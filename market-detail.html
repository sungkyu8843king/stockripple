<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>시장 지표 상세 — StockRipple</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{
  --bg:#15171e; --bg2:#1e2129; --bg3:#262a34; --bg4:#2f333f;
  --border:rgba(255,255,255,0.075); --border-strong:rgba(255,255,255,0.16);
  --text:#f2f4f8; --text2:#a6adbb; --text3:#6c7385;
  --red:#ff6b6b; --green:#3ddb7f; --blue:#4d8dff; --yellow:#f0b45e; --purple:#9d7bff;
  --mono:'SF Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5}
/* 메인 사이트 헤더와 통일 */
.header{position:sticky;top:0;z-index:100;background:rgba(21,23,30,0.80);backdrop-filter:blur(14px) saturate(150%);border-bottom:1px solid var(--border);padding:0 24px}
.header-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:16px;height:56px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;flex-shrink:0}
.logo-icon{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--blue) 0%,var(--purple) 100%);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;box-shadow:0 3px 10px rgba(36,87,230,0.30)}
.logo-text{font-size:17px;font-weight:800;color:var(--text);letter-spacing:-0.02em}
.logo-sub{font-size:10px;color:var(--text3);font-weight:500;margin-top:1px}
.header-nav{display:flex;gap:2px;margin-left:auto;align-items:center}
.nav-btn{padding:7px 13px;border-radius:10px;font-size:13px;font-weight:500;background:none;border:none;color:var(--text2);cursor:pointer;text-decoration:none;display:flex;align-items:center;gap:6px;transition:all .12s;white-space:nowrap}
.nav-btn:hover{background:var(--bg3);color:var(--text)}
.nav-btn-primary{background:var(--blue);color:#fff;padding:7px 16px;margin-left:6px;border-radius:10px;font-size:13px;font-weight:600;text-decoration:none}
.nav-btn-primary:hover{background:#1e4ccc}
.nav-new{position:relative}
.nav-new::after{content:"";position:absolute;top:2px;right:1px;width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px var(--bg),0 0 6px var(--red)}
@media (max-width:760px){ .header-inner{flex-wrap:wrap;height:auto;padding:8px 0;row-gap:6px} }
@media (max-width:900px){ .header-nav{flex-wrap:wrap;row-gap:4px} }
@media (max-width:680px){ .logo-sub{display:none} .nav-btn{padding:6px 9px;font-size:12px} }
.wrap{max-width:1100px;margin:0 auto;padding:20px 20px 60px}
.back{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text2);text-decoration:none;padding:8px 12px;border:1px solid var(--border);border-radius:10px;background:var(--bg2);margin-bottom:16px}
.back:hover{border-color:var(--border-strong);color:var(--text)}
.hero{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:22px 24px;margin-bottom:16px}
.hero-name{display:flex;align-items:center;gap:9px;font-size:22px;font-weight:750;letter-spacing:-0.02em}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 1.4s infinite;display:none}
.live-dot.on{display:inline-block}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.hero-sub{font-size:12px;color:var(--text3);margin-top:3px}
.hero-price{font-size:34px;font-weight:800;font-family:var(--mono);letter-spacing:-0.02em;margin-top:14px}
.hero-chg{font-size:15px;font-weight:700;font-family:var(--mono);margin-top:3px}
.hero-chg.up{color:var(--green)}.hero-chg.dn{color:var(--red)}.hero-chg.flat{color:var(--text3)}
.status-line{display:flex;gap:8px;margin-top:12px;font-size:12px;color:var(--text2);flex-wrap:wrap}
.status-item{display:flex;align-items:center;gap:6px;background:var(--bg3);padding:5px 11px;border-radius:999px}
.status-item .d{width:6px;height:6px;border-radius:50%;background:var(--text3)}
.status-item .d.open{background:var(--green);box-shadow:0 0 6px var(--green)}
.w52{margin-top:16px}
.w52-label{font-size:10.5px;color:var(--text3);display:flex;justify-content:space-between;margin-bottom:6px}
.w52-track{position:relative;height:5px;background:var(--bg4);border-radius:3px}
.w52-fill{position:absolute;top:0;left:0;height:100%;background:var(--blue);opacity:.35;border-radius:3px}
.w52-dot{position:absolute;top:50%;width:10px;height:10px;border-radius:50%;background:var(--blue);border:2px solid var(--bg2);transform:translate(-50%,-50%)}
.sec{margin-bottom:16px}
.sec-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sec-head .tick{width:3px;height:14px;border-radius:2px;background:var(--blue)}
.sec-head h3{font-size:13px;font-weight:700}
.range-btns{display:flex;gap:6px;margin-left:auto}
.range-btn{border:1px solid var(--border);background:var(--bg2);color:var(--text2);font-size:11.5px;font-weight:600;padding:5px 11px;border-radius:8px;cursor:pointer}
.range-btn.active{background:var(--blue);border-color:var(--blue);color:#fff}
.chart-card{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:14px}
.chart-box{width:100%;height:400px}
.loading{padding:60px;text-align:center;color:var(--text3);font-size:13px}
@media (max-width:640px){ .hero-price{font-size:28px} .chart-box{height:300px} }
</style>
</head>
<body>
<header class="header">
  <div class="header-inner">
    <a href="/index.html" class="logo">
      <div class="logo-icon">〜</div>
      <div>
        <div class="logo-text">StockRipple</div>
        <div class="logo-sub">파급효과 주식 전망</div>
      </div>
    </a>
    <nav class="header-nav">
      <a href="/news.html" class="nav-btn nav-new">📰 뉴스</a>
      <a href="/picks.html" class="nav-btn">🎯 매수 후보</a>
      <a href="/heatmap.html" class="nav-btn">🔥 히트맵</a>
      <a href="/kr-market.html" class="nav-btn">📊 시장 현황</a>
      <a href="/talks.html" class="nav-btn nav-new">💬 말말말</a>
      <a href="/sectors.html" class="nav-btn">🧭 섹터 지도</a>
      <a href="/account.html" class="nav-btn-primary">로그인</a>
    </nav>
  </div>
</header>
<div class="wrap">
  <a class="back" href="/index.html">← 홈</a>
  <div id="content"><div class="loading">불러오는 중...</div></div>
</div>

<script>
const MKT = {
  nasdaq:{name:'나스닥 종합', sub:'NASDAQ Composite', fmt:'n', mk:'us'},
  sp500: {name:'S&P 500', sub:'S&P 500 Index', fmt:'n', mk:'us'},
  dow:   {name:'다우존스', sub:'Dow Jones Industrial', fmt:'n', mk:'us'},
  kospi: {name:'코스피', sub:'KOSPI', fmt:'n', mk:'kr'},
  kosdaq:{name:'코스닥', sub:'KOSDAQ', fmt:'n', mk:'kr'},
  vix:   {name:'VIX 변동성지수', sub:'CBOE Volatility Index', fmt:'n', mk:'us'},
  usdkrw:{name:'원/달러 환율', sub:'USD/KRW', fmt:'n', mk:'fx'},
  sox:   {name:'필라델피아 반도체', sub:'PHLX Semiconductor', fmt:'n', mk:'us'},
  nq:    {name:'나스닥100 선물', sub:'Nasdaq 100 Futures', fmt:'n', mk:'us'},
  btc:   {name:'비트코인', sub:'BTC/USD', fmt:'$', mk:'crypto'},
  gold:  {name:'금 (Gold)', sub:'Gold Spot', fmt:'$', mk:'commodity'},
  oil:   {name:'WTI 원유', sub:'Crude Oil WTI', fmt:'$', mk:'commodity'},
};
let _sym = '', _range = '6mo', _chart = null, _resizeObs = null;

function fmtVal(v, fmt){ if(v==null) return '—'; return fmt==='$' ? '$'+Number(v).toLocaleString('en-US',{maximumFractionDigits:2}) : Number(v).toLocaleString('ko-KR',{maximumFractionDigits:2}); }

// 시장 개장 여부(KST 벽시계 — epoch+9h를 getUTC*로 읽어 브라우저 타임존과 무관하게 계산)
function marketOpen(mk){
  const kst=new Date(Date.now()+9*3600000);
  const day=kst.getUTCDay(), mins=kst.getUTCHours()*60+kst.getUTCMinutes(), weekday=day>=1&&day<=5;
  if(mk==='crypto') return true;
  if(mk==='kr') return weekday && mins>=540 && mins<930;
  if(mk==='us') return (weekday && mins>=1350) || (mins<300 && day>=2&&day<=6);
  if(mk==='fx'||mk==='commodity') return weekday || (day===0 && mins>=360);
  return false;
}
function statusLabel(mk, open){
  const m={us:'미국장',kr:'국내장',fx:'외환시장',commodity:'상품선물',crypto:'가상자산'}[mk]||'';
  return `${m} ${mk==='crypto'?'24시간':open?'개장 중':'휴장'}`;
}

async function init(){
  _sym=(new URLSearchParams(location.search).get('sym')||'').toLowerCase();
  const cfg=MKT[_sym];
  const c=document.getElementById('content');
  if(!cfg){ c.innerHTML='<div class="loading">알 수 없는 지표입니다. <a href="/index.html" style="color:var(--blue)">홈으로</a></div>'; return; }
  document.title=`${cfg.name} — StockRipple`;
  const open=marketOpen(cfg.mk);
  c.innerHTML=`
    <div class="hero">
      <div class="hero-name"><span class="live-dot ${open?'on':''}"></span>${cfg.name}</div>
      <div class="hero-sub">${cfg.sub}</div>
      <div class="hero-price" id="price">—</div>
      <div class="hero-chg" id="chg">—</div>
      <div class="status-line"><span class="status-item"><span class="d ${open||cfg.mk==='crypto'?'open':''}"></span>${statusLabel(cfg.mk,open)}</span></div>
      <div class="w52" id="w52" style="display:none">
        <div class="w52-label"><span>52주 최저</span><span>52주 최고</span></div>
        <div class="w52-track"><div class="w52-fill" id="w52Fill"></div><div class="w52-dot" id="w52Dot"></div></div>
        <div class="w52-label" style="margin-top:6px"><span id="w52Lo"></span><span id="w52Hi"></span></div>
      </div>
    </div>
    <div class="sec">
      <div class="sec-head">
        <span class="tick"></span><h3>📈 차트</h3>
        <div class="range-btns" id="rangeBtns">
          <button class="range-btn" data-r="1mo" onclick="setRange('1mo',this)">1개월</button>
          <button class="range-btn active" data-r="6mo" onclick="setRange('6mo',this)">6개월</button>
          <button class="range-btn" data-r="1y" onclick="setRange('1y',this)">1년</button>
        </div>
      </div>
      <div class="chart-card"><div class="chart-box" id="chartBox"><div class="loading">차트 불러오는 중...</div></div></div>
    </div>`;
  loadPrice(cfg);
  loadChart(_range);
}

async function loadPrice(cfg){
  try{
    const r=await fetch('/api/indices'); const j=await r.json(); const d=j?.data?.[_sym];
    if(d&&d.price!=null){
      document.getElementById('price').textContent=fmtVal(d.price,cfg.fmt);
      const cp=d.changePercent; const el=document.getElementById('chg');
      if(cp!=null){ const cls=cp>0?'up':cp<0?'dn':'flat'; const sign=cp>0?'+':''; el.className='hero-chg '+cls;
        el.textContent=`${sign}${(d.change??0).toLocaleString('en-US',{maximumFractionDigits:2})} (${sign}${cp.toFixed(2)}%)`; }
      if(d.fiftyTwoWeekLow!=null && d.fiftyTwoWeekHigh!=null && d.fiftyTwoWeekHigh>d.fiftyTwoWeekLow){
        const wrap=document.getElementById('w52'); wrap.style.display='';
        const pos=Math.min(100,Math.max(0,((d.price-d.fiftyTwoWeekLow)/(d.fiftyTwoWeekHigh-d.fiftyTwoWeekLow))*100));
        document.getElementById('w52Fill').style.width=pos+'%';
        document.getElementById('w52Dot').style.left=pos+'%';
        document.getElementById('w52Lo').textContent=fmtVal(d.fiftyTwoWeekLow,cfg.fmt);
        document.getElementById('w52Hi').textContent=fmtVal(d.fiftyTwoWeekHigh,cfg.fmt);
      }
    }
  }catch{}
}

async function setRange(r, btn){
  _range=r;
  document.querySelectorAll('#rangeBtns .range-btn').forEach(b=>b.classList.toggle('active',b===btn));
  loadChart(r);
}

async function loadChart(range){
  const box=document.getElementById('chartBox');
  if(!box) return;
  try{
    const r=await fetch(`/api/indices?chart=${encodeURIComponent(_sym)}&range=${range}`);
    if(!r.ok) throw new Error('http '+r.status);
    const j=await r.json();
    if(!j.ok || !j.candles?.length) throw new Error('no data');
    renderChart(box, j.candles);
  }catch(e){ box.innerHTML='<div class="loading" style="color:var(--red)">차트 데이터를 불러올 수 없어요.</div>'; }
}

function renderChart(box, candles){
  box.innerHTML='';
  if(_chart){ try{_chart.remove();}catch{} _chart=null; }
  if(_resizeObs){ try{_resizeObs.disconnect();}catch{} _resizeObs=null; }
  const up = candles[candles.length-1].close >= candles[0].close;
  const lineColor = up ? '#3ddb7f' : '#ff6b6b';
  const chart = LightweightCharts.createChart(box, {
    width: box.clientWidth || 600, height: box.clientHeight || 400,
    layout:{ background:{type:'solid',color:'transparent'}, textColor:'#6c7385', fontFamily:'Inter, sans-serif', fontSize:11 },
    grid:{ vertLines:{color:'rgba(255,255,255,0.06)'}, horzLines:{color:'rgba(255,255,255,0.06)'} },
    rightPriceScale:{ borderColor:'rgba(255,255,255,0.06)' },
    timeScale:{ borderColor:'rgba(255,255,255,0.06)', rightOffset:4 },
    crosshair:{ mode: LightweightCharts.CrosshairMode.Normal },
  });
  const series = chart.addAreaSeries({
    lineColor, topColor: lineColor+'33', bottomColor: lineColor+'00', lineWidth:2,
    priceFormat:{ type:'price', precision: candles[0].close < 100 ? 2 : (candles[0].close < 10000 ? 2 : 0) },
  });
  series.setData(candles.map(c=>({ time:c.date, value:c.close })));
  chart.timeScale().fitContent();
  _chart=chart;
  _resizeObs=new ResizeObserver(()=>{ if(_chart) _chart.applyOptions({width:box.clientWidth, height:box.clientHeight}); });
  _resizeObs.observe(box);
}

init();
</script>
</body>
</html>
