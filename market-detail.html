  --bg:#15171e; --bg-rgb: 21,23,30; --bg2:#1e2129; --bg3:#262a34; --bg4:#2f333f;

  --text:#f2f4f8; --text2:#a6adbb; --text3:#6c7385;
  --red:#ff6b6b; --green:#3ddb7f; --blue:#4d8dff; --yellow:#f0b45e; --purple:#9d7bff;
  --mono:'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace;
}

/* ── 라이트 모드 오버라이드 (2026-07-27) ── */
:root[data-theme="light"] {
  --bg: #f5f6f8; --bg-rgb: 245,246,248; --bg2: #ffffff; --bg3: #eef0f3; --bg4: #e3e6eb;
  --border: rgba(15,17,23,0.09); --border-strong: rgba(15,17,23,0.18);
  --text: #14161c; --text2: #4b5163; --text3: #6b7280;
  --red: #dc2626; --green: #15803d; --blue: #1d4ed8; --yellow: #a16207; --purple: #7c3aed;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5}
/* 메인 사이트 헤더와 통일 */
.header{position:sticky;top:0;z-index:100;background:rgba(var(--bg-rgb),0.80);backdrop-filter:blur(14px) saturate(150%);border-bottom:1px solid var(--border);padding:0 24px}
.header-inner{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:16px;height:56px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;flex-shrink:0}
.logo-icon{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--blue) 0%,var(--purple) 100%);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;box-shadow:0 3px 10px rgba(36,87,230,0.30)}
.logo-text{font-size:19px;font-weight:800;color:var(--text);letter-spacing:-0.02em}
.logo-sub{font-size:13px;color:var(--text3);font-weight:500;margin-top:1px}
.header-nav{display:flex;gap:2px;margin-left:auto;align-items:center}
.nav-btn{padding:7px 13px;border-radius:10px;font-size:15.5px;font-weight:500;background:none;border:none;color:var(--text2);cursor:pointer;text-decoration:none;display:flex;align-items:center;gap:6px;transition:all .12s;white-space:nowrap}
.nav-btn:hover{background:var(--bg3);color:var(--text)}
.nav-btn.active{background:var(--blue);color:#fff;font-weight:600}
.nav-btn-primary{background:var(--blue);color:#fff;padding:7px 16px;margin-left:6px;border-radius:10px;font-size:15.5px;font-weight:600;text-decoration:none}
.nav-btn-primary:hover{background:#1e4ccc}
.nav-new{position:relative}
.nav-new::after{content:"";position:absolute;top:2px;right:1px;width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px var(--bg),0 0 6px var(--red)}
@media (max-width:760px){ .header-inner{flex-wrap:wrap;height:auto;padding:8px 0;row-gap:6px;position:relative} .header-nav .nav-btn-primary{position:absolute;top:8px;right:0;margin-left:0} }
@media (max-width:900px){ .header-nav{flex-wrap:wrap;row-gap:4px} }
@media (max-width:680px){ .logo-sub{display:none} .nav-btn{padding:6px 9px;font-size:14.5px} .header{padding:0 16px} }
.wrap{max-width:1320px;margin:0 auto;padding:20px 20px 60px}
.back{display:inline-flex;align-items:center;gap:6px;font-size:15.5px;color:var(--text2);text-decoration:none;padding:8px 12px;border:1px solid var(--border);border-radius:10px;background:var(--bg2);margin-bottom:16px}
.back:hover{border-color:var(--border-strong);color:var(--text)}
.hero{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:22px 24px;margin-bottom:16px}
.hero-name{display:flex;align-items:center;gap:9px;font-size:22px;font-weight:750;letter-spacing:-0.02em}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 1.4s infinite;display:none}
.live-dot.on{display:inline-block}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.hero-sub{font-size:14.5px;color:var(--text3);margin-top:3px}
.hero-price{font-size:34px;font-weight:800;font-family:var(--mono);letter-spacing:-0.02em;margin-top:14px}
.hero-chg{font-size:17px;font-weight:700;font-family:var(--mono);margin-top:3px}
.hero-chg.up{color:var(--red)}.hero-chg.dn{color:var(--blue)}.hero-chg.flat{color:var(--text3)}
.status-line{display:flex;gap:8px;margin-top:12px;font-size:14.5px;color:var(--text2);flex-wrap:wrap}
.status-item{display:flex;align-items:center;gap:6px;background:var(--bg3);padding:5px 11px;border-radius:999px}
.status-item .d{width:6px;height:6px;border-radius:50%;background:var(--text3)}
.status-item .d.open{background:var(--green);box-shadow:0 0 6px var(--green)}

/* ── KPI 카드 그리드 (Hero 하단, 2026-08 개편) ── */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px;margin-top:18px}
.kpi-card{background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:11px 13px}
.kpi-label{font-size:12.5px;color:var(--text3);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-value{font-size:18px;font-weight:800;font-family:var(--mono);margin-top:4px;letter-spacing:-0.02em}
.kpi-value.up{color:var(--red)}.kpi-value.dn{color:var(--blue)}
.kpi-sub{font-size:11.5px;color:var(--text3);margin-top:2px}

.sec{margin-bottom:16px}
.sec-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.sec-head .tick{width:3px;height:14px;border-radius:2px;background:var(--blue)}
.sec-head h3{font-size:15.5px;font-weight:700}
.sec-note{font-size:12px;color:var(--text3);font-weight:500}
.range-btns{display:flex;gap:6px;margin-left:auto}
.range-btn{border:1px solid var(--border);background:var(--bg2);color:var(--text2);font-size:14px;font-weight:600;padding:5px 11px;border-radius:8px;cursor:pointer}
.range-btn.active{background:var(--blue);border-color:var(--blue);color:#fff}
.chart-card{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:14px}
.chart-box{width:100%;height:260px}
.loading{padding:60px;text-align:center;color:var(--text3);font-size:15.5px}
.panel{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:16px 18px}
.panel-empty{color:var(--text3);font-size:14px;text-align:center;padding:18px 0}

/* ── Market Breadth ── */
.breadth-row{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.breadth-stat{display:flex;flex-direction:column;gap:2px}
.breadth-num{font-size:22px;font-weight:800;font-family:var(--mono)}
.breadth-lbl{font-size:12.5px;color:var(--text3);font-weight:600}
.breadth-bar{height:10px;border-radius:5px;overflow:hidden;display:flex;background:var(--bg4)}
.breadth-bar .seg{height:100%}

/* ── Sector performance / momentum bars ── */
.bar-row{display:flex;align-items:center;gap:8px;font-size:13.5px;margin-bottom:6px}
.bar-row .lbl{width:88px;flex-shrink:0;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{flex:1;background:var(--bg3);border-radius:3px;height:6px;position:relative;overflow:hidden}
.bar-track .fill{position:absolute;top:0;bottom:0;border-radius:2px}
.bar-track .mid{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--border)}
.bar-row .val{width:60px;text-align:right;font-weight:700;font-family:var(--mono);flex-shrink:0}

/* ── Mega Cap 기여도 ── */
.contrib-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border)}
.contrib-row:last-child{border-bottom:none}
.contrib-tk{width:110px;flex-shrink:0;overflow:hidden}
.contrib-tk a{font-weight:700;font-size:13.5px;color:var(--text);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.contrib-tk a:hover{color:var(--blue)}
.contrib-bar{flex:1;height:7px;background:var(--bg3);border-radius:4px;overflow:hidden}
.contrib-bar .f{height:100%;border-radius:4px}
.contrib-pct{width:58px;text-align:right;font-weight:700;font-family:var(--mono);font-size:13.5px;flex-shrink:0}

/* ── 미니 히트맵 ── */
.mini-hm{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:4px}
.mini-hm a{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 4px;border-radius:8px;text-decoration:none;text-align:center;min-height:52px;transition:filter .12s}
.mini-hm a:hover{filter:brightness(1.12)}
.mini-hm .tk{font-weight:800;font-size:12.5px;line-height:1.2}
.mini-hm .pc{font-size:11px;font-weight:700;margin-top:2px;font-family:var(--mono)}

/* ── AI Market Summary ── */
.ai-badge{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:999px}
.ai-headline{font-size:15.5px;font-weight:700;line-height:1.5;margin:9px 0}
.ai-catalyst{font-size:13.5px;color:var(--text2);line-height:1.6;padding:4px 0 4px 14px;position:relative}
.ai-catalyst::before{content:"·";position:absolute;left:2px;color:var(--text3)}
.ai-meta{font-size:12px;color:var(--text3);margin-top:8px}

/* ── 관련 ETF / 관련 지표 칩 ── */
.chip-row{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:7px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:8px 12px;text-decoration:none;color:var(--text);font-size:13.5px;transition:border-color .12s}
.chip:hover{border-color:var(--border-strong)}
.chip .ck-t{font-weight:700}
.chip .ck-n{color:var(--text3);font-size:12px}
.chip .ck-p{font-weight:700;font-family:var(--mono);margin-left:auto;padding-left:4px}
.chip .ck-p.up{color:var(--red)}.chip .ck-p.dn{color:var(--blue)}

@media (max-width:640px){ .hero-price{font-size:28px} .chart-box{height:220px} .kpi-grid{grid-template-columns:repeat(2,1fr)} }
</style>

  if (!v) return '—';
  if (isKr) return (v / 1e12).toFixed(1) + '조원';
  if (v >= 1e12) return '$' + (v / 1e12).toFixed(2) + 'T';
  return '$' + (v / 1e9).toFixed(1) + 'B';
}

// 시장 개장 여부(KST 벽시계 — epoch+9h를 getUTC*로 읽어 브라우저 타임존과 무관하게 계산)
function marketOpen(mk){
  const kst=new Date(Date.now()+9*3600000);
  const day=kst.getUTCDay(), mins=kst.getUTCHours()*60+kst.getUTCMinutes(), weekday=day>=1&&day<=5;
  if(mk==='crypto') return true;
  if(mk==='kr') return weekday && mins>=540 && mins<930;
  if(mk==='us') return (weekday && mins>=1350) || (mins<300 && day>=2&&day<=6);
  if(mk==='fx'||mk==='commodity') return weekday || (day===0 && mins>=360);
  return false;
}
// ⚠️ 예전엔 open이 false면 무조건 "휴장"이었다 — 프리마켓(예: 미장 17시대)처럼 그냥
// "아직 개장 전"인 상황까지 전부 "휴장"(마치 오늘 거래 자체가 없는 것처럼)으로 보여준
// 버그였다(2026-08-20 실측 피드백: KST 18시에 나스닥이 "휴장"으로 표시 — 실제로는 정상
// 거래일의 프리마켓일 뿐이었음, Yahoo marketState도 PRE로 정상 확인). 개장 전/장중/마감
// 후/진짜 휴장(주말 등) 4단계로 나눈다.
function marketStatus(mk){
  const kst=new Date(Date.now()+9*3600000);
  const day=kst.getUTCDay(), mins=kst.getUTCHours()*60+kst.getUTCMinutes(), weekday=day>=1&&day<=5;
  if(mk==='crypto') return 'open';
  if(mk==='kr'){
    if(weekday && mins>=480 && mins<540) return 'pre';
    if(weekday && mins>=540 && mins<930) return 'open';
    if(weekday && mins>=930 && mins<1200) return 'post';       // 넥스트장(15:30~20:00)
    return 'closed';
  }
  if(mk==='us'){
    // 프리마켓 04:00~09:30 ET = 17:00~22:30 KST(평일만 — 일요일 저녁엔 프리마켓 자체가 없다), 정규장 22:30~05:00(다음날), 애프터 05:00~09:00
    if(weekday && mins>=1020 && mins<1350) return 'pre';
    if((weekday && mins>=1350) || (mins<300 && day>=2&&day<=6)) return 'open';
    if(mins>=300 && mins<540 && day>=2&&day<=6) return 'post';
    return 'closed';
  }
  if(mk==='fx'||mk==='commodity') return (weekday || (day===0 && mins>=360)) ? 'open' : 'closed';
  return 'closed';
}
function statusLabel(mk, open){
  const m={us:'미국장',kr:'국내장',fx:'외환시장',commodity:'상품선물',crypto:'가상자산'}[mk]||'';
  if(mk==='crypto') return `${m} 24시간`;
  const s=marketStatus(mk);
  const lbl={open:'개장 중',pre:'개장 전',post:'마감 후',closed:'휴장'}[s] || (open?'개장 중':'휴장');
  return `${m} ${lbl}`;
}

// 52주 위치 / 52주 고점대비 / 오늘 변동은 /api/indices 값으로 즉시 계산. YTD%는 차트 히스토리가
// 별도로 필요해 loadYtd()가 채워 넣는다(비동기 — 카드가 먼저 그려진 뒤 값만 갱신).
function renderKpiGrid(cfg, d){
  const grid = document.getElementById('kpiGrid');
  if (!grid) return;
  const cp = d.changePercent;
  let w52pos = null, athGap = null;
  if (d.price != null && d.fiftyTwoWeekLow != null && d.fiftyTwoWeekHigh != null && d.fiftyTwoWeekHigh > d.fiftyTwoWeekLow) {
    w52pos = ((d.price - d.fiftyTwoWeekLow) / (d.fiftyTwoWeekHigh - d.fiftyTwoWeekLow)) * 100;
  }
  if (d.price != null && d.fiftyTwoWeekHigh) athGap = (d.price / d.fiftyTwoWeekHigh - 1) * 100;

  const cards = [
    { label: '오늘 변동', val: cp != null ? fmtSignedPct(cp) : '—', cls: cp>0?'up':cp<0?'dn':'' },
    { label: '52주 위치', val: w52pos != null ? w52pos.toFixed(0) + '%' : '—', sub: w52pos != null ? '52주 범위 내 위치' : '' },
    { label: 'YTD', val: '—', id: 'kpiYtd' },
    { label: '52주 고점대비', val: athGap != null ? fmtSignedPct(athGap) : '—', cls: athGap>0?'up':athGap<0?'dn':'' },
  ];
  if (cfg.rich) {
    cards.push({ label: '시총(주요종목 합산)', val: '—', id: 'kpiCap' });
    cards.push({ label: '거래대금(주요종목 합산)', val: '—', id: 'kpiVal' });
  }
  grid.innerHTML = cards.map(c => `
    <div class="kpi-card">
      <div class="kpi-label">${c.label}</div>
      <div class="kpi-value ${c.cls||''}" ${c.id?`id="${c.id}"`:''}>${c.val}</div>
      ${c.sub ? `<div class="kpi-sub">${c.sub}</div>` : ''}
    </div>`).join('');
  loadYtd();
}

let _ytdRequested = false;
async function loadYtd(){
  if (_ytdRequested) return;
  _ytdRequested = true;
  try{
    const r = await fetch(`/api/indices?chart=${encodeURIComponent(_sym)}&range=ytd`);
    const j = await r.json();
    const candles = j?.candles;
    if (!j.ok || !candles?.length || candles.length < 2) return;
    const ytdPct = (candles[candles.length-1].close / candles[0].close - 1) * 100;
    const el = document.getElementById('kpiYtd');
    if (el) { el.textContent = fmtSignedPct(ytdPct); el.classList.add(ytdPct > 0 ? 'up' : ytdPct < 0 ? 'dn' : ''); }

}

async function loadChart(range){

function renderChart(box, candles){
  box.innerHTML='';
  if(_chart){ try{_chart.remove();}catch{} _chart=null; }
  if(_resizeObs){ try{_resizeObs.disconnect();}catch{} _resizeObs=null; }
  const up = candles[candles.length-1].close >= candles[0].close;
  const lineColor = up ? cssVarMD('--green','#3ddb7f') : cssVarMD('--red','#ff6b6b');
  const gridColor = cssVarMD('--border-soft', 'rgba(255,255,255,0.06)');
  const chart = LightweightCharts.createChart(box, {
    width: box.clientWidth || 600, height: box.clientHeight || 260,
    layout:{ background:{type:'solid',color:'transparent'}, textColor:cssVarMD('--text3','#6c7385'), fontFamily:'Inter, sans-serif', fontSize:11 },
    grid:{ vertLines:{color:gridColor}, horzLines:{color:gridColor} },
    rightPriceScale:{ borderColor:gridColor },
    timeScale:{ borderColor:gridColor, rightOffset:4 },
    crosshair:{ mode: LightweightCharts.CrosshairMode.Normal },
  });
  const series = chart.addAreaSeries({
    lineColor, topColor: lineColor+'33', bottomColor: lineColor+'00', lineWidth:2,
    priceFormat:{ type:'price', precision: candles[0].close < 100 ? 2 : (candles[0].close < 10000 ? 2 : 0) },
  });
  series.setData(candles.map(c=>({ time:c.date, value:c.close })));
  chart.timeScale().fitContent();
  _chart=chart;
  _resizeObs=new ResizeObserver(()=>{ if(_chart) _chart.applyOptions({width:box.clientWidth, height:box.clientHeight}); });
  _resizeObs.observe(box);
}

// ── 시총(발행주식수 × 가격) — 히트맵과 동일 데이터 소스 재사용(정적 스냅샷 + DB 실시간 갱신 병합) ──
function loadSharesOutstanding(){
  if (_sharesOut) return Promise.resolve(_sharesOut);
  return Promise.all([
    fetch('/data/shares-outstanding.json').then(r => r.ok ? r.json() : {}).catch(() => ({})),
    fetch('/api/admin?action=shares-outstanding').then(r => r.ok ? r.json() : { ok:false }).catch(() => ({ ok:false })),
  ]).then(([staticSnap, dbResp]) => (_sharesOut = { ...staticSnap, ...(dbResp.ok ? dbResp.data : {}) }));
}

async function loadRichData(cfg){
  const list = RICH_LIST[cfg.rich] || [];
  if (!list.length) return;
  const isKr = cfg.mk === 'kr';
  try {
    const [qr, shares] = await Promise.all([
      fetch(`/api/quotes?tickers=${list.map(x=>x[0]).join(',')}`),
      loadSharesOutstanding(),
    ]);
    const qj = await qr.json();
    if (!qj.ok) throw new Error('quotes failed');
    const data = qj.data || {};

    const items = list.map(([t, n]) => {
      const d = data[t];
      if (!d || d.changePercent == null) return null;
      const price = d.price;
      const mcap = (shares[t] && price != null) ? shares[t] * price : null;
      const tradingValue = (d.volume != null && price != null) ? d.volume * price : 0;
      return { ticker: t, name: n, pct: d.changePercent, price, mcap, tradingValue };
    }).filter(Boolean);

    renderBreadth(items);
    renderMiniHeatmap(items, isKr);
    renderContrib(items, isKr);

    const totalCap = items.reduce((s, it) => s + (it.mcap || 0), 0);
    const totalVal = items.reduce((s, it) => s + (it.tradingValue || 0), 0);
    const capEl = document.getElementById('kpiCap');
    const valEl = document.getElementById('kpiVal');
    if (capEl) capEl.textContent = fmtCap(totalCap, isKr);
    if (valEl) valEl.textContent = fmtCap(totalVal, isKr);
  } catch (e) {
    ['breadthPanel','contribPanel'].forEach(id => { const el = document.getElementById(id); if (el) el.innerHTML = '<div class="panel-empty" style="color:var(--red)">로드 실패</div>'; });
    const hm = document.getElementById('miniHeatmap'); if (hm) hm.innerHTML = '<div class="panel-empty" style="color:var(--red)">로드 실패</div>';
  }
}

function renderBreadth(items){
  const el = document.getElementById('breadthPanel');
  if (!el) return;
  const up = items.filter(it => it.pct > 0).length;
  const dn = items.filter(it => it.pct < 0).length;
  const flat = items.length - up - dn;
  const total = items.length || 1;
  el.innerHTML = `
    <div class="breadth-row">
      <div class="breadth-stat"><span class="breadth-num" style="color:var(--red)">${up}</span><span class="breadth-lbl">상승</span></div>
      <div class="breadth-stat"><span class="breadth-num" style="color:var(--text3)">${flat}</span><span class="breadth-lbl">보합</span></div>
      <div class="breadth-stat"><span class="breadth-num" style="color:var(--blue)">${dn}</span><span class="breadth-lbl">하락</span></div>
    </div>
    <div class="breadth-bar">
      <span class="seg" style="width:${up/total*100}%;background:var(--red)"></span>
      <span class="seg" style="width:${flat/total*100}%;background:var(--text3)"></span>
      <span class="seg" style="width:${dn/total*100}%;background:var(--blue)"></span>
    </div>`;
}

function hexToRgb(hex, fb){
  const m = /^#?([0-9a-f]{6})$/i.exec((hex||'').trim());
  if (!m) return fb;
  const n = parseInt(m[1], 16);
  return [(n>>16)&255, (n>>8)&255, n&255];
}
function hmColor(pct){
  const up = pct >= 0;
  const mag = Math.min(Math.abs(pct), 5) / 5;
  // 라이트/다크 테마의 실제 --red/--blue 값을 읽어 히트맵 타일 색이 나머지 UI(등락률 텍스트 등)와
  // 같은 톤을 쓰게 한다 — 하드코딩하면 라이트 모드에서 다크 모드용 색이 그대로 나온다.
  const base = up ? hexToRgb(cssVarMD('--red','#ff6b6b'), [255,107,107]) : hexToRgb(cssVarMD('--blue','#4d8dff'), [77,141,255]);
  const light = up ? [255,214,214] : [214,229,255];
  const t = 0.35 + mag * 0.65;
  const rgb = base.map((c,i) => Math.round(light[i] + (c - light[i]) * t));
  return { bg: `rgb(${rgb.join(',')})`, fg: t > 0.55 ? '#fff' : '#1a1a1a' };
}

function renderMiniHeatmap(items, isKr){
  const el = document.getElementById('miniHeatmap');
  if (!el) return;
  const top = [...items].sort((a,b) => (b.mcap||b.tradingValue||0) - (a.mcap||a.tradingValue||0)).slice(0, 24);
  if (!top.length) { el.innerHTML = '<div class="panel-empty">데이터 없음</div>'; return; }
  el.innerHTML = top.map(it => {
    const c = hmColor(it.pct);
    const tk = isKr ? escHtml(it.name) : escHtml(it.ticker);
    return `<a href="/company.html?ticker=${encodeURIComponent(it.ticker)}" style="background:${c.bg};color:${c.fg}" title="${escHtml(it.name)} ${fmtSignedPct(it.pct)}">
      <span class="tk">${tk}</span><span class="pc">${fmtSignedPct(it.pct)}</span>
    </a>`;
  }).join('');
}

function renderContrib(items, isKr){
  const el = document.getElementById('contribPanel');
  if (!el) return;
  const capped = items.filter(it => it.mcap);
  const totalCap = capped.reduce((s, it) => s + it.mcap, 0);
  if (!totalCap) { el.innerHTML = '<div class="panel-empty">시가총액 데이터 없음</div>'; return; }
  const ranked = capped
    .map(it => ({ ...it, contrib: (it.mcap / totalCap) * it.pct }))
    .sort((a, b) => Math.abs(b.contrib) - Math.abs(a.contrib))
    .slice(0, 6);
  const maxAbs = Math.max(...ranked.map(it => Math.abs(it.contrib)), 0.001);
  el.innerHTML = ranked.map(it => {
    const color = it.pct >= 0 ? 'var(--red)' : 'var(--blue)';
    const barPct = Math.abs(it.contrib) / maxAbs * 100;
    return `<div class="contrib-row">
      <div class="contrib-tk"><a href="/company.html?ticker=${encodeURIComponent(it.ticker)}" title="${escHtml(it.name)}">${escHtml(it.name)}</a></div>
      <div class="contrib-bar"><div class="f" style="width:${barPct}%;background:${color}"></div></div>
      <div class="contrib-pct" style="color:${color}">${fmtSignedPct(it.pct)}</div>
    </div>`;
  }).join('');
}

// ── 섹터 퍼포먼스 — index.html의 loadSectorMomentum()과 동일 패턴(SPDR 섹터 ETF) ──
const SECTOR_ETFS = [
  { t:'XLK', n:'기술' }, { t:'XLF', n:'금융' }, { t:'XLV', n:'헬스케어' },
  { t:'XLY', n:'경기소비재' }, { t:'XLP', n:'필수소비재' }, { t:'XLE', n:'에너지' },
  { t:'XLI', n:'산업재' }, { t:'XLB', n:'소재' }, { t:'XLU', n:'유틸리티' },
  { t:'XLRE',n:'리츠' }, { t:'XLC', n:'통신서비스' },
];
async function loadSectorPerf(){
  const el = document.getElementById('sectorPerfPanel');
  if (!el) return;
  try {
    const r = await fetch(`/api/quotes?tickers=${SECTOR_ETFS.map(s=>s.t).join(',')}`);
    const j = await r.json();
    if (!j.ok) throw new Error();
    const items = SECTOR_ETFS.map(s => ({ ...s, pct: j.data?.[s.t]?.changePercent ?? null }))
      .filter(x => x.pct != null).sort((a,b) => b.pct - a.pct);
    if (!items.length) { el.innerHTML = '<div class="panel-empty">데이터 없음(시장 휴장)</div>'; return; }
    const maxAbs = Math.max(...items.map(it => Math.abs(it.pct)), 1);
    el.innerHTML = items.map(it => {
      const barPct = Math.abs(it.pct) / maxAbs * 100;
      const color = it.pct >= 0 ? 'var(--red)' : 'var(--blue)';
      return `<div class="bar-row">
        <span class="lbl">${escHtml(it.n)}</span>
        <div class="bar-track"><div class="fill" style="${it.pct>=0?'left:50%':'right:50%'};width:${barPct/2}%;background:${color}"></div><div class="mid"></div></div>
        <span class="val" style="color:${color}">${fmtSignedPct(it.pct)}</span>
      </div>`;
    }).join('');
  } catch { el.innerHTML = '<div class="panel-empty" style="color:var(--red)">로드 실패</div>'; }
}

// ── AI 시장 요약 — 매일 자동 생성되는 daily_reports(US/KR)를 그대로 재사용(신규 AI 파이프라인 없음) ──
async function loadAiSummary(market){
  const el = document.getElementById('aiSummaryPanel');
  if (!el) return;
  try {
    const r = await fetch(`/api/admin?action=daily-report&market=${market}`);
    if (!r.ok) { el.innerHTML = '<div class="panel-empty">아직 생성 전이에요(장 마감 후 자동 생성)</div>'; return; }
    const d = await r.json();
    const moodEmoji = { bullish:'🔴 강세', bearish:'🔵 약세', mixed:'🟡 혼조', neutral:'⚪ 중립' }[d.mood] || '';
    const genAt = d.created_at ? new Date(d.created_at).toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}) : '';
    el.innerHTML = `
      ${moodEmoji ? `<span class="ai-badge" style="background:var(--bg3);color:var(--text2)">${moodEmoji}</span>` : ''}
      <div class="ai-headline">${escHtml(d.headline || '')}</div>
      ${(d.catalysts||[]).map(c => `<div class="ai-catalyst">${escHtml(c)}</div>`).join('')}
      <div class="ai-meta">${d.report_date ? d.report_date.slice(5).replace('-','/') + ' 장마감' : ''}${genAt ? ` · ${genAt} 생성` : ''} · 투자 권유가 아닌 정보 제공용입니다</div>`;
  } catch { el.innerHTML = '<div class="panel-empty" style="color:var(--red)">로드 실패</div>'; }
}

async function loadRelatedEtf(){
  const el = document.getElementById('relatedEtf');
  if (!el) return;
  const tickers = RELATED_ETF[_sym] || [];
  try {
    const r = await fetch(`/api/quotes?tickers=${tickers.join(',')}`);
    const j = await r.json();
    el.innerHTML = tickers.map(t => {
      const d = j?.data?.[t];
      const pct = d?.changePercent;
      const cls = pct > 0 ? 'up' : pct < 0 ? 'dn' : '';
      return `<a class="chip" href="/company.html?ticker=${encodeURIComponent(t)}">
        <span class="ck-t">${escHtml(t)}</span><span class="ck-n">${escHtml(ETF_NAMES[t]||'')}</span>
        <span class="ck-p ${cls}">${pct!=null?fmtSignedPct(pct):'—'}</span>
      </a>`;
    }).join('');
  } catch {}
}

function renderRelatedMkt(){
  const el = document.getElementById('relatedMkt');
  if (!el) return;
  const syms = RELATED_MKT[_sym] || [];
  el.innerHTML = syms.map(s => {
    const cfg = MKT[s];
    if (!cfg) return '';
    const d = _idxData?.[s];
    const pct = d?.changePercent;
    const cls = pct > 0 ? 'up' : pct < 0 ? 'dn' : '';
    return `<a class="chip" href="/market-detail.html?sym=${encodeURIComponent(s)}">
      <span class="ck-t">${escHtml(cfg.name)}</span>
      <span class="ck-p ${cls}">${pct!=null?fmtSignedPct(pct):'—'}</span>
    </a>`;
  }).join('');
}

initAuth();
