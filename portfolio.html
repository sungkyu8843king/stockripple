<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>가상 포트폴리오 — StockRipple</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0d1117; --bg2:#161b22; --bg3:#21262d; --border:#30363d;
  --text:#e6edf3; --text2:#8b949e; --text3:#6e7681;
  --blue:#2f81f7; --green:#3fb950; --red:#f85149; --yellow:#d29922; --purple:#a371f7;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
.header { position: sticky; top:0; z-index:100; background: rgba(13,17,23,.92); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 0 24px; }
.header-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; gap: 16px; height: 56px; }
.back-btn { display:flex; align-items:center; gap:6px; color: var(--text2); text-decoration:none; font-size:13px; padding:5px 10px; border-radius:6px; }
.back-btn:hover { background: var(--bg3); color: var(--text); }
.logo-sm { font-size: 14px; font-weight: 700; color: var(--text2); }
.logo-sm span { color: var(--blue); }

.wrap { max-width: 1200px; margin: 0 auto; padding: 28px 24px 60px; }
h1 { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
.subtitle { font-size: 13px; color: var(--text3); margin-bottom: 24px; }

/* Auth gate */
.auth-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 32px; max-width: 380px; margin: 60px auto; text-align: center; }
.auth-card h2 { font-size: 18px; margin-bottom: 8px; }
.auth-card p { font-size: 13px; color: var(--text2); margin-bottom: 16px; }
.btn { padding: 9px 18px; border-radius: 7px; font-size: 13px; font-weight: 600; border: none; cursor: pointer; transition: all .15s; }
.btn-primary { background: var(--blue); color: #fff; }
.btn-primary:hover:not(:disabled) { background: #388be8; }
.btn-success { background: var(--green); color: #fff; }
.btn-success:hover:not(:disabled) { background: #2ea043; }
.btn-danger { background: var(--red); color: #fff; }
.btn-danger:hover:not(:disabled) { background: #d04040; }
.btn-ghost { background: var(--bg3); color: var(--text); border: 1px solid var(--border); }
.btn-ghost:hover:not(:disabled) { border-color: var(--blue); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-sm { padding: 5px 11px; font-size: 11px; }

input { padding: 9px 12px; background: var(--bg3); border: 1px solid var(--border); border-radius: 7px; color: var(--text); font-size: 13px; outline: none; font-family: inherit; }
input:focus { border-color: var(--blue); }

/* Portfolio summary */
.summary-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 28px; }
.summary-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; }
.s-label { font-size: 11px; color: var(--text3); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.4px; font-weight: 600; }
.s-val { font-size: 22px; font-weight: 700; font-family: 'SF Mono', monospace; }
.s-val.green { color: var(--green); }
.s-val.red   { color: var(--red); }
.s-val.blue  { color: var(--blue); }
.s-sub { font-size: 11px; color: var(--text3); margin-top: 2px; font-family: 'SF Mono', monospace; }

.section { margin-bottom: 32px; }
.section-h { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
.section-h h2 { font-size: 16px; font-weight: 700; }
.section-h .count { font-size: 12px; color: var(--text3); font-weight: 400; }

/* Tables */
.table-wrap { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { font-size: 10px; font-weight: 600; color: var(--text3); text-align: left; padding: 10px 12px; background: var(--bg3); border-bottom: 1px solid var(--border); text-transform: uppercase; letter-spacing: 0.4px; }
td { padding: 11px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: rgba(255,255,255,.02); }
.ticker-chip { font-family:'SF Mono',monospace; font-size:11px; font-weight:700; padding:2px 7px; border-radius:4px; }
.ticker-chip.kr { background:#1f3540; color:#64c8ea; }
.ticker-chip.us { background:#1f2d4a; color:#79c0ff; }
.pct.up { color: var(--green); font-weight: 700; font-family: 'SF Mono', monospace; }
.pct.dn { color: var(--red);   font-weight: 700; font-family: 'SF Mono', monospace; }
.pct.flat { color: var(--text3); font-family: 'SF Mono', monospace; }
.mono { font-family: 'SF Mono', monospace; }

/* Watchlist card */
.watch-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 12px; }
.watch-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.watch-head { display: flex; align-items: center; gap: 8px; }
.watch-name { font-size: 13px; font-weight: 600; flex: 1; }
.watch-meta { display: flex; gap: 6px; font-size: 10px; color: var(--text3); flex-wrap: wrap; }
.upside-badge { font-size: 18px; font-weight: 800; color: var(--green); font-family: 'SF Mono', monospace; }
.signal-pill { font-size: 9px; font-weight: 700; padding: 3px 7px; border-radius: 4px; }
.sig-strong { background: linear-gradient(135deg,#ef4444,#dc2626); color: #fff; }
.sig-buy    { background: linear-gradient(135deg,#3b82f6,#1d4ed8); color: #fff; }
.sig-watch  { background: var(--bg3); color: var(--text2); }
.trade-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; padding: 8px; background: var(--bg3); border-radius: 6px; font-size: 11px; }
.trade-row > div { text-align: center; }
.trade-row .lbl { color: var(--text3); font-size: 9px; }
.trade-row .v.buy { color: var(--blue); font-weight: 700; font-family:'SF Mono',monospace; }
.trade-row .v.tg  { color: var(--green); font-weight: 700; font-family:'SF Mono',monospace; }
.trade-row .v.sl  { color: var(--red); font-weight: 700; font-family:'SF Mono',monospace; }

/* Modal */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.75); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px; }
.modal { background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; width: 100%; max-width: 460px; padding: 24px; }
.modal h3 { font-size: 17px; margin-bottom: 16px; }
.modal-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.modal-row:last-child { border-bottom: none; }
.modal-row .mr-l { color: var(--text3); }
.modal-row .mr-v { font-weight: 600; font-family:'SF Mono',monospace; }
.modal-actions { display: flex; gap: 8px; margin-top: 18px; }
.modal-actions .btn { flex: 1; padding: 11px; }

.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 16px; font-size: 13px; z-index: 2000; display: none; }
.toast.show { display: block; }
.toast.success { border-color: var(--green); }
.toast.error   { border-color: var(--red); }

.live-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: pulse 1s infinite; margin-right: 4px; }
@keyframes pulse { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:.4; transform:scale(1.3); } }

@media (max-width: 700px) {
  .summary-grid { grid-template-columns: repeat(2, 1fr); }
  th:nth-child(5), td:nth-child(5), th:nth-child(6), td:nth-child(6) { display: none; }
}
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <a href="/" class="back-btn">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      메인으로
    </a>
    <span class="logo-sm">Stock<span>Ripple</span></span>
    <span style="font-size:11px;padding:3px 10px;background:var(--bg3);border-radius:5px;color:var(--text3)">📝 페이퍼 트레이딩</span>
  </div>
</header>

<div class="wrap" id="root">
  <div style="text-align:center;padding:60px;color:var(--text3)">불러오는 중...</div>
</div>

<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://nmvfffzpkqyzztiobwtt.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_22PPW0eCY3Tvy3vZVZYKFw_yCb8cI2f';

// 만료 세션 자동 정리
try {
  for (const key of Object.keys(localStorage)) {
    if (!key.startsWith('sb-') || !key.endsWith('-auth-token')) continue;
    try {
      const parsed = JSON.parse(localStorage.getItem(key));
      if (parsed?.expires_at && parsed.expires_at * 1000 < Date.now()) localStorage.removeItem(key);
    } catch { localStorage.removeItem(key); }
  }
} catch {}

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let _user = null;
let _portfolio = null;
let _positions = [];      // 보유 중 (open)
let _closed = [];         // 종결 (closed)
let _watchlist = [];      // AI 추천 (아직 안 산 것)
let _quoteCache = {};     // 실시간 시세 캐시
const _usdKrw = 1500;     // USD/KRW 환율 (고정)

function escHtml(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtKRW(v)  { return v == null ? '—' : '₩' + Math.round(v).toLocaleString('ko-KR'); }
function fmtUSD(v, digits=2)  { return v == null ? '—' : '$' + Number(v).toFixed(digits); }
function fmtPct(v)  { return v == null ? '—' : (v>0?'+':'') + Number(v).toFixed(2) + '%'; }
function toast(msg, type='info') {
  const t = document.getElementById('toast');
  t.className = 'toast show ' + type;
  t.textContent = msg;
  setTimeout(() => t.classList.remove('show'), 3000);
}

// [TRADE] / [FUND] 마커 파싱
function parseRationale(r) {
  if (!r) return { reason: '', trade: null, fund: null };
  let reason = r, trade = null, fund = null;
  const fi = r.indexOf('[FUND]');
  if (fi >= 0) { try { fund = JSON.parse(r.slice(fi+6).split(/\[(TRADE|FUND)\]/)[0].trim()); } catch {} }
  const ti = r.indexOf('[TRADE]');
  if (ti >= 0) {
    const after = r.slice(ti+7);
    const fa = after.indexOf('[FUND]');
    const tjson = fa >= 0 ? after.slice(0, fa).trim() : after.trim();
    try { trade = JSON.parse(tjson); } catch {}
  }
  const cut = Math.min(ti >= 0 ? ti : Infinity, fi >= 0 ? fi : Infinity);
  if (cut !== Infinity) reason = r.slice(0, cut).trim();
  return { reason, trade, fund };
}

// ──────────────────────────────────────────────────────────
// 로그인 게이트
// ──────────────────────────────────────────────────────────
async function init() {
  const { data: { session } } = await sb.auth.getSession();
  _user = session?.user || null;
  if (!_user) {
    renderAuthGate();
    sb.auth.onAuthStateChange((_e, s) => { if (s?.user) { _user = s.user; loadAll(); } });
    return;
  }
  await loadAll();
}

function renderAuthGate() {
  document.getElementById('root').innerHTML = `
    <div class="auth-card">
      <h2>로그인이 필요합니다</h2>
      <p>가상 포트폴리오는 사용자 계정에 연결됩니다.</p>
      <form onsubmit="event.preventDefault();doLogin()" autocomplete="off">
        <input type="text" name="fu" style="display:none" autocomplete="username">
        <input type="password" name="fp" style="display:none" autocomplete="new-password">
        <input type="email" id="pf_email" placeholder="이메일" autocomplete="off" name="e_${Date.now()}" readonly onfocus="this.removeAttribute('readonly')" style="width:100%;margin-bottom:8px">
        <input type="password" id="pf_pw" placeholder="비밀번호" autocomplete="new-password" name="p_${Date.now()}" readonly onfocus="this.removeAttribute('readonly')" style="width:100%;margin-bottom:12px">
        <div id="pf_err" style="font-size:12px;color:var(--red);min-height:16px;margin-bottom:8px"></div>
        <button type="submit" class="btn btn-primary" style="width:100%">로그인</button>
      </form>
    </div>`;
}
async function doLogin() {
  const email = document.getElementById('pf_email').value.trim();
  const pw    = document.getElementById('pf_pw').value;
  const err   = document.getElementById('pf_err');
  err.textContent = '';
  if (!email || !pw) { err.textContent = '이메일/비밀번호 입력'; return; }
  const { error } = await sb.auth.signInWithPassword({ email, password: pw });
  if (error) { err.textContent = error.message; return; }
}

// ──────────────────────────────────────────────────────────
// 데이터 로드
// ──────────────────────────────────────────────────────────
async function loadAll() {
  await ensurePortfolio();
  await loadPositions();
  await loadWatchlist();
  await refreshPrices();
  render();
  // 실시간 시세 30초마다 갱신
  if (!window._priceTimer) {
    window._priceTimer = setInterval(async () => { await refreshPrices(); render(); }, 30000);
  }
}

async function ensurePortfolio() {
  const { data } = await sb.from('paper_portfolios').select('*').eq('user_id', _user.id).maybeSingle();
  if (data) { _portfolio = data; return; }
  // 신규 생성 (1000만원)
  const { data: created, error } = await sb.from('paper_portfolios').insert({
    user_id: _user.id,
    initial_cash: 10000000,
    cash_balance: 10000000,
  }).select().single();
  if (error) { toast('포트폴리오 생성 실패: ' + error.message, 'error'); return; }
  _portfolio = created;
}

async function loadPositions() {
  const { data } = await sb.from('paper_positions')
    .select('*')
    .eq('portfolio_id', _portfolio.id)
    .order('entry_date', { ascending: false });
  _positions = (data || []).filter(p => p.status === 'open');
  _closed    = (data || []).filter(p => p.status === 'closed');
}

async function loadWatchlist() {
  // AI 추천 종목 (인사이트 패널과 동일 로직 단순화)
  const { data } = await sb
    .from('analysis_companies')
    .select('id, upside_pct, confidence, rationale, entry_date, ripple_sector, companies(ticker, name_ko, name_en, market)')
    .order('entry_date', { ascending: false })
    .limit(200);

  // 티커별 가장 최근 분석 1개만 사용
  const seen = new Set();
  const items = [];
  for (const r of data || []) {
    const t = r.companies?.ticker;
    if (!t || seen.has(t)) continue;
    seen.add(t);
    const parsed = parseRationale(r.rationale);
    items.push({
      id: r.id,
      ticker: t,
      name: r.companies.name_ko || r.companies.name_en || t,
      market: r.companies.market || 'US',
      upside: r.upside_pct,
      confidence: r.confidence,
      trade: parsed.trade,
      thesis: parsed.trade?.th,
      sector: r.ripple_sector,
    });
  }

  // 신뢰도 70+ AND 상승 예측 AND 매매 정보 일관성 (target > 0, stop < 0)
  _watchlist = items
    .filter(i => i.upside > 0 && (i.confidence || 0) >= 70)
    .filter(i => {
      const t = i.trade;
      if (!t) return true;
      if (t.tp != null && t.tp <= 0) return false;  // 음수 목표 제외
      if (t.sl != null && t.sl >= 0) return false;  // 양수 손절 제외
      return true;
    })
    .sort((a, b) => (b.confidence + b.upside) - (a.confidence + a.upside))
    .slice(0, 12);
}

async function refreshPrices() {
  // 보유 + 워치리스트의 모든 티커 시세
  const tickers = [...new Set([
    ..._positions.map(p => p.ticker),
    ..._watchlist.map(w => w.ticker),
  ])];
  if (!tickers.length) return;
  try {
    const r = await fetch(`/api/quotes?tickers=${tickers.map(encodeURIComponent).join(',')}`);
    if (!r.ok) return;
    const j = await r.json();
    if (j?.data) Object.assign(_quoteCache, j.data);
  } catch {}
}

// 종목 가격 → KRW 환산 (현재 환율 사용)
function toKrw(price, market) {
  if (price == null) return 0;
  return market === 'KR' ? price : price * _usdKrw;
}

// 진입 환율 기준 KRW 환산 (포지션별 entry_fx_rate 사용)
function toKrwAtEntry(price, position) {
  if (price == null) return 0;
  if (position.market === 'KR') return price;
  const fx = position.entry_fx_rate || _usdKrw;
  return price * fx;
}

// ──────────────────────────────────────────────────────────
// 렌더링
// ──────────────────────────────────────────────────────────
function render() {
  if (!_portfolio) return;
  const root = document.getElementById('root');

  // 평가금액 계산 — 진입 환율 고정 사용 (환차익 제외, 순수 주식 손익만 반영)
  let unrealizedPnl = 0;       // KRW
  let positionsValue = 0;       // KRW
  let fxGain = 0;               // 환차익 (참고용)
  for (const p of _positions) {
    const q = _quoteCache[p.ticker];
    const cur = q?.price ?? p.entry_price;
    // 진입 환율로 환산 (순수 주가 손익)
    const valueAtEntryFx = toKrwAtEntry(cur, p) * p.quantity;
    const entryKrw       = toKrwAtEntry(p.entry_price, p) * p.quantity;
    positionsValue += valueAtEntryFx;
    unrealizedPnl  += (valueAtEntryFx - entryKrw);
    // 환차익 (현재 환율 vs 진입 환율) — 정보용
    if (p.market !== 'KR') {
      const fxNow = toKrw(cur, p.market) * p.quantity;
      fxGain += (fxNow - valueAtEntryFx);
    }
  }
  const realizedPnl = _closed.reduce((s, p) => s + (p.pnl_amount || 0), 0);
  const totalValue  = (_portfolio.cash_balance || 0) + positionsValue;
  const totalPnl    = totalValue - _portfolio.initial_cash;
  const totalPnlPct = (_portfolio.initial_cash > 0)
    ? (totalPnl / _portfolio.initial_cash) * 100 : 0;

  root.innerHTML = `
    <h1>📝 가상 포트폴리오</h1>
    <p class="subtitle" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
      <span>실제 돈 없이 AI 추천대로 매매해보고, 30~90일 누적 결과로 신뢰도 검증.</span>
      <span style="font-size:11px;color:var(--text3);font-family:'SF Mono',monospace">USD/KRW: ₩${Math.round(_usdKrw).toLocaleString()}</span>
      <button class="btn btn-ghost btn-sm" onclick="resetPortfolio()" style="margin-left:auto">🔄 포트폴리오 리셋</button>
    </p>

    <!-- 요약 카드 -->
    <div class="summary-grid">
      <div class="summary-card">
        <div class="s-label">💰 현금 잔고</div>
        <div class="s-val blue">${fmtKRW(_portfolio.cash_balance)}</div>
        <div class="s-sub">시작 ${fmtKRW(_portfolio.initial_cash)}</div>
      </div>
      <div class="summary-card">
        <div class="s-label">📊 보유 평가액</div>
        <div class="s-val">${fmtKRW(positionsValue)}</div>
        <div class="s-sub">${_positions.length}종목</div>
      </div>
      <div class="summary-card">
        <div class="s-label">💎 총 자산</div>
        <div class="s-val ${totalPnl >= 0 ? 'green' : 'red'}">${fmtKRW(totalValue)}</div>
        <div class="s-sub ${totalPnl >= 0 ? 'green' : ''}" style="color:${totalPnl >= 0 ? 'var(--green)' : 'var(--red)'}">${totalPnl >= 0 ? '+' : ''}${fmtKRW(totalPnl)} (${fmtPct(totalPnlPct)})</div>
      </div>
      <div class="summary-card">
        <div class="s-label">🏆 주식 손익 (환율 고정)</div>
        <div class="s-val ${unrealizedPnl >= 0 ? 'green' : 'red'}">${unrealizedPnl >= 0 ? '+' : ''}${fmtKRW(unrealizedPnl)}</div>
        <div class="s-sub">${Math.abs(fxGain) > 100 ? `환차익 ${fxGain >= 0 ? '+' : ''}${fmtKRW(fxGain)} · ` : ''}실현 ${realizedPnl >= 0 ? '+' : ''}${fmtKRW(realizedPnl)}</div>
      </div>
    </div>

    <!-- 보유 종목 -->
    <div class="section">
      <div class="section-h">
        <span class="live-dot"></span>
        <h2>보유 중</h2>
        <span class="count">${_positions.length}건</span>
        <span style="margin-left:auto;font-size:11px;color:var(--text3)">실시간 시세 30초 갱신</span>
      </div>
      ${_positions.length ? `
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>티커</th><th>종목</th><th>수량</th>
                <th>진입가</th><th>현재가</th><th>평가금액</th>
                <th>수익률</th><th>AI 가이드</th><th>액션</th>
              </tr>
            </thead>
            <tbody>${_positions.map(renderPositionRow).join('')}</tbody>
          </table>
        </div>
      ` : `<div style="background:var(--bg2);border:1px dashed var(--border);border-radius:10px;padding:24px;text-align:center;color:var(--text3);font-size:13px">아직 보유 종목이 없습니다. 아래 추천 종목에서 가상 매수해 보세요.</div>`}
    </div>

    <!-- AI 추천 워치리스트 -->
    <div class="section">
      <div class="section-h">
        <h2>🎯 AI 추천 워치리스트</h2>
        <span class="count">${_watchlist.length}건 · 신뢰도 70%+</span>
      </div>
      ${_watchlist.length ? `<div class="watch-grid">${_watchlist.map(renderWatchCard).join('')}</div>`
        : `<div style="background:var(--bg2);border:1px dashed var(--border);border-radius:10px;padding:24px;text-align:center;color:var(--text3);font-size:13px">조건 만족 추천 없음 (신뢰도 70%+, 상승 예측). 메인에서 분석 더 누적 필요.</div>`}
    </div>

    <!-- 종결된 거래 -->
    ${_closed.length ? `
    <div class="section">
      <div class="section-h">
        <h2>📜 거래 이력</h2>
        <span class="count">${_closed.length}건</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>티커</th><th>종목</th><th>수량</th>
              <th>진입가</th><th>청산가</th><th>손익액</th>
              <th>수익률</th><th>사유</th><th>기간</th>
            </tr>
          </thead>
          <tbody>${_closed.slice(0, 30).map(renderClosedRow).join('')}</tbody>
        </table>
      </div>
    </div>` : ''}
  `;
}

function renderPositionRow(p) {
  const q = _quoteCache[p.ticker];
  const cur = q?.price ?? p.entry_price;
  const pnlPct = ((cur - p.entry_price) / p.entry_price) * 100;
  // 진입 환율 고정 사용 (환차익 제외, 순수 주식 손익)
  const valueKrw = toKrwAtEntry(cur, p) * p.quantity;
  const entryKrw = toKrwAtEntry(p.entry_price, p) * p.quantity;
  const pnlAmt = valueKrw - entryKrw;
  const value  = valueKrw;
  const isKr   = p.market === 'KR';
  const fmtP   = isKr ? fmtKRW : fmtUSD;
  const cls    = pnlPct > 0 ? 'up' : pnlPct < 0 ? 'dn' : 'flat';
  const tgtHit = (p.ai_target_pct != null) && (pnlPct >= p.ai_target_pct);
  const slHit  = (p.ai_stop_pct   != null) && (pnlPct <= p.ai_stop_pct);
  const aiHint = tgtHit ? `<span style="color:var(--green);font-weight:700">🎯 목표 도달</span>` :
                 slHit  ? `<span style="color:var(--red);font-weight:700">⚠️ 손절선 도달</span>` :
                 p.ai_target_pct ? `<span style="color:var(--text3)">목표 +${p.ai_target_pct}% / 손절 ${p.ai_stop_pct}%</span>` : '—';

  return `
    <tr>
      <td><span class="ticker-chip ${isKr?'kr':'us'}">${escHtml(p.ticker)}</span></td>
      <td><a href="/company.html?ticker=${encodeURIComponent(p.ticker)}" style="color:var(--text);text-decoration:none">${escHtml(p.name_ko || p.ticker)}</a></td>
      <td class="mono">${p.quantity}</td>
      <td class="mono">${fmtP(p.entry_price)}</td>
      <td class="mono">${fmtP(cur)}</td>
      <td class="mono">${fmtKRW(value)}</td>
      <td class="pct ${cls}">${fmtPct(pnlPct)}<br><span style="font-size:10px;font-weight:400">${pnlAmt >= 0 ? '+' : ''}${fmtKRW(pnlAmt)}</span></td>
      <td style="font-size:11px">${aiHint}</td>
      <td>
        <button class="btn btn-success btn-sm" onclick="closePosition('${p.id}','manual')">청산</button>
      </td>
    </tr>`;
}

function renderClosedRow(p) {
  const days = p.exit_date && p.entry_date
    ? Math.round((new Date(p.exit_date) - new Date(p.entry_date)) / 86400000) : '—';
  const isKr = p.market === 'KR';
  const fmtP = isKr ? fmtKRW : fmtUSD;
  const cls  = (p.pnl_pct||0) > 0 ? 'up' : (p.pnl_pct||0) < 0 ? 'dn' : 'flat';
  const reasonLabel = { manual:'수동', target_hit:'🎯 익절', stop_hit:'⚠️ 손절' }[p.exit_reason] || p.exit_reason;
  return `
    <tr>
      <td><span class="ticker-chip ${isKr?'kr':'us'}">${escHtml(p.ticker)}</span></td>
      <td>${escHtml(p.name_ko || p.ticker)}</td>
      <td class="mono">${p.quantity}</td>
      <td class="mono">${fmtP(p.entry_price)}</td>
      <td class="mono">${fmtP(p.exit_price)}</td>
      <td class="pct ${cls}">${p.pnl_amount >= 0 ? '+' : ''}${fmtKRW(p.pnl_amount)}</td>
      <td class="pct ${cls}">${fmtPct(p.pnl_pct)}</td>
      <td style="font-size:11px;color:var(--text2)">${reasonLabel}</td>
      <td class="mono" style="font-size:11px;color:var(--text3)">${days}일</td>
    </tr>`;
}

function renderWatchCard(w) {
  const q = _quoteCache[w.ticker];
  const isKr = w.market === 'KR';
  const fmtP = isKr ? (v => fmtKRW(v)) : (v => fmtUSD(v));
  const signal = (w.confidence >= 80) ? { label: '🔥 STRONG BUY', cls: 'sig-strong' }
                 : (w.confidence >= 70) ? { label: '⭐ BUY', cls: 'sig-buy' }
                 : { label: 'WATCH', cls: 'sig-watch' };

  // 현재가 기반 실제 가격 계산
  const cur = q?.price;
  const t = w.trade || {};
  const buyLow  = cur && t.elp != null ? cur * (1 + t.elp / 100) : null;
  const buyHigh = cur && t.ehp != null ? cur * (1 + t.ehp / 100) : null;
  const target  = cur && t.tp  != null ? cur * (1 + t.tp  / 100) : null;
  const stop    = cur && t.sl  != null ? cur * (1 + t.sl  / 100) : null;

  return `
    <div class="watch-card">
      <div class="watch-head">
        <span class="ticker-chip ${isKr?'kr':'us'}">${escHtml(w.ticker)}</span>
        <span class="watch-name">${escHtml(w.name)}</span>
        <span class="upside-badge">+${Math.round(w.upside)}%</span>
      </div>
      <div class="watch-meta">
        <span class="signal-pill ${signal.cls}">${signal.label}</span>
        <span>신뢰 ${w.confidence}%</span>
        ${w.sector ? `<span>· ${escHtml(w.sector)}</span>` : ''}
        ${cur ? `<span style="margin-left:auto;font-family:'SF Mono',monospace;font-weight:700;color:var(--text)">${fmtP(cur)}</span>` : ''}
      </div>
      ${t && (buyLow || target || stop) ? `
        <div class="trade-row">
          <div>
            <div class="lbl">매수가</div>
            ${buyLow && buyHigh ? `
              <div class="v buy">${fmtP(buyLow)}<br><span style="font-size:9px;color:var(--text3);font-weight:400">~ ${fmtP(buyHigh)}</span></div>
            ` : `<div class="v buy">—</div>`}
          </div>
          <div>
            <div class="lbl">목표</div>
            ${target ? `<div class="v tg">${fmtP(target)}<br><span style="font-size:9px;color:var(--text3);font-weight:400">+${t.tp}%</span></div>` : `<div class="v tg">—</div>`}
          </div>
          <div>
            <div class="lbl">손절</div>
            ${stop ? `<div class="v sl">${fmtP(stop)}<br><span style="font-size:9px;color:var(--text3);font-weight:400">${t.sl}%</span></div>` : `<div class="v sl">—</div>`}
          </div>
        </div>` : ''}
      ${w.thesis ? `<div style="font-size:11px;color:var(--text2);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${escHtml(w.thesis)}</div>` : ''}
      <button class="btn btn-primary btn-sm" style="margin-top:auto" onclick='openBuyModal(${JSON.stringify({ticker:w.ticker, name:w.name, market:w.market, ac_id:w.id, trade:w.trade, upside:w.upside}).replace(/'/g,"&#39;")})'>가상 매수</button>
    </div>`;
}

// ──────────────────────────────────────────────────────────
// 매수 모달 + 매수 실행
// ──────────────────────────────────────────────────────────
function openBuyModal(w) {
  const q = _quoteCache[w.ticker];
  const isKr = w.market === 'KR';
  const fmtP = isKr ? fmtKRW : fmtUSD;
  const price = q?.price;
  const currency = isKr ? 'KRW' : 'USD';

  // 실시간 환율 사용
  const priceInKrw = isKr ? price : (price * _usdKrw);

  // 기본 투자금액: 잔고의 5%
  const defaultBudget = Math.round((_portfolio.cash_balance || 0) * 0.05);
  const defaultQty = priceInKrw ? Math.floor(defaultBudget / priceInKrw) : 0;

  // 실제 가격 계산
  const t = w.trade || {};
  const buyLow  = price && t.elp != null ? price * (1 + t.elp / 100) : null;
  const buyHigh = price && t.ehp != null ? price * (1 + t.ehp / 100) : null;
  const target  = price && t.tp  != null ? price * (1 + t.tp  / 100) : null;
  const stop    = price && t.sl  != null ? price * (1 + t.sl  / 100) : null;

  document.body.insertAdjacentHTML('beforeend', `
    <div class="modal-overlay" id="buyModal" onclick="if(event.target===this)closeBuyModal()">
      <div class="modal">
        <h3>가상 매수: ${escHtml(w.name)} (${escHtml(w.ticker)})</h3>
        <div class="modal-row"><span class="mr-l">현재가</span><span class="mr-v">${price ? fmtP(price) : '—'} ${!isKr ? `(₩${Math.round(priceInKrw).toLocaleString()})` : ''}</span></div>
        ${w.trade ? `
        <div class="modal-row"><span class="mr-l">AI 추천 매수가</span><span class="mr-v" style="color:var(--blue)">${buyLow ? fmtP(buyLow) : '—'} ~ ${buyHigh ? fmtP(buyHigh) : '—'}<br><span style="font-size:10px;color:var(--text3);font-weight:400">(${(t.elp>0?'+':'')}${t.elp}% ~ ${(t.ehp>0?'+':'')}${t.ehp}%)</span></span></div>
        <div class="modal-row"><span class="mr-l">목표가</span><span class="mr-v" style="color:var(--green)">${target ? fmtP(target) : '—'} <span style="font-size:10px;color:var(--text3);font-weight:400">(+${t.tp}%)</span></span></div>
        <div class="modal-row"><span class="mr-l">손절가</span><span class="mr-v" style="color:var(--red)">${stop ? fmtP(stop) : '—'} <span style="font-size:10px;color:var(--text3);font-weight:400">(${t.sl}%)</span></span></div>
        ` : ''}
        <div class="modal-row"><span class="mr-l">잔고</span><span class="mr-v">${fmtKRW(_portfolio.cash_balance)}</span></div>
        <div style="padding:10px 0;border-bottom:1px solid var(--border)">
          <div class="mr-l" style="font-size:12px;margin-bottom:8px">💰 잔고 비율로 빠른 선택</div>
          <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px">
            <button class="btn btn-ghost btn-sm" type="button" onclick="setBuyByPercent(10)">10%</button>
            <button class="btn btn-ghost btn-sm" type="button" onclick="setBuyByPercent(25)">25%</button>
            <button class="btn btn-ghost btn-sm" type="button" onclick="setBuyByPercent(50)">50%</button>
            <button class="btn btn-ghost btn-sm" type="button" onclick="setBuyByPercent(100)">최대</button>
          </div>
        </div>
        <div class="modal-row" style="display:flex;justify-content:space-between;align-items:center">
          <span class="mr-l">매수 수량</span>
          <input type="number" id="buyQty" value="${defaultQty}" min="1" style="width:120px;text-align:right" oninput="updateBuyTotal()">
        </div>
        <div class="modal-row"><span class="mr-l">예상 매수금액</span><span class="mr-v" id="buyTotal">${fmtKRW(defaultQty * priceInKrw)}</span></div>
        <div class="modal-row"><span class="mr-l">매수 후 잔고</span><span class="mr-v" id="buyRemaining" style="color:var(--text3);font-size:12px">${fmtKRW(_portfolio.cash_balance - defaultQty * priceInKrw)}</span></div>
        <div id="buyError" style="font-size:12px;color:var(--red);margin-top:8px;min-height:16px"></div>
        <div class="modal-actions">
          <button class="btn btn-ghost" onclick="closeBuyModal()">취소</button>
          <button class="btn btn-primary" onclick='executeBuy(${JSON.stringify(w).replace(/'/g,"&#39;")})'>매수 확정</button>
        </div>
      </div>
    </div>`);
  window._buyContext = { w, price, priceInKrw };
}

function updateBuyTotal() {
  const qty = parseFloat(document.getElementById('buyQty').value) || 0;
  const { priceInKrw } = window._buyContext || {};
  if (!priceInKrw) return;
  const total = qty * priceInKrw;
  const remaining = _portfolio.cash_balance - total;
  document.getElementById('buyTotal').textContent = fmtKRW(total);
  const remEl = document.getElementById('buyRemaining');
  if (remEl) {
    remEl.textContent = fmtKRW(remaining);
    remEl.style.color = remaining < 0 ? 'var(--red)' : 'var(--text3)';
  }
}

// 잔고 비율로 매수 수량 자동 설정
function setBuyByPercent(pct) {
  const { priceInKrw } = window._buyContext || {};
  if (!priceInKrw) return;
  const budget = _portfolio.cash_balance * (pct / 100);
  const qty = Math.floor(budget / priceInKrw);
  document.getElementById('buyQty').value = Math.max(1, qty);
  updateBuyTotal();
}

function closeBuyModal() {
  document.getElementById('buyModal')?.remove();
}

async function executeBuy(w) {
  const qty = parseFloat(document.getElementById('buyQty').value);
  const errEl = document.getElementById('buyError');
  errEl.textContent = '';
  if (!qty || qty < 1) { errEl.textContent = '수량을 입력하세요'; return; }
  const { price, priceInKrw } = window._buyContext || {};
  if (!price) { errEl.textContent = '현재가 정보 없음'; return; }
  const totalKrw = qty * priceInKrw;
  if (totalKrw > _portfolio.cash_balance) {
    errEl.textContent = `잔고 부족 (필요: ${fmtKRW(totalKrw)})`;
    return;
  }

  // DB 저장 + 잔고 차감
  const isKr = w.market === 'KR';
  const { error: posErr } = await sb.from('paper_positions').insert({
    portfolio_id: _portfolio.id,
    ticker: w.ticker,
    name_ko: w.name,
    market: w.market,
    quantity: qty,
    entry_price: price,
    entry_date: new Date().toISOString(),
    entry_fx_rate: isKr ? 1 : _usdKrw,   // 매수 시점 환율 고정 (환차익 제거용)
    analysis_company_id: w.ac_id,
    ai_target_pct: w.trade?.tp ?? null,
    ai_stop_pct:   w.trade?.sl ?? null,
    ai_thesis:     w.trade?.th ?? null,
    ai_time_frame: w.trade?.tf ?? null,
    status: 'open',
  });
  if (posErr) { errEl.textContent = posErr.message; return; }

  const newCash = _portfolio.cash_balance - totalKrw;
  await sb.from('paper_portfolios').update({ cash_balance: newCash, updated_at: new Date().toISOString() }).eq('id', _portfolio.id);

  closeBuyModal();
  toast(`✓ ${w.ticker} ${qty}주 매수 완료`, 'success');
  await loadAll();
}

// ──────────────────────────────────────────────────────────
// 청산
// ──────────────────────────────────────────────────────────
// 포트폴리오 리셋 (모든 포지션 삭제 + 잔고 1000만원으로 초기화)
async function resetPortfolio() {
  if (!confirm('정말 리셋하시겠습니까?\n\n• 모든 보유 포지션 삭제\n• 모든 거래 이력 삭제\n• 현금 잔고 ₩10,000,000으로 초기화')) return;
  if (!confirm('이 작업은 되돌릴 수 없습니다. 진행할까요?')) return;

  // 모든 포지션 삭제 (RLS가 user_id로 자동 필터)
  const { error: posErr } = await sb.from('paper_positions')
    .delete().eq('portfolio_id', _portfolio.id);
  if (posErr) { toast('포지션 삭제 실패: ' + posErr.message, 'error'); return; }

  // 잔고 리셋
  const { error: portErr } = await sb.from('paper_portfolios')
    .update({ cash_balance: 10000000, initial_cash: 10000000, updated_at: new Date().toISOString() })
    .eq('id', _portfolio.id);
  if (portErr) { toast('잔고 리셋 실패: ' + portErr.message, 'error'); return; }

  toast('✓ 포트폴리오 리셋 완료', 'success');
  await loadAll();
}

async function closePosition(positionId, reason) {
  const pos = _positions.find(p => p.id === positionId);
  if (!pos) return;
  const q = _quoteCache[pos.ticker];
  if (!q?.price) { toast('현재가 정보 없음', 'error'); return; }

  if (reason === 'manual' && !confirm(`${pos.ticker} ${pos.quantity}주를 현재가에 청산하시겠습니까?`)) return;

  const isKr = pos.market === 'KR';
  // 청산은 진입 환율 기준 (순수 주식 손익만 반영)
  const entryFx       = pos.entry_fx_rate || (isKr ? 1 : _usdKrw);
  const exitPriceKrw  = isKr ? q.price       : q.price * entryFx;
  const entryPriceKrw = isKr ? pos.entry_price : pos.entry_price * entryFx;
  const pnlAmount = (exitPriceKrw - entryPriceKrw) * pos.quantity;
  const pnlPct = ((q.price - pos.entry_price) / pos.entry_price) * 100;

  const { error } = await sb.from('paper_positions').update({
    exit_price: q.price,
    exit_date: new Date().toISOString(),
    exit_reason: reason,
    pnl_pct: pnlPct,
    pnl_amount: pnlAmount,
    status: 'closed',
  }).eq('id', positionId);
  if (error) { toast(error.message, 'error'); return; }

  // 잔고 환원 (청산 금액)
  const proceeds = exitPriceKrw * pos.quantity;
  const newCash = _portfolio.cash_balance + proceeds;
  await sb.from('paper_portfolios').update({ cash_balance: newCash, updated_at: new Date().toISOString() }).eq('id', _portfolio.id);

  toast(`✓ ${pos.ticker} 청산 (${pnlPct >= 0 ? '+' : ''}${pnlPct.toFixed(2)}%)`, pnlPct >= 0 ? 'success' : 'error');
  await loadAll();
}

init();
</script>
</body>
</html>
