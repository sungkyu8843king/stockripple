<script>
/* 모의투자 (구 "가상 포트폴리오") — 2026-08-01 전면 재작성.
 *
 * 이전 버전은 analysis_companies에서 "AI 추천 워치리스트(STRONG BUY / 신뢰도 / 목표가 /
 * 손절가 / 상승여력%)"를 읽어 카드로 뿌렸는데, 그 테이블의 anon SELECT 정책은
 * db/disable-public-recommendations.sql로 이미 DROP된 상태라(유사투자자문업 리스크,
 * CLAUDE.md 참고) 실제로는 늘 빈 섹션이었다 — UI만 남아 있던 셈. 재작성하면서
 * 그 축을 통째로 걷어내고, "종목 찾기"는 투자판단이 섞이지 않는 객관적 시장 데이터
 * (토스 실시간 랭킹: 인기/거래대금/거래량/급등/급락)로만 채운다.
 * ⚠️ 이 페이지에 목표가·손절가·신뢰도·상승여력·매수후보류를 다시 넣지 말 것.
 *
 * 데이터: /api/toss?action=rankings-all|fx, /api/quotes, companies(anon), /api/stock?type=search-kr
 * 저장:  paper_portfolios / paper_positions (RLS로 본인 것만, db/paper-trading.sql)
 *
 * 손익은 "진입 시점 환율 고정" 기준 — 미국 종목의 환차익을 손익에서 제외해 순수
 * 주가 수익률만 보이게 한다(기존 버전의 정책을 그대로 유지, entry_fx_rate 컬럼).
 */

// escHtml/showToast/sb 는 site-header.js가 전역 제공(2026-07-22 통합) — 재정의하지 않는다.
const INITIAL_CASH = 10000000;

let _user = null, _pf = null;
let _lots = [];          // status='open' 개별 매수 건(로트)
let _closed = [];        // status='closed'
let _q = {};             // 시세 캐시 { ticker: {price, changePercent, currency} }
let _fx = 1441;          // USD/KRW (로드 시 실제값으로 교체)
let _sel = null;         // 선택 종목 { ticker, name, market }
let _side = 'buy';
let _findMkt = 'KR', _findCat = 'popular', _findCache = {}, _findBusy = false;
let _metaCache = {};     // KR 티커 → nxtSupported(bool), 넥스트레이드 애프터마켓(~20:00) 허용 판단용
let _marketGate = { ok: true }; // orderHtml()이 채우고 updateOrder()/submitOrder()가 참조
let _krHoliday = false;  // 평일이지만 국내 증시 휴장일(공휴일) — boot()에서 1회 조회, isTradableNow가 참조

const isKrTicker = t => /\.K[SQ]$/i.test(t || '');
const fmtKRW = v => v == null ? '—' : '₩' + Math.round(v).toLocaleString('ko-KR');
const fmtUSD = v => v == null ? '—' : '$' + Number(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtNat = (v, mkt) => mkt === 'KR' ? fmtKRW(v) : fmtUSD(v);
const fmtPct = v => v == null ? '—' : (v > 0 ? '+' : '') + Number(v).toFixed(2) + '%';
const dirCls = v => v > 0 ? 'up' : v < 0 ? 'dn' : '';
const nfmt = v => Number(v || 0).toLocaleString('ko-KR');

/* 로트의 진입 환율 — 매수 시점에 고정 저장(구버전 행은 현재 환율로 폴백) */
const lotFx = l => l.market === 'KR' ? 1 : (Number(l.entry_fx_rate) || _fx);
const krwAt = (price, l) => (price == null ? 0 : price * lotFx(l));

/* ══════════════ 장 시간 게이트 ══════════════
 * 국내(09:00~15:30 KST)·미국(09:30~16:00 ET, DST는 Intl이 자동 반영) 정규장에만
 * 주문 가능. 국내는 넥스트레이드(NXT) 애프터마켓 지원 종목만 예외로 20:00까지
 * 연장 — company.html의 loadStockMeta()와 같은 /api/toss?action=meta의
 * nxtSupported 필드를 그대로 재사용(app.js:anyMarketOpenNow와 같은 Intl 패턴). */
function marketWindow() {
  const now = new Date();
  const parts = tz => {
    const p = new Intl.DateTimeFormat('en-US', { timeZone: tz, weekday: 'short', hour: '2-digit', minute: '2-digit', hour12: false }).formatToParts(now);
    const g = t => p.find(x => x.type === t)?.value;
    return { wd: g('weekday'), min: (parseInt(g('hour')) % 24) * 60 + parseInt(g('minute')) };
  };
  const wk = w => w !== 'Sat' && w !== 'Sun';
  const kr = parts('Asia/Seoul'), us = parts('America/New_York');
  return { krWeekday: wk(kr.wd), krMin: kr.min, usWeekday: wk(us.wd), usMin: us.min };
}

async function ensureNxtMeta(ticker) {
  if (ticker in _metaCache) return;
  try {
    const r = await fetch('/api/toss?action=meta&symbol=' + encodeURIComponent(ticker));
    const m = await r.json();
    _metaCache[ticker] = m?.ok ? !!m.nxtSupported : false;
  } catch { _metaCache[ticker] = false; }
  if (_sel && _sel.ticker === ticker) repaintOrder();
}

function isTradableNow(market, ticker) {
  const w = marketWindow();
  if (market === 'KR') {
    if (!w.krWeekday) return { ok: false, reason: '국내 증시는 주말엔 거래할 수 없습니다.' };
    // 평일이어도 국내 공휴일(추석·설·광복절 등)엔 KRX가 휴장 — 요일만으론 못 걸러서
    // boot()가 미리 받아온 실제 토스 개장일 판정(_krHoliday)을 추가로 확인한다
    // (kr-market.html·index.html의 같은 문제 수정과 동일한 근거 데이터).
    if (_krHoliday) return { ok: false, reason: '오늘은 국내 증시 휴장일입니다.' };
    const nxt = !!_metaCache[ticker];
    const closeMin = nxt ? 1200 : 930; // NXT 애프터마켓 지원 종목은 20:00, 아니면 15:30
    if (w.krMin >= 540 && w.krMin < closeMin) return { ok: true };
    return { ok: false, reason: nxt
      ? '지금은 국내 거래 가능 시간이 아닙니다 (09:00~20:00, 넥스트레이드 애프터마켓 포함).'
      : '지금은 국내 정규장 시간이 아닙니다 (09:00~15:30). 넥스트레이드(NXT) 지원 종목은 20:00까지 거래할 수 있어요.' };
  }
  if (market === 'US') {
    if (!w.usWeekday) return { ok: false, reason: '미국 증시는 주말엔 거래할 수 없습니다.' };
    if (w.usMin >= 570 && w.usMin < 960) return { ok: true };
    return { ok: false, reason: '지금은 미국 정규장 시간이 아닙니다 (한국시간 22:30~05:00).' };
  }
  return { ok: true };
}

async function init() {
  const { data: { session } } = await sb.auth.getSession();
  _user = session?.user || null;
  if (!_user) {
    renderGate();
    sb.auth.onAuthStateChange((_e, s) => { if (s?.user && !_user) { _user = s.user; boot(); } });
    return;
  }
  boot();
}

function renderGate() {
  document.getElementById('root').innerHTML = `
    <div class="gate">
      <h2>로그인하고 모의투자 시작하기</h2>
      <p>가상 자금 <b>₩10,000,000</b>이 계좌에 지급됩니다.<br>보유 종목과 거래 내역은 계정에 저장돼 언제든 이어서 볼 수 있어요.</p>
      <button class="btn btn-primary" style="padding:12px 26px;font-size:15px" onclick="openAuthModal()">로그인 / 회원가입</button>
    </div>`;
}

async function boot() {
  try {
    const fxRes = await fetch('/api/toss?action=fx').then(r => r.json()).catch(() => null);
    if (fxRes?.rate > 0) _fx = fxRes.rate;
  } catch {}
  try {
    // /api/toss(액션 없는 기본 핸들러)가 토스 market-calendar/KR 기반 krMarket.isHoliday를
    // 이미 계산해서 준다 — 여기서 새로 판정 로직을 만들지 않고 그대로 재사용.
    const calRes = await fetch('/api/toss').then(r => r.json()).catch(() => null);
    if (calRes?.ok) _krHoliday = !!calRes.krMarket?.isHoliday;
  } catch {}
  await ensurePortfolio();
  if (!_pf) return;
  await loadLots();
  await refreshQuotes();
  render();
  loadFind();
  if (!window._pfTimer) {
    window._pfTimer = setInterval(async () => {
      if (document.hidden || !_pf) return;
      await refreshQuotes();
      render();
    }, 30000);
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && _pf) refreshQuotes().then(render);
    });
  }
}

async function ensurePortfolio() {
  const { data } = await sb.from('paper_portfolios').select('*').eq('user_id', _user.id).maybeSingle();
  if (data) { _pf = data; return; }
  const { data: created, error } = await sb.from('paper_portfolios')
    .insert({ user_id: _user.id, initial_cash: INITIAL_CASH, cash_balance: INITIAL_CASH })
    .select().single();
  if (error) {
    document.getElementById('root').innerHTML = `<div class="empty">계좌를 만들지 못했습니다.<br>${escHtml(error.message)}</div>`;
    return;
  }
  _pf = created;
}

async function loadLots() {
  const { data } = await sb.from('paper_positions').select('*')
    .eq('portfolio_id', _pf.id).order('entry_date', { ascending: true });
  _lots   = (data || []).filter(p => p.status === 'open');
  _closed = (data || []).filter(p => p.status === 'closed').reverse();
}

async function refreshQuotes() {
  const tickers = [...new Set([..._lots.map(l => l.ticker), ...(_sel ? [_sel.ticker] : [])])];
  if (!tickers.length) return;
  try {
    const r = await fetch('/api/quotes?tickers=' + tickers.map(encodeURIComponent).join(','));
    const j = await r.json();
    if (j?.data) Object.assign(_q, j.data);
  } catch {}
}

/* 보유 로트를 종목 단위로 합산 — 실제 증권사 잔고 화면과 같은 형태(평균단가/평가손익) */
function holdings() {
  const m = new Map();
  for (const l of _lots) {
    let h = m.get(l.ticker);
    if (!h) {
      h = { ticker: l.ticker, name: l.name_ko || l.ticker, market: l.market || (isKrTicker(l.ticker) ? 'KR' : 'US'), qty: 0, natSum: 0, costKrw: 0 };
      m.set(l.ticker, h);
    }
    const q = Number(l.quantity);
    h.qty     += q;
    h.natSum  += Number(l.entry_price) * q;          // 평균단가용(원 통화 기준)
    h.costKrw += krwAt(Number(l.entry_price), l) * q; // 원가(진입 환율 고정)
  }
  return [...m.values()].map(h => {
    const cur   = _q[h.ticker]?.price ?? (h.natSum / h.qty);
    const avg   = h.natSum / h.qty;
    const fx    = h.market === 'KR' ? 1 : _fx;
    const valKrw = cur * (h.market === 'KR' ? 1 : fx) * h.qty;
    // 평가금액도 원가와 같은 "진입 환율" 축으로 맞춰야 환차익이 손익에 섞이지 않는다
    const valAtEntryFx = _lots.filter(l => l.ticker === h.ticker)
      .reduce((s, l) => s + krwAt(cur, l) * Number(l.quantity), 0);
    return { ...h, cur, avg, valKrw, valAtEntryFx, pnlKrw: valAtEntryFx - h.costKrw, pnlPct: ((cur - avg) / avg) * 100 };
  }).sort((a, b) => b.valAtEntryFx - a.valAtEntryFx);
}

/* ══════════════ 주문 티켓 ══════════════ */
function orderHtml() {
  const searchBox = `
    <div class="order-search">
      <div class="order-search-in">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="stkSearch" placeholder="종목명 또는 티커 검색" autocomplete="off"
               oninput="onSearchInput(this.value)" onfocus="onSearchInput(this.value)">
      </div>
      <div id="sugBox"></div>
    </div>`;

  if (!_sel) {
    return `<div class="panel-h"><h2>🧾 주문</h2></div>${searchBox}
      <div class="order-empty">주문할 종목을 검색해 주세요.<br>아래 <b>종목 찾기</b>에서 눌러도 됩니다.</div>`;
  }

  const isKr  = _sel.market === 'KR';
  const q     = _q[_sel.ticker] || {};
  const price = q.price;
  const chg   = q.changePercent;
  const unitKrw = price == null ? null : price * (isKr ? 1 : _fx);
  const held  = holdings().find(h => h.ticker === _sel.ticker);
  const heldQty = held ? held.qty : 0;
  const cash  = Number(_pf.cash_balance);
  const maxQty = _side === 'buy'
    ? (unitKrw > 0 ? Math.floor(cash / unitKrw) : 0)
    : heldQty;
  if (isKr) ensureNxtMeta(_sel.ticker);
  const gate = isTradableNow(_sel.market, _sel.ticker);
  _marketGate = gate;

  return `
    <div class="panel-h"><h2>🧾 주문</h2></div>
    ${searchBox}
    ${!gate.ok ? `<div class="order-msg" style="color:var(--yellow);font-weight:600;margin-bottom:11px">⏰ ${escHtml(gate.reason)}</div>` : ''}
    <div class="sel-box">
      <div class="sel-top">
        <span class="tk ${isKr ? 'kr' : 'us'}">${escHtml(_sel.ticker.replace(/\.(KS|KQ)$/i, ''))}</span>
        <span class="sel-nm">${escHtml(_sel.name)}</span>
      </div>
      <div class="sel-price ${dirCls(chg)}">${price == null ? '—' : fmtNat(price, _sel.market)}</div>
      <div class="sel-chg ${dirCls(chg)}">${chg == null ? '' : fmtPct(chg)}</div>
      ${!isKr && unitKrw ? `<div class="sel-krw">≈ ${fmtKRW(unitKrw)} · 환율 ₩${Math.round(_fx).toLocaleString()}</div>` : ''}
    </div>

    <div class="side-tabs">
      <button class="side-tab buy ${_side === 'buy' ? 'on' : ''}" onclick="setSide('buy')">매수</button>
      <button class="side-tab sell ${_side === 'sell' ? 'on' : ''}" onclick="setSide('sell')">매도</button>
    </div>

    <div class="f-row">
      <span class="f-lbl">${_side === 'buy' ? '주문 가능' : '보유 수량'}</span>
      <span class="f-val">${_side === 'buy' ? fmtKRW(cash) : nfmt(heldQty) + '주'}</span>
    </div>
    <div class="f-row">
      <span class="f-lbl">수량</span>
      <input type="number" class="qty-in" id="ordQty" min="1" step="1" value="" placeholder="0" oninput="updateOrder()">
    </div>
    <div class="pct-row">
      ${[10, 25, 50, 100].map(p => `<button class="btn btn-ghost btn-sm" onclick="setQtyPct(${p})">${p === 100 ? '최대' : p + '%'}</button>`).join('')}
    </div>
    <div class="f-row">
      <span class="f-lbl">주문 금액</span>
      <span class="f-val" id="ordTotal">${fmtKRW(0)}</span>
    </div>
    <div class="f-row">
      <span class="f-lbl">주문 후 현금</span>
      <span class="f-val" id="ordAfter" style="color:var(--text3)">${fmtKRW(cash)}</span>
    </div>
    <div class="order-msg" id="ordMsg"></div>
    <button class="order-submit" id="ordBtn"
            style="background:${_side === 'buy' ? 'var(--red)' : 'var(--blue)'}"
            onclick="submitOrder()" ${price == null || maxQty < 1 || !gate.ok ? 'disabled' : ''}>
      ${!gate.ok ? '거래 시간이 아닙니다' : price == null ? '시세 없음' : _side === 'buy' ? '매수 주문' : '매도 주문'}
    </button>`;
}

function repaintOrder() {
  const el = document.getElementById('orderPanel');
  if (el) el.innerHTML = orderHtml();
}
function setSide(s) { _side = s; repaintOrder(); }

function orderUnitKrw() {
  if (!_sel) return null;
  const p = _q[_sel.ticker]?.price;
  if (p == null) return null;
  return p * (_sel.market === 'KR' ? 1 : _fx);
}

function setQtyPct(pct) {
  const unit = orderUnitKrw();
  if (!unit) return;
  let qty;
  if (_side === 'buy') {
    qty = Math.floor((Number(_pf.cash_balance) * (pct / 100)) / unit);
  } else {
    const h = holdings().find(x => x.ticker === _sel.ticker);
    qty = Math.floor((h ? h.qty : 0) * (pct / 100));
  }
  document.getElementById('ordQty').value = Math.max(0, qty);
  updateOrder();
}

function updateOrder() {
  const unit = orderUnitKrw();
  const qty  = parseInt(document.getElementById('ordQty')?.value, 10) || 0;
  const cash = Number(_pf.cash_balance);
  const total = unit ? qty * unit : 0;
  const after = _side === 'buy' ? cash - total : cash + total;
  const msgEl = document.getElementById('ordMsg');
  const btn   = document.getElementById('ordBtn');
  const tEl = document.getElementById('ordTotal'); if (tEl) tEl.textContent = fmtKRW(total);
  const aEl = document.getElementById('ordAfter'); if (aEl) aEl.textContent = fmtKRW(after);
  if (!msgEl || !btn) return;

  if (_marketGate && !_marketGate.ok) { msgEl.textContent = ''; btn.disabled = true; return; }

  let err = '';
  if (qty > 0 && _side === 'buy' && total > cash) err = `현금이 ${fmtKRW(total - cash)} 부족합니다.`;
  if (qty > 0 && _side === 'sell') {
    const h = holdings().find(x => x.ticker === _sel.ticker);
    if (!h || qty > h.qty) err = `보유 수량(${nfmt(h ? h.qty : 0)}주)을 초과했습니다.`;
  }
  msgEl.textContent = err;
  msgEl.style.color = 'var(--red)';
  btn.disabled = !!err || qty < 1 || !unit;
}

async function submitOrder() {
  const qty = parseInt(document.getElementById('ordQty')?.value, 10) || 0;
  if (qty < 1 || !_sel) return;
  const gate = isTradableNow(_sel.market, _sel.ticker);
  if (!gate.ok) { showToast(gate.reason, 'error'); return; }
  const btn = document.getElementById('ordBtn');
  btn.disabled = true; btn.textContent = '처리 중…';
  try {
    if (_side === 'buy') await doBuy(qty); else await doSell(qty);
  } catch (e) {
    showToast('주문 실패: ' + (e?.message || e), 'error');
  }
  await loadLots();
  await refreshQuotes();
  render();
}

async function doBuy(qty) {
  const price = _q[_sel.ticker]?.price;
  const unit  = orderUnitKrw();
  if (!price || !unit) throw new Error('현재가를 불러오지 못했습니다');
  const total = qty * unit;
  if (total > Number(_pf.cash_balance)) throw new Error('현금이 부족합니다');

  const isKr = _sel.market === 'KR';
  const row = {
    portfolio_id: _pf.id, ticker: _sel.ticker, name_ko: _sel.name, market: _sel.market,
    quantity: qty, entry_price: price, entry_date: new Date().toISOString(),
    entry_fx_rate: isKr ? 1 : _fx, status: 'open',
  };
  let { error } = await sb.from('paper_positions').insert(row);
  // entry_fx_rate는 최초 스키마(db/paper-trading.sql) 이후 추가된 컬럼이라, 마이그레이션
  // 전 DB에서는 없을 수 있다 — 이 레포의 표준대로 컬럼 없으면 빼고 재시도(fail-open).
  if (error && /entry_fx_rate/i.test(error.message || '')) {
    delete row.entry_fx_rate;
    ({ error } = await sb.from('paper_positions').insert(row));
  }
  if (error) throw error;

  const { error: cErr } = await sb.from('paper_portfolios')
    .update({ cash_balance: Number(_pf.cash_balance) - total, updated_at: new Date().toISOString() })
    .eq('id', _pf.id);
  if (cErr) throw cErr;
  _pf.cash_balance = Number(_pf.cash_balance) - total;
  showToast(`✓ ${_sel.name} ${nfmt(qty)}주 매수`, 'success');
}

/* 매도는 오래된 로트부터(FIFO). 일부만 팔면 그 로트를 쪼개서
   판 만큼은 closed 행으로 새로 남기고 원래 로트의 수량을 줄인다 — 평균단가와
   거래 내역이 둘 다 어긋나지 않게 하려면 이 방식이어야 한다. */
async function doSell(qty) {
  const cur = _q[_sel.ticker]?.price;
  if (!cur) throw new Error('현재가를 불러오지 못했습니다');
  const lots = _lots.filter(l => l.ticker === _sel.ticker)
    .sort((a, b) => new Date(a.entry_date) - new Date(b.entry_date));
  const have = lots.reduce((s, l) => s + Number(l.quantity), 0);
  if (qty > have) throw new Error('보유 수량을 초과했습니다');

  let remain = qty, proceeds = 0;
  const nowIso = new Date().toISOString();

  for (const lot of lots) {
    if (remain <= 0) break;
    const lotQty = Number(lot.quantity);
    const take   = Math.min(remain, lotQty);
    const exitKrw  = krwAt(cur, lot);
    const entryKrw = krwAt(Number(lot.entry_price), lot);
    const pnlAmount = (exitKrw - entryKrw) * take;
    const pnlPct    = ((cur - Number(lot.entry_price)) / Number(lot.entry_price)) * 100;
    proceeds += exitKrw * take;

    const closeFields = {
      exit_price: cur, exit_date: nowIso, exit_reason: 'manual',
      pnl_pct: pnlPct, pnl_amount: pnlAmount, status: 'closed',
    };

    if (take === lotQty) {
      const { error } = await sb.from('paper_positions').update(closeFields).eq('id', lot.id);
      if (error) throw error;
    } else {
      const { id, created_at, ...rest } = lot;
      const { error: insErr } = await sb.from('paper_positions')
        .insert({ ...rest, quantity: take, ...closeFields });
      if (insErr) throw insErr;
      const { error: updErr } = await sb.from('paper_positions')
        .update({ quantity: lotQty - take }).eq('id', lot.id);
      if (updErr) throw updErr;
    }
    remain -= take;
  }

  const { error: cErr } = await sb.from('paper_portfolios')
    .update({ cash_balance: Number(_pf.cash_balance) + proceeds, updated_at: nowIso })
    .eq('id', _pf.id);
  if (cErr) throw cErr;
  _pf.cash_balance = Number(_pf.cash_balance) + proceeds;
  showToast(`✓ ${_sel.name} ${nfmt(qty)}주 매도`, 'success');
}

async function resetAccount() {
  if (!confirm('계좌를 초기화할까요?\n\n· 보유 종목 전부 삭제\n· 거래 내역 전부 삭제\n· 현금 ₩10,000,000으로 복구\n\n되돌릴 수 없습니다.')) return;
  const { error } = await sb.from('paper_positions').delete().eq('portfolio_id', _pf.id);
  if (error) { showToast('삭제 실패: ' + error.message, 'error'); return; }
  const { error: e2 } = await sb.from('paper_portfolios')
    .update({ cash_balance: INITIAL_CASH, initial_cash: INITIAL_CASH, updated_at: new Date().toISOString() })
    .eq('id', _pf.id);
  if (e2) { showToast('초기화 실패: ' + e2.message, 'error'); return; }
  _pf.cash_balance = INITIAL_CASH; _pf.initial_cash = INITIAL_CASH;
  _sel = null;
  showToast('✓ 계좌를 초기화했습니다', 'success');
  await loadLots(); render();
}

/* ══════════════ 종목 검색 ══════════════ */
let _sugTimer = null;
function onSearchInput(v) {
  clearTimeout(_sugTimer);
  const q = (v || '').trim();
  if (q.length < 1) { document.getElementById('sugBox').innerHTML = ''; return; }
  _sugTimer = setTimeout(() => runSearch(q), 240);
}

async function runSearch(q) {
  const box = document.getElementById('sugBox');
  if (!box) return;
  const upper = q.toUpperCase();
  let items = [];

  // 6자리 숫자는 국내 종목코드 — 바로 후보로
  if (/^\d{6}$/.test(q)) items.push({ ticker: q + '.KS', name: q, market: 'KR' });

  try {
    const safe = q.replace(/[%_'"\\]/g, '');
    const { data } = await sb.from('companies')
      .select('ticker, name_ko, name_en, market')
      .or(`name_ko.ilike.%${safe}%,name_en.ilike.%${safe}%,ticker.ilike.${upper}%`)
      .limit(14);
    for (const c of data || []) {
      if (items.some(i => i.ticker === c.ticker)) continue;
      items.push({ ticker: c.ticker, name: c.name_ko || c.name_en || c.ticker, market: c.market || (isKrTicker(c.ticker) ? 'KR' : 'US') });
    }
  } catch {}

  // companies에 없는 국내 종목은 네이버 자동완성으로 보완(site-header의 검색과 같은 폴백)
  if (items.length < 5) {
    try {
      const r = await fetch('/api/stock?type=search-kr&q=' + encodeURIComponent(q));
      const j = await r.json();
      for (const it of j.items || []) {
        if (items.some(i => i.ticker === it.ticker)) continue;
        items.push({ ticker: it.ticker, name: it.name, market: 'KR' });
      }
    } catch {}
  }

  items = rankSearch(items, q).slice(0, 12);
  box.innerHTML = items.length
    ? `<div class="sug">${items.map(it => `
        <div class="sug-item" onclick="selectStock('${escHtml(it.ticker)}','${escHtml((it.name || '').replace(/'/g, ''))}','${it.market}')">
          <span class="tk ${it.market === 'KR' ? 'kr' : 'us'}">${escHtml(it.ticker.replace(/\.(KS|KQ)$/i, ''))}</span>
          <span class="sug-nm">${escHtml(it.name)}</span>
          <span style="font-size:12px;color:var(--text3);flex-shrink:0">${it.market === 'KR' ? '국내' : '미국'}</span>
        </div>`).join('')}</div>`
    : `<div class="sug"><div class="sug-empty">"${escHtml(q)}" 검색 결과가 없습니다</div></div>`;
}

/* 검색 결과 정렬 — ilike 결과를 DB 순서 그대로 두면 "삼성"에 삼성전자가 10번째로
   밀린다(계열사가 워낙 많음). 이름 매칭 등급으로 1차 정렬하고, 동급이면 이미 받아둔
   토스 랭킹(인기·거래대금)에서의 순위로 대표 종목을 끌어올린다 — 국내 종목은 계열사
   이름이 겹쳐(삼성·현대·LG 계열) 이름만으론 대표 종목을 고를 수 없고, 거래 규모가
   가장 현실적인 신호다. */
function normName(s) {
  return (s || '').toLowerCase().replace(/\(주\)|주식회사|\s+/g, '');
}
function popScore(ticker) {
  for (const mkt of Object.keys(_findCache)) {
    const cats = _findCache[mkt] || {};
    for (const key of ['popular', 'amount']) {
      const i = (cats[key] || []).findIndex(it => (it.linkTicker || it.symbol) === ticker);
      if (i >= 0) return i;
    }
  }
  return 999;
}
function rankSearch(items, q) {
  const nq = normName(q);
  const grade = it => {
    const n = normName(it.name);
    if (n === nq || (it.ticker || '').toUpperCase() === q.toUpperCase()) return 0;
    if (n.startsWith(nq)) return 1;
    return 2;
  };
  return items.slice().sort((a, b) => {
    const ga = grade(a), gb = grade(b);
    if (ga !== gb) return ga - gb;
    const pa = popScore(a.ticker), pb = popScore(b.ticker);
    if (pa !== pb) return pa - pb;
    return normName(a.name).length - normName(b.name).length;
  });
}

async function selectStock(ticker, name, market) {
  _sel = { ticker, name: name || ticker, market: market || (isKrTicker(ticker) ? 'KR' : 'US') };
  _side = 'buy';
  const box = document.getElementById('sugBox'); if (box) box.innerHTML = '';
  const inp = document.getElementById('stkSearch'); if (inp) inp.value = '';
  repaintOrder();
  await refreshQuotes();
  // 종목명이 코드뿐이면(6자리 직접 입력 등) 시세 응답의 이름으로 보정
  const sn = _q[_sel.ticker]?.shortName;
  if (sn && (_sel.name === _sel.ticker || /^\d{6}$/.test(_sel.name))) _sel.name = sn;
  repaintOrder();
  if (window.innerWidth <= 900) {
    document.getElementById('orderPanel')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

function pickHolding(ticker) {
  const h = holdings().find(x => x.ticker === ticker);
  if (!h) return;
  _sel = { ticker: h.ticker, name: h.name, market: h.market };
  _side = 'sell';
  repaintOrder();
  if (window.innerWidth <= 900) {
    document.getElementById('orderPanel')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

document.addEventListener('click', e => {
  if (!e.target.closest('.order-search')) {
    const box = document.getElementById('sugBox');
    if (box) box.innerHTML = '';
  }
});

/* ══════════════ 종목 찾기(객관적 랭킹) ══════════════ */
function setFindMkt(m) { _findMkt = m; render(); loadFind(); }
function setFindCat(c) { _findCat = c; render(); loadFind(); }

async function loadFind() {
  if (_findCache[_findMkt]) { renderFind(); return; }
  if (_findBusy) return;
  _findBusy = true;
  try {
    const r = await fetch('/api/toss?action=rankings-all&market=' + _findMkt);
    const j = await r.json();
    if (j?.categories) _findCache[_findMkt] = j.categories;
  } catch {}
  _findBusy = false;
  renderFind();
}

function renderFind() {
  const el = document.getElementById('findBody');
  if (!el) return;
  const cats = _findCache[_findMkt];
  if (!cats) { el.innerHTML = `<div class="empty">불러오는 중…</div>`; return; }
  const list = (cats[_findCat] || []).slice(0, 12);
  if (!list.length) { el.innerHTML = `<div class="empty">표시할 종목이 없습니다.</div>`; return; }

  el.innerHTML = `<div class="find-grid">${list.map(it => {
    const mkt = _findMkt;
    const tk  = it.linkTicker || it.symbol;
    const sub = _findCat === 'amount'  ? '거래대금 ' + compactKrw(it.tradingAmount)
              : _findCat === 'volume'  ? '거래량 ' + nfmt(it.tradingVolume) + '주'
              : fmtNat(it.price, mkt);
    return `<button class="find-card" onclick="selectStock('${escHtml(tk)}','${escHtml((it.name || '').replace(/'/g, ''))}','${mkt}')">
      <span class="find-rank">${it.rank}</span>
      <span class="find-mid">
        <span class="find-nm"><b>${escHtml(it.name || tk)}</b></span>
        <span class="find-sub">${escHtml(sub)}</span>
      </span>
      <span class="find-chg ${dirCls(it.changePercent)}">${fmtPct(it.changePercent)}</span>
    </button>`;
  }).join('')}</div>`;
  applyMarquee(el);
}

/* 실제로 칸 밖으로 넘치는 이름에만 좌우로 흐르는 애니메이션을 건다 — 안 넘치는데도
   전부 애니메이션을 걸면 화면이 산만해진다. 넘치는 만큼(px)에 비례해 속도(지속시간)도
   같이 늘려서, 아주 긴 이름이 너무 빨리 홱홱 움직이지 않게 한다. */
function applyMarquee(root) {
  // scrollWidth를 읽는 순간 브라우저가 강제로 동기 레이아웃을 계산해주므로
  // rAF 없이 바로 재도 된다(innerHTML 대입 직후라도 정확한 값이 나온다).
  root.querySelectorAll('.find-nm').forEach(nm => {
    // <b>가 아직 inline(기본값)일 때는 scrollWidth가 안 잡힌다 — .mq 클래스가 붙어야
    // <b>가 inline-block이 되므로, 판정은 항상 바깥 블록 요소(.find-nm)의
    // scrollWidth/clientWidth로 한다(overflow:hidden 상태에서도 scrollWidth는
    // 안에 흘러넘치는 인라인 콘텐츠의 실제 폭을 정확히 알려준다).
    const over = nm.scrollWidth - nm.clientWidth;
    if (over > 2) {
      nm.classList.add('mq');
      nm.style.setProperty('--mq-shift', `-${over + 6}px`);
      nm.style.setProperty('--mq-dur', Math.max(4, Math.min(10, over / 14)) + 's');
    }
  });
}

function compactKrw(v) {
  const n = Number(v) || 0;
  if (n >= 1e12) return (n / 1e12).toFixed(1) + '조';
  if (n >= 1e8)  return Math.round(n / 1e8).toLocaleString() + '억';
  if (n >= 1e4)  return Math.round(n / 1e4).toLocaleString() + '만';
  return nfmt(n);
}
