<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이슈 분석 — StockRipple</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg: #ffffff; --bg2: #f6f6f8; --bg3: #ececf0; --bg4: #dededf;
  --border: #e5e5ea; --border-strong: #c4c4c9; --border-soft: rgba(0,0,0,0.06);
  --text: #0a0a0a; --text2: #4b4b52; --text3: #86868b;
  --blue: #0066cc; --blue-dim: rgba(0,102,204,0.10);
  --green: #00873a; --green-dim: rgba(0,135,58,0.10);
  --red:   #e31937; --red-dim:   rgba(227,25,55,0.10);
  --yellow:#b8860b; --purple:#7c3aed;
  --shadow-card: 0 1px 3px rgba(0,0,0,0.04), 0 8px 24px rgba(0,0,0,0.06);
  --r-lg: 20px; --r-md: 14px; --r-sm: 10px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

.header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(255,255,255,0.85); backdrop-filter: blur(12px) saturate(180%);
  border-bottom: 1px solid var(--border); padding: 0 24px;
}
.header-inner {
  max-width: 1100px; margin: 0 auto;
  display: flex; align-items: center; gap: 16px; height: 56px;
}
.back-btn {
  display: flex; align-items: center; gap: 6px; color: var(--text2);
  text-decoration: none; font-size: 13px; background: none; border: none; cursor: pointer;
  padding: 5px 10px; border-radius: 6px; transition: all 0.15s;
}
.back-btn:hover { background: var(--bg3); color: var(--text); }
.logo-sm { font-size: 14px; font-weight: 700; color: var(--text2); }
.logo-sm span { color: var(--blue); }

.page-wrap { max-width: 1100px; margin: 0 auto; padding: 32px 24px 60px; }

/* Issue Header */
.issue-header { margin-bottom: 32px; }
.issue-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.meta-source { font-size: 12px; color: var(--text3); display: flex; align-items: center; gap: 5px; }
.source-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--blue); }
.meta-date { font-size: 12px; color: var(--text3); }
.meta-sep { color: var(--border); }
.issue-title { font-size: 24px; font-weight: 700; line-height: 1.4; margin-bottom: 12px; }
.issue-summary { font-size: 14px; color: var(--text2); line-height: 1.7; margin-bottom: 16px; }
.issue-sectors { display: flex; gap: 6px; flex-wrap: wrap; }
.sector-tag { font-size: 11px; padding: 3px 8px; border-radius: 4px; font-weight: 500; }
.tag-semi   { background: rgba(0,102,204,0.10); color: #0066cc; }
.tag-ev     { background: rgba(0,135,58,0.10);  color: #00873a; }
.tag-ai     { background: rgba(124,58,237,0.10);color: #7c3aed; }
.tag-bio    { background: rgba(227,25,55,0.10); color: #e31937; }
.tag-fin    { background: rgba(184,134,11,0.12);color: #b8860b; }
.tag-cloud  { background: rgba(0,102,204,0.10); color: #0066cc; }
.tag-robot  { background: rgba(124,58,237,0.10);color: #7c3aed; }
.tag-energy { background: rgba(0,135,58,0.10);  color: #00873a; }
.tag-default { background: var(--bg3); color: var(--text2); }

/* AI Summary Card — Tesla-light */
.ai-card {
  position: relative;
  background:
    radial-gradient(ellipse 80% 100% at 0% 0%, rgba(0,102,204,0.06), transparent 60%),
    radial-gradient(ellipse 70% 100% at 100% 100%, rgba(124,58,237,0.06), transparent 60%),
    #ffffff;
  border: 1px solid var(--border);
  border-radius: var(--r-lg, 20px);
  padding: 24px 26px;
  margin-bottom: 32px;
  box-shadow: var(--shadow-card, 0 1px 3px rgba(0,0,0,0.04), 0 8px 24px rgba(0,0,0,0.06));
}
.ai-card::before {
  content: '';
  position: absolute; left: 0; top: 0; bottom: 0;
  width: 3px; border-radius: var(--r-lg, 20px) 0 0 var(--r-lg, 20px);
  background: linear-gradient(180deg, var(--blue), var(--purple));
}
.ai-badge { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--blue); font-weight: 700; margin-bottom: 14px; text-transform: uppercase; letter-spacing: 0.6px; }
.ai-badge-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--blue); animation: pulse 2s infinite; box-shadow: 0 0 0 3px rgba(0,102,204,0.18); }
@keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.85); } }
.ai-text { font-size: 14.5px; line-height: 1.75; color: var(--text); font-weight: 400; }

/* Confidence */
.confidence-row { display: flex; align-items: center; gap: 12px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border); }
.conf-label { font-size: 11px; color: var(--text2); font-weight: 600; white-space: nowrap; }
.conf-bar { flex: 1; height: 6px; background: var(--bg3); border-radius: 999px; overflow: hidden; }
.conf-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--blue), var(--purple)); transition: width 1s var(--ease, ease); box-shadow: 0 0 8px rgba(0,102,204,0.25); }
.conf-pct { font-size: 13px; font-weight: 800; color: var(--blue); font-family: var(--font-mono, monospace); }

/* Section Headers */
.section-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
.section-title svg { color: var(--text3); }

/* Ripple Flow */
.ripple-section { margin-bottom: 36px; }
.ripple-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.ripple-card {
  background: var(--bg2); border: 1px solid var(--border); border-radius: 10px;
  padding: 16px; transition: border-color 0.2s;
}
.ripple-card:hover { border-color: var(--blue); }
.ripple-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.impact-badge {
  font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 4px;
  text-transform: uppercase; letter-spacing: 0.5px;
}
.impact-positive { background: var(--green-dim); color: var(--green); }
.impact-negative { background: var(--red-dim); color: var(--red); }
.impact-neutral { background: var(--bg3); color: var(--text2); }
.ripple-sector-name { font-size: 14px; font-weight: 600; }
.ripple-reason { font-size: 12px; color: var(--text2); line-height: 1.55; }

/* Companies Section */
.companies-section { margin-bottom: 36px; }
.companies-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.company-card {
  background: var(--bg2); border: 1px solid var(--border); border-radius: 10px;
  padding: 16px; transition: all 0.2s; cursor: pointer; position: relative;
}
.card-star {
  position: absolute; top: 12px; right: 12px;
  background: none; border: none; cursor: pointer; font-size: 16px;
  color: var(--text3); line-height: 1; padding: 2px; z-index: 2;
  transition: all 0.15s;
}
.card-star.active { color: #b8860b; }
.card-star:hover { transform: scale(1.2); }
.company-ticker-link { text-decoration: none; }
.company-ticker-link:hover .company-ticker { opacity: 0.8; }
.company-card:hover { border-color: var(--blue); box-shadow: 0 4px 20px rgba(47,129,247,0.1); transform: translateY(-1px); }

/* Auth Modal (shared) */
.auth-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 2000;
  display: flex; align-items: center; justify-content: center; padding: 20px;
  backdrop-filter: blur(4px);
}
.auth-modal {
  background: var(--bg2); border: 1px solid var(--border); border-radius: 16px;
  width: 100%; max-width: 400px; padding: 32px; position: relative;
}
.auth-close { position: absolute; top: 14px; right: 14px; background: none; border: none; color: var(--text3); cursor: pointer; font-size: 18px; padding: 4px; border-radius: 4px; }
.auth-close:hover { background: var(--bg3); color: var(--text); }
.auth-logo { font-size: 16px; font-weight: 700; color: var(--text2); margin-bottom: 20px; }
.auth-logo span { color: var(--blue); }
.auth-title { font-size: 22px; font-weight: 700; margin-bottom: 20px; }
.auth-btn-google { width: 100%; padding: 11px; border-radius: 8px; font-size: 14px; font-weight: 500; background: var(--bg3); border: 1px solid var(--border); color: var(--text); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: all 0.15s; margin-bottom: 16px; }
.auth-btn-google:hover { background: var(--border); }
.auth-divider { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; color: var(--text3); font-size: 12px; }
.auth-divider::before, .auth-divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.auth-input { width: 100%; padding: 10px 12px; background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 14px; margin-bottom: 10px; outline: none; transition: border-color 0.15s; font-family: inherit; }
.auth-input:focus { border-color: var(--blue); }
.auth-submit-btn { width: 100%; padding: 11px; border-radius: 8px; font-size: 14px; font-weight: 600; background: var(--blue); border: none; color: #fff; cursor: pointer; transition: all 0.15s; margin-top: 4px; }
.auth-submit-btn:hover { background: #388be8; }
.auth-submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.auth-switch { margin-top: 16px; text-align: center; font-size: 13px; color: var(--text2); }
.auth-link { background: none; border: none; color: var(--blue); cursor: pointer; font-size: 13px; }
.auth-link:hover { text-decoration: underline; }

/* Chart Modal */
.chart-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 1000;
  display: flex; align-items: center; justify-content: center; padding: 20px;
  backdrop-filter: blur(4px);
}
.chart-modal {
  background: var(--bg2); border: 1px solid var(--border); border-radius: 14px;
  width: 100%; max-width: 720px; padding: 24px; position: relative;
}
.chart-modal-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 4px; }
.chart-modal-ticker { font-family: 'SF Mono', monospace; font-size: 13px; font-weight: 700; }
.chart-modal-ticker.kr { background: rgba(0,102,204,0.10); color: #0066cc; padding: 3px 8px; border-radius: 5px; }
.chart-modal-ticker.us { background: var(--bg3); color: var(--text2); padding: 3px 8px; border-radius: 5px; }
.chart-modal-name { font-size: 18px; font-weight: 700; margin: 6px 0 2px; }
.chart-modal-price { font-size: 24px; font-weight: 700; }
.chart-modal-change { font-size: 14px; font-weight: 600; margin-left: 8px; }
.chart-modal-change.pos { color: var(--green); }
.chart-modal-change.neg { color: var(--red); }
.chart-close {
  background: none; border: none; color: var(--text3); cursor: pointer;
  font-size: 20px; line-height: 1; padding: 4px; border-radius: 4px;
}
.chart-close:hover { background: var(--bg3); color: var(--text); }
.chart-range-btns { display: flex; gap: 6px; margin: 14px 0 12px; }
.range-btn {
  padding: 4px 12px; border-radius: 6px; font-size: 12px; font-weight: 600;
  border: 1px solid var(--border); background: none; color: var(--text3); cursor: pointer; transition: all 0.15s;
}
.range-btn.active, .range-btn:hover { background: var(--blue); border-color: var(--blue); color: #fff; }
.chart-canvas-wrap { position: relative; height: 260px; }
.chart-loading { text-align: center; padding: 60px; color: var(--text3); font-size: 13px; }
.company-top { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
.company-ticker {
  font-size: 13px; font-weight: 700; font-family: 'SF Mono', 'Fira Code', monospace;
  background: var(--bg3); color: var(--text2); padding: 4px 10px; border-radius: 6px;
}
.company-ticker.kr { background: rgba(0,102,204,0.10); color: #0066cc; }
.company-ticker.us { background: rgba(124,58,237,0.10); color: #7c3aed; }
.company-info { flex: 1; }
.company-name { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
.company-market { font-size: 11px; color: var(--text3); }
.upside-badge {
  font-size: 20px; font-weight: 800; padding: 4px 10px; border-radius: 8px;
  white-space: nowrap;
}
.upside-pos { background: var(--green-dim); color: var(--green); }
.upside-neg { background: var(--red-dim); color: var(--red); }
.company-rationale { font-size: 12px; color: var(--text2); line-height: 1.55; margin-bottom: 10px; }
.company-ripple { font-size: 11px; color: var(--text3); }
.company-ripple span { color: var(--blue); }
.company-footer { display: flex; align-items: center; gap: 10px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
.price-info { font-size: 12px; color: var(--text2); }
.price-info .price { font-weight: 600; color: var(--text); }
.conf-mini { display: flex; align-items: center; gap: 6px; flex: 1; justify-content: flex-end; }
.conf-mini-bar { width: 60px; height: 4px; background: var(--bg3); border-radius: 2px; overflow: hidden; }
.conf-mini-fill { height: 100%; border-radius: 2px; }
.conf-mini-pct { font-size: 11px; color: var(--text3); }

/* Chart Section */
.chart-section { margin-bottom: 36px; }
.chart-container {
  background: var(--bg2); border: 1px solid var(--border); border-radius: 12px;
  padding: 20px;
}
.chart-title { font-size: 14px; font-weight: 600; margin-bottom: 16px; color: var(--text2); }
.chart-wrap { position: relative; height: 280px; }

/* Loading / Error */
.loading-state { text-align: center; padding: 80px 24px; }
.spinner { width: 36px; height: 36px; border: 2px solid var(--border); border-top-color: var(--blue); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 600px) {
  .issue-title { font-size: 18px; }
  .companies-grid { grid-template-columns: 1fr; }
  .ripple-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <a href="/" class="back-btn">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      피드로 돌아가기
    </a>
    <span class="logo-sm">Stock<span>Ripple</span></span>
  </div>
</header>

<div class="page-wrap" id="pageWrap">
  <div class="loading-state">
    <div class="spinner"></div>
    <p style="color:var(--text2)">분석 불러오는 중...</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://nmvfffzpkqyzztiobwtt.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_22PPW0eCY3Tvy3vZVZYKFw_yCb8cI2f';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const sectorColors = {
  '반도체': 'tag-semi', 'AI': 'tag-ai', '전기차': 'tag-ev', '배터리': 'tag-ev',
  '바이오': 'tag-bio', '제약': 'tag-bio', '핀테크': 'tag-fin', '금융': 'tag-fin',
  '클라우드': 'tag-cloud', 'IT': 'tag-cloud', '로봇': 'tag-robot',
  '에너지': 'tag-energy', '친환경': 'tag-energy',
};

function timeAgo(d) {
  const diff = (Date.now() - new Date(d).getTime()) / 1000;
  if (diff < 3600) return `${Math.floor(diff / 60)}분 전`;
  if (diff < 86400) return `${Math.floor(diff / 3600)}시간 전`;
  return new Date(d).toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric' });
}
function escHtml(s) {
  return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function getConfColor(c) {
  if (c >= 70) return 'var(--green)';
  if (c >= 40) return 'var(--yellow)';
  return 'var(--red)';
}

async function loadStockPrice(ticker, el) {
  try {
    const res = await fetch(`/api/stock-price?ticker=${encodeURIComponent(ticker)}`);
    const data = await res.json();
    if (data.price) {
      const fmt = new Intl.NumberFormat('en-US', { style: 'currency', currency: data.currency || 'USD', maximumFractionDigits: 2 });
      const cp = data.changePercent;
      const chgHtml = (cp != null && !isNaN(cp))
        ? ` <span class="price-chg" style="color:${cp >= 0 ? 'var(--green)' : 'var(--red)'};font-weight:700" title="당일 등락(최근 시세 기준)">${cp >= 0 ? '▲' : '▼'} ${cp >= 0 ? '+' : ''}${Number(cp).toFixed(2)}%</span>`
        : '';
      el.innerHTML = `<span class="price">${fmt.format(data.price)}</span>${chgHtml}`;
      if (data.marketCap) {
        const mc = data.marketCap >= 1e12
          ? `$${(data.marketCap/1e12).toFixed(1)}T`
          : data.marketCap >= 1e9
            ? `$${(data.marketCap/1e9).toFixed(1)}B`
            : `$${(data.marketCap/1e6).toFixed(0)}M`;
        el.innerHTML += ` · 시총 ${mc}`;
      }
    }
  } catch(e) {}
}

function renderPage(issue, analysis, companies) {
  const sectors = issue.sectors || [];
  const rippleEffects = analysis?.ripple_effects || [];
  const confidence = analysis?.confidence_score || 0;

  const sectorTags = sectors.map(s =>
    `<span class="sector-tag ${sectorColors[s]||'tag-default'}">${s}</span>`
  ).join('');

  const rippleCards = rippleEffects.map(r => {
    const impactClass = r.impact === 'positive' ? 'impact-positive' : r.impact === 'negative' ? 'impact-negative' : 'impact-neutral';
    const impactText = r.impact === 'positive' ? '긍정적' : r.impact === 'negative' ? '부정적' : '중립';
    return `
      <div class="ripple-card">
        <div class="ripple-header">
          <span class="impact-badge ${impactClass}">${impactText}</span>
          <span class="ripple-sector-name">${escHtml(r.sector)}</span>
        </div>
        <div class="ripple-reason">${escHtml(r.reason)}</div>
      </div>`;
  }).join('');

  // [TRADE] / [FUND] 마커 파싱
  const parseTradeMeta = (rationale) => {
    if (!rationale) return { reason: '', trade: null, fund: null };
    let reason = rationale, trade = null, fund = null;
    const fundIdx = rationale.indexOf('[FUND]');
    if (fundIdx >= 0) {
      try { fund = JSON.parse(rationale.slice(fundIdx + 6).split(/\[(TRADE|FUND)\]/)[0].trim()); } catch {}
    }
    const tradeIdx = rationale.indexOf('[TRADE]');
    if (tradeIdx >= 0) {
      const after = rationale.slice(tradeIdx + 7);
      const fundInAfter = after.indexOf('[FUND]');
      const tradeJson = fundInAfter >= 0 ? after.slice(0, fundInAfter).trim() : after.trim();
      try { trade = JSON.parse(tradeJson); } catch {}
    }
    const cutIdx = Math.min(
      tradeIdx >= 0 ? tradeIdx : Infinity,
      fundIdx  >= 0 ? fundIdx  : Infinity
    );
    if (cutIdx !== Infinity) reason = rationale.slice(0, cutIdx).trim();
    return { reason, trade, fund };
  };
  const tfLabel = { '1w':'단기 1주', '1m':'중기 1개월', '3m':'중장기 3개월', '6m':'장기 6개월' };

  const companyCards = companies.map(c => {
    const co = c.companies;
    if (!co) return '';
    const isKr = co.market === 'KR';
    const upsidePct = c.upside_pct;
    const sign = upsidePct >= 0 ? '+' : '';
    const upsideClass = upsidePct >= 0 ? 'upside-pos' : 'upside-neg';
    const confColor = getConfColor(c.confidence || 50);
    const parsed = parseTradeMeta(c.rationale);
    const trade  = parsed.trade;
    const fmtP   = v => (v > 0 ? '+' : '') + v + '%';

    // 차트 테크니컬 칩 ([FUND] 메타의 rsi/sig/volr/mom1m/atrm)
    const fund = parsed.fund;
    const sigInfo = {
      strong_bullish: ['정배열 강세', 'var(--green)'], bullish: ['상승 추세', 'var(--green)'],
      neutral: ['중립', 'var(--text3)'], bearish: ['하락 추세', 'var(--red)'],
      strong_bearish: ['역배열 약세', 'var(--red)'], overbought: ['과열', 'var(--yellow)'],
      oversold: ['과매도', 'var(--red)'], oversold_bull: ['눌림목 기회', 'var(--blue)'],
    };
    const techChip = (label, color) => `<span style="font-size:10px;font-weight:600;padding:3px 8px;border-radius:10px;border:1px solid ${color};color:${color}">${label}</span>`;
    let techChips = '';
    if (fund && (fund.rsi != null || fund.sig || fund.volr != null)) {
      const parts = [];
      if (fund.sig && sigInfo[fund.sig]) parts.push(techChip('📈 ' + sigInfo[fund.sig][0], sigInfo[fund.sig][1]));
      if (fund.rsi != null) parts.push(techChip('RSI ' + fund.rsi, fund.rsi >= 70 ? 'var(--yellow)' : fund.rsi <= 30 ? 'var(--red)' : 'var(--text2)'));
      if (fund.volr != null) parts.push(techChip('거래량 ' + fund.volr + '×', fund.volr >= 1.5 ? 'var(--blue)' : 'var(--text3)'));
      if (fund.mom1m != null) parts.push(techChip('1개월 ' + fmtP(fund.mom1m), fund.mom1m >= 0 ? 'var(--green)' : 'var(--red)'));
      if (fund.atrm != null) parts.push(techChip('월변동폭 ±' + fund.atrm + '%', 'var(--text3)'));
      if (parts.length) techChips = `<div style="display:flex;gap:5px;flex-wrap:wrap;margin:8px 0 2px">${parts.join('')}</div>`;
    }

    const tradeBox = trade ? `
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:10px;margin:8px 0;background:linear-gradient(135deg,rgba(63,185,80,.08),rgba(47,129,247,.08));border:1px solid rgba(63,185,80,.25);border-radius:8px">
        <div style="text-align:center">
          <div style="font-size:9px;color:var(--text3);margin-bottom:2px">매수가</div>
          <div style="font-size:13px;font-weight:700;color:var(--blue);font-family:'SF Mono',monospace">${trade.elp != null ? fmtP(trade.elp) : '—'}~${trade.ehp != null ? fmtP(trade.ehp) : '—'}</div>
        </div>
        <div style="text-align:center;border-left:1px solid var(--border);border-right:1px solid var(--border)">
          <div style="font-size:9px;color:var(--text3);margin-bottom:2px">목표</div>
          <div style="font-size:13px;font-weight:700;color:var(--green);font-family:'SF Mono',monospace">${trade.tp != null ? fmtP(trade.tp) : '—'}</div>
        </div>
        <div style="text-align:center">
          <div style="font-size:9px;color:var(--text3);margin-bottom:2px">손절</div>
          <div style="font-size:13px;font-weight:700;color:var(--red);font-family:'SF Mono',monospace">${trade.sl != null ? fmtP(trade.sl) : '—'}</div>
        </div>
      </div>
      ${trade.tf ? `<div style="font-size:11px;color:var(--blue);margin-bottom:6px;font-weight:600">⏱ ${tfLabel[trade.tf] || trade.tf}</div>` : ''}
      ${trade.th ? `<div style="font-size:12px;color:var(--text2);margin-bottom:4px;line-height:1.5"><span style="color:var(--green);font-weight:700">💡 </span>${escHtml(trade.th)}</div>` : ''}
      ${trade.rk ? `<div style="font-size:12px;color:var(--text3);line-height:1.5"><span style="color:var(--yellow);font-weight:700">⚠️ </span>${escHtml(trade.rk)}</div>` : ''}
    ` : '';

    return `
      <div class="company-card" data-chart-ticker="${escHtml(co.ticker)}" data-chart-name="${escHtml(co.name_ko||co.name_en||co.ticker)}" data-chart-kr="${isKr}" onclick="openChart(this.dataset.chartTicker,this.dataset.chartName,this.dataset.chartKr==='true')">
        <button class="card-star${isAnalysisWatched(co.ticker)?' active':''}" data-wl-ticker="${escHtml(co.ticker)}" data-wl-name="${escHtml(co.name_ko||co.name_en||co.ticker)}" data-wl-market="${isKr?'KR':'US'}" onclick="toggleAnalysisWatch(event,this)" title="관심종목">${isAnalysisWatched(co.ticker)?'★':'☆'}</button>
        <div class="company-top">
          <a href="/company.html?ticker=${encodeURIComponent(co.ticker)}" class="company-ticker-link" onclick="event.stopPropagation()"><span class="company-ticker ${isKr ? 'kr' : 'us'}">${escHtml(co.ticker)}</span></a>
          <div class="company-info">
            <div class="company-name">${escHtml(co.name_ko || co.name_en || co.ticker)}</div>
            <div class="company-market">${isKr ? '한국 상장' : '미국 상장'} · ${escHtml(co.sector || c.ripple_sector || '')}</div>
          </div>
          ${upsidePct != null ? `<div class="upside-badge ${upsideClass}">${sign}${upsidePct}%</div>` : ''}
        </div>
        <div class="company-rationale">${escHtml(parsed.reason || '')}</div>
        ${techChips}
        ${tradeBox}
        ${c.ripple_sector ? `<div class="company-ripple">파급 섹터: <span>${escHtml(c.ripple_sector)}</span></div>` : ''}
        <div class="company-footer">
          <div class="price-info" data-ticker="${escHtml(co.ticker)}">주가 로딩중...</div>
          <div class="conf-mini">
            <div class="conf-mini-bar"><div class="conf-mini-fill" style="width:${c.confidence||50}%;background:${confColor}"></div></div>
            <span class="conf-mini-pct">${c.confidence||50}%</span>
          </div>
        </div>
      </div>`;
  }).join('');

  const html = `
    <div class="issue-header">
      <div class="issue-meta">
        <span class="meta-source"><span class="source-dot"></span>${escHtml(issue.source_name || '뉴스')}</span>
        <span class="meta-sep">·</span>
        <span class="meta-date">${timeAgo(issue.published_at)}</span>
        ${issue.source_url ? `<a href="${escHtml(issue.source_url)}" target="_blank" rel="noopener noreferrer" style="font-size:11px;color:var(--blue);margin-left:4px">원문 보기 ↗</a>` : ''}
      </div>
      <h1 class="issue-title">${escHtml(issue.title)}</h1>
      ${issue.summary ? `<p class="issue-summary">${escHtml(issue.summary)}</p>` : ''}
      <div class="issue-sectors">${sectorTags}</div>
    </div>

    ${analysis?.ai_summary ? `
    <div class="ai-card">
      <div class="ai-badge"><span class="ai-badge-dot"></span>Claude AI 분석</div>
      <div class="ai-text">${escHtml(analysis.ai_summary)}</div>
      <div class="confidence-row">
        <span class="conf-label">분석 신뢰도</span>
        <div class="conf-bar"><div class="conf-fill" style="width:${confidence}%"></div></div>
        <span class="conf-pct">${confidence}%</span>
      </div>
    </div>` : ''}

    ${rippleEffects.length ? `
    <div class="ripple-section">
      <div class="section-title">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 0"/><circle cx="12" cy="12" r="3"/></svg>
        파급 섹터 분석 <span style="font-size:13px;color:var(--text2);font-weight:400">(${rippleEffects.length}개 섹터)</span>
      </div>
      <div class="ripple-grid">${rippleCards}</div>
    </div>` : ''}

    ${companies.length ? `
    <div class="companies-section">
      <div class="section-title">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>
        수혜 기업 분석 <span style="font-size:13px;color:var(--text2);font-weight:400">(${companies.length}개 기업)</span>
      </div>
      <div class="companies-grid">${companyCards}</div>
    </div>

    <div class="chart-section">
      <div class="section-title">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        예상 상승률 비교
      </div>
      <div class="chart-container">
        <div class="chart-title">기업별 예상 상승 가능성 (%)</div>
        <div class="chart-wrap"><canvas id="upsideChart"></canvas></div>
      </div>
    </div>` : ''}
  `;

  document.getElementById('pageWrap').innerHTML = html;

  document.querySelectorAll('[data-ticker]').forEach(el => {
    loadStockPrice(el.dataset.ticker, el);
  });

  if (companies.length) {
    setTimeout(() => renderChart(companies), 100);
  }
}

function renderChart(companies) {
  const ctx = document.getElementById('upsideChart');
  if (!ctx) return;

  const labels = companies.map(c => {
    const co = c.companies;
    return co ? (co.name_ko || co.ticker) : '';
  });
  const values = companies.map(c => c.upside_pct || 0);
  const colors = values.map(v => v >= 0 ? 'rgba(63,185,80,0.8)' : 'rgba(248,81,73,0.8)');
  const borderColors = values.map(v => v >= 0 ? '#3fb950' : '#f85149');

  new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        data: values,
        backgroundColor: colors,
        borderColor: borderColors,
        borderWidth: 1,
        borderRadius: 6,
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: ctx => {
              const v = ctx.raw;
              return ` ${v >= 0 ? '+' : ''}${v}% 예상 상승`;
            }
          }
        }
      },
      scales: {
        x: { ticks: { color: '#4b4b52', font: { size: 11 } }, grid: { color: '#e5e5ea' } },
        y: {
          ticks: { color: '#4b4b52', font: { size: 11 }, callback: v => `${v}%` },
          grid: { color: '#e5e5ea' },
        }
      }
    }
  });
}

async function init() {
  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  if (!id) { location.href = '/'; return; }

  const { data: issue, error: issueErr } = await sb
    .from('issues').select('*').eq('id', id).single();

  if (issueErr || !issue) {
    document.getElementById('pageWrap').innerHTML = '<div class="loading-state"><p style="color:var(--red)">이슈를 찾을 수 없습니다.</p></div>';
    return;
  }

  const { data: analysis } = await sb
    .from('analyses').select('*').eq('issue_id', id).single();

  let companies = [];
  if (analysis) {
    const { data: ac } = await sb
      .from('analysis_companies')
      .select('*, companies(*)')
      .eq('analysis_id', analysis.id)
      .order('upside_pct', { ascending: false });
    companies = ac || [];
  }

  document.title = `${issue.title} — StockRipple`;
  renderPage(issue, analysis, companies);
}

initAnalysisAuth();
init();

/* ── Auth & Watchlist ── */
let _authUser = null;
let _wlCache = new Set();

async function initAnalysisAuth() {
  const { data: { session } } = await sb.auth.getSession();
  _authUser = session?.user ?? null;
  if (_authUser) {
    const { data } = await sb.from('user_watchlist').select('ticker');
    _wlCache = new Set((data || []).map(r => r.ticker));
  }
  sb.auth.onAuthStateChange(async (event, session) => {
    _authUser = session?.user ?? null;
    if (_authUser) {
      const { data } = await sb.from('user_watchlist').select('ticker');
      _wlCache = new Set((data || []).map(r => r.ticker));
    } else {
      _wlCache.clear();
    }
    if (event === 'SIGNED_IN') closeAnalysisAuthModal();
  });
}

function isAnalysisWatched(ticker) { return _wlCache.has(ticker); }

async function toggleAnalysisWatch(e, btn) {
  e.stopPropagation();
  if (!_authUser) { openAnalysisAuthModal(); return; }
  const { wlTicker: ticker, wlName: name, wlMarket: market } = btn.dataset;
  if (_wlCache.has(ticker)) {
    await sb.from('user_watchlist').delete().eq('ticker', ticker);
    _wlCache.delete(ticker);
  } else {
    await sb.from('user_watchlist').insert({ user_id: _authUser.id, ticker, name, market });
    _wlCache.add(ticker);
  }
  const w = _wlCache.has(ticker);
  btn.classList.toggle('active', w);
  btn.textContent = w ? '★' : '☆';
}

function openAnalysisAuthModal() {
  document.getElementById('analysisAuthOverlay').style.display = 'flex';
}
function closeAnalysisAuthModal() {
  document.getElementById('analysisAuthOverlay').style.display = 'none';
}
async function analysisSubmitAuth(e) {
  e.preventDefault();
  const mode = document.getElementById('analysisAuthForm').dataset.mode;
  const email = document.getElementById('analysisAuthEmail').value.trim();
  const pass = document.getElementById('analysisAuthPass').value;
  const errEl = document.getElementById('analysisAuthError');
  const btn = document.getElementById('analysisAuthSubmitBtn');
  btn.disabled = true; btn.textContent = '처리 중...';
  errEl.textContent = '';
  try {
    let result;
    if (mode === 'signup') {
      result = await sb.auth.signUp({ email, password: pass });
      if (result.error) throw result.error;
      if (result.data?.user && !result.data.session) {
        errEl.style.color = 'var(--green)';
        errEl.textContent = '이메일을 확인해 인증 링크를 클릭하세요.';
        return;
      }
    } else {
      result = await sb.auth.signInWithPassword({ email, password: pass });
      if (result.error) throw result.error;
    }
  } catch (err) {
    errEl.style.color = 'var(--red)';
    const msgs = { 'Invalid login credentials': '이메일 또는 비밀번호가 올바르지 않습니다.' };
    errEl.textContent = msgs[err.message] || err.message;
  } finally {
    btn.disabled = false;
    btn.textContent = document.getElementById('analysisAuthForm').dataset.mode === 'signin' ? '로그인' : '가입하기';
  }
}
async function analysisSignInGoogle() {
  await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin } });
}
function switchAnalysisAuthMode(mode) {
  const isSignIn = mode === 'signin';
  document.getElementById('analysisAuthTitle').textContent = isSignIn ? '로그인' : '회원가입';
  document.getElementById('analysisAuthSubmitBtn').textContent = isSignIn ? '로그인' : '가입하기';
  document.getElementById('analysisAuthSwitch').innerHTML = isSignIn
    ? `계정이 없나요? <button onclick="switchAnalysisAuthMode('signup')" class="auth-link">회원가입</button>`
    : `이미 계정이 있나요? <button onclick="switchAnalysisAuthMode('signin')" class="auth-link">로그인</button>`;
  document.getElementById('analysisAuthForm').dataset.mode = mode;
  document.getElementById('analysisAuthError').textContent = '';
}

/* ── Stock Chart Modal ── */
let _chartInstance = null;
let _chartTicker = null;
let _chartRange = '3mo';

function openChart(ticker, name, isKr) {
  _chartTicker = ticker;
  _chartRange = '3mo';
  const overlay = document.getElementById('chartOverlay');
  overlay.style.display = 'flex';
  document.body.style.overflow = 'hidden';
  document.getElementById('chartModalTicker').textContent = ticker;
  document.getElementById('chartModalTicker').className = 'chart-modal-ticker ' + (isKr ? 'kr' : 'us');
  document.getElementById('chartModalName').textContent = name;
  document.getElementById('chartModalPrice').textContent = '';
  document.getElementById('chartModalChange').textContent = '';
  document.querySelectorAll('.range-btn').forEach(b => b.classList.toggle('active', b.dataset.range === _chartRange));
  loadChartData(ticker, _chartRange);
}

function closeChart() {
  document.getElementById('chartOverlay').style.display = 'none';
  document.body.style.overflow = '';
  if (_chartInstance) { _chartInstance.destroy(); _chartInstance = null; }
}

async function loadChartData(ticker, range) {
  const wrap = document.getElementById('chartCanvasWrap');
  wrap.innerHTML = '<div class="chart-loading">차트 불러오는 중...</div>';
  document.getElementById('chartModalPrice').textContent = '';
  document.getElementById('chartModalChange').textContent = '';

  try {
    const res = await fetch(`/api/stock-chart?ticker=${encodeURIComponent(ticker)}&range=${range}`);
    const data = await res.json();
    if (!data.points || !data.points.length) throw new Error('데이터 없음');
    renderLineChart(data);
  } catch(e) {
    wrap.innerHTML = `<div class="chart-loading" style="color:var(--red)">차트 로드 실패: ${e.message}</div>`;
  }
}

function renderLineChart(data) {
  const { points, currentPrice, currency } = data;
  const wrap = document.getElementById('chartCanvasWrap');
  wrap.innerHTML = '<canvas id="chartCanvas"></canvas>';
  const ctx = document.getElementById('chartCanvas');

  const labels = points.map(p => p.date);
  const values = points.map(p => p.close);
  const first = values[0];
  const last = currentPrice || values[values.length - 1];
  const isUp = last >= first;
  const lineColor = isUp ? '#3fb950' : '#f85149';
  const changeAbs = last - first;
  const changePct = ((changeAbs / first) * 100).toFixed(2);

  const fmt = new Intl.NumberFormat('en-US', {
    style: 'currency', currency: currency || 'USD', maximumFractionDigits: currency === 'KRW' ? 0 : 2
  });
  document.getElementById('chartModalPrice').textContent = fmt.format(last);
  const changeEl = document.getElementById('chartModalChange');
  changeEl.textContent = `${isUp ? '+' : ''}${changePct}%`;
  changeEl.className = 'chart-modal-change ' + (isUp ? 'pos' : 'neg');

  if (_chartInstance) _chartInstance.destroy();
  _chartInstance = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        data: values,
        borderColor: lineColor,
        borderWidth: 2,
        pointRadius: 0,
        tension: 0.2,
        fill: true,
        backgroundColor: (ctx2) => {
          const g = ctx2.chart.ctx.createLinearGradient(0, 0, 0, ctx2.chart.height);
          g.addColorStop(0, isUp ? 'rgba(63,185,80,0.25)' : 'rgba(248,81,73,0.25)');
          g.addColorStop(1, 'rgba(0,0,0,0)');
          return g;
        },
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: c => {
              const v = c.raw;
              return ' ' + fmt.format(v);
            }
          },
          backgroundColor: '#ffffff', borderColor: '#e5e5ea', borderWidth: 1,
          titleColor: '#4b4b52', bodyColor: '#0a0a0a',
        }
      },
      scales: {
        x: {
          ticks: {
            color: '#4b4b52', font: { size: 10 }, maxTicksLimit: 6,
            callback(val, i, ticks) { return labels[i]?.slice(5); }
          },
          grid: { color: '#e5e5ea' }
        },
        y: {
          ticks: {
            color: '#4b4b52', font: { size: 10 },
            callback: v => currency === 'KRW' ? v.toLocaleString('ko-KR') : v.toFixed(0)
          },
          grid: { color: '#e5e5ea' }
        }
      }
    }
  });
}
</script>

  </div>
</div>
