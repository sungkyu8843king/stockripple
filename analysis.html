<style>
:root {
  --bg: #15171e; --bg-rgb: 21,23,30; --bg2: #1e2129; --bg3: #262a34; --bg4: #2f333f;
  --border: rgba(255,255,255,0.075); --border-strong: rgba(255,255,255,0.16); --border-soft: rgba(255,255,255,0.05);
  --text: #f2f4f8; --text2: #a6adbb; --text3: #6c7385;
  --blue: #4d8dff; --blue-dim: rgba(77,141,255,0.14);
  --green: #3ddb7f; --green-dim: rgba(61,219,127,0.14);
  --red:   #ff6b6b; --red-dim:   rgba(255,107,107,0.14);
  --yellow:#f0b45e; --yellow-dim: rgba(240,180,94,0.16); --purple:#9d7bff; --purple-dim: rgba(157,123,255,0.16);
  --shadow-card: 0 10px 30px -14px rgba(0,0,0,0.55);
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
  --shadow-pop: 0 20px 50px rgba(0,0,0,0.6), 0 4px 12px rgba(0,0,0,0.4);
  --shadow-focus: 0 0 0 3px rgba(77,141,255,0.22);
  --r-lg: 20px; --r-md: 14px; --r-sm: 10px; --r-xs: 7px; --r-xl: 20px;
  --ease: cubic-bezier(0.22, 1, 0.36, 1); --t-fast: 120ms;
}

/* ── 라이트 모드 오버라이드 (2026-07-27) ── */
:root[data-theme="light"] {
  --bg: #f5f6f8; --bg-rgb: 245,246,248; --bg2: #ffffff; --bg3: #eef0f3; --bg4: #e3e6eb;
  --border: rgba(15,17,23,0.09); --border-strong: rgba(15,17,23,0.18); --border-soft: rgba(15,17,23,0.05);
  --text: #14161c; --text2: #4b5163; --text3: #6b7280;
  --red: #dc2626; --green: #15803d; --blue: #1d4ed8; --yellow: #a16207; --purple: #7c3aed;
  --shadow-sm: 0 2px 8px rgba(15,17,23,0.10);
  --shadow-card: 0 10px 30px -14px rgba(15,17,23,0.16);
  --shadow-pop: 0 20px 50px rgba(15,17,23,0.20), 0 4px 12px rgba(15,17,23,0.10);
  --shadow-focus: 0 0 0 3px rgba(29,78,216,0.18);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

.header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(var(--bg-rgb),0.80); backdrop-filter: blur(12px) saturate(180%);
  border-bottom: 1px solid var(--border); padding: 0 24px;
}
.header-inner {
  max-width: 1100px; margin: 0 auto;
  display: flex; align-items: center; gap: 16px; height: 56px;
}
.back-btn {
  display: flex; align-items: center; gap: 6px; color: var(--text2);
  text-decoration: none; font-size: 15.5px; background: none; border: none; cursor: pointer;
  padding: 5px 10px; border-radius: 6px; transition: all 0.15s;
}
.back-btn:hover { background: var(--bg3); color: var(--text); }
.logo-sm { font-size: 16px; font-weight: 700; color: var(--text2); }
.logo-sm span { color: var(--blue); }

/* 메인 상단바(index.html)와 통일 — 로고/검색/네비/로그인 */
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.logo-icon {
  width: 32px; height: 32px; border-radius: 9px;
  background: linear-gradient(135deg, var(--blue) 0%, var(--purple) 100%);
  color: #fff; display: flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: 700; box-shadow: 0 3px 10px rgba(36,87,230,0.30); flex-shrink: 0;
}
.logo-text { font-size: 19px; font-weight: 800; color: var(--text); letter-spacing: -0.02em; }
.logo-sub { font-size: 13px; color: var(--text3); font-weight: 500; margin-top: 1px; letter-spacing: 0; }
.header-nav { display: flex; gap: 2px; margin-left: auto; align-items: center; }
.nav-btn {
  padding: 7px 13px; border-radius: var(--r-md); font-size: 15.5px; font-weight: 500;
  background: none; border: none; color: var(--text2); cursor: pointer;
  text-decoration: none; display: flex; align-items: center; gap: 6px;
  transition: all var(--t-fast) var(--ease); white-space: nowrap;
}
.nav-btn:hover { background: var(--bg3); color: var(--text); }
.nav-btn.active { background: var(--blue); color: #fff; font-weight: 600; }
.nav-new { position: relative; }
.nav-new::after { content: ""; position: absolute; top: 2px; right: 1px; width: 7px; height: 7px; border-radius: 50%; background: var(--red); box-shadow: 0 0 0 2px var(--bg), 0 0 6px var(--red); }
.nav-btn-primary {
  background: var(--blue); color: #fff; padding: 7px 16px; margin-left: 6px;
  border-radius: var(--r-md); font-size: 15.5px; font-weight: 600;
  text-decoration: none; cursor: pointer; border: none; transition: all var(--t-fast);
}
.nav-btn-primary:hover { background: #1e4ccc; }
.user-menu { position: relative; flex-shrink: 0; }
.user-avatar-btn {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--blue-dim); color: var(--blue);
  border: 1.5px solid var(--blue); font-size: 15.5px; font-weight: 700;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.user-dropdown {
  position: absolute; top: calc(100% + 8px); right: 0;
  background: var(--bg2); border: 1px solid var(--border); border-radius: var(--r-md);
  min-width: 140px; overflow: hidden; z-index: 500; box-shadow: var(--shadow-pop);
}
.dropdown-item {
  display: block; width: 100%; padding: 10px 14px; font-size: 15.5px;
  color: var(--text2); background: none; border: none; text-align: left;
  cursor: pointer; text-decoration: none; transition: all var(--t-fast);
}
.dropdown-item:hover { background: var(--bg3); color: var(--text); }
/* PC 전용 상단 종목 검색창 — 모바일(700px 이하)에서는 숨김 */
.header-search {
  display: flex; align-items: center; gap: 6px;
  background: var(--bg2); border: 1px solid var(--border); border-radius: var(--r-md);
  padding: 7px 10px; flex: 1 1 auto; max-width: 260px; min-width: 0;
}
.header-search svg { color: var(--text3); flex-shrink: 0; }
.header-search input { flex: 1; min-width: 0; border: none; outline: none; background: none; font-size: 15.5px; color: var(--text); font-family: inherit; }
.header-search input::placeholder { color: var(--text3); }
@media (max-width: 900px) { .header-search { display: none; } }
@media (max-width: 760px) {
  .header-inner { flex-wrap: wrap; height: auto; padding: 8px 0; row-gap: 6px; position: relative; }
  .header-nav { flex-wrap: wrap; row-gap: 4px; }
  /* 로그인/유저메뉴는 로고와 같은 첫 줄 우측 끝에 고정 — 아래로 줄바꿈되는 네비 목록과 분리 */
  #loginBtn, .user-menu { position: absolute; top: 8px; right: 0; margin-left: 0; }
}
@media (max-width: 680px) { .logo-sub { display: none; } .nav-btn { padding: 6px 9px; font-size: 14.5px; } .header { padding: 0 16px; } }
.sp-card { display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; text-decoration: none; color: var(--text); transition: transform .12s var(--ease), border-color .12s, box-shadow .12s; }
.sp-card:hover { transform: translateY(-2px); border-color: var(--blue); box-shadow: 0 8px 24px rgba(0,102,204,0.10); }
.sp-card-top { display:flex; align-items:center; justify-content:space-between; gap:8px; }
.sp-ticker { font-family: 'SF Mono', monospace; font-size: 14.5px; font-weight: 700; padding: 3px 9px; border-radius: 6px; letter-spacing: .3px; }
.sp-market { font-size: 13.5px; color: var(--text3); font-weight: 500; }
.sp-name { font-size: 17px; font-weight: 700; color: var(--text); line-height: 1.3; }
.sp-name-sub { font-size: 13.5px; color: var(--text3); font-weight: 400; }
.sp-arrow { font-size: 13.5px; color: var(--blue); margin-top: 4px; font-weight: 500; }

.page-wrap { max-width: 1100px; margin: 0 auto; padding: 32px 24px 60px; }

/* Issue Header */
.issue-header { margin-bottom: 32px; }
.issue-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.meta-source { font-size: 14.5px; color: var(--text3); display: flex; align-items: center; gap: 5px; }
.source-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--blue); }
.meta-date { font-size: 14.5px; color: var(--text3); }
.meta-sep { color: var(--border); }
.issue-title { font-size: 24px; font-weight: 700; line-height: 1.4; margin-bottom: 12px; }
.issue-summary { font-size: 16px; color: var(--text2); line-height: 1.7; margin-bottom: 16px; }
.issue-sectors { display: flex; gap: 6px; flex-wrap: wrap; }
.sector-tag { font-size: 13.5px; padding: 3px 8px; border-radius: 4px; font-weight: 500; }
.tag-semi   { background: rgba(0,102,204,0.10); color: #4d8dff; }
.tag-ev     { background: rgba(0,135,58,0.10);  color: #3ddb7f; }
.tag-ai     { background: rgba(124,58,237,0.10);color: #9d7bff; }
.tag-bio    { background: rgba(227,25,55,0.10); color: #ff6b6b; }
.tag-fin    { background: rgba(184,134,11,0.12);color: #f0b45e; }
.tag-cloud  { background: rgba(0,102,204,0.10); color: #4d8dff; }
.tag-robot  { background: rgba(124,58,237,0.10);color: #9d7bff; }
.tag-energy { background: rgba(0,135,58,0.10);  color: #3ddb7f; }
.tag-default { background: var(--bg3); color: var(--text2); }

/* AI Summary Card — Tesla-light */
.ai-card {
  position: relative;
  background:
    radial-gradient(ellipse 80% 100% at 0% 0%, rgba(0,102,204,0.06), transparent 60%),
    radial-gradient(ellipse 70% 100% at 100% 100%, rgba(124,58,237,0.06), transparent 60%),
    var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--r-lg, 20px);
  padding: 24px 26px;
  margin-bottom: 32px;
  box-shadow: var(--shadow-card, 0 1px 3px rgba(0,0,0,0.04), 0 8px 24px rgba(0,0,0,0.06));
}
.ai-card::before {
  content: '';
  position: absolute; left: 0; top: 0; bottom: 0;
  width: 3px; border-radius: var(--r-lg, 20px) 0 0 var(--r-lg, 20px);
  background: linear-gradient(180deg, var(--blue), var(--purple));
}
.ai-badge { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--blue); font-weight: 700; margin-bottom: 14px; text-transform: uppercase; letter-spacing: 0.6px; }
.ai-badge-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--blue); animation: pulse 2s infinite; box-shadow: 0 0 0 3px rgba(0,102,204,0.18); }
@keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.85); } }
.ai-text { font-size: 16.5px; line-height: 1.75; color: var(--text); font-weight: 400; }

/* Confidence */
.confidence-row { display: flex; align-items: center; gap: 12px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border); }
.conf-label { font-size: 13.5px; color: var(--text2); font-weight: 600; white-space: nowrap; }
.conf-bar { flex: 1; height: 6px; background: var(--bg3); border-radius: 999px; overflow: hidden; }
.conf-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--blue), var(--purple)); transition: width 1s var(--ease, ease); box-shadow: 0 0 8px rgba(0,102,204,0.25); }
.conf-pct { font-size: 15.5px; font-weight: 800; color: var(--blue); font-family: var(--font-mono, monospace); }

/* 투자 포인트 요약 */
.invest-point { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--r-lg, 16px); padding: 16px 18px; margin-bottom: 24px; }
.ip-title { font-size: 15.5px; font-weight: 700; margin-bottom: 12px; }
.ip-row { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
.ip-row:last-child { margin-bottom: 0; }
.ip-tag { flex-shrink: 0; font-size: 13.5px; font-weight: 700; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
.ip-tag.pos { color: var(--red); background: var(--red-dim); }
.ip-tag.neg { color: var(--blue); background: var(--blue-dim); }
.ip-names { font-size: 16px; color: var(--text); line-height: 1.6; font-weight: 500; }

/* 관련 과거 이슈 타임라인 */
.related-section { margin-top: 8px; }
.related-list { display: flex; flex-direction: column; gap: 8px; }
.related-item { display: flex; align-items: center; gap: 12px; background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 13px 16px; text-decoration: none; color: var(--text); transition: border-color 0.12s; }
.related-item:hover { border-color: var(--blue); }
.related-date { font-size: 14px; color: var(--text3); font-family: var(--font-mono, monospace); white-space: nowrap; flex-shrink: 0; }
.related-title { flex: 1; font-size: 16px; font-weight: 500; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.related-sectors { display: flex; gap: 4px; flex-shrink: 0; }

/* Section Headers */
.section-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
.section-title svg { color: var(--text3); }

/* Ripple Flow */
.ripple-section { margin-bottom: 36px; }
.ripple-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.ripple-card {
  background: var(--bg2); border: 1px solid var(--border); border-radius: 10px;
  padding: 16px; transition: border-color 0.2s;
}
.ripple-card:hover { border-color: var(--blue); }
.ripple-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.impact-badge {
  font-size: 13px; font-weight: 700; padding: 3px 8px; border-radius: 4px;
  text-transform: uppercase; letter-spacing: 0.5px;
  white-space: nowrap; flex-shrink: 0;
}
.impact-positive { background: var(--red-dim); color: var(--red); }
.impact-negative { background: var(--blue-dim); color: var(--blue); }
.impact-neutral { background: var(--bg3); color: var(--text2); }
.ripple-sector-name { font-size: 16px; font-weight: 600; min-width: 0; }
.ripple-reason { font-size: 14.5px; color: var(--text2); line-height: 1.55; }

/* Companies Section */
.companies-section { margin-bottom: 36px; }
.companies-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.company-card {
  background: var(--bg2); border: 1px solid var(--border); border-radius: 10px;
  padding: 16px; transition: all 0.2s; cursor: pointer; position: relative;
}
.card-star {
  position: absolute; top: 12px; right: 12px;
  background: none; border: none; cursor: pointer; font-size: 18px;
  color: var(--text3); line-height: 1; padding: 2px; z-index: 2;
  transition: all 0.15s;
}
.card-star.active { color: #f0b45e; }
.card-star:hover { transform: scale(1.2); }
.company-ticker-link { text-decoration: none; }
.company-ticker-link:hover .company-ticker { opacity: 0.8; }
.company-card:hover { border-color: var(--blue); box-shadow: 0 4px 20px rgba(47,129,247,0.1); transform: translateY(-1px); }

/* Auth Modal (index.html/company.html과 통일) */
.auth-overlay {
  position: fixed; inset: 0; background: rgba(19,23,34,0.45); z-index: 2000;
  display: flex; align-items: center; justify-content: center; padding: 20px;
  backdrop-filter: blur(6px); animation: fadeIn 0.15s ease;
}
@keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
.auth-modal {
  background: var(--bg2); border: 1px solid var(--border); border-radius: var(--r-xl);
  width: 100%; max-width: 380px; padding: 36px 32px 28px; position: relative;
  animation: slideUp 0.2s ease; box-shadow: var(--shadow-pop);
}
@keyframes slideUp { from { transform: translateY(16px); opacity: 0 } to { transform: translateY(0); opacity: 1 } }
.auth-close { position: absolute; top: 14px; right: 14px; background: none; border: none; color: var(--text3); cursor: pointer; font-size: 18px; width: 28px; height: 28px; border-radius: var(--r-xs); display: flex; align-items: center; justify-content: center; transition: all var(--t-fast); }
.auth-close:hover { background: var(--bg3); color: var(--text); }
.auth-logo { font-size: 17px; font-weight: 800; color: var(--text3); margin-bottom: 6px; }
.auth-logo span { color: var(--blue); }
.auth-title { font-size: 24px; font-weight: 800; margin-bottom: 24px; letter-spacing: -0.02em; }
.auth-btn-google { width: 100%; padding: 12px 16px; border-radius: var(--r-md); font-size: 16px; font-weight: 500; background: #fff; border: 1px solid #dadce0; color: #3c4043; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: all var(--t-fast); margin-bottom: 20px; box-shadow: var(--shadow-sm); }
.auth-btn-google:hover { background: #f8f9fa; box-shadow: 0 2px 6px rgba(0,0,0,0.12); }
.auth-btn-google:active { background: #f1f3f4; }
.auth-divider { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; color: var(--text3); font-size: 14.5px; }
.auth-divider::before, .auth-divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.auth-field { position: relative; margin-bottom: 12px; }
.auth-field label { display: block; font-size: 14.5px; font-weight: 600; color: var(--text3); margin-bottom: 5px; }
.auth-input { width: 100%; padding: 10px 12px; background: var(--bg3); border: 1.5px solid var(--border); border-radius: var(--r-sm); color: var(--text); font-size: 16px; outline: none; transition: border-color var(--t-fast), box-shadow var(--t-fast); font-family: inherit; box-sizing: border-box; }
.auth-input:focus { border-color: var(--blue); box-shadow: var(--shadow-focus); background: var(--bg2); }
.auth-input::placeholder { color: var(--text3); }
.auth-error { font-size: 14.5px; min-height: 18px; margin: 4px 0 8px; color: var(--red); }
.auth-error.success { color: var(--green); }
.auth-submit-btn { width: 100%; padding: 12px; border-radius: var(--r-md); font-size: 16px; font-weight: 700; background: var(--blue); border: none; color: #fff; cursor: pointer; transition: all var(--t-fast); }
.auth-submit-btn:hover { background: #1e4ccc; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(36,87,230,0.35); }
.auth-submit-btn:active { transform: none; box-shadow: none; }
.auth-submit-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
.auth-switch { margin-top: 18px; text-align: center; font-size: 15.5px; color: var(--text3); }
.auth-link { background: none; border: none; color: var(--blue); cursor: pointer; font-size: 15.5px; font-weight: 600; }
.auth-link:hover { text-decoration: underline; }
.auth-consent { margin-bottom: 14px; }
.auth-consent-label { display: flex; align-items: flex-start; gap: 8px; font-size: 15px; color: var(--text2); cursor: pointer; line-height: 1.5; }
.auth-consent-label input[type="checkbox"] { margin-top: 2px; width: 15px; height: 15px; flex-shrink: 0; accent-color: var(--blue); cursor: pointer; }
.auth-link-inline { background: none; border: none; color: var(--blue); cursor: pointer; font-size: 15px; font-weight: 600; padding: 0; text-decoration: underline; }
.auth-privacy-text { margin-top: 8px; padding: 10px 12px; background: var(--bg3); border-radius: var(--r-sm); font-size: 14px; color: var(--text3); line-height: 1.7; }

/* Chart Modal */
.chart-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 1000;
  display: flex; align-items: center; justify-content: center; padding: 20px;
  backdrop-filter: blur(4px);
}
.chart-modal {
  background: var(--bg2); border: 1px solid var(--border); border-radius: 14px;
  width: 100%; max-width: 720px; padding: 24px; position: relative;
}
.chart-modal-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 4px; }
.chart-modal-ticker { font-family: 'SF Mono', monospace; font-size: 15.5px; font-weight: 700; }
.chart-modal-ticker.kr { background: rgba(0,102,204,0.10); color: #4d8dff; padding: 3px 8px; border-radius: 5px; }
.chart-modal-ticker.us { background: var(--bg3); color: var(--text2); padding: 3px 8px; border-radius: 5px; }
.chart-modal-name { font-size: 20px; font-weight: 700; margin: 6px 0 2px; }
.chart-modal-price { font-size: 24px; font-weight: 700; }
.chart-modal-change { font-size: 16px; font-weight: 600; margin-left: 8px; }
.chart-modal-change.pos { color: var(--red); }
.chart-modal-change.neg { color: var(--blue); }
.chart-close {
  background: none; border: none; color: var(--text3); cursor: pointer;
  font-size: 20px; line-height: 1; padding: 4px; border-radius: 4px;
}
.chart-close:hover { background: var(--bg3); color: var(--text); }
.chart-range-btns { display: flex; gap: 6px; margin: 14px 0 12px; }
.range-btn {
  padding: 4px 12px; border-radius: 6px; font-size: 14.5px; font-weight: 600;
  border: 1px solid var(--border); background: none; color: var(--text3); cursor: pointer; transition: all 0.15s;
}
.range-btn.active, .range-btn:hover { background: var(--blue); border-color: var(--blue); color: #fff; }
.chart-canvas-wrap { position: relative; height: 260px; }
.chart-loading { text-align: center; padding: 60px; color: var(--text3); font-size: 15.5px; }
.company-top { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
.company-ticker {
  font-size: 15.5px; font-weight: 700; font-family: 'SF Mono', 'Fira Code', monospace;
  background: var(--bg3); color: var(--text2); padding: 4px 10px; border-radius: 6px;
}
.company-ticker.kr { background: rgba(0,102,204,0.10); color: #4d8dff; }
.company-ticker.us { background: rgba(124,58,237,0.10); color: #9d7bff; }
.company-info { flex: 1; }
.company-name { font-size: 16px; font-weight: 600; margin-bottom: 2px; }
.company-market { font-size: 13.5px; color: var(--text3); }
.upside-badge {
  font-size: 20px; font-weight: 800; padding: 4px 10px; border-radius: 8px;
  white-space: nowrap;
}
.upside-pos { background: var(--red-dim); color: var(--red); }
.upside-neg { background: var(--blue-dim); color: var(--blue); }
.company-rationale { font-size: 14.5px; color: var(--text2); line-height: 1.55; margin-bottom: 10px; }
.company-ripple { font-size: 13.5px; color: var(--text3); }
.company-ripple span { color: var(--blue); }
.company-footer { display: flex; align-items: center; gap: 10px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
.price-info { font-size: 14.5px; color: var(--text2); }
.price-info .price { font-weight: 600; color: var(--text); }
.conf-mini { display: flex; align-items: center; gap: 6px; flex: 1; justify-content: flex-end; }
.conf-mini-bar { width: 60px; height: 4px; background: var(--bg3); border-radius: 2px; overflow: hidden; }
.conf-mini-fill { height: 100%; border-radius: 2px; }
.conf-mini-pct { font-size: 13.5px; color: var(--text3); }

/* Chart Section */
.chart-section { margin-bottom: 36px; }
.chart-container {
  background: var(--bg2); border: 1px solid var(--border); border-radius: 12px;
  padding: 20px;
}
.chart-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; color: var(--text2); }
.chart-wrap { position: relative; height: 280px; }

/* Loading / Error */
.loading-state { text-align: center; padding: 80px 24px; }
.spinner { width: 36px; height: 36px; border: 2px solid var(--border); border-top-color: var(--blue); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 600px) {
  .issue-title { font-size: 20px; }
  .companies-grid { grid-template-columns: 1fr; }
  .ripple-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/site-header.js"></script>
<div id="site-header-mount"></div>
<script>renderSiteHeader('/analysis.html');</script>

<div class="page-wrap" id="pageWrap">
  <div class="loading-state">
    <div class="spinner"></div>
    <p style="color:var(--text2)">분석 불러오는 중...</p>
  </div>
</div>

<script>
// SUPABASE_URL/ANON_KEY/sb/트래킹은 site-header.js가 공용 제공(2026-07-22) — 여기서 재선언 안 함.

// 2026-07-27: Chart.js 색상을 라이트/다크 토글에 맞춰 렌더 시점에 다시 읽기 위한 헬퍼.
function cssVar(name, fallback) {
  const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  return v || fallback;
}

const sectorColors = {
  '반도체': 'tag-semi', 'AI': 'tag-ai', '전기차': 'tag-ev', '배터리': 'tag-ev',
  '바이오': 'tag-bio', '제약': 'tag-bio', '핀테크': 'tag-fin', '금융': 'tag-fin',
  '클라우드': 'tag-cloud', 'IT': 'tag-cloud', '로봇': 'tag-robot',
  '에너지': 'tag-energy', '친환경': 'tag-energy',
};

function timeAgo(d) {
  const diff = (Date.now() - new Date(d).getTime()) / 1000;
  if (diff < 3600) return `${Math.floor(diff / 60)}분 전`;
  if (diff < 86400) return `${Math.floor(diff / 3600)}시간 전`;
  return new Date(d).toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric' });
}
function escHtml(s) {
  return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function getConfColor(c) {
  if (c >= 70) return 'var(--green)';
  if (c >= 40) return 'var(--yellow)';
  return 'var(--red)';
}

async function loadStockPrice(ticker, el) {
  try {
    const res = await fetch(`/api/stock-price?ticker=${encodeURIComponent(ticker)}`);
    const data = await res.json();
    if (data.price) {
      const fmt = new Intl.NumberFormat('en-US', { style: 'currency', currency: data.currency || 'USD', maximumFractionDigits: 2 });
      const cp = data.changePercent;
      const chgHtml = (cp != null && !isNaN(cp))
        ? ` <span class="price-chg" style="color:${cp >= 0 ? 'var(--red)' : 'var(--blue)'};font-weight:700" title="당일 등락(최근 시세 기준)">${cp >= 0 ? '▲' : '▼'} ${cp >= 0 ? '+' : ''}${Number(cp).toFixed(2)}%</span>`
        : '';
      el.innerHTML = `<span class="price">${fmt.format(data.price)}</span>${chgHtml}`;
      if (data.marketCap) {
        const mc = data.marketCap >= 1e12
          ? `$${(data.marketCap/1e12).toFixed(1)}T`
          : data.marketCap >= 1e9
            ? `$${(data.marketCap/1e9).toFixed(1)}B`
            : `$${(data.marketCap/1e6).toFixed(0)}M`;
        el.innerHTML += ` · 시총 ${mc}`;
      }
    }
  } catch(e) {}
}

// 관련 과거 이슈 — 같은 섹터의 최근 분석 이슈 (파급효과 추적)
async function loadRelatedIssues(issue) {
  const wrap = document.getElementById('relatedIssuesWrap');
  if (!wrap) return;
  const sectors = issue.sectors || [];
  if (!sectors.length) return;
  try {
    const { data } = await sb.from('issues')
      .select('id,title,published_at,sectors')
      .overlaps('sectors', sectors)
      .neq('ai_digest', '')
      .neq('id', issue.id)
      .order('published_at', { ascending: false })
      .limit(6);
    if (!data || !data.length) return;
    const rows = data.map(it => {
      const dt = new Date(it.published_at);
      const mmdd = `${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
      const tags = (it.sectors || []).slice(0, 2).map(s => `<span class="sector-tag ${sectorColors[s] || 'tag-default'}" style="font-size:13px;padding:2px 7px">${escHtml(s)}</span>`).join('');
      return `<a href="/analysis.html?id=${it.id}" class="related-item">
        <span class="related-date">${mmdd}</span>
        <span class="related-title">${escHtml(it.title)}</span>
        <span class="related-sectors">${tags}</span>
      </a>`;
    }).join('');
    wrap.innerHTML = `
      <div class="related-section">
        <div class="section-title">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          관련 과거 이슈 <span style="font-size:15.5px;color:var(--text2);font-weight:400">(같은 섹터 · ${data.length}건)</span>
        </div>
        <div class="related-list">${rows}</div>
      </div>`;
  } catch (e) { /* silent */ }
}

function renderPage(issue, analysis, companies) {
  const sectors = issue.sectors || [];
  const rippleEffects = analysis?.ripple_effects || [];
  const confidence = analysis?.confidence_score || 0;

  const sectorTags = sectors.map(s =>
    `<span class="sector-tag ${sectorColors[s]||'tag-default'}">${s}</span>`
  ).join('');

  const rippleCards = rippleEffects.map(r => {
    const impactClass = r.impact === 'positive' ? 'impact-positive' : r.impact === 'negative' ? 'impact-negative' : 'impact-neutral';
    const impactText = r.impact === 'positive' ? '긍정적' : r.impact === 'negative' ? '부정적' : '중립';
    return `
      <div class="ripple-card">
        <div class="ripple-header">
          <span class="impact-badge ${impactClass}">${impactText}</span>
          <span class="ripple-sector-name">${escHtml(r.sector)}</span>
        </div>
        <div class="ripple-reason">${escHtml(r.reason)}</div>
      </div>`;
  }).join('');

  // [TRADE] / [FUND] 마커 파싱
  const parseTradeMeta = (rationale) => {
    if (!rationale) return { reason: '', trade: null, fund: null };
    let reason = rationale, trade = null, fund = null;
    const fundIdx = rationale.indexOf('[FUND]');
    if (fundIdx >= 0) {
      try { fund = JSON.parse(rationale.slice(fundIdx + 6).split(/\[(TRADE|FUND)\]/)[0].trim()); } catch {}
    }
    const tradeIdx = rationale.indexOf('[TRADE]');
    if (tradeIdx >= 0) {
      const after = rationale.slice(tradeIdx + 7);
      const fundInAfter = after.indexOf('[FUND]');
      const tradeJson = fundInAfter >= 0 ? after.slice(0, fundInAfter).trim() : after.trim();
      try { trade = JSON.parse(tradeJson); } catch {}
    }
    const cutIdx = Math.min(
      tradeIdx >= 0 ? tradeIdx : Infinity,
      fundIdx  >= 0 ? fundIdx  : Infinity
    );
    if (cutIdx !== Infinity) reason = rationale.slice(0, cutIdx).trim();
    return { reason, trade, fund };
  };
  const tfLabel = { '1w':'단기 1주', '1m':'중기 1개월', '3m':'중장기 3개월', '6m':'장기 6개월' };

  // 기업 방향(긍정/부정) 판정: 매칭되는 파급섹터 impact 우선, 없으면 예상 상승률 부호
  const _rippleImpactBySector = {};
  rippleEffects.forEach(r => { if (r.sector) _rippleImpactBySector[r.sector] = r.impact; });
  const companyDir = (c) => {
    const imp = _rippleImpactBySector[c.ripple_sector];
    if (imp === 'positive') return 'pos';
    if (imp === 'negative') return 'neg';
    if (c.upside_pct != null) return c.upside_pct >= 0 ? 'pos' : 'neg';
    return 'pos';
  };

  const renderCoCard = (c) => {
    const co = c.companies;
    if (!co) return '';
    const isKr = co.market === 'KR';
    const confColor = getConfColor(c.confidence || 50);
    const parsed = parseTradeMeta(c.rationale);
    const trade  = parsed.trade;
    const fmtP   = v => (v > 0 ? '+' : '') + v + '%';

    // 차트 테크니컬 칩 ([FUND] 메타의 rsi/sig/volr/mom1m/atrm)
    const fund = parsed.fund;
    const sigInfo = {
      strong_bullish: ['정배열 강세', 'var(--red)'], bullish: ['상승 추세', 'var(--red)'],
      neutral: ['중립', 'var(--text3)'], bearish: ['하락 추세', 'var(--blue)'],
      strong_bearish: ['역배열 약세', 'var(--blue)'], overbought: ['과열', 'var(--yellow)'],
      oversold: ['과매도', 'var(--blue)'], oversold_bull: ['눌림목 기회', 'var(--blue)'],
    };
    const techChip = (label, color) => `<span style="font-size:13px;font-weight:600;padding:3px 8px;border-radius:10px;border:1px solid ${color};color:${color}">${label}</span>`;
    let techChips = '';
    if (fund && (fund.rsi != null || fund.sig || fund.volr != null)) {
      const parts = [];
      if (fund.sig && sigInfo[fund.sig]) parts.push(techChip('📈 ' + sigInfo[fund.sig][0], sigInfo[fund.sig][1]));
      if (fund.rsi != null) parts.push(techChip('RSI ' + fund.rsi, fund.rsi >= 70 ? 'var(--yellow)' : fund.rsi <= 30 ? 'var(--red)' : 'var(--text2)'));
      if (fund.volr != null) parts.push(techChip('거래량 ' + fund.volr + '×', fund.volr >= 1.5 ? 'var(--blue)' : 'var(--text3)'));
      if (fund.mom1m != null) parts.push(techChip('1개월 ' + fmtP(fund.mom1m), fund.mom1m >= 0 ? 'var(--red)' : 'var(--blue)'));
      if (fund.atrm != null) parts.push(techChip('월변동폭 ±' + fund.atrm + '%', 'var(--text3)'));
      if (parts.length) techChips = `<div style="display:flex;gap:5px;flex-wrap:wrap;margin:8px 0 2px">${parts.join('')}</div>`;
    }

    const tradeBox = trade ? `
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:10px;margin:8px 0;background:linear-gradient(135deg,rgba(63,185,80,.08),rgba(47,129,247,.08));border:1px solid rgba(63,185,80,.25);border-radius:8px">
        <div style="text-align:center">
          <div style="font-size:12px;color:var(--text3);margin-bottom:2px">매수가</div>
          <div style="font-size:15.5px;font-weight:700;color:var(--blue);font-family:'SF Mono',monospace">${trade.elp != null ? fmtP(trade.elp) : '—'}~${trade.ehp != null ? fmtP(trade.ehp) : '—'}</div>
        </div>
        <div style="text-align:center;border-left:1px solid var(--border);border-right:1px solid var(--border)">
          <div style="font-size:12px;color:var(--text3);margin-bottom:2px">목표</div>
          <div style="font-size:15.5px;font-weight:700;color:var(--green);font-family:'SF Mono',monospace">${trade.tp != null ? fmtP(trade.tp) : '—'}</div>
        </div>
        <div style="text-align:center">
          <div style="font-size:12px;color:var(--text3);margin-bottom:2px">손절</div>
          <div style="font-size:15.5px;font-weight:700;color:var(--red);font-family:'SF Mono',monospace">${trade.sl != null ? fmtP(trade.sl) : '—'}</div>
        </div>
      </div>
      ${trade.tf ? `<div style="font-size:13.5px;color:var(--blue);margin-bottom:6px;font-weight:600">⏱ ${tfLabel[trade.tf] || trade.tf}</div>` : ''}
      ${trade.th ? `<div style="font-size:14.5px;color:var(--text2);margin-bottom:4px;line-height:1.5"><span style="color:var(--green);font-weight:700">💡 </span>${escHtml(trade.th)}</div>` : ''}
      ${trade.rk ? `<div style="font-size:14.5px;color:var(--text3);line-height:1.5"><span style="color:var(--yellow);font-weight:700">⚠️ </span>${escHtml(trade.rk)}</div>` : ''}
    ` : '';

    return `
      <div class="company-card" data-chart-ticker="${escHtml(co.ticker)}" data-chart-name="${escHtml(co.name_ko||co.name_en||co.ticker)}" data-chart-kr="${isKr}" onclick="openChart(this.dataset.chartTicker,this.dataset.chartName,this.dataset.chartKr==='true')">
        <button class="card-star${isAnalysisWatched(co.ticker)?' active':''}" data-wl-ticker="${escHtml(co.ticker)}" data-wl-name="${escHtml(co.name_ko||co.name_en||co.ticker)}" data-wl-market="${isKr?'KR':'US'}" onclick="toggleAnalysisWatch(event,this)" title="관심종목">${isAnalysisWatched(co.ticker)?'★':'☆'}</button>
        <div class="company-top">
          <a href="/company.html?ticker=${encodeURIComponent(co.ticker)}" class="company-ticker-link" onclick="event.stopPropagation()"><span class="company-ticker ${isKr ? 'kr' : 'us'}">${escHtml(co.ticker)}</span></a>
          <div class="company-info">
            <div class="company-name">${escHtml(co.name_ko || co.name_en || co.ticker)}</div>
            <div class="company-market">${isKr ? '한국 상장' : '미국 상장'} · ${escHtml(co.sector || c.ripple_sector || '')}</div>
          </div>
        </div>
        <div class="company-rationale">${escHtml(parsed.reason || '')}</div>
        ${techChips}
        ${tradeBox}
        ${c.ripple_sector ? `<div class="company-ripple">파급 섹터: <span>${escHtml(c.ripple_sector)}</span></div>` : ''}
        <div class="company-footer">
          <div class="price-info" data-ticker="${escHtml(co.ticker)}">주가 로딩중...</div>
          <div class="conf-mini">
            <div class="conf-mini-bar"><div class="conf-mini-fill" style="width:${c.confidence||50}%;background:${confColor}"></div></div>
            <span class="conf-mini-pct">${c.confidence||50}%</span>
          </div>
        </div>
      </div>`;
  };

  // 부정 기업용 간단 카드 (ripple_effects JSON의 피해 우려 기업 — 검증/시세 없이 표시)
  const renderNegSimpleCard = (co) => {
    const isKr = /\.K[SQ]$/i.test(co.ticker || '') || co.market === 'KR';
    return `
      <div class="company-card">
        <div class="company-top">
          <a href="/company.html?ticker=${encodeURIComponent(co.ticker)}" class="company-ticker-link" onclick="event.stopPropagation()"><span class="company-ticker ${isKr ? 'kr' : 'us'}">${escHtml(co.ticker)}</span></a>
          <div class="company-info">
            <div class="company-name">${escHtml(co.name_ko || co.name_en || co.ticker)}</div>
            <div class="company-market">${isKr ? '한국 상장' : '미국 상장'}${co._sector ? ' · ' + escHtml(co._sector) : ''}</div>
          </div>
        </div>
        ${co.rationale ? `<div class="company-rationale">${escHtml(co.rationale)}</div>` : ''}
        ${co._sector ? `<div class="company-ripple">파급 섹터: <span>${escHtml(co._sector)}</span></div>` : ''}
      </div>`;
  };

  // 긍정 영향 기업 = 검증된 매수 후보(analysis_companies)
  const posCompanies = companies.filter(c => c.companies && companyDir(c) === 'pos');
  const posCards = posCompanies.map(renderCoCard).join('');

  // 부정 영향 기업 = analysis_companies(neg) + ripple_effects negative 섹터 기업 (티커 중복 제거)
  const negFromTable = companies.filter(c => c.companies && companyDir(c) === 'neg');
  const negTickers = new Set(negFromTable.map(c => (c.companies?.ticker || '').toUpperCase()).filter(Boolean));
  const negFromRipple = [];
  rippleEffects.filter(r => r.impact === 'negative').forEach(r => {
    (r.companies || []).forEach(co => {
      const tk = (co.ticker || '').toUpperCase();
      if (!tk || negTickers.has(tk)) return;
      negTickers.add(tk);
      negFromRipple.push({ ...co, _sector: r.sector });
    });
  });
  const negCount = negFromTable.length + negFromRipple.length;
  const negCards = negFromTable.map(renderCoCard).join('') + negFromRipple.map(renderNegSimpleCard).join('');

  const html = `
    <div class="issue-header">
      <div class="issue-meta">
        <span class="meta-source"><span class="source-dot"></span>${escHtml(issue.source_name || '뉴스')}</span>
        <span class="meta-sep">·</span>
        <span class="meta-date">${timeAgo(issue.published_at)}</span>
        ${issue.source_url ? `<a href="${escHtml(issue.source_url)}" target="_blank" rel="noopener noreferrer" style="font-size:13.5px;color:var(--blue);margin-left:4px">원문 보기 ↗</a>` : ''}
      </div>
      <h1 class="issue-title">${escHtml(issue.title)}</h1>
      ${issue.summary ? `<p class="issue-summary">${escHtml(issue.summary)}</p>` : ''}
      <div class="issue-sectors">${sectorTags}</div>
    </div>

    ${analysis?.ai_summary ? `
    <div class="ai-card">
      <div class="ai-badge"><span class="ai-badge-dot"></span>Claude AI 분석</div>
      <div class="ai-text">${escHtml(analysis.ai_summary)}</div>
      <div class="confidence-row">
        <span class="conf-label">분석 신뢰도</span>
        <div class="conf-bar"><div class="conf-fill" style="width:${confidence}%"></div></div>
        <span class="conf-pct">${confidence}%</span>
      </div>
    </div>` : (issue.ai_digest ? `
    <div class="ai-card">
      <div class="ai-badge"><span class="ai-badge-dot"></span>📝 AI 기사 요약</div>
      <div class="ai-text">${escHtml(issue.ai_digest)}</div>
    </div>` : '')}

    ${(() => {
      // 뉴스 키포인트 + 관련 산업 방향성(news_analysis) — 종목 미지정 편집성 태깅.
      const na = issue.news_analysis || {};
      const kp = Array.isArray(na.keypoints) ? na.keypoints.slice(0, 3) : [];
      const secs = Array.isArray(na.sectors) ? na.sectors.slice(0, 3) : [];
      if (!kp.length && !secs.length) return '';
      const tm = { pos:{l:'우호적',c:'#ff6b6b',b:'rgba(255,107,107,.14)'}, neg:{l:'비우호적',c:'#4d8dff',b:'rgba(77,141,255,.14)'}, neu:{l:'중립',c:'var(--text3)',b:'rgba(255,255,255,.06)'} };
      const kpHtml = kp.length ? `<div style="margin-bottom:${secs.length?16:0}px">
        <div style="font-size:14.5px;font-weight:700;color:var(--blue);margin-bottom:9px">🔑 핵심 포인트</div>
        <ul style="margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px">${kp.map(k=>`<li style="font-size:16px;color:var(--text);line-height:1.55;position:relative;padding-left:16px"><span style="position:absolute;left:0;color:var(--blue);font-weight:700">·</span>${escHtml(k)}</li>`).join('')}</ul></div>` : '';
      const secHtml = secs.length ? `<div>
        <div style="font-size:14.5px;font-weight:700;color:var(--blue);margin-bottom:9px">📡 관련 산업 영향</div>
        <div style="display:flex;flex-wrap:wrap;gap:8px">${secs.map(s=>{const m=tm[s.tone]||tm.neu;return `<span style="display:inline-flex;align-items:center;gap:6px;font-size:15.5px;font-weight:600;padding:6px 13px;border-radius:999px;color:${m.c};background:${m.b}">${escHtml(s.name)}<span style="font-size:13.5px;opacity:.8">${m.l}</span></span>`;}).join('')}</div></div>` : '';
      return `<div class="ai-card">${kpHtml}${secHtml}
        <div style="font-size:13px;color:var(--text3);margin-top:14px;line-height:1.5">산업 영향 방향은 뉴스 분류이며 특정 종목의 매수·매도 의견이 아닙니다.</div>
      </div>`;
    })()}

    ${(posCompanies.length || negCount) ? `
    <div class="invest-point">
      <div class="ip-title">💡 이 뉴스의 투자 포인트</div>
      ${posCompanies.length ? `<div class="ip-row"><span class="ip-tag pos">수혜</span><span class="ip-names">${posCompanies.slice(0, 6).map(c => escHtml(c.companies?.name_ko || c.companies?.name_en || '')).filter(Boolean).join(' · ')}</span></div>` : ''}
      ${negCount ? `<div class="ip-row"><span class="ip-tag neg">피해 우려</span><span class="ip-names">${[...negFromTable.map(c => c.companies?.name_ko || c.companies?.name_en), ...negFromRipple.map(co => co.name_ko || co.name_en)].filter(Boolean).slice(0, 6).map(escHtml).join(' · ')}</span></div>` : ''}
    </div>` : ''}

    ${rippleEffects.length ? `
    <div class="ripple-section">
      <div class="section-title">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 0"/><circle cx="12" cy="12" r="3"/></svg>
        파급 섹터 분석 <span style="font-size:15.5px;color:var(--text2);font-weight:400">(${rippleEffects.length}개 섹터)</span>
      </div>
      <div class="ripple-grid">${rippleCards}</div>
    </div>` : ''}

    ${posCompanies.length ? `
    <div class="companies-section">
      <div class="section-title">
        <span style="display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:6px;background:var(--red-dim);color:var(--red);font-size:15.5px">▲</span>
        긍정 영향 기업 <span style="font-size:15.5px;color:var(--text2);font-weight:400">(${posCompanies.length}개 · 수혜 예상)</span>
      </div>
      <div class="companies-grid">${posCards}</div>
    </div>` : ''}

    ${negCount ? `
    <div class="companies-section">
      <div class="section-title">
        <span style="display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:6px;background:var(--blue-dim);color:var(--blue);font-size:15.5px">▼</span>
        부정 영향 기업 <span style="font-size:15.5px;color:var(--text2);font-weight:400">(${negCount}개 · 피해 우려)</span>
      </div>
      <div class="companies-grid">${negCards}</div>
    </div>` : ''}

    ${companies.length ? `
    <div class="chart-section">
      <div class="section-title">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        예상 상승률 비교
      </div>
      <div class="chart-container">
        <div class="chart-title">기업별 예상 상승 가능성 (%)</div>
        <div class="chart-wrap"><canvas id="upsideChart"></canvas></div>
      </div>
    </div>` : ''}

    <!-- 관련 과거 이슈 타임라인 (같은 섹터) -->
    <div id="relatedIssuesWrap"></div>
  `;

  document.getElementById('pageWrap').innerHTML = html;

  loadRelatedIssues(issue);

  document.querySelectorAll('[data-ticker]').forEach(el => {
    loadStockPrice(el.dataset.ticker, el);
  });

  if (companies.length) {
    setTimeout(() => renderChart(companies), 100);
  }
}

function renderChart(companies) {
  const ctx = document.getElementById('upsideChart');
  if (!ctx) return;

  const labels = companies.map(c => {
    const co = c.companies;
    return co ? (co.name_ko || co.ticker) : '';
  });
  const values = companies.map(c => c.upside_pct || 0);
  const colors = values.map(v => v >= 0 ? 'rgba(63,185,80,0.8)' : 'rgba(248,81,73,0.8)');
  const borderColors = values.map(v => v >= 0 ? '#3fb950' : '#f85149');

  new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        data: values,
        backgroundColor: colors,
        borderColor: borderColors,
        borderWidth: 1,
        borderRadius: 6,
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: ctx => {
              const v = ctx.raw;
              return ` ${v >= 0 ? '+' : ''}${v}% 예상 상승`;
            }
          }
        }
      },
      scales: {
        x: { ticks: { color: cssVar('--text3','#6c7385'), font: { size: 11 } }, grid: { color: cssVar('--border-soft','rgba(255,255,255,0.06)') } },
        y: {
          ticks: { color: cssVar('--text3','#6c7385'), font: { size: 11 }, callback: v => `${v}%` },
          grid: { color: cssVar('--border-soft','rgba(255,255,255,0.06)') },
        }
      }
    }
  });
}

async function init() {
  // 공유 링크는 /analysis/{id} 형태(share-btn이 이 URL을 만든다). vercel.json이 이걸
  // analysis.html로 rewrite하지만 rewrite는 서버 측이라 브라우저 주소는 그대로
  // /analysis/{id}로 남는다 — 즉 location.search가 비어 있어서 예전에는 여기서
  // 곧장 홈으로 돌려보냈다(공유받은 사람이 뉴스 대신 홈을 보게 되던 버그).
  // 쿼리(?id=) 우선, 없으면 경로에서 파싱.
  const params = new URLSearchParams(location.search);
  const id = params.get('id') || (location.pathname.match(/^\/analysis\/([^/?#]+)/)?.[1] ?? null);
  if (!id) { location.href = '/'; return; }

  const { data: issue, error: issueErr } = await sb
    .from('issues').select('*').eq('id', id).single();

  if (issueErr || !issue) {
    document.getElementById('pageWrap').innerHTML = '<div class="loading-state"><p style="color:var(--red)">이슈를 찾을 수 없습니다.</p></div>';
    return;
  }

  const { data: analysis } = await sb
    .from('analyses').select('*').eq('issue_id', id).single();

  let companies = [];
  if (analysis) {
    const { data: ac } = await sb
      .from('analysis_companies')
      .select('*, companies(*)')
      .eq('analysis_id', analysis.id)
      .order('upside_pct', { ascending: false });
    companies = ac || [];
  }

  document.title = `${issue.title} — StockRipple`;
  renderPage(issue, analysis, companies);
}

initAuth();
init();

/* ── 상단 로그인/유저메뉴 (company.html/index.html의 app.js 로직과 통일) + Watchlist ── */
let _authUser = null;
let _wlCache = new Set();

async function initAuth() {
  const { data: { session } } = await sb.auth.getSession();
  _authUser = session?.user ?? null;
  renderUserMenu(_authUser);
  if (_authUser) {
    const { data } = await sb.from('user_watchlist').select('ticker');
    _wlCache = new Set((data || []).map(r => r.ticker));
  }
  sb.auth.onAuthStateChange(async (event, session) => {
    _authUser = session?.user ?? null;
    renderUserMenu(_authUser);
    if (_authUser) {
      const { data } = await sb.from('user_watchlist').select('ticker');
      _wlCache = new Set((data || []).map(r => r.ticker));
    } else {
      _wlCache.clear();
    }
    if (event === 'SIGNED_IN') closeAuthModal();
  });
}

function renderUserMenu(user) {
  const loginBtn = document.getElementById('loginBtn');
  const userMenu = document.getElementById('userMenu');
  if (!loginBtn || !userMenu) return;
  if (!user) {
    loginBtn.style.display = '';
    userMenu.style.display = 'none';
  } else {
    loginBtn.style.display = 'none';
    userMenu.style.display = '';
    document.getElementById('userAvatar').textContent = (user.email || '?')[0].toUpperCase();
  }
}
// toggleUserDropdown/doSignOut은 site-header.js 공용 버전 사용(2026-07-22) — 이 페이지의
// doSignOut은 관심종목 캐시(_wlCache) 정리 로직이 없어 공용판과 동작 차이가 없었음.

function isAnalysisWatched(ticker) { return _wlCache.has(ticker); }

async function toggleAnalysisWatch(e, btn) {
  e.stopPropagation();
  if (!_authUser) { openAuthModal(); return; }
  const { wlTicker: ticker, wlName: name, wlMarket: market } = btn.dataset;
  if (_wlCache.has(ticker)) {
    await sb.from('user_watchlist').delete().eq('ticker', ticker);
    _wlCache.delete(ticker);
  } else {
    await sb.from('user_watchlist').insert({ user_id: _authUser.id, ticker, name, market });
    _wlCache.add(ticker);
  }
  const w = _wlCache.has(ticker);
  btn.classList.toggle('active', w);
  btn.textContent = w ? '★' : '☆';
}



/* ── Stock Chart Modal ── */
let _chartInstance = null;
let _chartTicker = null;
let _chartRange = '3mo';

function openChart(ticker, name, isKr) {
  _chartTicker = ticker;
  _chartRange = '3mo';
  const overlay = document.getElementById('chartOverlay');
  overlay.style.display = 'flex';
  document.body.style.overflow = 'hidden';
  document.getElementById('chartModalTicker').textContent = ticker;
  document.getElementById('chartModalTicker').className = 'chart-modal-ticker ' + (isKr ? 'kr' : 'us');
  document.getElementById('chartModalName').textContent = name;
  document.getElementById('chartModalPrice').textContent = '';
  document.getElementById('chartModalChange').textContent = '';
  document.querySelectorAll('.range-btn').forEach(b => b.classList.toggle('active', b.dataset.range === _chartRange));
  loadChartData(ticker, _chartRange);
}

function closeChart() {
  document.getElementById('chartOverlay').style.display = 'none';
  document.body.style.overflow = '';
  if (_chartInstance) { _chartInstance.destroy(); _chartInstance = null; }
}

async function loadChartData(ticker, range) {
  const wrap = document.getElementById('chartCanvasWrap');
  wrap.innerHTML = '<div class="chart-loading">차트 불러오는 중...</div>';
  document.getElementById('chartModalPrice').textContent = '';
  document.getElementById('chartModalChange').textContent = '';

  try {
    const res = await fetch(`/api/stock-chart?ticker=${encodeURIComponent(ticker)}&range=${range}`);
    const data = await res.json();
    if (!data.points || !data.points.length) throw new Error('데이터 없음');
    renderLineChart(data);
  } catch(e) {
    wrap.innerHTML = `<div class="chart-loading" style="color:var(--red)">차트 로드 실패: ${e.message}</div>`;
  }
}

function renderLineChart(data) {
  const { points, currentPrice, currency } = data;
  const wrap = document.getElementById('chartCanvasWrap');
  wrap.innerHTML = '<canvas id="chartCanvas"></canvas>';
  const ctx = document.getElementById('chartCanvas');

  const labels = points.map(p => p.date);
  const values = points.map(p => p.close);
  const first = values[0];
  const last = currentPrice || values[values.length - 1];
  const isUp = last >= first;
  const lineColor = isUp ? '#3fb950' : '#f85149';
  const changeAbs = last - first;
  const changePct = ((changeAbs / first) * 100).toFixed(2);

  const fmt = new Intl.NumberFormat('en-US', {
    style: 'currency', currency: currency || 'USD', maximumFractionDigits: currency === 'KRW' ? 0 : 2
  });
  document.getElementById('chartModalPrice').textContent = fmt.format(last);
  const changeEl = document.getElementById('chartModalChange');
  changeEl.textContent = `${isUp ? '+' : ''}${changePct}%`;
  changeEl.className = 'chart-modal-change ' + (isUp ? 'pos' : 'neg');

  if (_chartInstance) _chartInstance.destroy();
  _chartInstance = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        data: values,
        borderColor: lineColor,
        borderWidth: 2,
        pointRadius: 0,
        tension: 0.2,
        fill: true,
        backgroundColor: (ctx2) => {
          const g = ctx2.chart.ctx.createLinearGradient(0, 0, 0, ctx2.chart.height);
          g.addColorStop(0, isUp ? 'rgba(63,185,80,0.25)' : 'rgba(248,81,73,0.25)');
          g.addColorStop(1, 'rgba(0,0,0,0)');
          return g;
        },
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: c => {
              const v = c.raw;
              return ' ' + fmt.format(v);
            }
          },
          backgroundColor: cssVar('--bg2','#1e2129'), borderColor: cssVar('--border-strong','rgba(255,255,255,0.14)'), borderWidth: 1,
          titleColor: cssVar('--text2','#a6adbb'), bodyColor: cssVar('--text','#f2f4f8'),
        }
      },
      scales: {
        x: {
          ticks: {
            color: cssVar('--text3','#6c7385'), font: { size: 10 }, maxTicksLimit: 6,
            callback(val, i, ticks) { return labels[i]?.slice(5); }
          },
          grid: { color: cssVar('--border-soft','rgba(255,255,255,0.06)') }
        },
        y: {
          ticks: {
            color: cssVar('--text3','#6c7385'), font: { size: 10 },
            callback: v => currency === 'KRW' ? v.toLocaleString('ko-KR') : v.toFixed(0)
          },
          grid: { color: cssVar('--border-soft','rgba(255,255,255,0.06)') }
        }
      }
    }
  });
}
</script>
