name: Market Hours News Fetch

on:
  schedule:
    # KST 09:00~16:00 = UTC 00:00~07:00, 30분마다
    # 주의: :00/:30 정각은 GitHub 스케줄러가 가장 혼잡해 실행이 대부분 탈락함
    # (실측: 하루 16회 스케줄 중 ~3회만 실행) — :07/:37로 비켜서 배치
    - cron: '7,37 0-7 * * 1-5'   # 평일만
  workflow_dispatch:  # 수동 실행 가능

jobs:
  fetch-and-analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Fetch RSS News
        run: |
          RESPONSE=$(curl -s -o /tmp/rss_resp.json -w "%{http_code}" \
            -X POST "${{ secrets.VERCEL_URL }}/api/fetch-rss" \
            -H "Authorization: Bearer ${{ secrets.ADMIN_SECRET }}" \
            -H "Content-Type: application/json")
          echo "RSS fetch status: $RESPONSE"
          cat /tmp/rss_resp.json

      - name: Fetch NewsAPI
        run: |
          RESP=$(curl -s --max-time 60 -X POST "${{ secrets.VERCEL_URL }}/api/fetch-news" \
            -H "Authorization: Bearer ${{ secrets.ADMIN_SECRET }}" \
            -H "Content-Type: application/json" || true)
          echo "$RESP" | jq -r '.saved // "done"' 2>/dev/null || echo "non-JSON response: $(echo "$RESP" | head -c 200)"

      # Message Batches API로 제출만 하고 끝 — 실제 처리/완료는 analyze-backlog.yml의
      # 10분 주기 폴링(mode=batch-poll)이 이어받는다. 입력 토큰 50% 할인 + 프롬프트 캐싱 적용.
      # 이미 진행 중인 배치가 있으면 서버가 알아서 중복 제출을 스킵한다.
      - name: AI Analyze (배치 제출)
        run: |
          RESP=$(curl -s --max-time 60 -X POST "${{ secrets.VERCEL_URL }}/api/analyze?mode=batch-submit" \
            -H "Authorization: Bearer ${{ secrets.ADMIN_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"limit": 30}' || true)
          echo "$RESP" | jq -c '{submitted, staleSkipped, reason}' 2>/dev/null || echo "non-JSON response: $(echo "$RESP" | head -c 200)"
