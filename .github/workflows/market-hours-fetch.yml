name: Market Hours News Fetch

on:
  schedule:
    # KST 09:00~16:00 = UTC 00:00~07:00, 30분마다
    - cron: '0,30 0,1,2,3,4,5,6,7 * * 1-5'   # 평일만
  workflow_dispatch:  # 수동 실행 가능

jobs:
  fetch-and-analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Fetch RSS News
        run: |
          RESPONSE=$(curl -s -o /tmp/rss_resp.json -w "%{http_code}" \
            -X POST "${{ secrets.VERCEL_URL }}/api/fetch-rss" \
            -H "Authorization: Bearer ${{ secrets.ADMIN_SECRET }}" \
            -H "Content-Type: application/json")
          echo "RSS fetch status: $RESPONSE"
          cat /tmp/rss_resp.json

      - name: Fetch NewsAPI
        run: |
          curl -s -X POST "${{ secrets.VERCEL_URL }}/api/fetch-news" \
            -H "Authorization: Bearer ${{ secrets.ADMIN_SECRET }}" \
            -H "Content-Type: application/json" | jq '.saved // "done"'

      # analyze API가 배치가 꽉 차면 스스로 다음 배치를 체이닝하므로 1회만 호출 (기본 max_chain 4 = 최대 20건)
      # 주의: Vercel 60s 타임아웃 시 JSON이 아닌 에러 텍스트가 오는데, 이때 jq 파싱 실패가
      # pipefail로 스텝 전체를 죽이지 않도록 방어 (분석 자체는 서버에서 계속 진행됨)
      - name: AI Analyze (체이닝 최대 4회 × 5건)
        run: |
          RESP=$(curl -s --max-time 120 -X POST "${{ secrets.VERCEL_URL }}/api/analyze" \
            -H "Authorization: Bearer ${{ secrets.ADMIN_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"limit": 5}' || true)
          echo "$RESP" | jq -r '.analyzed // 0' 2>/dev/null || echo "non-JSON response: $(echo "$RESP" | head -c 200)"
