name: Analyze Backlog

# 장중 수집 워크플로(market-hours-fetch)와 별개로, 24시간 매시간 RSS 수집 + 미분석 이슈를 소화한다.
# — 미국장 뉴스는 KST 밤에 쏟아지는데 기존 워크플로는 KST 09~16시만 돌아서 밤 사이 수집 공백이 있었음
#   → RSS 수집(무료)을 여기에 포함해 24시간 커버. NewsAPI(일 100콜 제한)는 장중 워크플로에만 둔다
# — analyze API가 48시간 지난 미분석 이슈를 자동 스킵 처리하므로 오래된 뉴스에 비용을 쓰지 않음
# — 미분석이 없으면 첫 라운드에서 바로 종료 (Claude 호출 없음)

on:
  schedule:
    - cron: '15 * * * *'   # 매시 15분: 전체 파이프라인 (fetch 워크플로와 시간대 분산)
    - cron: '*/10 * * * *' # 10분마다: 배치 폴링만 — Message Batches API 진행을 빠르게 이어간다
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # 배치 폴링은 매 실행(10분 주기 포함)마다 — discover→decide 2단계 전환을 놓치지 않도록.
      # 진행 중인 배치가 없으면 즉시 {checked:0}으로 끝나 비용/시간 낭비 없음.
      - name: Batch Poll (진행 중인 배치 이어받기)
        run: |
          RESP=$(curl -s --max-time 60 -X POST "${{ secrets.VERCEL_URL }}/api/analyze?mode=batch-poll" \
            -H "Authorization: Bearer ${{ secrets.ADMIN_SECRET }}" || true)
          echo "$RESP" | jq -c '{checked, outcomes}' 2>/dev/null || echo "non-JSON response: $(echo "$RESP" | head -c 200)"

      - name: Fetch RSS News
        if: github.event.schedule != '*/10 * * * *'
        run: |
          RESP=$(curl -s --max-time 60 -X POST "${{ secrets.VERCEL_URL }}/api/fetch-rss" \
            -H "Authorization: Bearer ${{ secrets.ADMIN_SECRET }}" \
            -H "Content-Type: application/json" || true)
          echo "$RESP" | jq -r '.saved // "done"' 2>/dev/null || echo "non-JSON response: $(echo "$RESP" | head -c 200)"

      # Claude Code 에이전트 큐에 제출만 하고 끝 — Anthropic API 비용 없음. 프롬프트만
      # analyze_batches(engine='agent')에 적재되고, 스케줄 에이전트가 답을 채우면 위
      # Batch Poll 스텝(10분 주기)이 기존과 동일한 로직으로 완료 처리를 이어받는다.
      # 이미 진행 중인 큐가 있으면 서버가 알아서 중복 제출을 스킵한다.
      - name: AI Analyze (에이전트 큐 제출, 최대 30건)
        if: github.event.schedule != '*/10 * * * *'
        run: |
          RESP=$(curl -s --max-time 60 -X POST "${{ secrets.VERCEL_URL }}/api/analyze?mode=agent-submit" \
            -H "Authorization: Bearer ${{ secrets.ADMIN_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"limit": 100}' || true)
          echo "$RESP" | jq -c '{submitted, staleSkipped, reason}' 2>/dev/null || echo "non-JSON response: $(echo "$RESP" | head -c 200)"

      # 예측 정확도 검증 — Vercel cron이 불안정해 GH Actions에서 매시간 실행 (due 항목만 처리, 멱등)
      - name: Check Accuracy (예측 검증)
        if: github.event.schedule != '*/10 * * * *'
        run: |
          RESP=$(curl -s --max-time 120 -X POST "${{ secrets.VERCEL_URL }}/api/check-accuracy" \
            -H "Authorization: Bearer ${{ secrets.ADMIN_SECRET }}" || true)
          echo "$RESP" | head -c 300; echo

      # Vercel daily cron 백업: 01시(UTC)대 실행 시 오케스트레이터 호출 (뉴스수집/AI요약 등)
      - name: Daily Orchestrator 백업 (01 UTC에만)
        if: github.event.schedule != '*/10 * * * *'
        run: |
          if [ "$(date -u +%H)" = "01" ]; then
            curl -s --max-time 30 -X POST "${{ secrets.VERCEL_URL }}/api/cron-daily" \
              -H "Authorization: Bearer ${{ secrets.ADMIN_SECRET }}" | head -c 300; echo
          else
            echo "skip (01 UTC에만 실행)"
          fi

      # 데일리 리포트 캐치업 — 전용 daily-reports.yml 스케줄이 GitHub Actions에 자주 드롭되므로
      # (실측: 7/6 국장 07:40 UTC 슬롯 누락), 매시간 도는 이 워크플로에서 멱등 생성한다.
      # "해당 시장이 마감(+버퍼)했는데 오늘자 리포트가 아직 없으면 1회 생성" → 어느 시간대 run이든
      # 처음 뜨는 놈이 채워넣고, 이후 run은 이미 존재하므로 스킵 (upsert라 중복도 안전).
      - name: Daily Report catch-up (KR/US)
        if: github.event.schedule != '*/10 * * * *'
        run: |
          gen() {
            local MKT="$1" TODAY="$2" CLOSE_EPOCH="$3"
            local RESP LATEST CREATED CREATED_EPOCH
            RESP=$(curl -s --max-time 20 "${{ secrets.VERCEL_URL }}/api/admin?action=daily-report&market=$MKT")
            LATEST=$(echo "$RESP"  | jq -r '.report_date // "none"' 2>/dev/null || echo none)
            CREATED=$(echo "$RESP" | jq -r '.created_at // ""'      2>/dev/null || echo "")
            if [ "$LATEST" = "$TODAY" ]; then
              # 오늘자가 있어도 "마감 전에 생성된 것"(장 시작 전 수동 배포 등)이면 마감 데이터로 재생성
              CREATED_EPOCH=$(date -d "$CREATED" +%s 2>/dev/null || echo 0)
              if [ "$CREATED_EPOCH" -ge "$CLOSE_EPOCH" ]; then
                echo "$MKT: 이미 $TODAY 마감 후 리포트 존재 (created=$CREATED) — 스킵"; return
              fi
              echo "$MKT: $TODAY 리포트가 마감 전 생성본 (created=$CREATED) — 마감 데이터로 재생성"
            else
              echo "$MKT: $TODAY 리포트 없음 (최신=$LATEST) — 생성 요청"
            fi
            curl -s --max-time 120 -X POST "${{ secrets.VERCEL_URL }}/api/admin?action=daily-report" \
              -H "Authorization: Bearer ${{ secrets.ADMIN_SECRET }}" -H "Content-Type: application/json" \
              -d "{\"market\":\"$MKT\"}" \
              | jq -c '{ok,generated,market,report_date,error}' 2>/dev/null \
              || echo "  (non-JSON 응답 — 서버에서 생성은 계속될 수 있음)"
          }
          # 국장: KST 평일, 마감 15:30 + 버퍼 → KST 17~23시에 catch-up (report_date = KST 당일)
          KST_DOW=$(TZ=Asia/Seoul date +%u); KST_H=$(TZ=Asia/Seoul date +%H); KST_DATE=$(TZ=Asia/Seoul date +%F)
          KR_CLOSE=$(TZ=Asia/Seoul date -d "$KST_DATE 15:30" +%s)
          if [ "$KST_DOW" -le 5 ] && [ "$KST_H" -ge 17 ]; then gen KR "$KST_DATE" "$KR_CLOSE"; else echo "KR: 생성 창 아님 (dow=$KST_DOW h=$KST_H KST)"; fi
          # 미장: ET 평일, 마감 16:00 + 버퍼 → ET 17~23시에 catch-up (report_date = ET 당일)
          ET_DOW=$(TZ=America/New_York date +%u); ET_H=$(TZ=America/New_York date +%H); ET_DATE=$(TZ=America/New_York date +%F)
          US_CLOSE=$(TZ=America/New_York date -d "$ET_DATE 16:00" +%s)
          if [ "$ET_DOW" -le 5 ] && [ "$ET_H" -ge 17 ]; then gen US "$ET_DATE" "$US_CLOSE"; else echo "US: 생성 창 아님 (dow=$ET_DOW h=$ET_H ET)"; fi

      # AI 시장 종합 + 예정 catalyst 갱신 — 기존엔 cron-daily(하루 1회 01 UTC)에만 있어 GitHub 슬롯
      # 드롭 시 며칠씩 멈췄음(실측 7/3 이후 정지). 매시간 도는 이 워크플로로 옮김.
      # 서버에 신선도 가드가 있어 자주 불려도 낭비 없음(요약 3h 이내면 스킵, catalyst는 멱등).
      - name: AI 시장 종합 + catalyst 갱신
        if: github.event.schedule != '*/10 * * * *'
        run: |
          echo "-- ai-market-summary --"
          curl -s --max-time 60 -X POST "${{ secrets.VERCEL_URL }}/api/admin?action=ai-market-summary" \
            -H "Authorization: Bearer ${{ secrets.ADMIN_SECRET }}" -H "Content-Type: application/json" \
            | jq -c '{ok,generated,reason,headline}' 2>/dev/null || echo "  (non-JSON)"
          echo "-- catalysts --"
          curl -s --max-time 120 -X POST "${{ secrets.VERCEL_URL }}/api/admin?action=catalysts" \
            -H "Authorization: Bearer ${{ secrets.ADMIN_SECRET }}" -H "Content-Type: application/json" \
            | jq -c '{ok,added,candidates}' 2>/dev/null || echo "  (non-JSON)"

      # 종목 AI 종합분석 사전 백필 — 방문자가 우연히 눌러야만(캐시 없으면 빈 화면) 생성되던
      # company_summary를, 조회수 있는 종목 위주로 매시간 최대 25건씩 미리 큐에 채워둔다.
      # 비용은 없음(agent 큐 제출만) — 스케줄 에이전트가 실제 처리. 이 크론이 드롭돼도
      # 스케줄 Claude Code 에이전트(30분 주기)가 매 실행마다 직접 백업 제출도 한다.
      - name: AI 종합분석 사전 백필
        if: github.event.schedule != '*/10 * * * *'
        run: |
          curl -s --max-time 60 -X POST "${{ secrets.VERCEL_URL }}/api/admin?action=company-summary-backfill" \
            -H "Authorization: Bearer ${{ secrets.ADMIN_SECRET }}" -H "Content-Type: application/json" \
            -d '{"limit": 25}' \
            | jq -c '{ok,submitted,scanned,reason}' 2>/dev/null || echo "  (non-JSON)"
