<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>재분석 트리거 — StockRipple Admin</title>
<style>
  :root {
    --bg:#0d1117; --bg2:#161b22; --bg3:#21262d; --border:#30363d;
    --text:#e6edf3; --text2:#8b949e; --text3:#6e7681;
    --blue:#2f81f7; --green:#3fb950; --red:#f85149; --yellow:#d29922;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 40px 20px; }
  .wrap { max-width: 600px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
  .card { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 24px; margin-bottom: 16px; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:10px; }
  label { display: block; font-size: 13px; color: var(--text2); margin-bottom: 8px; }
  input[type="email"], input[type="password"], input[type="number"] {
    width: 100%; padding: 10px 12px; background: var(--bg3); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-size: 14px; outline: none; font-family: inherit;
  }
  input:focus { border-color: var(--blue); }
  button {
    padding: 11px 18px; background: var(--blue); color: #fff; border: none;
    border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; width: 100%;
    transition: all .15s; margin-top: 10px;
  }
  button:hover:not(:disabled) { background: #388be8; transform: translateY(-1px); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.secondary { background: var(--bg3); color: var(--text); border: 1px solid var(--border); }
  button.secondary:hover:not(:disabled) { border-color: var(--blue); }
  button.success { background: var(--green); }
  button.success:hover:not(:disabled) { background: #2ea043; }
  .info { font-size: 12px; color: var(--text3); line-height: 1.6; margin-top: 8px; }
  .log {
    margin-top: 20px; padding: 14px; background: #000; border-radius: 8px;
    font-family: 'SF Mono', Consolas, monospace; font-size: 12px; line-height: 1.6;
    max-height: 360px; overflow-y: auto; white-space: pre-wrap; color: var(--green);
  }
  .log .err { color: var(--red); }
  .log .info-line { color: var(--blue); }
  .pill { display:inline-block; padding:2px 8px; border-radius:4px; font-size:11px; font-weight:600; background:var(--bg3); color:var(--text2); }
  .user-chip { display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--text2); }
  .user-chip .dot { width:6px; height:6px; border-radius:50%; background:var(--green); }
  a.back { color: var(--text3); font-size: 13px; text-decoration: none; }
  a.back:hover { color: var(--blue); }
  .auth-error { color: var(--red); font-size: 12px; margin-top: 8px; min-height: 16px; }
</style>
</head>
<body>
<div class="wrap">
  <a href="/" class="back">← 메인으로</a>
  <h1>🔄 재분석 트리거 <span class="pill">Admin</span></h1>

  <!-- 로그인 안 됐을 때 -->
  <div id="authCard" class="card" style="display:none">
    <form autocomplete="off" onsubmit="event.preventDefault(); signIn();">
      <label>관리자 로그인</label>
      <!-- 자동완성 방지용 디코이 (브라우저가 첫 input/password 쌍을 채우게 유도) -->
      <input type="text" name="fakeuser" style="display:none" autocomplete="username" tabindex="-1">
      <input type="password" name="fakepass" style="display:none" autocomplete="new-password" tabindex="-1">
      <input type="email" id="email" placeholder="example@email.com" autocomplete="off" name="admin_email_${Date.now()}" data-form-type="other" readonly onfocus="this.removeAttribute('readonly')">
      <input type="password" id="password" placeholder="비밀번호" autocomplete="new-password" name="admin_pw_${Date.now()}" data-form-type="other" readonly onfocus="this.removeAttribute('readonly')" style="margin-top:10px">
      <div class="auth-error" id="authError"></div>
      <button type="submit">로그인</button>
      <button type="button" onclick="signInGoogle()" class="secondary">Google로 로그인</button>
    </form>
    <div class="info">관리자 이메일(allowlist)에 등록된 계정만 접근 가능합니다.</div>
  </div>

  <!-- 로그인 됐을 때 -->
  <div id="actionCard" class="card" style="display:none">
    <div class="row" style="margin-bottom:16px">
      <span class="user-chip"><span class="dot"></span><span id="userEmail">—</span></span>
      <button onclick="signOut()" class="secondary" style="margin-top:0;width:auto;padding:6px 12px;font-size:12px">로그아웃</button>
    </div>

    <label>재분석할 최근 이슈 개수 (1회 최대 15)</label>
    <input type="number" id="count" value="15" min="1" max="15">
    <div class="info">
      가장 최근 N개의 분석된 이슈를 삭제하고 새 형식(매수가/목표/손절/시간프레임/thesis/risk)으로 재분석.<br>
      Vercel 함수 60초 타임아웃 때문에 <b>1회 최대 15건</b>으로 제한됨. 더 많이 처리하려면 반복 실행.<br>
      Anthropic API 비용: 개당 약 $0.003 (15개 = ~$0.045)
    </div>
    <button id="btnRun" onclick="runReanalyze()">재분석 시작</button>
    <button id="btnAuto" onclick="runReanalyzeAuto()" class="secondary" style="margin-top:8px">🔁 자동 반복 (전체 재분석)</button>
    <button onclick="runFresh()" class="success" style="margin-top:8px">신규 미분석 이슈만 분석</button>
  </div>

  <div id="log" class="log" style="display:none"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://nmvfffzpkqyzztiobwtt.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_22PPW0eCY3Tvy3vZVZYKFw_yCb8cI2f';
// 메인 사이트와 동일한 기본 스토리지 키 사용 (세션 공유)
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: {
    persistSession: true,
    autoRefreshToken: true,
    detectSessionInUrl: true,
    flowType: 'pkce',
  },
});

let _session = null;

// 디버그 정보를 페이지에 표시 + sessionStorage에 저장 (리다이렉트 후 복원용)
const DEBUG_KEY = 'admin_debug_logs';
function loadDebugLogs() {
  try { return JSON.parse(sessionStorage.getItem(DEBUG_KEY) || '[]'); } catch { return []; }
}
function saveDebugLogs(logs) {
  try { sessionStorage.setItem(DEBUG_KEY, JSON.stringify(logs.slice(-50))); } catch {}
}
function clearDebugLogs() {
  try { sessionStorage.removeItem(DEBUG_KEY); } catch {}
  const el = document.getElementById('debugBox');
  if (el) el.innerHTML = '';
}

function debugInfo(msg) {
  let el = document.getElementById('debugBox');
  if (!el) {
    el = document.createElement('div');
    el.id = 'debugBox';
    el.style.cssText = 'background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:12px;font-family:monospace;font-size:11px;color:var(--text2);max-height:240px;overflow-y:auto;position:relative';
    const clearBtn = document.createElement('button');
    clearBtn.textContent = '× clear';
    clearBtn.style.cssText = 'position:absolute;top:4px;right:6px;background:none;border:none;color:var(--text3);cursor:pointer;font-size:10px;width:auto;padding:2px 6px;margin:0';
    clearBtn.onclick = (e) => { e.preventDefault(); clearDebugLogs(); };
    el.appendChild(clearBtn);
    document.querySelector('.wrap').insertBefore(el, document.getElementById('authCard'));
  }
  const time = new Date().toLocaleTimeString('ko-KR');
  const entry = `[${time}] ${msg}`;
  const line = document.createElement('div');
  line.textContent = entry;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;

  // sessionStorage에 저장 (리다이렉트 후 복원)
  const logs = loadDebugLogs();
  logs.push(entry);
  saveDebugLogs(logs);
}

// 페이지 로드 시 이전 로그 복원
function restoreDebugLogs() {
  const logs = loadDebugLogs();
  if (!logs.length) return;
  let el = document.getElementById('debugBox');
  if (!el) {
    el = document.createElement('div');
    el.id = 'debugBox';
    el.style.cssText = 'background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:12px;font-family:monospace;font-size:11px;color:var(--text2);max-height:240px;overflow-y:auto;position:relative';
    const clearBtn = document.createElement('button');
    clearBtn.textContent = '× clear';
    clearBtn.style.cssText = 'position:absolute;top:4px;right:6px;background:none;border:none;color:var(--text3);cursor:pointer;font-size:10px;width:auto;padding:2px 6px;margin:0';
    clearBtn.onclick = (e) => { e.preventDefault(); clearDebugLogs(); };
    el.appendChild(clearBtn);
    document.querySelector('.wrap').insertBefore(el, document.getElementById('authCard'));
  }
  for (const entry of logs) {
    const line = document.createElement('div');
    line.textContent = entry;
    line.style.opacity = '0.7';
    el.appendChild(line);
  }
  const sep = document.createElement('div');
  sep.style.cssText = 'border-top:1px dashed #444;margin:6px 0';
  el.appendChild(sep);
}

function log(msg, cls='') {
  const el = document.getElementById('log');
  el.style.display = 'block';
  const line = document.createElement('div');
  if (cls) line.className = cls;
  line.textContent = `[${new Date().toLocaleTimeString('ko-KR')}] ${msg}`;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}

async function refreshUI() {
  const { data, error } = await sb.auth.getSession();
  if (error) debugInfo(`getSession error: ${error.message}`);
  _session = data.session;
  debugInfo(_session?.user
    ? `✓ 로그인됨: ${_session.user.email || _session.user.id}`
    : '⊘ 세션 없음 (로그인 필요)');
  if (_session?.user) {
    document.getElementById('authCard').style.display = 'none';
    document.getElementById('actionCard').style.display = 'block';
    document.getElementById('userEmail').textContent = _session.user.email || _session.user.id;
  } else {
    document.getElementById('authCard').style.display = 'block';
    document.getElementById('actionCard').style.display = 'none';
  }
}

async function signIn() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const errEl = document.getElementById('authError');
  errEl.textContent = '';
  if (!email || !password) { errEl.textContent = '이메일과 비밀번호를 입력해 주세요'; return; }
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) { errEl.textContent = error.message; return; }
  await refreshUI();
}

async function signInGoogle() {
  debugInfo(`Google OAuth 시작 (전체 리다이렉트, 로그 보존됨)`);
  const { error } = await sb.auth.signInWithOAuth({
    provider: 'google',
    options: {
      redirectTo: `${location.origin}${location.pathname}`,
      queryParams: { prompt: 'select_account' },
    },
  });
  if (error) debugInfo(`OAuth 에러: ${error.message}`);
}

async function signOut() {
  await sb.auth.signOut();
  _session = null;
  await refreshUI();
}

async function callAnalyze(body) {
  if (!_session?.access_token) {
    log('로그인 세션이 만료되었습니다. 다시 로그인해 주세요.', 'err');
    await refreshUI();
    return null;
  }
  const res = await fetch('/api/analyze', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${_session.access_token}`,
    },
    body: JSON.stringify(body),
  });
  const text = await res.text();
  let json;
  try { json = JSON.parse(text); } catch { json = { raw: text }; }
  if (!res.ok) {
    log(`HTTP ${res.status}: ${json.error || text.slice(0,200)}`, 'err');
    return null;
  }
  return json;
}

async function runReanalyze() {
  const btn = document.getElementById('btnRun');
  const count = parseInt(document.getElementById('count').value, 10) || 20;
  btn.disabled = true;
  btn.textContent = '실행 중... (1~2분 소요)';
  log(`🔄 최근 ${count}개 이슈 재분석 시작`, 'info-line');
  const result = await callAnalyze({ force_recent: count, limit: count });
  if (result) {
    log(`✓ 재분석 완료: 기존 분석 삭제 ${result.reanalyzed || 0}건, 새로 분석 ${result.analyzed || 0}건`);
    if (result.errors?.length) {
      log(`⚠️ 에러 ${result.errors.length}건:`, 'err');
      result.errors.slice(0, 5).forEach(e => log(`  - ${e}`, 'err'));
    }
  }
  btn.disabled = false;
  btn.textContent = '재분석 시작';
}

async function runFresh() {
  log('🆕 신규 미분석 이슈 처리 시작', 'info-line');
  const result = await callAnalyze({ limit: 15 });
  if (result) {
    log(`✓ 완료: 분석 ${result.analyzed || 0}건`);
    if (result.errors?.length) {
      log(`⚠️ 에러 ${result.errors.length}건`, 'err');
      result.errors.slice(0, 5).forEach(e => log(`  - ${e}`, 'err'));
    }
  }
}

// 자동 반복: 신규 분석할 이슈 없을 때까지 15개씩 처리
let _autoStop = false;
async function runReanalyzeAuto() {
  const btn = document.getElementById('btnAuto');
  const total = parseInt(prompt('전체 재분석할 이슈 개수 (예: 50)', '30'), 10);
  if (!total || total < 1) return;
  if (!confirm(`최근 ${total}개 이슈를 15개씩 배치로 재분석합니다. 약 ${Math.ceil(total/15)}분 소요. 진행할까요?`)) return;

  _autoStop = false;
  btn.disabled = true;
  btn.textContent = '🛑 중단';
  btn.onclick = () => { _autoStop = true; log('🛑 중단 요청됨, 현재 배치 후 종료', 'err'); };

  log(`🔁 자동 반복 시작: 최근 ${total}개 (15개씩 배치)`, 'info-line');

  // 1) 먼저 최근 N개의 분석을 모두 삭제 + is_analyzed=false 처리
  log(`1️⃣ 최근 ${total}개 기존 분석 삭제 중...`, 'info-line');
  const wipe = await callAnalyze({ force_recent: Math.min(total, 15), limit: 0 });
  if (!wipe) { btn.disabled = false; btn.textContent = '🔁 자동 반복 (전체 재분석)'; btn.onclick = runReanalyzeAuto; return; }
  log(`  ↳ ${wipe.reanalyzed || 0}개 삭제`);

  // 2) 15개씩 반복 처리
  let analyzedTotal = 0;
  let batch = 1;
  while (!_autoStop && analyzedTotal < total) {
    log(`2️⃣ 배치 ${batch} 시작 (15개)...`, 'info-line');
    const res = await callAnalyze({ limit: 15 });
    if (!res) break;
    const got = res.analyzed || 0;
    analyzedTotal += got;
    log(`  ↳ ${got}개 분석 완료 (누적 ${analyzedTotal}/${total})`);
    if (got === 0) { log(`✓ 더 분석할 이슈 없음, 종료`); break; }
    if (res.errors?.length) res.errors.slice(0, 3).forEach(e => log(`  ⚠️ ${e}`, 'err'));
    batch++;
    await new Promise(r => setTimeout(r, 1500));  // 다음 배치 전 잠시 대기
  }

  log(`🎯 자동 반복 완료: 총 ${analyzedTotal}개 새 형식 분석 생성`);
  btn.disabled = false;
  btn.textContent = '🔁 자동 반복 (전체 재분석)';
  btn.onclick = runReanalyzeAuto;
}

// 팝업 창에서 실행 중인지 감지 (OAuth 콜백용)
const isOAuthPopup = window.opener && window.opener !== window && (location.hash.includes('access_token') || location.search.includes('code='));

// 이전 디버그 로그 복원 (OAuth 리다이렉트 후)
restoreDebugLogs();

sb.auth.onAuthStateChange((event, session) => {
  debugInfo(`auth event: ${event} ${session?.user?.email || ''}`);
  refreshUI();
});

(async () => {
  // OAuth 콜백 감지 + 진단
  const hasCode  = location.search.includes('code=');
  const hasHash  = location.hash.includes('access_token');
  const hasError = location.search.includes('error=') || location.hash.includes('error=');

  if (hasError) {
    const params = new URLSearchParams(location.search + '&' + location.hash.replace(/^#/, ''));
    const errCode = params.get('error') || params.get('error_code') || '';
    const errDesc = params.get('error_description') || params.get('error_message') || '';
    debugInfo(`❌ OAuth 에러: ${errCode}`);
    if (errDesc) debugInfo(`   상세: ${decodeURIComponent(errDesc.replace(/\+/g, ' '))}`);
    debugInfo(`   원인 후보: Supabase Auth Providers에서 Google 비활성화 또는 Client ID/Secret 누락`);
    history.replaceState({}, document.title, location.pathname);
  } else if (hasCode) {
    debugInfo(`📍 OAuth 콜백 도착 (PKCE code 있음), 코드 교환 중...`);
    // PKCE 코드 교환 시도
    try {
      const { data, error } = await sb.auth.exchangeCodeForSession(location.href);
      if (error) debugInfo(`❌ 코드 교환 실패: ${error.message}`);
      else if (data?.session) debugInfo(`✓ 코드 교환 성공: ${data.session.user.email}`);
    } catch (e) {
      debugInfo(`❌ 코드 교환 예외: ${e.message}`);
    }
    // URL 정리 (token이 URL에 남아있지 않게)
    history.replaceState({}, document.title, location.pathname);
  } else if (hasHash) {
    debugInfo(`📍 OAuth 콜백 도착 (implicit hash 있음)`);
    await new Promise(r => setTimeout(r, 500));
  }
  await refreshUI();
})();
</script>
</body>
</html>
