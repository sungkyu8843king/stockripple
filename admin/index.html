<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리자 — StockRipple</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #ffffff; --bg2: #f6f6f8; --bg3: #ececf0; --bg4: #dededf;
  --border: #e5e5ea; --border-strong: #c4c4c9; --border-soft: rgba(0,0,0,0.06);
  --text: #0a0a0a; --text2: #4b4b52; --text3: #86868b;
  --blue: #0066cc; --green: #00873a; --red: #e31937; --yellow: #b8860b;
  --blue-dim: rgba(0,102,204,0.10); --green-dim: rgba(0,135,58,0.10); --red-dim: rgba(227,25,55,0.10);
  --shadow-card: 0 1px 3px rgba(0,0,0,0.04), 0 8px 24px rgba(0,0,0,0.06);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; }

/* Sidebar */
.sidebar {
  width: 220px; flex-shrink: 0; background: var(--bg2); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; position: fixed; top: 0; left: 0; height: 100vh; z-index: 100;
}
.sidebar-logo { padding: 20px 16px; border-bottom: 1px solid var(--border); }
.sidebar-logo .site-name { font-size: 16px; font-weight: 700; }
.sidebar-logo .site-sub { font-size: 11px; color: var(--text3); margin-top: 2px; }
.sidebar-nav { padding: 12px 8px; flex: 1; overflow-y: auto; }
.nav-section { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.8px; padding: 8px 8px 4px; font-weight: 600; }
.nav-item {
  display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 6px;
  cursor: pointer; font-size: 13px; color: var(--text2); transition: all 0.15s; margin-bottom: 2px;
  background: none; border: none; width: 100%; text-align: left;
}
.nav-item:hover { background: var(--bg3); color: var(--text); }
.nav-item.active { background: var(--bg3); color: var(--text); }
.nav-item svg { flex-shrink: 0; }
.sidebar-footer { padding: 12px 16px; border-top: 1px solid var(--border); }
.back-link { font-size: 12px; color: var(--text3); text-decoration: none; display: flex; align-items: center; gap: 6px; }
.back-link:hover { color: var(--blue); }

/* Main */
.main { margin-left: 220px; flex: 1; min-height: 100vh; }
.topbar {
  background: rgba(255,255,255,0.85); backdrop-filter: blur(12px) saturate(180%); border-bottom: 1px solid var(--border);
  padding: 0 24px; display: flex; align-items: center; gap: 16px; height: 56px;
  position: sticky; top: 0; z-index: 50;
}
.topbar-title { font-size: 15px; font-weight: 600; }
.topbar-sub { font-size: 12px; color: var(--text3); }
.spacer { flex: 1; }
.btn {
  padding: 7px 16px; border-radius: 7px; font-size: 13px; font-weight: 600;
  border: none; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all 0.15s;
}
.btn-primary { background: var(--blue); color: #fff; }
.btn-primary:hover { background: #0052a3; }
.btn-success { background: var(--green-dim); color: var(--green); border: 1px solid rgba(0,135,58,0.25); }
.btn-success:hover { background: rgba(0,135,58,0.18); }
.btn-warn { background: rgba(184,134,11,0.12); color: var(--yellow); border: 1px solid rgba(184,134,11,0.30); }
.btn-warn:hover { background: rgba(184,134,11,0.20); }
.btn-danger { background: var(--red-dim); color: var(--red); border: 1px solid rgba(227,25,55,0.25); }
.btn-danger:hover { background: #5a2020; }
.btn-ghost { background: var(--bg3); color: var(--text2); border: 1px solid var(--border); }
.btn-ghost:hover { color: var(--text); border-color: var(--text2); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

.content { padding: 24px; }

/* Panel sections */
.panel-section { display: none; }
.panel-section.active { display: block; }
.section-header { margin-bottom: 20px; }
.section-header h2 { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
.section-header p { font-size: 13px; color: var(--text2); }

/* Cards */
.card { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 16px; }
.card-title { font-size: 14px; font-weight: 600; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
.card-title svg { color: var(--text3); }

/* Action Row */
.action-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
.label-row { font-size: 12px; color: var(--text3); }

/* Log Box */
.log-box {
  background: #0a0a0a; border: 1px solid var(--border); border-radius: 8px;
  padding: 12px 14px; font-family: 'SF Mono', 'Fira Code', monospace; font-size: 12px;
  color: #a8b5c1; max-height: 200px; overflow-y: auto; line-height: 1.7;
}
.log-box .log-ok { color: var(--green); }
.log-box .log-err { color: var(--red); }
.log-box .log-info { color: var(--blue); }
.log-box .log-warn { color: var(--yellow); }

/* Stats grid */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; margin-bottom: 20px; }
.stat-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
.stat-label { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
.stat-value { font-size: 28px; font-weight: 700; }
.stat-value.blue { color: var(--blue); }
.stat-value.green { color: var(--green); }
.stat-value.yellow { color: var(--yellow); }

/* Table */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; padding: 8px 12px; font-size: 11px; color: var(--text3); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--border); }
td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: var(--bg3); }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 4px; }
.badge-green { background: var(--green-dim); color: var(--green); }
.badge-yellow { background: rgba(184,134,11,0.12); color: var(--yellow); }
.badge-red { background: var(--red-dim); color: var(--red); }
.badge-blue { background: var(--blue-dim); color: var(--blue); }
.badge-gray { background: var(--bg3); color: var(--text2); }
.fb-nav-badge { background: var(--red); color: #fff; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 999px; margin-left: 4px; }
.fb-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
.fb-card-top { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
.fb-cat-badge { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
.fb-card-msg { font-size: 13.5px; color: var(--text); line-height: 1.6; margin-bottom: 8px; white-space: pre-wrap; }
.fb-card-meta { font-size: 11px; color: var(--text3); margin-bottom: 10px; }
.fb-card-actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.fb-status-select { padding: 5px 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 12px; }
.btn-sm { padding: 5px 11px; font-size: 11px; }
.ticker-cell { font-family: 'SF Mono', monospace; font-size: 12px; font-weight: 700; color: var(--blue); }
.truncate { max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wrap-msg { max-width: 460px; white-space: normal; word-break: break-word; line-height: 1.5; }
.row-actions { display: flex; gap: 6px; }
.icon-btn { background: none; border: none; color: var(--text3); cursor: pointer; padding: 4px; border-radius: 4px; transition: all 0.15s; }
.icon-btn:hover { background: var(--bg3); color: var(--text); }
.icon-btn.danger:hover { background: var(--red-dim); color: var(--red); }

/* Input */
.form-group { margin-bottom: 14px; }
.form-label { font-size: 12px; font-weight: 600; color: var(--text2); margin-bottom: 6px; display: block; }
.form-input {
  width: 100%; padding: 9px 12px; background: var(--bg3); border: 1px solid var(--border);
  border-radius: 7px; color: var(--text); font-size: 13px; outline: none; font-family: inherit;
}
.form-input:focus { border-color: var(--blue); }
.form-textarea { min-height: 80px; resize: vertical; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* Toast */
.toast {
  position: fixed; bottom: 24px; right: 24px; z-index: 9999;
  background: var(--bg2); border: 1px solid var(--border); border-radius: 10px;
  padding: 12px 16px; font-size: 13px; display: flex; align-items: center; gap: 8px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4); transform: translateY(80px); opacity: 0;
  transition: all 0.3s; pointer-events: none; min-width: 240px;
  max-width: min(320px, calc(100vw - 48px)); word-break: break-word;
}
.toast.show { transform: translateY(0); opacity: 1; }
.toast.success { border-color: var(--green); }
.toast.error { border-color: var(--red); }

/* Spinner inline */
.spin { animation: spin 0.8s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }

.loading-row { text-align: center; padding: 32px; color: var(--text3); }

@media (max-width: 768px) {
  .sidebar { display: none; }
  .main { margin-left: 0; }
}

/* Login overlay */
.login-overlay {
  position: fixed; inset: 0; background: var(--bg); z-index: 10000;
  display: flex; align-items: center; justify-content: center;
}
.login-box {
  background: var(--bg2); border: 1px solid var(--border); border-radius: 16px;
  padding: 40px 36px; width: 360px; max-width: 90vw;
}
.login-logo { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
.login-sub { font-size: 13px; color: var(--text3); margin-bottom: 28px; }
.login-error { font-size: 12px; color: var(--red); margin-top: 10px; min-height: 18px; }

/* Auth modal — index.html/analysis.html/portfolio.html과 동일한 로그인 UI로 통일 */
.auth-logo { font-size: 15px; font-weight: 800; color: var(--text2); margin-bottom: 14px; }
.auth-logo span { color: var(--blue); }
.auth-title { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
.auth-sub { font-size: 13px; color: var(--text3); margin-bottom: 18px; }
.auth-btn-google {
  width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;
  padding: 11px; border: 1px solid var(--border-strong); border-radius: 10px;
  background: #fff; color: #0a0a0a; font-size: 14px; font-weight: 600; cursor: pointer;
  transition: background .15s;
}
.auth-btn-google:hover { background: var(--bg3); }
.auth-divider { display: flex; align-items: center; gap: 10px; margin: 18px 0; font-size: 12px; color: var(--text3); }
.auth-divider::before, .auth-divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.auth-field { text-align: left; margin-bottom: 12px; }
.auth-field label { display: block; font-size: 12px; font-weight: 600; color: var(--text2); margin-bottom: 5px; }
.auth-input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 9px; background: var(--bg2); font-size: 14px; font-family: inherit; color: var(--text); }
.auth-input:focus { border-color: var(--blue); outline: none; }
.auth-submit-btn {
  width: 100%; padding: 11px; border: none; border-radius: 10px; margin-top: 4px;
  background: var(--blue); color: #fff; font-size: 14px; font-weight: 700; cursor: pointer;
}
.auth-submit-btn:hover { background: #0052a3; }
.auth-error { font-size: 12px; color: var(--red); min-height: 16px; margin-bottom: 4px; text-align: left; }
.auth-switch { text-align: center; font-size: 12.5px; color: var(--text3); margin-top: 16px; }
.auth-link { background: none; border: none; color: var(--blue); font-weight: 600; cursor: pointer; font-size: inherit; padding: 0; }
</style>
</head>
<body>

<div class="login-overlay" id="loginOverlay" style="display:none">
  <div class="login-box">
    <div class="auth-logo">Stock<span>Ripple</span></div>
    <div class="auth-title">로그인</div>
    <div class="auth-sub">관리자 계정만 접근할 수 있습니다.</div>

    <button type="button" class="auth-btn-google" onclick="adminSignInGoogle()">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Google로 계속하기
    </button>
    <div class="auth-divider"><span>이메일로 계속하기</span></div>
    <form id="loginSbForm" autocomplete="off" onsubmit="event.preventDefault();doLoginSb()">
      <input type="text" name="fakeu" style="display:none" autocomplete="username" tabindex="-1">
      <input type="password" name="fakep" style="display:none" autocomplete="new-password" tabindex="-1">
      <div class="auth-field">
        <label for="sbEmail">이메일</label>
        <input type="email" id="sbEmail" class="auth-input" placeholder="example@email.com" required
          autocomplete="off" name="ae_${Date.now()}" readonly onfocus="this.removeAttribute('readonly')">
      </div>
      <div class="auth-field">
        <label for="sbPassword" id="sbPassLabel">비밀번호</label>
        <input type="password" id="sbPassword" class="auth-input" placeholder="6자 이상" required minlength="6"
          autocomplete="new-password" name="ap_${Date.now()}" readonly onfocus="this.removeAttribute('readonly')">
      </div>
      <div class="auth-error" id="loginError"></div>
      <button type="submit" id="loginSbSubmitBtn" class="auth-submit-btn">로그인</button>
    </form>
    <div class="auth-switch" id="loginSwitchText">
      계정이 없나요? <button type="button" onclick="switchAdminAuthMode('signup')" class="auth-link">회원가입</button>
    </div>
  </div>
</div>

<!-- 로그인 인증된 사용자에게만 /api/admin-shell 에서 받아와 채워짐 (view-source 노출 방지) -->
<div id="appRoot"></div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<script>
const SUPABASE_URL = 'https://nmvfffzpkqyzztiobwtt.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_22PPW0eCY3Tvy3vZVZYKFw_yCb8cI2f';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// 대시보드 본체(nav+패널 HTML)와 업무 로직(JS: panels 라벨/showPanel/runPipeline 등
// 전부)을 인증된 API에서 받아와 각각 #appRoot / 동적 <script>로 주입한다.
// 로그인 전에는 이 마크업·로직이 DOM/소스 어디에도 존재하지 않는다.
//
// 이메일 화이트리스트 검사도 여기서만 함 — 클라이언트에 허용 이메일 목록을
// 따로 두지 않는다. 서버(lib/auth.js ADMIN_EMAILS)가 유일한 판단 주체이고,
// /api/admin-shell·/api/admin-logic이 401을 주면 그게 곧 "권한 없음"이다
// (두 소스가 어긋날 일이 없고, view-source에 이메일 주소가 남지도 않는다).
// 반환값: 'ok' | 'unauthorized' | 'error'
let _shellLoaded = false;
async function loadDashboardShell() {
  if (_shellLoaded) return 'ok';
  const token = await getAuthToken();
  if (!token) return 'error';
  try {
    const [htmlRes, jsRes] = await Promise.all([
      fetch('/api/admin-shell', { headers: { Authorization: `Bearer ${token}` } }),
      fetch('/api/admin-logic', { headers: { Authorization: `Bearer ${token}` } }),
    ]);
    if (htmlRes.status === 401 || jsRes.status === 401) return 'unauthorized';
    if (!htmlRes.ok || !jsRes.ok) return 'error';
    const [html, js] = await Promise.all([htmlRes.text(), jsRes.text()]);
    document.getElementById('appRoot').innerHTML = html;
    // innerHTML로 넣은 <script>는 실행되지 않으므로, 업무 로직은 별도 <script>
    // 엘리먼트를 만들어 붙여야 실제로 실행된다 (전역 스코프 공유, onclick에서
    // 참조하는 함수들도 이 시점 이후 전부 정상 정의됨)
    const scriptEl = document.createElement('script');
    scriptEl.textContent = js;
    document.body.appendChild(scriptEl);
    document.querySelectorAll('[data-panel]').forEach(btn => {
      btn.addEventListener('click', () => showPanel(btn.dataset.panel));
    });
    _shellLoaded = true;
    return 'ok';
  } catch { return 'error'; }
}

function showAdminLoginError(msg) {
  const el = document.getElementById('loginError');
  if (el) { el.style.color = 'var(--red)'; el.textContent = msg; }
}

async function adminSignInGoogle() {
  await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + '/admin/' } });
}

let _adminAuthMode = 'signin';
function switchAdminAuthMode(mode) {
  _adminAuthMode = mode;
  const isSignIn = mode === 'signin';
  document.querySelector('.auth-title').textContent = isSignIn ? '로그인' : '회원가입';
  document.getElementById('sbPassLabel').textContent = isSignIn ? '비밀번호' : '비밀번호 (6자 이상)';
  document.getElementById('loginSbSubmitBtn').textContent = isSignIn ? '로그인' : '가입하기';
  document.getElementById('loginSwitchText').innerHTML = isSignIn
    ? `계정이 없나요? <button type="button" onclick="switchAdminAuthMode('signup')" class="auth-link">회원가입</button>`
    : `이미 계정이 있나요? <button type="button" onclick="switchAdminAuthMode('signin')" class="auth-link">로그인</button>`;
  document.getElementById('loginError').textContent = '';
}

async function doLoginSb() {
  const email = document.getElementById('sbEmail').value.trim();
  const password = document.getElementById('sbPassword').value;
  const errEl = document.getElementById('loginError');
  errEl.style.color = 'var(--red)';
  errEl.textContent = '';
  if (!email || !password) { errEl.textContent = '이메일과 비밀번호 입력'; return; }
  const { data, error } = _adminAuthMode === 'signin'
    ? await sb.auth.signInWithPassword({ email, password })
    : await sb.auth.signUp({ email, password });
  if (error) { errEl.textContent = error.message; return; }
  if (_adminAuthMode === 'signup') {
    errEl.style.color = 'var(--green)';
    errEl.textContent = '가입 완료! 이메일 인증 후 로그인해주세요.';
    return;
  }
  if (!data?.session?.access_token) { errEl.textContent = '로그인 실패'; return; }
  const result = await loadDashboardShell();
  if (result === 'unauthorized') { await sb.auth.signOut(); errEl.textContent = '관리자 권한이 없는 계정입니다'; return; }
  if (result !== 'ok') { errEl.textContent = '대시보드 로드 실패 — 새로고침 후 다시 시도해주세요'; return; }
  document.getElementById('loginOverlay').style.display = 'none';
  loadDashStats();
  loadFeatureFlags();
  initPresenceWatch();
}

// 통합 인증 토큰 — Supabase 세션 우선, 없으면 ADMIN_SECRET(자동화용, UI에는 입력창 없음)
async function getAuthToken() {
  const { data } = await sb.auth.getSession();
  if (data?.session?.access_token) return data.session.access_token;
  return sessionStorage.getItem('sr_admin_secret') || null;
}

// 페이지 로드 시 인증 확인 — Supabase 세션 또는 ADMIN_SECRET(자동화) 둘 중 하나면 시도.
// 실제 통과 여부는 loadDashboardShell()의 서버 응답(401 여부)으로만 판단한다.
(async () => {
  const { data } = await sb.auth.getSession();
  const hasSecret = !!sessionStorage.getItem('sr_admin_secret');
  if (!data?.session?.access_token && !hasSecret) {
    document.getElementById('loginOverlay').style.display = 'flex';
    setTimeout(() => document.getElementById('sbEmail').focus(), 100);
    return;
  }
  const result = await loadDashboardShell();
  if (result === 'unauthorized') {
    if (data?.session) await sb.auth.signOut();
    document.getElementById('loginOverlay').style.display = 'flex';
    showAdminLoginError('관리자 권한이 없는 계정입니다');
    return;
  }
  if (result !== 'ok') {
    document.getElementById('loginOverlay').style.display = 'flex';
    showAdminLoginError('대시보드 로드 실패 — 새로고침 후 다시 시도해주세요');
    return;
  }
  loadDashStats();
  loadFeatureFlags();
  initPresenceWatch();
})();
</script>
</body>
</html>
