<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리자 — StockRipple</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #ffffff; --bg2: #f6f6f8; --bg3: #ececf0; --bg4: #dededf;
  --border: #e5e5ea; --border-strong: #c4c4c9; --border-soft: rgba(0,0,0,0.06);
  --text: #0a0a0a; --text2: #4b4b52; --text3: #86868b;
  --blue: #0066cc; --green: #00873a; --red: #e31937; --yellow: #b8860b;
  --blue-dim: rgba(0,102,204,0.10); --green-dim: rgba(0,135,58,0.10); --red-dim: rgba(227,25,55,0.10);
  --shadow-card: 0 1px 3px rgba(0,0,0,0.04), 0 8px 24px rgba(0,0,0,0.06);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; }

/* Sidebar */
.sidebar {
  width: 220px; flex-shrink: 0; background: var(--bg2); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; position: fixed; top: 0; left: 0; height: 100vh; z-index: 100;
}
.sidebar-logo { padding: 20px 16px; border-bottom: 1px solid var(--border); }
.sidebar-logo .site-name { font-size: 16px; font-weight: 700; }
.sidebar-logo .site-sub { font-size: 11px; color: var(--text3); margin-top: 2px; }
.sidebar-nav { padding: 12px 8px; flex: 1; overflow-y: auto; }
.nav-section { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.8px; padding: 8px 8px 4px; font-weight: 600; }
.nav-item {
  display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 6px;
  cursor: pointer; font-size: 13px; color: var(--text2); transition: all 0.15s; margin-bottom: 2px;
  background: none; border: none; width: 100%; text-align: left;
}
.nav-item:hover { background: var(--bg3); color: var(--text); }
.nav-item.active { background: var(--bg3); color: var(--text); }
.nav-item svg { flex-shrink: 0; }
.sidebar-footer { padding: 12px 16px; border-top: 1px solid var(--border); }
.back-link { font-size: 12px; color: var(--text3); text-decoration: none; display: flex; align-items: center; gap: 6px; }
.back-link:hover { color: var(--blue); }

/* Main */
.main { margin-left: 220px; flex: 1; min-height: 100vh; }
.topbar {
  background: rgba(255,255,255,0.85); backdrop-filter: blur(12px) saturate(180%); border-bottom: 1px solid var(--border);
  padding: 0 24px; display: flex; align-items: center; gap: 16px; height: 56px;
  position: sticky; top: 0; z-index: 50;
}
.topbar-title { font-size: 15px; font-weight: 600; }
.topbar-sub { font-size: 12px; color: var(--text3); }
.spacer { flex: 1; }
.btn {
  padding: 7px 16px; border-radius: 7px; font-size: 13px; font-weight: 600;
  border: none; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all 0.15s;
}
.btn-primary { background: var(--blue); color: #fff; }
.btn-primary:hover { background: #0052a3; }
.btn-success { background: var(--green-dim); color: var(--green); border: 1px solid rgba(0,135,58,0.25); }
.btn-success:hover { background: rgba(0,135,58,0.18); }
.btn-warn { background: rgba(184,134,11,0.12); color: var(--yellow); border: 1px solid rgba(184,134,11,0.30); }
.btn-warn:hover { background: rgba(184,134,11,0.20); }
.btn-danger { background: var(--red-dim); color: var(--red); border: 1px solid rgba(227,25,55,0.25); }
.btn-danger:hover { background: #5a2020; }
.btn-ghost { background: var(--bg3); color: var(--text2); border: 1px solid var(--border); }
.btn-ghost:hover { color: var(--text); border-color: var(--text2); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

.content { padding: 24px; }

/* Panel sections */
.panel-section { display: none; }
.panel-section.active { display: block; }
.section-header { margin-bottom: 20px; }
.section-header h2 { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
.section-header p { font-size: 13px; color: var(--text2); }

/* Cards */
.card { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 16px; }
.card-title { font-size: 14px; font-weight: 600; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
.card-title svg { color: var(--text3); }

/* Action Row */
.action-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
.label-row { font-size: 12px; color: var(--text3); }

/* Log Box */
.log-box {
  background: #0a0a0a; border: 1px solid var(--border); border-radius: 8px;
  padding: 12px 14px; font-family: 'SF Mono', 'Fira Code', monospace; font-size: 12px;
  color: #a8b5c1; max-height: 200px; overflow-y: auto; line-height: 1.7;
}
.log-box .log-ok { color: var(--green); }
.log-box .log-err { color: var(--red); }
.log-box .log-info { color: var(--blue); }
.log-box .log-warn { color: var(--yellow); }

/* Stats grid */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; margin-bottom: 20px; }
.stat-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
.stat-label { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
.stat-value { font-size: 28px; font-weight: 700; }
.stat-value.blue { color: var(--blue); }
.stat-value.green { color: var(--green); }
.stat-value.yellow { color: var(--yellow); }

/* Table */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; padding: 8px 12px; font-size: 11px; color: var(--text3); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--border); }
td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: var(--bg3); }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 4px; }
.badge-green { background: var(--green-dim); color: var(--green); }
.badge-yellow { background: rgba(184,134,11,0.12); color: var(--yellow); }
.badge-red { background: var(--red-dim); color: var(--red); }
.badge-blue { background: var(--blue-dim); color: var(--blue); }
.badge-gray { background: var(--bg3); color: var(--text2); }
.ticker-cell { font-family: 'SF Mono', monospace; font-size: 12px; font-weight: 700; color: var(--blue); }
.truncate { max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-actions { display: flex; gap: 6px; }
.icon-btn { background: none; border: none; color: var(--text3); cursor: pointer; padding: 4px; border-radius: 4px; transition: all 0.15s; }
.icon-btn:hover { background: var(--bg3); color: var(--text); }
.icon-btn.danger:hover { background: var(--red-dim); color: var(--red); }

/* Input */
.form-group { margin-bottom: 14px; }
.form-label { font-size: 12px; font-weight: 600; color: var(--text2); margin-bottom: 6px; display: block; }
.form-input {
  width: 100%; padding: 9px 12px; background: var(--bg3); border: 1px solid var(--border);
  border-radius: 7px; color: var(--text); font-size: 13px; outline: none; font-family: inherit;
}
.form-input:focus { border-color: var(--blue); }
.form-textarea { min-height: 80px; resize: vertical; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* Toast */
.toast {
  position: fixed; bottom: 24px; right: 24px; z-index: 9999;
  background: var(--bg2); border: 1px solid var(--border); border-radius: 10px;
  padding: 12px 16px; font-size: 13px; display: flex; align-items: center; gap: 8px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4); transform: translateY(80px); opacity: 0;
  transition: all 0.3s; pointer-events: none; min-width: 240px;
}
.toast.show { transform: translateY(0); opacity: 1; }
.toast.success { border-color: var(--green); }
.toast.error { border-color: var(--red); }

/* Spinner inline */
.spin { animation: spin 0.8s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }

.loading-row { text-align: center; padding: 32px; color: var(--text3); }

@media (max-width: 768px) {
  .sidebar { display: none; }
  .main { margin-left: 0; }
}

/* Login overlay */
.login-overlay {
  position: fixed; inset: 0; background: var(--bg); z-index: 10000;
  display: flex; align-items: center; justify-content: center;
}
.login-box {
  background: var(--bg2); border: 1px solid var(--border); border-radius: 16px;
  padding: 40px 36px; width: 360px; max-width: 90vw;
}
.login-logo { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
.login-sub { font-size: 13px; color: var(--text3); margin-bottom: 28px; }
.login-error { font-size: 12px; color: var(--red); margin-top: 10px; min-height: 18px; }

/* Auth modal — index.html/analysis.html/portfolio.html과 동일한 로그인 UI로 통일 */
.auth-logo { font-size: 15px; font-weight: 800; color: var(--text2); margin-bottom: 14px; }
.auth-logo span { color: var(--blue); }
.auth-title { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
.auth-sub { font-size: 13px; color: var(--text3); margin-bottom: 18px; }
.auth-btn-google {
  width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;
  padding: 11px; border: 1px solid var(--border-strong); border-radius: 10px;
  background: #fff; color: #0a0a0a; font-size: 14px; font-weight: 600; cursor: pointer;
  transition: background .15s;
}
.auth-btn-google:hover { background: var(--bg3); }
.auth-divider { display: flex; align-items: center; gap: 10px; margin: 18px 0; font-size: 12px; color: var(--text3); }
.auth-divider::before, .auth-divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.auth-field { text-align: left; margin-bottom: 12px; }
.auth-field label { display: block; font-size: 12px; font-weight: 600; color: var(--text2); margin-bottom: 5px; }
.auth-input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 9px; background: var(--bg2); font-size: 14px; font-family: inherit; color: var(--text); }
.auth-input:focus { border-color: var(--blue); outline: none; }
.auth-submit-btn {
  width: 100%; padding: 11px; border: none; border-radius: 10px; margin-top: 4px;
  background: var(--blue); color: #fff; font-size: 14px; font-weight: 700; cursor: pointer;
}
.auth-submit-btn:hover { background: #0052a3; }
.auth-error { font-size: 12px; color: var(--red); min-height: 16px; margin-bottom: 4px; text-align: left; }
.auth-switch { text-align: center; font-size: 12.5px; color: var(--text3); margin-top: 16px; }
.auth-link { background: none; border: none; color: var(--blue); font-weight: 600; cursor: pointer; font-size: inherit; padding: 0; }
</style>
</head>
<body>

<div class="login-overlay" id="loginOverlay" style="display:none">
  <div class="login-box">
    <div class="auth-logo">Stock<span>Ripple</span></div>
    <div class="auth-title">로그인</div>
    <div class="auth-sub">관리자 계정만 접근할 수 있습니다.</div>

    <button type="button" class="auth-btn-google" onclick="adminSignInGoogle()">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Google로 계속하기
    </button>
    <div class="auth-divider"><span>이메일로 계속하기</span></div>
    <form id="loginSbForm" autocomplete="off" onsubmit="event.preventDefault();doLoginSb()">
      <input type="text" name="fakeu" style="display:none" autocomplete="username" tabindex="-1">
      <input type="password" name="fakep" style="display:none" autocomplete="new-password" tabindex="-1">
      <div class="auth-field">
        <label for="sbEmail">이메일</label>
        <input type="email" id="sbEmail" class="auth-input" placeholder="example@email.com" required
          autocomplete="off" name="ae_${Date.now()}" readonly onfocus="this.removeAttribute('readonly')">
      </div>
      <div class="auth-field">
        <label for="sbPassword" id="sbPassLabel">비밀번호</label>
        <input type="password" id="sbPassword" class="auth-input" placeholder="6자 이상" required minlength="6"
          autocomplete="new-password" name="ap_${Date.now()}" readonly onfocus="this.removeAttribute('readonly')">
      </div>
      <div class="auth-error" id="loginError"></div>
      <button type="submit" id="loginSbSubmitBtn" class="auth-submit-btn">로그인</button>
    </form>
    <div class="auth-switch" id="loginSwitchText">
      계정이 없나요? <button type="button" onclick="switchAdminAuthMode('signup')" class="auth-link">회원가입</button>
    </div>
  </div>
</div>

<!-- 로그인 인증된 사용자에게만 /api/admin-shell 에서 받아와 채워짐 (view-source 노출 방지) -->
<div id="appRoot"></div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<script>
const SUPABASE_URL = 'https://nmvfffzpkqyzztiobwtt.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_22PPW0eCY3Tvy3vZVZYKFw_yCb8cI2f';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const panels = { dashboard: '대시보드', news: '뉴스 수집', analyze: 'AI 분석', issues: '이슈 목록', companies: '기업 데이터', investments: '🌟 전략투자', accuracy: '예측 정확도', backtest: '통계 + 백테스트', reanalyze: '재분석 (구→신)', settings: 'API 키 설정' };

function showPanel(name) {
  document.querySelectorAll('.panel-section').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
  document.getElementById(`panel-${name}`)?.classList.add('active');
  document.querySelector(`[data-panel="${name}"]`)?.classList.add('active');
  document.getElementById('topbarTitle').textContent = panels[name] || name;

  if (name === 'dashboard') loadDashStats();
  if (name === 'issues') loadIssuesTable();
  if (name === 'companies') loadCompaniesTable();
  if (name === 'accuracy') loadAccuracy();
  if (name === 'backtest' && !window._btLoaded) { window._btLoaded = true; loadBacktest(); }
  if (name === 'investments') invLoad();
}

// panels 라벨도 추가
window._panelsExtra = { investments: '🌟 전략투자 관리' };

// 대시보드 본체(nav+패널)를 인증된 API(/api/admin-shell)에서 받아와 #appRoot에 주입.
// 로그인 전에는 이 마크업이 DOM/소스 어디에도 존재하지 않는다 (view-source 노출 방지).
let _shellLoaded = false;
async function loadDashboardShell() {
  if (_shellLoaded) return true;
  const token = await getAuthToken();
  if (!token) return false;
  try {
    const res = await fetch('/api/admin-shell', { headers: { Authorization: `Bearer ${token}` } });
    if (!res.ok) return false;
    document.getElementById('appRoot').innerHTML = await res.text();
    document.querySelectorAll('[data-panel]').forEach(btn => {
      btn.addEventListener('click', () => showPanel(btn.dataset.panel));
    });
    _shellLoaded = true;
    return true;
  } catch { return false; }
}

// 어드민 페이지 접근 화이트리스트 — 실제 권한 검증은 서버(lib/auth.js ADMIN_EMAILS)에서
// 하므로 이건 UX 가드일 뿐이지만, 화이트리스트 밖 계정은 여기서 즉시 로그아웃시켜
// 대시보드 화면 자체가 보이지 않도록 한다. 관리자를 추가하려면 서버 env(ADMIN_EMAILS)와
// 이 배열을 함께 갱신할 것.
const ADMIN_ALLOWED_EMAILS = ['tjdrb8423@gmail.com'];

function showAdminLoginError(msg) {
  const el = document.getElementById('loginError');
  if (el) { el.style.color = 'var(--red)'; el.textContent = msg; }
}

// 세션은 있지만 화이트리스트 밖 이메일이면 로그아웃 처리 후 false 반환
async function enforceAdminEmail(email) {
  if (email && ADMIN_ALLOWED_EMAILS.includes(email.toLowerCase())) return true;
  await sb.auth.signOut();
  document.getElementById('loginOverlay').style.display = 'flex';
  showAdminLoginError(`관리자 권한이 없는 계정입니다${email ? ` (${email})` : ''}`);
  return false;
}

async function adminSignInGoogle() {
  await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + '/admin/' } });
}

let _adminAuthMode = 'signin';
function switchAdminAuthMode(mode) {
  _adminAuthMode = mode;
  const isSignIn = mode === 'signin';
  document.querySelector('.auth-title').textContent = isSignIn ? '로그인' : '회원가입';
  document.getElementById('sbPassLabel').textContent = isSignIn ? '비밀번호' : '비밀번호 (6자 이상)';
  document.getElementById('loginSbSubmitBtn').textContent = isSignIn ? '로그인' : '가입하기';
  document.getElementById('loginSwitchText').innerHTML = isSignIn
    ? `계정이 없나요? <button type="button" onclick="switchAdminAuthMode('signup')" class="auth-link">회원가입</button>`
    : `이미 계정이 있나요? <button type="button" onclick="switchAdminAuthMode('signin')" class="auth-link">로그인</button>`;
  document.getElementById('loginError').textContent = '';
}

async function doLoginSb() {
  const email = document.getElementById('sbEmail').value.trim();
  const password = document.getElementById('sbPassword').value;
  const errEl = document.getElementById('loginError');
  errEl.style.color = 'var(--red)';
  errEl.textContent = '';
  if (!email || !password) { errEl.textContent = '이메일과 비밀번호 입력'; return; }
  const { data, error } = _adminAuthMode === 'signin'
    ? await sb.auth.signInWithPassword({ email, password })
    : await sb.auth.signUp({ email, password });
  if (error) { errEl.textContent = error.message; return; }
  if (_adminAuthMode === 'signup') {
    errEl.style.color = 'var(--green)';
    errEl.textContent = '가입 완료! 이메일 인증 후 로그인해주세요.';
    return;
  }
  if (!data?.session?.access_token) { errEl.textContent = '로그인 실패'; return; }
  if (!(await enforceAdminEmail(data.session.user?.email))) return;
  if (!(await loadDashboardShell())) { errEl.textContent = '대시보드 로드 실패 — 새로고침 후 다시 시도해주세요'; return; }
  document.getElementById('loginOverlay').style.display = 'none';
  loadDashStats();
  initPresenceWatch();
}

// 통합 인증 토큰 — Supabase 세션 우선, 없으면 ADMIN_SECRET(자동화용, UI에는 입력창 없음)
async function getAuthToken() {
  const { data } = await sb.auth.getSession();
  if (data?.session?.access_token) return data.session.access_token;
  return sessionStorage.getItem('sr_admin_secret') || null;
}

// ── 실시간 접속자 현황 (Supabase Realtime Presence) ───────────────
// 공개 페이지(index.html/company.html/analysis.html)가 'site-presence' 채널에
// track()으로 자신을 등록하고, 여기서는 track 없이 구독만 해서 그 상태를 관찰한다
// (관리자 본인의 admin 페이지 접속은 방문자 수에 포함되지 않음).
let _presenceCh = null;
function initPresenceWatch() {
  if (_presenceCh) return;
  _presenceCh = sb.channel('site-presence');
  _presenceCh.on('presence', { event: 'sync' }, () => {
    const state = _presenceCh.presenceState();
    const keys = Object.keys(state);
    const el = document.getElementById('ds-live-visitors');
    if (el) el.textContent = keys.length;
    const pages = {};
    for (const k of keys) {
      const p = state[k]?.[0]?.page || '?';
      pages[p] = (pages[p] || 0) + 1;
    }
    const pagesEl = document.getElementById('ds-live-pages');
    if (pagesEl) {
      const sorted = Object.entries(pages).sort((a, b) => b[1] - a[1]);
      pagesEl.innerHTML = sorted.length
        ? sorted.map(([p, n]) => `${escHtml(p)} · ${n}명`).join('<br>')
        : '접속자 없음';
    }
  });
  _presenceCh.subscribe();
}

function log(elId, msg, type = '') {
  const el = document.getElementById(elId);
  if (!el) return;
  el.style.display = 'block';
  const cls = { ok: 'log-ok', err: 'log-err', info: 'log-info', warn: 'log-warn' }[type] || '';
  el.innerHTML += `<div class="${cls}">${new Date().toLocaleTimeString('ko-KR')} ${escHtml(msg)}</div>`;
  el.scrollTop = el.scrollHeight;
}

async function callApi(path, body, logId, authMode = 'ADMIN') {
  const token = await getAuthToken();
  if (!token) { showToast('로그인이 필요합니다', 'error'); return null; }

  try {
    const res = await fetch(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
      body: body && Object.keys(body).length ? JSON.stringify(body) : undefined,
    });
    const data = await res.json();
    if (!res.ok) { log(logId, `오류: ${data.error || res.status}`, 'err'); return null; }
    return data;
  } catch(e) { log(logId, `네트워크 오류: ${e.message}`, 'err'); return null; }
}

// 2-패스 애널리스트 파이프라인 배포 시각 — 구형/신형 구간 분리 기준
const PIPELINE_V2_AT = '2026-07-02T13:43';

async function loadAccuracy() {
  const periods = ['1d', '3d', '7d', '30d'];

  for (const p of periods) {
    // count 쿼리 사용: select-rows 방식은 PostgREST 기본 1000행 캡에 걸려 총계가 잘림
    const cnt = (mods) => {
      let q = sb.from('analysis_companies').select('id', { count: 'exact', head: true }).not(`check_date_${p}`, 'is', null);
      return mods ? mods(q) : q;
    };
    const [total, hit, nTotal, nHit] = await Promise.all([
      cnt(),
      cnt(q => q.eq(`is_accurate_${p}`, true)),
      cnt(q => q.gte('entry_date', PIPELINE_V2_AT)),
      cnt(q => q.eq(`is_accurate_${p}`, true).gte('entry_date', PIPELINE_V2_AT)),
    ]);
    document.getElementById(`acc-${p}-total`).textContent = (total.count ?? 0).toLocaleString();
    document.getElementById(`acc-${p}-rate`).textContent = total.count
      ? Math.round((hit.count || 0) / total.count * 100) + '%' : '—';

    const splitEl = document.getElementById(`acc-${p}-split`);
    if (splitEl) {
      if (nTotal.count) {
        const oldT = (total.count || 0) - nTotal.count;
        const oldH = (hit.count || 0) - (nHit.count || 0);
        const newR = Math.round((nHit.count || 0) / nTotal.count * 100);
        splitEl.textContent = `구형 ${oldT ? Math.round(oldH / oldT * 100) + '%' : '—'} (${oldT.toLocaleString()}) → 신형 ${newR}% (${nTotal.count.toLocaleString()})`;
      } else {
        splitEl.textContent = '신형 파이프라인 검증 대기';
      }
    }

    const { data: rows } = await sb.from('analysis_companies')
      .select(`upside_pct, entry_price, check_price_${p}, actual_return_${p}, is_accurate_${p}, companies(ticker, name_ko, currency)`)
      .not(`check_date_${p}`, 'is', null)
      .order('entry_date', { ascending: false }).limit(50);
    renderAccTable(`accuracy${p}Table`, rows, p);
  }
}

function renderAccTable(tbodyId, rows, period) {
  const tbody = document.getElementById(tbodyId);
  const labelMap = { '1d': '1일', '3d': '3일', '7d': '7일', '30d': '30일' };
  if (!rows?.length) { tbody.innerHTML = `<tr><td colspan="7" class="loading-row">아직 데이터 없음 (분석 후 ${labelMap[period]} 경과 시 자동 집계)</td></tr>`; return; }
  const sym = r => r.companies?.currency === 'KRW' ? '₩' : '$';
  tbody.innerHTML = rows.map(r => {
    const ret = r[`actual_return_${period}`];
    const retColor = ret > 0 ? 'var(--green)' : ret < 0 ? 'var(--red)' : 'var(--text2)';
    const acc = r[`is_accurate_${period}`];
    const accBadge = acc == null ? '<span class="badge badge-gray">—</span>'
      : acc ? '<span class="badge badge-green">✓ 적중</span>'
      : '<span class="badge badge-red">✗ 빗나감</span>';
    return `<tr>
      <td class="ticker-cell">${escHtml(r.companies?.ticker || '—')}</td>
      <td>${escHtml(r.companies?.name_ko || '—')}</td>
      <td style="color:var(--green)">+${r.upside_pct ?? '—'}%</td>
      <td style="color:var(--text2)">${r.entry_price ? sym(r) + Number(r.entry_price).toLocaleString() : '—'}</td>
      <td style="color:var(--text2)">${r[`check_price_${period}`] ? sym(r) + Number(r[`check_price_${period}`]).toLocaleString() : '—'}</td>
      <td style="color:${retColor};font-weight:600">${ret != null ? (ret > 0 ? '+' : '') + ret + '%' : '—'}</td>
      <td>${accBadge}</td>
    </tr>`;
  }).join('');
}

let _reanAutoStop = false;
let _reanLiveTimer = null;
function startLiveCounter(label) {
  const start = Date.now();
  stopLiveCounter();
  const live = document.createElement('div');
  live.id = 'reanLiveLine';
  live.style.cssText = 'color:var(--blue);font-weight:600;padding:4px 0';
  document.getElementById('reanLog').appendChild(live);
  const update = () => {
    const sec = Math.round((Date.now() - start) / 1000);
    const dots = '.'.repeat((sec % 4));
    live.textContent = `⏳ ${label} ${sec}초 경과${dots}`;
  };
  update();
  _reanLiveTimer = setInterval(update, 250);
  return start;
}
function stopLiveCounter() {
  if (_reanLiveTimer) { clearInterval(_reanLiveTimer); _reanLiveTimer = null; }
  document.getElementById('reanLiveLine')?.remove();
}

// 회사명 보정
function fnTag(msg, color = 'var(--text2)') {
  const el = document.getElementById('fixNamesLog');
  el.style.display = 'block';
  const div = document.createElement('div');
  div.style.color = color;
  div.textContent = `${new Date().toLocaleTimeString('ko-KR')} ${msg}`;
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
}
function fnRenderResult(result, dryRun) {
  fnTag(`✓ 스캔 ${result.scanned}개 중 ${result.updated}개 변경 ${dryRun ? '예정' : '완료'}`, 'var(--green)');
  (result.updates || []).forEach(u => {
    const before = `[${u.before.ko || '∅'} / ${u.before.en || '∅'}]`;
    const after  = `[${u.after.name_ko || u.before.ko || '∅'} / ${u.after.name_en || u.before.en || '∅'}]`;
    fnTag(`  ${u.ticker}: ${before} → ${after}  ${u.reason ? '(' + u.reason + ')' : ''}`);
  });
  (result.errors || []).slice(0, 5).forEach(e => fnTag(`⚠️ ${e}`, 'var(--red)'));
}

// 실시간 상태 박스 제어
let _fnElapsedTimer = null;
let _fnStop = false;
function fnShowStatus(text) {
  document.getElementById('fnStatus').style.display = 'block';
  document.getElementById('fnStatusText').textContent = text;
}
function fnHideStatus() {
  document.getElementById('fnStatus').style.display = 'none';
  if (_fnElapsedTimer) clearInterval(_fnElapsedTimer);
  _fnElapsedTimer = null;
}
function fnStartElapsed() {
  const start = Date.now();
  if (_fnElapsedTimer) clearInterval(_fnElapsedTimer);
  document.getElementById('fnElapsed').textContent = '0';
  _fnElapsedTimer = setInterval(() => {
    document.getElementById('fnElapsed').textContent = Math.round((Date.now() - start) / 1000);
  }, 250);
}
function fnSetProgress(curr, total) {
  document.getElementById('fnBatchN').textContent = curr;
  document.getElementById('fnBatchT').textContent = total;
  document.getElementById('fnProgBar').style.width = total ? `${Math.min(100, (curr/total)*100)}%` : '0';
}

async function fixNames(dryRun) {
  document.getElementById('fixNamesLog').innerHTML = '';
  fnTag(dryRun ? '🔍 기본 모드 미리보기...' : '🏷️ 기본 모드 실행...', 'var(--blue)');
  fnShowStatus(dryRun ? '기본 미리보기 진행 중...' : '기본 보정 진행 중...');
  fnStartElapsed();
  const result = await callApi('/api/fix-company-names', { dry_run: dryRun }, 'fixNamesLog');
  fnHideStatus();
  if (result) fnRenderResult(result, dryRun);
}

// AI 검증 모드: 작은 배치 자동 반복 + 실시간 상태
async function fixNamesAi(dryRun) {
  const log = document.getElementById('fixNamesLog');
  log.innerHTML = '';
  _fnStop = false;
  const previewBtn = document.getElementById('fnAiPreviewBtn');
  const runBtn     = document.getElementById('fnAiRunBtn');
  const targetBtn  = dryRun ? previewBtn : runBtn;
  const origText = targetBtn.textContent;
  targetBtn.textContent = '🛑 중단';
  targetBtn.onclick = () => { _fnStop = true; fnTag('🛑 중단 요청, 현재 배치 후 종료', 'var(--yellow)'); };
  previewBtn.disabled = dryRun ? false : true;
  runBtn.disabled = dryRun ? true : false;

  const batchSize = Math.max(3, Math.min(20, parseInt(document.getElementById('fnBatchSize').value, 10) || 10));
  fnTag(dryRun ? `🔍 AI 검증 미리보기 (배치 1, ${batchSize}개)` : `🤖 AI 검증 자동 반복 시작 (배치 ${batchSize}개씩)`, 'var(--blue)');
  fnShowStatus('첫 배치 시작...');
  fnStartElapsed();

  let offset = 0;
  let totalUpdated = 0;
  let totalProcessed = 0;
  let totalKnown = null;
  let batch = 1;

  while (!_fnStop) {
    fnShowStatus(`📦 배치 ${batch} 처리 중 (offset ${offset}, ${batchSize}개)...`);
    fnSetProgress(batch - 1, totalKnown ? Math.ceil(totalKnown / batchSize) : '?');
    fnTag(`📦 배치 ${batch} (offset ${offset}, ${batchSize}개)`, 'var(--text3)');

    const result = await callApi('/api/fix-company-names',
      { dry_run: dryRun, ai_verify: true, batch_size: batchSize, batch_offset: offset },
      'fixNamesLog');
    if (!result) { fnTag(`❌ 배치 ${batch} 실패 (네트워크 또는 타임아웃) — 배치 크기 줄여 재시도하세요`, 'var(--red)'); break; }

    if (totalKnown == null) totalKnown = result.total;
    totalProcessed += result.scanned || 0;
    totalUpdated   += result.updated || 0;

    fnRenderResult(result, dryRun);
    if (result.timing) {
      fnTag(`  ⏱ Yahoo ${(result.timing.yhMs/1000).toFixed(1)}s · Claude ${(result.timing.aiMs/1000).toFixed(1)}s · 총 ${(result.timing.totalMs/1000).toFixed(1)}s`, 'var(--text3)');
    }
    fnSetProgress(batch, Math.ceil(totalKnown / batchSize));

    if (dryRun) break;
    if (result.nextOffset == null) {
      fnTag(`🎯 완료: 전체 ${totalUpdated}개 변경 (스캔 ${totalProcessed}/${totalKnown})`, 'var(--green)');
      break;
    }
    offset = result.nextOffset;
    batch++;
    await new Promise(r => setTimeout(r, 800));
  }

  if (_fnStop) fnTag(`🛑 중단됨: ${totalUpdated}개 변경됨, 다음 offset ${offset}`, 'var(--yellow)');
  fnHideStatus();
  targetBtn.textContent = origText;
  targetBtn.onclick = () => (dryRun ? fixNamesAi(true) : fixNamesAi(false));
  previewBtn.disabled = false;
  runBtn.disabled = false;
}

function renderBacktest(d) {
  const o = d.overall || {};

  document.getElementById('btAcc30d').textContent = o.accuracy30d != null ? `${o.accuracy30d}%` : '—';

  const bt = d.backtest || {};
  document.getElementById('btTrades').textContent = (bt.totalTrades || 0).toLocaleString();
  document.getElementById('btWinRate').textContent = `${bt.winRate || 0}%`;
  document.getElementById('btAvgRet').textContent = fmtPctVal(bt.avgReturn);
  const cumColor = (bt.cumulativeReturn || 0) >= 0 ? 'var(--green)' : 'var(--red)';
  const cumEl = document.getElementById('btCumRet');
  cumEl.textContent = fmtPctVal(bt.cumulativeReturn);
  cumEl.style.color = cumColor;
  const cumWeeksEl = document.getElementById('btCumWeeks');
  if (cumWeeksEl) cumWeeksEl.textContent = bt.weeks ? `${bt.weeks}주 리밸런싱` : '';

  // 신뢰도 버킷 테이블
  const confTbody = document.getElementById('btConfTable');
  confTbody.innerHTML = (d.byConfidence || []).map(b => `
    <tr>
      <td><span class="badge ${b.bucket === '80-100' ? 'badge-green' : b.bucket === '60-80' ? 'badge-blue' : 'badge-gray'}">${b.bucket}</span></td>
      <td>${(b.total || 0).toLocaleString()}</td>
      <td style="color:${accColor(b.accuracy7d)}">${b.accuracy7d != null ? b.accuracy7d + '%' : '—'}</td>
      <td style="color:${retColor(b.avgActualReturn7d)}">${fmtPctVal(b.avgActualReturn7d)}</td>
      <td style="color:var(--text2)">${fmtPctVal(b.avgUpside)}</td>
    </tr>
  `).join('');

  // 섹터 테이블
  const sectorTbody = document.getElementById('btSectorTable');
  sectorTbody.innerHTML = (d.bySector || []).map(s => `
    <tr>
      <td>${escHtml(s.sector)}</td>
      <td>${s.total}</td>
      <td style="color:${accColor(s.accuracy7d)}">${s.accuracy7d != null ? s.accuracy7d + '%' : '—'}</td>
      <td style="color:${retColor(s.avgActualReturn7d)}">${fmtPctVal(s.avgActualReturn7d)}</td>
      <td style="color:var(--text2)">${fmtPctVal(s.avgUpside)}</td>
    </tr>
  `).join('');

  // 위너/루저 테이블 (평균 7일 수익률 기준, 승률 표시)
  const renderTickerRow = t => `
    <tr>
      <td><code style="color:${t.market === 'KR' ? '#0066cc' : '#7c3aed'};font-size:11px">${escHtml(t.ticker)}</code></td>
      <td style="font-size:12px">${escHtml(t.name)}</td>
      <td>${t.n}</td>
      <td style="color:${retColor(t.avg)};font-weight:700">${fmtPctVal(t.avg)}</td>
      <td style="color:${accColor(t.winRate)}">${t.winRate != null ? t.winRate + '%' : '—'}</td>
    </tr>`;
  const emptyRow = `<tr><td colspan="5" style="color:var(--text3);text-align:center;padding:14px">3회 이상 추천된 종목이 부족합니다 (분석 누적 필요)</td></tr>`;
  document.getElementById('btWinnersTable').innerHTML = (bt.topWinners || []).length ? bt.topWinners.map(renderTickerRow).join('') : emptyRow;
  document.getElementById('btLosersTable').innerHTML  = (bt.topLosers  || []).length ? bt.topLosers.map(renderTickerRow).join('')  : emptyRow;

  // 기간별 비교
  const bp = bt.byPeriod || {};
  const periodLabel = { '1d': '1일', '7d': '7일', '30d': '30일' };
  const periodTbody = document.getElementById('btPeriodTable');
  periodTbody.innerHTML = ['1d', '7d', '30d'].map(p => {
    const s = bp[p] || {};
    return `
      <tr>
        <td><b>${periodLabel[p]}</b></td>
        <td>${(s.verified || 0).toLocaleString()}</td>
        <td style="color:${accColor(s.accuracy)}">${s.accuracy != null ? s.accuracy + '%' : '—'}</td>
        <td style="color:${accColor(s.winRate)}">${s.winRate != null ? s.winRate + '%' : '—'}</td>
        <td style="color:${retColor(s.avgReturn)}">${fmtPctVal(s.avgReturn)}</td>
      </tr>`;
  }).join('');
}

function accColor(v) {
  if (v == null) return 'var(--text3)';
  if (v >= 70) return 'var(--green)';
  if (v >= 50) return 'var(--yellow)';
  return 'var(--red)';
}
function retColor(v) {
  if (v == null) return 'var(--text3)';
  if (v > 0) return 'var(--green)';
  if (v < 0) return 'var(--red)';
  return 'var(--text2)';
}
function fmtPctVal(v) {
  if (v == null || isNaN(v)) return '—';
  const rounded = Math.round(v * 100) / 100;  // floating point 정리
  return (rounded > 0 ? '+' : '') + rounded.toFixed(2) + '%';
}

let _invPage = 1;

async function invLoad(page = 1) {
  _invPage = page;
  const status = document.getElementById('invStatusFilter').value;
  const q = document.getElementById('invSearch').value.trim();
  const params = new URLSearchParams({ action: 'list-investments', status, page, page_size: _invPageSize });
  if (q) params.set('q', q);

  const box = document.getElementById('invList');
  box.innerHTML = '<div style="color:var(--text3);font-size:13px;padding:20px;text-align:center">불러오는 중...</div>';

  try {
    const r = await fetch('/api/admin?' + params.toString(), {
      headers: { Authorization: 'Bearer ' + (await getAuthToken()) },
    });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'list failed');

    // 티커 셀렉트 옵션 업데이트
    const sel = document.getElementById('invChartTicker');
    const curVal = sel.value;
    sel.innerHTML = '<option value="">티커 선택...</option>' +
      (j.topTickers || []).map(t => `<option value="${t.ticker}" ${t.ticker===curVal?'selected':''}>${t.ticker} · ${t.name||''} (${t.count})</option>`).join('');

    // 목록 렌더
    if (!j.items.length) {
      box.innerHTML = '<div style="color:var(--text3);font-size:13px;padding:30px;text-align:center;background:var(--bg2);border-radius:10px">아직 추출된 항목이 없습니다. "즉시 추출" 또는 "DART 폴링" 버튼을 눌러 시작하세요.</div>';
    } else {
      box.innerHTML = j.items.map(invRowHtml).join('');
    }

    // 페이지네이션
    const totalPages = Math.ceil(j.total / _invPageSize);
    const pg = document.getElementById('invPagination');
    if (totalPages <= 1) { pg.innerHTML = ''; }
    else {
      let html = `<button class="btn btn-ghost" ${_invPage===1?'disabled':''} onclick="invLoad(${_invPage-1})">← 이전</button>`;
      html += `<span style="padding:6px 12px;color:var(--text2);font-size:13px">${_invPage} / ${totalPages} · 총 ${j.total}건</span>`;
      html += `<button class="btn btn-ghost" ${_invPage===totalPages?'disabled':''} onclick="invLoad(${_invPage+1})">다음 →</button>`;
      pg.innerHTML = html;
    }
  } catch (e) {
    box.innerHTML = `<div style="color:var(--red);padding:20px">로드 실패: ${e.message}</div>`;
  }
}

async function invDartPoll() {
  document.getElementById('invStatusBox').textContent = '🔄 DART 폴링 중...';
  try {
    const r = await fetch('/api/admin?action=dart-poll', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + (await getAuthToken()) },
      body: JSON.stringify({ days: 7 }),
    });
    const j = await r.json();
    if (!r.ok) {
      document.getElementById('invStatusBox').textContent = '❌ ' + (j.error || 'DART 실패');
    } else {
      const total = j.scanned;
      const ss = j.skippedSelf || 0, si = j.skippedIndividual || 0, su = j.skippedUnmatched || 0, sm = j.skippedMissing || 0;
      let msg = `✅ DART — 스캔 ${total} / 신규 ${j.new} / 업데이트 ${j.updated} <span style="color:var(--text3)">(${j.period})</span>`;
      msg += `<br><span style="font-size:11px;color:var(--text3)">스킵 분류: 자기지분 ${ss} · 개인주주 ${si} · 미매칭 법인 ${su}${sm ? ' · 필드누락 ' + sm : ''}</span>`;
      if (j.unmatchedReporters?.length) {
        msg += `<br><span style="font-size:11px;color:var(--text3)">⚠️ 미매칭 법인 (companies 테이블에 없음): ${j.unmatchedReporters.slice(0,8).map(escAttr).join(' · ')}${j.unmatchedReporters.length > 8 ? ' ...' : ''}</span>`;
      }
      document.getElementById('invStatusBox').innerHTML = msg;

async function invVerifyKrNames() {
  const mode = confirm('Dry-run으로 먼저 확인할까요?\n\n[확인] dry-run (DB 변경 없이 불일치만 표시)\n[취소] 실제 적용 (DART 공식명으로 자동 보정)');
  document.getElementById('invStatusBox').textContent = '🔄 DART 공식명과 대조 중... (KR 종목 수에 비례 — 30초~)';
  try {
    const r = await fetch('/api/admin?action=verify-kr-names', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + (await getAuthToken()) },
      body: JSON.stringify({ dry_run: mode }),
    });
    const j = await r.json();
    if (!r.ok) { document.getElementById('invStatusBox').textContent = '❌ ' + (j.error || '검증 실패'); return; }
    let msg = `✅ ${j.dry_run ? '[DRY-RUN]' : '[실제 적용]'} 스캔 ${j.scanned} / 일치 ${j.matches} / 불일치 ${j.mismatches} / 수정 ${j.fixed} / 오류 ${j.errors}`;
    if (j.samples?.length) {
      msg += '<br><br><b>불일치 예시:</b><br><div style="font-size:11px;font-family:monospace;background:var(--bg3);padding:8px;border-radius:6px;max-height:200px;overflow-y:auto">' +
        j.samples.map(s => `${s.ticker}: <span style="color:var(--red)">"${escAttr(s.db_name_ko)}"</span> → <span style="color:var(--green)">"${escAttr(s.dart_name_ko)}"</span>`).join('<br>') +
        '</div>';
    }
    document.getElementById('invStatusBox').innerHTML = msg;
  } catch (e) { document.getElementById('invStatusBox').textContent = '❌ ' + e.message; }
}

async function invLoadChart() {
  const ticker = document.getElementById('invChartTicker').value;
  const hint = document.getElementById('invChartHint');
  if (!ticker) { hint.textContent = '상단의 티커를 선택하면 추출 이벤트 누적 추이가 표시됩니다.'; return; }
  hint.textContent = '로딩 중...';

  try {
    const r = await fetch('/api/admin?action=investment-events&ticker=' + encodeURIComponent(ticker));
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'fetch failed');

    const series = j.series || [];
    if (!series.length) {
      hint.textContent = '이 티커의 이벤트가 아직 없습니다.';
      if (_invChart) { _invChart.destroy(); _invChart = null; }
      return;
    }

    const palette = ['#0066cc','#e31937','#00873a','#7c3aed','#b8860b','#06b6d4','#ec4899','#f97316','#84cc16','#a855f7'];
    const datasets = series.slice(0, 10).map((s, i) => ({
      label: s.target,
      data: s.points.map(p => ({ x: p.t, y: p.cumulative })),
      borderColor: palette[i % palette.length],
      backgroundColor: palette[i % palette.length] + '22',
      borderWidth: 2, pointRadius: 3, tension: 0.2, stepped: 'before',
    }));

    const ctx = document.getElementById('invChart');
    if (_invChart) _invChart.destroy();
    _invChart = new Chart(ctx, {
      type: 'line',
      data: { datasets },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { position: 'bottom', labels: { color: '#4b4b52', boxWidth: 12, font: { size: 11 } } },
          tooltip: {
            backgroundColor: '#fff', borderColor: '#e5e5ea', borderWidth: 1,
            titleColor: '#0a0a0a', bodyColor: '#4b4b52',
            callbacks: {
              title: (items) => new Date(items[0].parsed.x).toLocaleString('ko-KR'),
              label: (item) => `${item.dataset.label}: ${item.parsed.y}회`,
            },
          },
        },
        scales: {
          x: {
            type: 'time',
            time: { unit: 'day', displayFormats: { day: 'MM/dd' } },
            ticks: { color: '#86868b', font: { size: 10 } },
            grid: { color: '#e5e5ea' },
          },
          y: {
            beginAtZero: true,
            ticks: { color: '#86868b', font: { size: 10 }, stepSize: 1 },
            grid: { color: '#e5e5ea' },
            title: { display: true, text: '누적 추출 횟수', color: '#4b4b52', font: { size: 11 } },
          },
        },
      },
    });
    hint.textContent = `${ticker}: ${series.length}개 대상, 총 ${j.events.length}개 이벤트`;
  } catch (e) {
    hint.textContent = '❌ ' + e.message;
  }
}

if (typeof escAttr !== 'function') {
  window.escAttr = function(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); };
}
