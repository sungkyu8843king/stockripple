function showMetricInfo(ev, key) {
  ev.preventDefault(); ev.stopPropagation();
  const info = METRIC_INFO[key];
  if (!info) return;
  const pop = document.getElementById('metricPop');
  const cur = _chipData[key];
  const curLine = cur ? `<div class="mp-cur">이 종목 현재: <b>${escHtml(String(cur.val))}</b></div>` : '';
  pop.querySelector('.mp-card').innerHTML = `
    <button class="mp-close" onclick="hideMetricInfo()" aria-label="닫기">✕</button>
    <div class="mp-head"><span class="mp-emoji">${info.emoji}</span><span class="mp-name">${escHtml(info.name)}</span></div>
    ${curLine}
    <div class="mp-sec"><div class="mp-lbl">이게 뭐예요?</div><p>${escHtml(info.what)}</p></div>
    <div class="mp-sec"><div class="mp-lbl">어떻게 읽나요?</div><p>${escHtml(info.read)}</p></div>
    <div class="mp-foot">지표 해설이며 투자 권유가 아니에요.</div>`;
  pop.classList.add('show');
}
function hideMetricInfo(){ const p = document.getElementById('metricPop'); if (p) p.classList.remove('show'); }

let _chipData = {};
function setChip(key, label, val, cls) {
  _chipData[key] = { label, val, cls: cls || '' };
  renderCmpChips();
}
function renderCmpChips() {
  const el = document.getElementById('cmpChips');
  if (!el) return;
  const order = ['avgUpside', 'rsi', 'per', 'pbr', 'roe', 'opMargin', 'debt', 'div', 'foreign'];
  el.innerHTML = order.filter(k => _chipData[k]).map(k => {
    const c = _chipData[k];
    const q = METRIC_INFO[k] ? `<button class="chip-q" onclick="showMetricInfo(event,'${k}')" title="설명 보기">?</button>` : '';
    return `<div class="cmp-chip">${c.label} <b class="${c.cls}">${escHtml(String(c.val))}</b>${q}</div>`;
  }).join('');
}

// ── 판단 히어로: AI 목표가 평균 · 상승여력 채우기 (KR 컨센서스) ──
function hydrateVerdictTarget(mean) {
  if (mean == null) return;
  const tWrap = document.getElementById('verdictTargetWrap');
  const tEl = document.getElementById('verdictTarget');
  const div1 = document.getElementById('verdictDiv1');
  if (tWrap && tEl) { tWrap.style.display = ''; tEl.textContent = Math.round(mean).toLocaleString() + '원'; }
  if (div1) div1.style.display = '';
  if (_currentLivePrice != null) {
    const up = ((mean - _currentLivePrice) / _currentLivePrice) * 100;
    const uWrap = document.getElementById('verdictUpsideWrap');
    const uEl = document.getElementById('verdictUpside');
    if (uWrap && uEl) { uWrap.style.display = ''; uEl.textContent = (up >= 0 ? '+' : '') + up.toFixed(1) + '%'; uEl.className = 'v ' + (up >= 0 ? 'pos' : 'neg'); }
  }
}

// 쿠팡 파트너스 광고 (AI 분석 로딩 영역) — 세 가지 문제를 피해야 한다:
// 1) 스크립트 태그를 HTML 템플릿 리터럴 안에 문자열로 직접 넣으면 브라우저의 HTML
//    파서가(JS 문법을 모른 채) 그 안의 스크립트 종료 태그 문자열을 페이지 전체를
//    감싸는 진짜 메인 스크립트의 종료로 오인해 그 뒤 코드 전부가 텍스트로 노출되던 사고.
// 2) 쿠팡 위젯(g.js)은 레거시 document.write() 방식이라, 페이지 로드가 끝난 뒤
//    document.createElement로 동적 주입하면 브라우저가 document.write를 조용히
//    무시해버려(에러 없이) 광고가 아예 안 뜬다.
// 3) iframe에 srcdoc을 쓰면 진짜 URL이 없어(about:srcdoc) 광고 서버가 리퍼러를
//    검증하다 막힐 수 있다.
// → /coupang-ad-pc.html, /coupang-ad-mobile.html(우리 도메인의 진짜 정적 페이지,
//   실제 script 태그로 작성됨)을 iframe src로 로드해 세 문제를 전부 피한다.
function loadAiPanelAd(container) {
  if (!container || container.dataset.loaded) return;
  container.dataset.loaded = '1';
  const isMobile = window.innerWidth <= 768;
  const iframe = document.createElement('iframe');
  iframe.title = '광고';
  iframe.scrolling = 'no';
  iframe.src = isMobile ? '/coupang-ad-mobile.html' : '/coupang-ad-pc.html';
  iframe.style.cssText = `border:0;width:320px;height:${isMobile ? 100 : 480}px;display:block;margin:10px auto 0;max-width:100%`;
  container.appendChild(iframe);
  const disclosure = document.createElement('div');
  disclosure.style.cssText = 'text-align:center;font-size:13px;color:var(--text3);margin-top:6px';
  disclosure.textContent = '이 포스팅은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.';
  container.appendChild(disclosure);
}

// ── TradingView 차트 ──────────────────────────────────────
let _tvSymbol = '';
let _tvInterval = 'D';

function buildTvSymbol(ticker, market) {
  // 한국 주식: 005930.KS → KRX:005930
  if (/\.KS$/i.test(ticker)) return 'KRX:' + ticker.replace(/\.KS$/i, '');
  if (/\.KQ$/i.test(ticker)) return 'KOSDAQ:' + ticker.replace(/\.KQ$/i, '');
  // 미국 주식: 자동 인식 (대부분 NASDAQ:XXX 또는 NYSE:XXX)
  return ticker;
}

function loadTradingView(interval) {
  _tvInterval = interval;
  const frame = document.getElementById('tvFrame');
  if (!frame || !_tvSymbol) return;
  const sym = encodeURIComponent(_tvSymbol);
  // hide_side_toolbar=0 → 거래량/지표 도구 표시
  frame.src = `https://www.tradingview.com/widgetembed/?symbol=${sym}&interval=${interval}&theme=light&style=1&timezone=Asia%2FSeoul&locale=kr&hide_side_toolbar=0&allow_symbol_change=0&studies=Volume%40tv-basicstudies&save_image=0`;
}

function setTvInterval(interval, btn) {
  document.querySelectorAll('.tv-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  loadTradingView(interval);
}

  // [TRADE] 마커가 있는 가장 최근 분석을 사용
  const withTrade = (records || []).find(r => (r.rationale || '').includes('[TRADE]'));
  const wrap = document.getElementById('tradeBoxWrap');
  if (!withTrade || !wrap) { if (wrap) wrap.innerHTML = ''; return; }

  let trade = null, reason = '';
  try {
    const idx = withTrade.rationale.indexOf('[TRADE]');
    reason = withTrade.rationale.slice(0, idx).trim();
    trade = JSON.parse(withTrade.rationale.slice(idx + 7).trim());
  } catch { return; }

  const fmtP = v => (v > 0 ? '+' : '') + v + '%';
  const tfLabel = { '1w':'단기 1주', '1m':'중기 1개월', '3m':'중장기 3개월', '6m':'장기 6개월' };

  wrap.innerHTML = `
    <div class="section-title" style="margin-top:8px">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      AI 추천 매매 가이드 ${trade.tf ? `<span style="font-size:14.5px;color:var(--blue);font-weight:600;margin-left:6px">${tfLabel[trade.tf] || trade.tf}</span>` : ''}
    </div>
    <div class="trade-box">
      <div class="trade-cell">
        <div class="trade-label">매수가 (현재가 대비)</div>
        <div class="trade-val buy">${trade.elp != null ? fmtP(trade.elp) : '—'} ~ ${trade.ehp != null ? fmtP(trade.ehp) : '—'}</div>
      </div>
      <div class="trade-cell">
        <div class="trade-label">목표</div>
        <div class="trade-val tg">${trade.tp != null ? fmtP(trade.tp) : '—'}</div>
      </div>
      <div class="trade-cell">
        <div class="trade-label">손절</div>
        <div class="trade-val sl">${trade.sl != null ? fmtP(trade.sl) : '—'}</div>
      </div>
    </div>
    ${trade.th ? `<div style="font-size:15.5px;color:var(--green);margin-bottom:6px;line-height:1.55"><b>💡 매수 근거:</b> ${escHtml(trade.th)}</div>` : ''}
    ${trade.rk ? `<div style="font-size:15.5px;color:var(--yellow);margin-bottom:16px;line-height:1.55;font-weight:500"><b>⚠️ 리스크:</b> ${escHtml(trade.rk)}</div>` : ''}
  `;
}

// 보여주는 순수 이력(유사투자자문업 리스크 검토 후 이 형태로 확정, 2026-08).
//
// 이 종목이 언급된 뉴스 타임라인.
//
// 구버전은 analysis_companies를 브라우저에서 직접 조회했는데, 그 테이블의 anon SELECT
// 정책은 2026-07-21에 DROP됐다(유사투자자문업 리스크 대응) — 그래서 이 섹션은 실제로는
// 늘 빈 결과였고 catch가 삼켜 영구히 숨겨져 있었다. 지금은 게이트 대상이 아닌 issues
// 공개 필드(ai_digest / news_analysis)만 쓰는 서버 API를 경유한다.
// ── 📊 전일 동시간 대비 거래량 (2026-08-05) ────────────────────────────
// '오늘의 시세' 카드에 한 칸 추가하고, 누르면 시간대별 누적 차트를 띄운다.
// ⚠️ 전일 '하루 전체'가 아니라 '같은 시각까지'와 비교한다 — 장중에 전일 총량과 비교하면
// 개장 직후엔 늘 -80%대로 찍혀 거래가 죽은 것처럼 보인다(실측). 서버가 그 기준으로 계산해준다.
// company.html은 app.js를 안 쓰는 독립 페이지라, 홈/시장현황의 차트 코드를 여기 복제해
// 뒀다(이 파일의 다른 복제 함수들과 같은 사정 — 로직 수정 시 app.js 쪽도 같이 볼 것).
let _volSeries = null;
let _dailyRows = null;
// Yahoo 5분봉 합산은 장중 진행률을 보여주기엔 충분하지만, 마감 후 최종 비율에는 폐장
// 단일가/블록딜 등이 빠져 있어 실제 거래소 공식 거래량과 어긋난다(실측: 샌디스크 -27.2%
// 실제 vs -28.0% Yahoo봉합산). loadDailyTable()이 이미 Toss 공식 일별 거래량을 받아오므로,
// 두 날 다 마감 완료(_volSeries.complete)일 땐 그 실측치로 배지를 다시 계산해 덮어쓴다.
// loadVolumeCompare/loadDailyTable은 각자 독립 fetch라 어느 쪽이 먼저 끝날지 모르므로
// 양쪽 끝에서 이 함수를 다 호출해 순서 무관하게 정정되도록 한다.
function refineVolBadge() {
  if (!_volSeries?.complete || !_dailyRows || _dailyRows.length < 2) return;
  // ⚠️ 프리장/데이마켓/정규장 진행 중엔 오늘 정규장이 아직 안 끝나 Toss 일별표의 '오늘' 행이
  // 거래량 0에 가깝다 — Yahoo 쪽 today 버킷이 "정규장 데이터가 아직 없어 가장 최근 완료일=
  // 어제"로 잡히면서 _volSeries.complete가 (엉뚱하게) true가 돼 이 함수가 실행되고, 그
  // 텅 빈 '오늘' 행을 어제 전체 거래량과 나눠 -99%대 오탐이 났다(실측, 2026-08-19, 샌디스크
  // 프리장). 오늘 정규장이 실제로 끝난 상태(POST/CLOSED)일 때만 이 실측치를 신뢰한다.
  const sess = _tossQuote?.session;
  if (sess !== 'POST' && sess !== 'CLOSED') return;
  const a = _dailyRows[0], b = _dailyRows[1];
  if (a?.volume == null || b?.volume == null) return;
  const p = (a.volume / b.volume - 1) * 100;
  _volSeries.ratioPct = p; _volSeries.volToday = a.volume; _volSeries.volPrevSame = b.volume;
  const el = document.getElementById('volCmpBadge');
  if (!el || el.style.display === 'none') return;
  const col = p > 0 ? 'var(--red)' : p < 0 ? 'var(--blue)' : 'var(--text2)';
  el.textContent = `거래량 전일 동시간 ${p > 0 ? '+' : ''}${p.toFixed(1)}%`;
  el.style.color = col;
  el.style.borderColor = 'currentColor';
  el.title = `장 마감 · 실측 일별 거래량 기준(${(a.date || '').slice(5)} vs ${(b.date || '').slice(5)}) · 눌러서 차트 보기`;
}
async function loadVolumeCompare(ticker) {
  // ⚠️ 자리 선정 이력(둘 다 실측으로 걸러냄):
  //  1) '📊 오늘의 시세'(buildQuoteCard) 카드 → 그 카드는 #quoteCardWrap을 찾는 setInterval
  //     안에서만 그려지는데 정작 그 컨테이너가 DOM에 없어 한 번도 렌더링된 적 없는 죽은 코드.
  //  2) 상단 스탯바(buildStatBar) 셀 → 7칸이 되면서 표가 2줄로 깨지고 빈 칸이 생김.
  // 그래서 상한/하한 칩과 같은 배지 줄에 타원형 배지로 넣는다.
  const el = document.getElementById('volCmpBadge');
  if (!el || !ticker) return;
  try {
    const r = await fetch(`/api/market-data?source=market-volume&ticker=${encodeURIComponent(ticker)}`);
    const d = await r.json();
    if (!d?.ok || d.ratioPct == null) return;      // 데이터 없으면 배지를 숨긴 채 둔다
    _volSeries = d;
    const p = d.ratioPct;
    const col = p > 0 ? 'var(--red)' : p < 0 ? 'var(--blue)' : 'var(--text2)';
    // 기준 시점을 툴팁에 명시 — 장중이면 KST 시각, 끝났으면 '장 마감'.
    let basis = '';
    if (d.complete) basis = '장 마감';
    else if (d.cutoffTs) {
      const k = new Date((d.cutoffTs + 9 * 3600) * 1000);
      basis = String(k.getUTCHours()).padStart(2, '0') + ':' + String(k.getUTCMinutes()).padStart(2, '0') + ' KST';
    }

function volChartSvg(points) {
  const W = 620, H = 260, PL = 44, PR = 12, PT = 12, PB = 30;
  const iw = W - PL - PR, ih = H - PT - PB;
  const maxE = Math.max(...points.map(p => p.e), 1);
  const maxY = Math.max(100, ...points.map(p => Math.max(p.p, p.t ?? 0))) * 1.06;
  const X = e => PL + (e / maxE) * iw;
  const Y = v => PT + ih - (v / maxY) * ih;
  const path = key => {
    const seg = points.filter(p => p[key] != null);
    if (!seg.length) return '';
    return seg.map((p, i) => `${i ? 'L' : 'M'}${X(p.e).toFixed(1)},${Y(p[key]).toFixed(1)}`).join(' ');
  };
  const grid = [0, 25, 50, 75, 100].filter(v => v <= maxY).map(v => `
    <line x1="${PL}" y1="${Y(v)}" x2="${W - PR}" y2="${Y(v)}" stroke="var(--border)" stroke-width="${v === 100 ? 1.4 : 1}" ${v === 100 ? '' : 'stroke-dasharray="3 3"'}/>
    <text x="${PL - 6}" y="${Y(v) + 4}" text-anchor="end" font-size="10.5" fill="var(--text3)">${v}%</text>`).join('');
  // 마지막 라벨이 직전 것과 40px 안쪽이면 직전 것을 버린다(겹침 방지).
  const step = Math.max(1, Math.floor(points.length / 5));
  const picked = points.filter((_, i) => i % step === 0);
  const lastP = points[points.length - 1];
  if (lastP && picked[picked.length - 1] !== lastP) {
    if (X(lastP.e) - X(picked[picked.length - 1].e) < 40) picked.pop();
    picked.push(lastP);
  }
  const xlab = picked.map(p =>
    `<text x="${X(p.e)}" y="${H - 10}" text-anchor="middle" font-size="10.5" fill="var(--text3)">${p.kst}</text>`).join('');
  const last = [...points].reverse().find(p => p.t != null);
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:520px;height:auto;display:block">
    ${grid}${xlab}
    <path d="${path('p')}" fill="none" stroke="var(--text3)" stroke-width="2" stroke-dasharray="5 4"/>
    <path d="${path('t')}" fill="none" stroke="var(--blue)" stroke-width="2.6"/>
    ${last ? `<circle cx="${X(last.e)}" cy="${Y(last.t)}" r="4" fill="var(--blue)"/>` : ''}
  </svg>`;
}

async function loadOrderbook(ticker) {
  const wrap = document.getElementById('orderbookWrap');
  if (!wrap) return;
  try {
    const r = await fetch(`/api/toss?action=orderbook&symbol=${encodeURIComponent(ticker)}`);
    if (!r.ok) { wrap.innerHTML = '<div class="cmp-empty">호가 정보를 불러올 수 없어요.</div>'; return; }
    const d = await r.json();
    if (!d.ok || (!d.asks.length && !d.bids.length)) { wrap.innerHTML = '<div class="cmp-empty">지금은 호가 데이터가 없어요 (장 마감·휴장 시엔 표시되지 않아요).</div>'; return; }
    wrap.innerHTML = renderOrderbook(d);
  } catch { wrap.innerHTML = '<div class="cmp-empty">호가 정보를 불러올 수 없어요.</div>'; }
}
function renderOrderbook(d) {
  const isKrw = d.currency === 'KRW';
  const fmtP = v => isKrw ? Math.round(v).toLocaleString('ko-KR') : Number(v).toFixed(2);
  const fmtV = v => v >= 1e4 ? Math.round(v / 1e4).toLocaleString() + '만' : Math.round(v).toLocaleString();
  const all = [...d.asks, ...d.bids].map(x => x.volume);
  const maxVol = Math.max(1, ...all);
  const asks = [...d.asks].reverse(); // 높은 가격이 위로
  const askRows = asks.map(a => `
    <div class="ob-row">
      <div class="ob-vol ask"><span class="ob-vnum">${fmtV(a.volume)}</span><div class="ob-bar ask" style="width:${(a.volume / maxVol * 100).toFixed(1)}%"></div></div>
      <div class="ob-price ask">${fmtP(a.price)}</div>
      <div class="ob-vol"></div>
    </div>`).join('');
  const bidRows = d.bids.map(b => `
    <div class="ob-row">
      <div class="ob-vol"></div>
      <div class="ob-price bid">${fmtP(b.price)}</div>
      <div class="ob-vol bid"><div class="ob-bar bid" style="width:${(b.volume / maxVol * 100).toFixed(1)}%"></div><span class="ob-vnum">${fmtV(b.volume)}</span></div>
    </div>`).join('');
  const totAsk = d.asks.reduce((s, a) => s + a.volume, 0);
  const totBid = d.bids.reduce((s, b) => s + b.volume, 0);
  const totAll = totAsk + totBid || 1;
  const bidPct = (totBid / totAll * 100);
  const askPct = 100 - bidPct;
  // 매수/매도 압력 밸런스 — 잔량 비율을 한눈에. 매수잔량이 많으면(빨강) 아래에서 받치는 힘,
  // 매도잔량이 많으면(파랑) 위에서 누르는 힘으로 흔히 해석(절대 신호는 아님).
  const lean = bidPct >= 55 ? '매수 우위' : bidPct <= 45 ? '매도 우위' : '균형';
  const leanCol = bidPct >= 55 ? 'var(--red)' : bidPct <= 45 ? 'var(--blue)' : 'var(--text2)';
  return `
    <div class="ob-card">
      <div class="ob-ladder">
        ${askRows}
        <div class="ob-spread"><span class="ob-spread-lbl">매도호가</span><span class="ob-spread-lbl">매수호가</span></div>
        ${bidRows}
      </div>
      <div class="ob-balance">
        <div class="ob-bal-head">
          <span><em class="bid">매수잔량</em> ${fmtV(totBid)}</span>
          <span class="ob-bal-lean" style="color:${leanCol}">${lean}</span>
          <span><em class="ask">매도잔량</em> ${fmtV(totAsk)}</span>
        </div>
        <div class="ob-bal-track">
          <div class="ob-bal-bid" style="width:${bidPct.toFixed(1)}%">${bidPct >= 12 ? bidPct.toFixed(0) + '%' : ''}</div>
          <div class="ob-bal-ask" style="width:${askPct.toFixed(1)}%">${askPct >= 12 ? askPct.toFixed(0) + '%' : ''}</div>
        </div>
      </div>
    </div>`;
}

async function loadDailyTable(ticker) {
  const wrap = document.getElementById('dailyTableWrap');
  if (!wrap) return;
  try {
    const r = await fetch(`/api/toss?action=daily&symbol=${encodeURIComponent(ticker)}&count=20`);
    if (!r.ok) { wrap.innerHTML = '<div class="cmp-empty">일별 시세를 불러올 수 없어요.</div>'; return; }
    const d = await r.json();
    if (!d.ok || !d.rows.length) { wrap.innerHTML = '<div class="cmp-empty">일별 시세가 없어요.</div>'; return; }
    const isKrw = d.currency === 'KRW';
    const cur = isKrw ? '₩' : '$';
    const fmtP = v => v == null ? '—' : (isKrw ? Math.round(v).toLocaleString('ko-KR') : Number(v).toFixed(2));
    const fmtVol = v => { if (v == null) return '—'; if (v >= 1e8) return (v/1e8).toFixed(1)+'억'; if (v >= 1e4) return Math.round(v/1e4).toLocaleString()+'만'; return v.toLocaleString(); };
    // 스탯바 시가/거래량/거래대금/1일 최저·최고를 최신 거래일(Toss 일별시세) 값으로 덮어씀 —
    // Yahoo는 국내 종목 NXT 프리/애프터장에 0을 주는 경우가 많아(2026-07 실측) 초깃값일 뿐임.
    const today = d.rows[0];
    const setStat = (id, text) => { const el = document.getElementById(id); if (el && text != null) el.textContent = text; };
    setStat('statOpen', today.open != null ? cur + fmtP(today.open) : null);
    setStat('statVolume', today.volume != null ? fmtVol(today.volume) + (isKrw ? '주' : '') : null);
    setStat('statAmount', (today.volume != null && today.close != null) ? fmtMoneyShort(today.volume * today.close, isKrw) : null);
    setStat('statLow', today.low != null ? cur + fmtP(today.low) : null);
    setStat('statHigh', today.high != null ? cur + fmtP(today.high) : null);
    wrap.innerHTML = renderDailyTable(d);
    _dailyRows = d.rows;
    refineVolBadge();
  } catch { wrap.innerHTML = '<div class="cmp-empty">일별 시세를 불러올 수 없어요.</div>'; }
}
function renderDailyTable(d) {
  const isKrw = d.currency === 'KRW';
  const fmtP = v => v == null ? '—' : (isKrw ? Math.round(v).toLocaleString('ko-KR') : Number(v).toFixed(2));
  const fmtV = v => { if (v == null) return '—'; if (v >= 1e8) return (v / 1e8).toFixed(1) + '억'; if (v >= 1e4) return Math.round(v / 1e4).toLocaleString() + '만'; return v.toLocaleString(); };
  const rows = d.rows.map(r => {
    const cls = r.changePercent == null ? '' : r.changePercent > 0 ? 'pos' : r.changePercent < 0 ? 'neg' : '';
    const sign = r.change > 0 ? '+' : '';
    const chgStr = r.change == null ? '—' : `${sign}${fmtP(Math.abs(r.change) * (r.change < 0 ? -1 : 1))}`;
    const pctStr = r.changePercent == null ? '' : `${sign}${r.changePercent.toFixed(2)}%`;
    return `
      <tr>
        <td class="dt-date">${r.date ? r.date.slice(5).replace('-', '.') : '—'}</td>
        <td class="dt-num dt-close">${fmtP(r.close)}</td>
        <td class="dt-num ${cls}">${chgStr}</td>
        <td class="dt-num ${cls}">${pctStr}</td>
        <td class="dt-num dt-dim">${fmtV(r.volume)}</td>
        <td class="dt-num dt-dim">${fmtP(r.open)}</td>
        <td class="dt-num dt-dim">${fmtP(r.high)}</td>
        <td class="dt-num dt-dim">${fmtP(r.low)}</td>
      </tr>`;
  }).join('');
  return `
    <div class="dt-wrap">
      <table class="dt-table">
        <thead><tr><th>일자</th><th class="dt-num">종가</th><th class="dt-num">전일대비</th><th class="dt-num">등락률</th><th class="dt-num">거래량</th><th class="dt-num">시가</th><th class="dt-num">고가</th><th class="dt-num">저가</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

    const sigMap = {

      strong_bearish: { label: '🔵 약세 추세',  color: 'var(--blue)' },

// ── AI 종합 분석 ──────────────────────────────────────────
// 저장된 분석(캐시)이 있으면 내용은 이미 렌더링해두고, 그 위에 쿠팡 배너가 든 잠금
// 오버레이를 덮는다 — 반드시 "배너 자체"를 클릭해야 열린다(오버레이의 빈 공간을
// 눌러서는 안 열림). 배너는 iframe(다른 문서)이라 부모 쪽 클릭 리스너로는 그 안의
// 클릭을 직접 잡을 수 없으므로, coupang-ad-mobile.html이 자기 클릭 이벤트에서
// window.parent.aiGateOnAdClicked()를 동기 직접 호출해 알려준다(같은 출처라 가능,
// postMessage 같은 비동기 큐를 안 거치므로 이후 광고 네비게이션보다 항상 먼저 끝난다).
// ⚠️ 2026-08-03: PC에서는 이 게이트 자체를 없앴다(요청) — 데스크톱은 AI 분석이 바로
// 노출되고, 아래 오버레이/광고 로직은 모바일(loadAiSummary의 innerWidth<=768 체크)에서만 탄다.
const AI_GATE_KEY_PREFIX = 'sr_ai_gate_unlocked_';
function aiGateIsUnlocked(ticker) {
  try { return sessionStorage.getItem(AI_GATE_KEY_PREFIX + ticker) === '1'; } catch { return false; }
}
function aiGateUnlock(ticker) {
  try { sessionStorage.setItem(AI_GATE_KEY_PREFIX + ticker, '1'); } catch {}
}

let _aiOverlayEl = null;
let _aiOverlayTicker = null;

// 쿠팡 광고 iframe(같은 출처)이 자기 클릭 시 직접 호출하는 전역 함수 — 현재 열려있는
// 오버레이가 있을 때만 반응한다.
function aiGateOnAdClicked() {
  if (!_aiOverlayEl || !_aiOverlayTicker) return;
  aiGateUnlock(_aiOverlayTicker);
  _aiOverlayEl.remove();
  _aiOverlayEl = null;
  _aiOverlayTicker = null;
}

async function loadAiSummary(ticker, displayName) {
  const wrap = document.getElementById('aiSummaryWrap');
  if (!wrap) return;
  _aiOverlayEl = null;
  _aiOverlayTicker = null;
  wrap.innerHTML = `
    <div class="ai-summary-card">
      <div class="ai-badge-row">
        <span class="ai-dot"></span>
        <span class="ai-badge">AI 분석하기</span>
        <span style="font-size:13.5px;color:var(--text3);margin-left:auto">확인 중...</span>
      </div>
      <div style="text-align:center;padding:20px;color:var(--text3);font-size:15.5px">
        🤖 ${escHtml(displayName)} 종합 분석 확인 중...
      </div>
    </div>`;
  try {
    const r = await fetch(`/api/company-summary?ticker=${encodeURIComponent(ticker)}`);
    if (!r.ok) { wrap.innerHTML = ''; return; }
    const d = await r.json();
    if (!d.ok) { wrap.innerHTML = ''; return; }
    renderAiSummaryContent(displayName, d);
    // PC에서는 게이트(잠금+쿠팡 배너) 자체를 없앤다 — 요청에 따라 모바일에서만 유지.
    if (window.innerWidth <= 768 && !aiGateIsUnlocked(ticker)) addAiGateOverlay(ticker);
  } catch(e) {
    wrap.innerHTML = `<div class="ai-summary-card"><div style="color:var(--red);font-size:15.5px">AI 분석 로딩 실패: ${escHtml(e.message)}</div></div>`;
  }
}

function addAiGateOverlay(ticker) {
  const card = document.querySelector('#aiSummaryWrap .ai-summary-card');
  if (!card) return;
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center;cursor:default;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);background:repeating-linear-gradient(45deg, rgba(11,15,25,.85), rgba(11,15,25,.85) 12px, rgba(11,15,25,.94) 12px, rgba(11,15,25,.94) 24px)';
  overlay.innerHTML = `
    <div style="font-size:15.5px;color:#fff;font-weight:700;line-height:1.6">🔒 배너를 누르면 AI 종합 분석이 열려요</div>
    <div id="aiPanelAdSlot" style="cursor:pointer"></div>
  `;
  card.appendChild(overlay);
  _aiOverlayEl = overlay;
  _aiOverlayTicker = ticker;
  const adSlot = overlay.querySelector('#aiPanelAdSlot');
  loadAiPanelAd(adSlot);

  // ⚠️ 주 감지 수단: iframe 안에서 aiGateOnAdClicked()를 직접 호출해주는 걸 기대했지만
  // (같은 출처라 가능해야 함) 실사용에서 계속 안 풀리는 걸로 봐서 광고 위젯(g.js) 내부가
  // 클릭 이벤트 전파를 막거나(stopPropagation) 실제 크리에이티브를 또 다른(교차 출처일
  // 수 있는) iframe으로 그리는 구조일 가능성이 크다 — 그러면 iframe 내부 스크립트가
  // 아예 협조를 안 해도 된다. 그래서 iframe 내부와 무관하게 부모에서 스스로 감지하는
  // 표준 기법을 기본 수단으로 쓴다: 어떤 iframe이든(교차 출처 포함) 사용자가 그 안을
  // 클릭/탭하면 브라우저가 포커스를 그 iframe으로 옮기므로, window가 blur되는 순간
  // document.activeElement가 이 광고 iframe이면 "광고를 클릭했다"로 간주한다.
  const iframeEl = adSlot.querySelector('iframe');
  function onWindowBlur() {
    setTimeout(function () {
      if (document.activeElement === iframeEl) aiGateOnAdClicked();
    }, 0);
  }
  window.addEventListener('blur', onWindowBlur);
  const _origRemove = overlay.remove.bind(overlay);
  overlay.remove = function () { window.removeEventListener('blur', onWindowBlur); _origRemove(); };
}

      ${Array.isArray(d.key_risks) && d.key_risks.length ? `

// ── 펀더멘털 표시 ────────────────────────────────────────
async function loadFundamentals(ticker, forceRefresh = false) {
  const wrap = document.getElementById('fundamentalsWrap');
  if (!wrap) return;
  wrap.innerHTML = `
    <div class="fund-section">
      <div class="section-title">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        펀더멘털 <span style="font-size:13.5px;color:var(--text3);font-weight:400">불러오는 중...</span>
        <span class="spinner" style="width:14px;height:14px;border-width:2px;margin:0 0 0 8px"></span>
      </div>
    </div>`;
  try {
    const url = `/api/stock?type=fundamentals&ticker=${encodeURIComponent(ticker)}${forceRefresh ? '&nocache=' + Date.now() : ''}`;
    const r = await fetch(url);
    if (!r.ok) {
      renderFundamentalsError(wrap, ticker, `서버 에러 (HTTP ${r.status})`);
      return;
    }
    const f = await r.json();
    if (!f.ok) {
      renderFundamentalsError(wrap, ticker, f.error || '데이터 없음', f.hint, f.resetKst);
      return;
    }
    renderFundamentals(wrap, f, ticker);
  } catch (e) {
    renderFundamentalsError(wrap, ticker, '네트워크 에러: ' + e.message);
  }
}

function renderFundamentalsError(wrap, ticker, message, hint = '', resetKst = '') {
  wrap.innerHTML = `
    <div class="fund-section">
      <div class="section-title">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        펀더멘털
        <button onclick="loadFundamentals('${escHtml(ticker)}', true)" style="margin-left:auto;background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:5px 12px;border-radius:6px;cursor:pointer;font-size:14.5px">🔄 다시 시도</button>
      </div>
      <div class="fund-group" style="text-align:center;padding:32px">
        <div style="font-size:16px;color:var(--yellow);margin-bottom:8px">⚠️ ${escHtml(message)}</div>
        ${hint ? `<div style="font-size:14.5px;color:var(--text2);margin-top:6px">${escHtml(hint)}</div>` : ''}
        ${resetKst ? `<div style="font-size:15.5px;color:var(--blue);margin-top:14px;padding:10px;background:var(--bg3);border-radius:6px;display:inline-block">⏰ FMP 한도 리셋: <b>${escHtml(resetKst)}</b></div>` : ''}
        <div style="font-size:13.5px;color:var(--text3);margin-top:14px">기존에 한 번 가져온 종목은 캐시로 자동 표시됨 (한도와 무관)</div>
      </div>
    </div>`;
}

function renderFundamentals(wrap, f, ticker) {
  const isKrw = f.currency === 'KRW';
  // 포맷 헬퍼
  const fmtNum = (v, digits = 2) => v == null ? '—' : Number(v).toFixed(digits);
  const fmtPct = v => v == null ? '—' : (v > 0 ? '+' : '') + Number(v).toFixed(1) + '%';
  const fmtPctRaw = v => v == null ? '—' : Number(v).toFixed(1) + '%';
  const fmtMoney = v => {
    if (v == null) return '—';
    const abs = Math.abs(v);
    if (isKrw) {
      if (abs >= 1e12) return `${(v/1e12).toLocaleString(undefined, { maximumFractionDigits: 1 })}조원`;
      if (abs >= 1e8)  return `${Math.round(v/1e8).toLocaleString()}억원`;
      return `${Number(v).toLocaleString()}원`;
    }
    if (abs >= 1e12) return `$${(v/1e12).toFixed(2)}T`;
    if (abs >= 1e9)  return `$${(v/1e9).toFixed(2)}B`;
    if (abs >= 1e6)  return `$${(v/1e6).toFixed(0)}M`;
    return `$${Number(v).toFixed(0)}`;
  };

  // 색상 판정 (값이 좋은지/나쁜지)
  const peColor = f.pe == null ? '' : f.pe < 15 ? 'good' : f.pe < 30 ? '' : f.pe < 50 ? 'warn' : 'bad';
  const pbColor = f.pb == null ? '' : f.pb < 1 ? 'good' : f.pb < 3 ? '' : f.pb < 5 ? 'warn' : 'bad';
  const roeColor = f.roe == null ? '' : f.roe > 15 ? 'good' : f.roe > 5 ? '' : f.roe > 0 ? 'warn' : 'bad';
  const opMarginColor = f.operatingMargin == null ? '' : f.operatingMargin > 20 ? 'good' : f.operatingMargin > 5 ? '' : f.operatingMargin > 0 ? 'warn' : 'bad';
  const debtColor = f.debtToEquity == null ? '' : f.debtToEquity < 0.5 ? 'good' : f.debtToEquity < 1.5 ? '' : f.debtToEquity < 3 ? 'warn' : 'bad';
  const currColor = f.currentRatio == null ? '' : f.currentRatio > 2 ? 'good' : f.currentRatio > 1 ? '' : 'bad';
  const revGrColor = f.revenueGrowthYoY == null ? '' : f.revenueGrowthYoY > 10 ? 'good' : f.revenueGrowthYoY > 0 ? '' : 'bad';

  // ── 핵심 지표 게이지 타일 (숫자를 good→bad 계기판으로) ──
  const clampPct = (v, lo = 3, hi = 100) => Math.max(lo, Math.min(hi, v));
  const gaugeTile = (label, disp, pct, color, tag, tagCls, lo, hi) => `
    <div class="gtile">
      <div class="glab">${label}${tag ? `<span class="gtag ${tagCls}">${tag}</span>` : ''}</div>
      <div class="gnum">${disp}</div>
      <div class="gmeter">
        <div class="gmeter-track"><div class="gmeter-fill" style="width:${pct}%;background:${color}"></div><div class="gmeter-knob" style="left:${pct}%;background:${color}"></div></div>
        <div class="gmeter-scale"><span>${lo}</span><span>${hi}</span></div>
      </div>
    </div>`;
  const gTiles = [];
  if (f.pe != null) { const v = f.pe; const [c, tg, tc] = v < 15 ? ['var(--green)', '저평가', 'g'] : v < 30 ? ['var(--blue)', '보통', 'n'] : v < 50 ? ['var(--yellow)', '고평가', 'w'] : ['var(--red)', '고평가', 'b']; gTiles.push(gaugeTile('PER', Number(v).toFixed(1), clampPct(v / 50 * 100), c, tg, tc, '저평가', '고평가')); }
  if (f.roe != null) { const v = f.roe; const [c, tg, tc] = v > 15 ? ['var(--green)', '우수', 'g'] : v > 5 ? ['var(--blue)', '양호', 'n'] : v > 0 ? ['var(--yellow)', '주의', 'w'] : ['var(--red)', '부진', 'b']; gTiles.push(gaugeTile('ROE', Number(v).toFixed(1) + '<small>%</small>', clampPct(v / 30 * 100), c, tg, tc, '0%', '30%+')); }
  if (f.operatingMargin != null) { const v = f.operatingMargin; const [c, tg, tc] = v > 20 ? ['var(--green)', '우수', 'g'] : v > 5 ? ['var(--blue)', '양호', 'n'] : v > 0 ? ['var(--yellow)', '주의', 'w'] : ['var(--red)', '적자', 'b']; gTiles.push(gaugeTile('영업이익률', Number(v).toFixed(1) + '<small>%</small>', clampPct(v / 50 * 100), c, tg, tc, '0%', '50%+')); }
  if (isKrw && f.debtRatioPct != null) { const v = f.debtRatioPct; const [c, tg, tc] = v < 100 ? ['var(--green)', '안전', 'g'] : v < 200 ? ['var(--blue)', '보통', 'n'] : v < 400 ? ['var(--yellow)', '높음', 'w'] : ['var(--red)', '위험', 'b']; gTiles.push(gaugeTile('부채비율', Math.round(v) + '<small>%</small>', clampPct(v / 200 * 100), c, tg, tc, '낮음(안전)', '200%+')); }
  else if (!isKrw && f.debtToEquity != null) { const v = f.debtToEquity; const [c, tg, tc] = v < 0.5 ? ['var(--green)', '안전', 'g'] : v < 1.5 ? ['var(--blue)', '보통', 'n'] : v < 3 ? ['var(--yellow)', '높음', 'w'] : ['var(--red)', '위험', 'b']; gTiles.push(gaugeTile('부채비율 D/E', Number(v).toFixed(2), clampPct(v / 3 * 100), c, tg, tc, '낮음', '3.0+')); }

  const html = `
    <div class="fund-section">
      <div class="section-title">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        펀더멘털 ${f.fiscalPeriod ? `<span style="font-size:13.5px;color:var(--text3);font-weight:400">${f.fiscalPeriod}${f.reportDate ? ` (${f.reportDate})` : ''}</span>` : ''}
        ${f.source === 'db-cache' ? `<span style="font-size:13px;color:var(--green);background:var(--bg3);padding:2px 7px;border-radius:4px;margin-left:6px">💾 캐시 ${f.cacheAgeHours}h 전</span>` : ''}
        ${f.source === 'db-cache-stale' ? `<span style="font-size:13px;color:var(--yellow);background:var(--bg3);padding:2px 7px;border-radius:4px;margin-left:6px" title="${f.warning || ''}">⚠️ stale ${f.cacheAgeHours}h 전</span>` : ''}
        ${f.source === 'fmp-stable' ? `<span style="font-size:13px;color:var(--blue);background:var(--bg3);padding:2px 7px;border-radius:4px;margin-left:6px">🆕 최신</span>` : ''}
        ${f.source === 'naver' ? `<span style="font-size:13px;color:var(--green);background:var(--bg3);padding:2px 7px;border-radius:4px;margin-left:6px">🇰🇷 네이버증권</span>` : ''}
        <button onclick="loadFundamentals('${escHtml(ticker)}', true)" style="margin-left:auto;background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:4px 10px;border-radius:6px;cursor:pointer;font-size:13.5px" title="캐시 무시하고 FMP에서 최신 데이터 가져오기">🔄 새로고침</button>
      </div>

      ${gTiles.length ? `<div class="fund-grid" style="margin-bottom:22px">${gTiles.join('')}</div>` : ''}

      <!-- 시총 / 밸류에이션 -->
      <div class="fund-group">
        <div class="fund-group-title">💎 밸류에이션</div>
        <div class="fund-grid">
          <div class="fund-item"><div class="fund-label">시가총액</div><div class="fund-val">${fmtMoney(f.marketCap)}</div></div>

// Yahoo Finance에서 정보 가져와 companies 테이블에 자동 등록
async function autoRegisterCompany(ticker) {
  try {
    // /api/quotes로 회사 정보 조회 (시세 + 통화 + marketState 가져옴)
    const r = await fetch(`/api/quotes?tickers=${encodeURIComponent(ticker)}`);
    if (!r.ok) return null;
    const j = await r.json();
    const q = j?.data?.[ticker];
    if (!q || q.price == null) return null;

    // 시장 자동 판별 (.KS = 한국, 그 외 = 미국)
    const market = /\.KS$|\.KQ$/i.test(ticker) ? 'KR' : 'US';

    // 회사명: 서버 프록시(펀더멘털 API)로 조회 — KR은 네이버(정확한 한글명), US는 FMP.
    // 브라우저에서 Yahoo Finance를 직접 호출하면 CORS로 거의 항상 실패해(응답을 읽을 수
    // 없음) 티커 코드가 그대로 회사명으로 저장되는 문제가 있었음 — /api/quotes가 이미
    // 받아온 shortName을 우선 폴백으로 쓰고, 서버 경유 조회로 더 정확한 이름을 덮어쓴다.
    let companyName = q.shortName || ticker;
    try {
      const r2 = await fetch(`/api/stock?type=fundamentals&ticker=${encodeURIComponent(ticker)}`);
      if (r2.ok) {
        const fd = await r2.json();
        if (fd?.company) companyName = fd.company;
      }
    } catch {}

    // DB에 INSERT (RLS: companies는 보통 public read + service write)
    const { data: inserted, error } = await sb.from('companies').insert({
      ticker,
      name_en: companyName,
      name_ko: companyName,  // 한국어 이름은 영문명으로 폴백, 추후 admin에서 보정
      market,
      current_price: q.price,
      currency: q.currency || (market === 'KR' ? 'KRW' : 'USD'),
      price_updated_at: new Date().toISOString(),
    }).select('id,ticker,name_ko,name_en,market,sector').single();

    if (error) {
      // 동시 요청으로 이미 만들어졌을 가능성 → 다시 조회
      const { data: existing } = await sb.from('companies')
        .select('id,ticker,name_ko,name_en,market,sector').eq('ticker', ticker).maybeSingle();
      return existing || null;
    }
    return inserted;
  } catch (e) {
    console.warn('autoRegisterCompany error:', e);
    return null;
  }
}

async function init() {
  // 공유·검색 유입은 /stock/{ticker} 형태로 들어온다. 서버 rewrite라 브라우저 주소는
  // 그대로 /stock/{ticker}로 남아 location.search가 비어 있으므로, 쿼리(?ticker=)를 먼저
  // 보고 없으면 경로에서 파싱한다(analysis.html이 /analysis/{id}에 쓰는 것과 같은 방식).
  const params = new URLSearchParams(location.search);
  const rawTicker = params.get('ticker')
    || (location.pathname.match(/^\/stock\/([^/?#]+)/)?.[1] ?? '');
  const ticker = decodeURIComponent(rawTicker).toUpperCase().trim();
  if (!ticker) { location.href = '/'; return; }

  _currentTicker = ticker;

  let { data: company } = await sb
    .from('companies')
    .select('id,ticker,name_ko,name_en,market,sector')
    .eq('ticker', ticker)
    .maybeSingle();

  // DB에 없으면 Yahoo에서 가져와서 자동 등록
  if (!company) {
    // 1차: name_ko / name_en으로 매칭 시도 (예: HLB → 028300.KQ)
    try {
      const safe = ticker.replace(/[%_'"\\]/g, '');
      const { data: nameMatch } = await sb
        .from('companies').select('ticker, name_ko, name_en, market')
        .or(`name_ko.ilike.${safe},name_en.ilike.${safe}`)
        .limit(1).maybeSingle();
      if (nameMatch?.ticker && nameMatch.ticker !== ticker) {
        location.replace(`/company.html?ticker=${encodeURIComponent(nameMatch.ticker)}`);
        return;
      }
    } catch {}

    document.getElementById('pageWrap').innerHTML = `
      <div class="loading-state">
        <div class="spinner"></div>
        <p style="color:var(--text2)"><strong>${escHtml(ticker)}</strong> 종목 정보를 불러오는 중...</p>
      </div>`;
    company = await autoRegisterCompany(ticker);
    if (!company) {
      document.getElementById('pageWrap').innerHTML = `
        <div class="loading-state">
          <p style="color:var(--red)">❌ 종목 <strong>${escHtml(ticker)}</strong>을(를) 찾을 수 없습니다.</p>
          <p style="color:var(--text3);font-size:15.5px;margin-top:8px">
            종목 정보를 찾을 수 없습니다.<br>
            한국 종목은 6자리 코드 + .KS 또는 .KQ (예: 028300.KQ, 005930.KS)<br>
            미국 종목은 영문 티커 (예: AAPL, MSFT, NVDA)
          </p>
          <a href="/" class="back-btn" style="display:inline-block;margin-top:14px;padding:8px 16px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text)">← 메인으로</a>
        </div>`;
      return;
    }
  }

  document.title = `${company.name_ko || company.name_en || ticker} (${ticker}) — StockRipple`;
  _isKr = company.market === 'KR';

  // 🕐 최근 본 종목 기록 — 우측 패널의 "최근 본" 탭이 읽는 localStorage 키에 push.
  // 서버 저장 없이 클라이언트에만 남기므로 기기/브라우저별로 따로 쌓인다(의도된 동작).
  try {
    const key = 'sr_recent_views';
    const list = JSON.parse(localStorage.getItem(key) || '[]').filter(it => it.ticker !== ticker);
    list.unshift({ ticker, name: company.name_ko || company.name_en || ticker, market: company.market, ts: Date.now() });
    localStorage.setItem(key, JSON.stringify(list.slice(0, 20)));
  } catch {}

  const [priceData] = await Promise.all([
    loadPrice(ticker),
    _isKr ? loadTossQuote(ticker) : Promise.all([loadUsdKrwRate(), loadTossQuote(ticker)]),
  ]);

  renderPage(company, [], priceData);
  startLivePriceRefresh();
  startTossFastPriceSync(ticker);
}

// 로직을 로컬로 따로 둔다. currentUser/renderUserMenu/기본 initAuth는 site-header.js
// 전역을 그대로 쓰되, 여기서 같은 이름으로 재정의해 관심종목 캐시 로딩만 얹는다
// (function 선언은 재선언이 허용돼 마지막에 정의된 쪽이 이긴다 — app.js와 동일 패턴).
let _wlCache = new Set();
function _syncWatchBtns() {
  document.querySelectorAll('[data-wl-ticker]').forEach(btn => {
    const w = _wlCache.has(btn.dataset.wlTicker);
    btn.classList.toggle('active', w);
    btn.textContent = w ? '★' : '☆';
    btn.title = `관심종목 ${w ? '제거' : '추가'}`;
  });
}
async function initAuth() {
  const { data: { session } } = await sb.auth.getSession();
  currentUser = session?.user ?? null;
  renderUserMenu(currentUser);
  if (currentUser) {
    const { data } = await sb.from('user_watchlist').select('ticker');
    _wlCache = new Set((data || []).map(r => r.ticker));
    _syncWatchBtns();
  }
  sb.auth.onAuthStateChange(async (event, session) => {
    currentUser = session?.user ?? null;
    renderUserMenu(currentUser);
    if (currentUser) {
      const { data } = await sb.from('user_watchlist').select('ticker');
      _wlCache = new Set((data || []).map(r => r.ticker));
    } else {
      _wlCache.clear();
    }
    _syncWatchBtns();
    if (event === 'SIGNED_IN') closeAuthModal();
  });
}
// (initAuth() 호출은 위 init() 옆에 이미 있음 — function 선언 호이스팅으로 이 재정의가
// 그 호출 시점에도 이미 적용돼 있어 별도로 다시 부를 필요 없음)

function isCoWatched(ticker) { return _wlCache.has(ticker); }
async function toggleCoWatch(e, btn) {
  e.stopPropagation();
  if (!currentUser) { openAuthModal(); return; }
  const { wlTicker: ticker, wlName: name, wlMarket: market } = btn.dataset;
  if (_wlCache.has(ticker)) {
    await sb.from('user_watchlist').delete().eq('ticker', ticker);
    _wlCache.delete(ticker);
  } else {
    await sb.from('user_watchlist').insert({ user_id: currentUser.id, ticker, name, market });
    _wlCache.add(ticker);

function renderInvestorTrend(d) {
  const days = d.days;                 // 최신순 (0 = 오늘)
  const chron = [...days].reverse();   // 과거→현재 (차트용)
  const CG = '#e5484d', CR = '#4d8dff', CA = '#4d8dff', CM = '#f0b45e';
  const manju = v => Math.round((v || 0) / 10000);
  const latestClose = days[0]?.close || 0;

  // SVG 스파크라인 (일별 순매수, +/−)
  const spark = (vals, color, w = 200, h = 34) => {
    if (!vals.length) return '';
    const mn = Math.min(...vals), mx = Math.max(...vals), rng = (mx - mn) || 1;
    const pts = vals.map((v, i) => `${(i / (vals.length - 1 || 1)) * w},${(h - 2) - ((v - mn) / rng) * (h - 4)}`).join(' ');
    return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" points="${pts}"/></svg>`;
  };

  // B2. 주체별 5일 누적 순매수 타일
  const sum5 = key => days.slice(0, 5).reduce((a, day) => a + (day[key] || 0), 0);
  const recentDaily = key => chron.slice(-12).map(day => (day[key] || 0) / 10000);
  const flowTile = (name, dotColor, key) => {
    const net = sum5(key), mj = manju(net), buy = net >= 0;
    const eok = Math.round(Math.abs(net) * latestClose / 1e8);
    const col = buy ? 'var(--red)' : 'var(--blue)';
    const scol = buy ? CG : CR;
    return `<div class="ft">
      <div class="ft-top"><div class="ft-name"><i style="background:${dotColor}"></i>${name}</div>
        <span class="ft-arrow" style="color:${col};background:${buy ? 'var(--red-dim)' : 'var(--blue-dim)'}">${buy ? '순매수' : '순매도'}</span></div>
      <div class="ft-net" style="color:${col}">${buy ? '+' : '−'}${Math.abs(mj).toLocaleString()}만주</div>
      <div class="ft-sub">최근 5거래일 누적 · 약 ${buy ? '+' : '−'}${eok.toLocaleString()}억</div>
      <div class="ft-spark">${spark(recentDaily(key), scol)}</div>
    </div>`;
  };

  // B3. 누적 순매수 추세 (외국인 vs 기관) — 진입/이탈 구간이 선으로 드러남
  let cf = 0, ci = 0; const cumF = [], cumI = [];
  chron.forEach(day => { cf += (day.foreign || 0) / 10000; ci += (day.institution || 0) / 10000; cumF.push(cf); cumI.push(ci); });
  const cumSvg = (() => {
    const W = 1000, H = 150, all = [...cumF, ...cumI, 0];
    const mn = Math.min(...all), mx = Math.max(...all), rng = (mx - mn) || 1;
    const y = v => H - ((v - mn) / rng) * H;
    const path = (arr, color) => {
      const pts = arr.map((v, i) => `${(i / (arr.length - 1 || 1)) * W},${y(v)}`).join(' ');
      return `<polyline fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" points="${pts}"/><circle cx="${W}" cy="${y(arr[arr.length - 1])}" r="3.5" fill="${color}"/>`;
    };
    return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <line x1="0" y1="${y(0)}" x2="${W}" y2="${y(0)}" stroke="${cssVar('--border-strong','rgba(255,255,255,.12)')}" stroke-dasharray="4 5" stroke-width="1"/>
      ${path(cumF, CA)}${path(cumI, CM)}</svg>`;
  })();

  // B4. 일자별 순매수 테이블
  const cell = v => { const mj = manju(v), p = v >= 0; return `<span class="ck-cell ${p ? 'p' : 'n'}">${p ? '+' : '−'}${Math.abs(mj).toLocaleString()}만</span>`; };
  const rows = days.map(day => `<tr>
      <td>${fmtMDW(day.date)}</td>
      <td>${cell(day.foreign)}</td>
      <td>${cell(day.institution)}</td>
      <td>${cell(day.individual)}</td>
      <td style="color:var(--text3)">${day.foreignHoldRatio != null ? day.foreignHoldRatio.toFixed(2) + '%' : '—'}</td>
    </tr>`).join('');

  // B1. 외국인 보유비중 추세 (기관/개인 보유% 는 소스에 없어 외국인만 정직 표기)
  const holdVals = chron.map(dd => dd.foreignHoldRatio).filter(v => v != null);
  const curHold = days[0]?.foreignHoldRatio;

  return `
    <div class="ck-sec-head"><span class="tick"></span><h3>수급 흐름 · 외국인 / 기관 / 개인</h3><span class="note">최근 ${days.length} 거래일 · 네이버증권</span></div>
    <p class="flow-help">💡 <b>순매수</b>는 산 금액이 판 금액보다 많다는 뜻(<span style="color:var(--red)">빨강</span>), <b>순매도</b>는 그 반대(<span style="color:var(--blue)">파랑</span>)예요. 아래 <b>누적 추세</b> 선이 우상향이면 그 주체가 꾸준히 사 모으는 중, 우하향이면 파는 중으로 읽어요.</p>

    ${curHold != null ? `
    <div class="ck-panel" style="padding:16px 18px;margin-bottom:14px">
      <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
        <div><div style="font-size:13.5px;color:var(--text3);margin-bottom:2px">외국인 보유비중</div>
          <div style="font-family:var(--mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums">${curHold.toFixed(2)}<small style="font-size:15.5px;color:var(--text2)">%</small></div></div>
        <div style="flex:1;min-width:160px;height:38px;margin-left:auto">${spark(holdVals, CA, 320, 38)}</div>
      </div>
    </div>` : ''}

    <div class="flow-tiles">
      ${flowTile('외국인', CA, 'foreign')}
      ${flowTile('기관', CM, 'institution')}
      ${flowTile('개인', '#8b8bff', 'individual')}
    </div>

    <div class="ck-panel" style="padding:16px 18px;margin-bottom:14px">
      <div style="display:flex;align-items:center;gap:14px;margin-bottom:6px;flex-wrap:wrap">
        <div style="font-size:15px;font-weight:600">누적 순매수 추세 <span style="color:var(--text3);font-weight:400;font-size:13.5px">· 어디서 들어왔나 / 나갔나</span></div>
        <div class="rr-legend" style="margin-left:auto">
          <div class="rr-lg"><span class="ln" style="background:${CA}"></span>외국인</div>
          <div class="rr-lg"><span class="ln" style="background:${CM}"></span>기관</div>
        </div>
      </div>
      <div class="cum-box">${cumSvg}</div>
    </div>

    <div class="ck-panel" style="padding:4px 6px;margin-bottom:24px;overflow-x:auto;-webkit-overflow-scrolling:touch">
      <table class="ck-tbl" style="min-width:480px">
        <thead><tr><th>일자</th><th>외국인</th><th>기관</th><th>개인</th><th>외인보유율</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

async function loadDartDetail(ticker) {
  const wrap = document.getElementById('dartDetailWrap');
  if (!wrap) return;
  wrap.innerHTML = `<div style="background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:24px">
    <div style="font-size:16px;font-weight:700;color:var(--text2);display:flex;align-items:center;gap:8px">
      🇰🇷 DART 상세 공시 데이터 <span class="spinner" style="width:12px;height:12px;border-width:2px"></span>
    </div>
  </div>`;

  try {
    const r = await fetch('/api/admin?action=dart-company-detail&ticker=' + encodeURIComponent(ticker));
    if (!r.ok) {
      const j = await r.json().catch(() => ({}));
      wrap.innerHTML = `<div style="background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:24px;font-size:14.5px;color:var(--text3)">
        🇰🇷 DART 상세 데이터 사용 불가 — ${escHtml(j.error || 'unknown')}
        ${j.error?.includes('not synced') ? '<div style="margin-top:6px;color:var(--blue)">관리자가 <code>?action=dart-sync-corp-codes</code>를 실행해야 합니다.</div>' : ''}
      </div>`;
      return;
    }
    const d = await r.json();
    wrap.innerHTML = renderDartDetail(d);
  } catch (e) {
    wrap.innerHTML = `<div style="background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:24px;font-size:14.5px;color:var(--red)">DART 로드 실패: ${escHtml(e.message)}</div>`;
  }
}

function renderDartDetail(d) {
  const sections = [];

  // 1. 최대주주 현황
  if (d.major_holders?.length) {
    // DART 실제 필드명: trmend_posesn_stock_co / trmend_posesn_stock_qota_rt (기말 기준)
    // 기초 기준은 bsis_posesn_stock_co / bsis_posesn_stock_qota_rt
    const pickStock = (h) => h.trmend_posesn_stock_co ?? h.trmend_qy ?? h.bsis_posesn_stock_co ?? '';
    const pickRt    = (h) => h.trmend_posesn_stock_qota_rt ?? h.bsis_posesn_stock_qota_rt ?? h.trmend_qota_rt ?? '';
    const fmtCount = (v) => {
      if (v == null || v === '' || v === '-') return '—';
      const n = parseFloat(String(v).replace(/,/g, ''));
      return isNaN(n) ? String(v) : n.toLocaleString();
    };
    const fmtRt = (v) => {
      if (v == null || v === '' || v === '-') return '—';
      const s = String(v).trim();
      return s.includes('%') ? s : s + '%';
    };
    const rows = d.major_holders.slice(0, 15).map(h => `<tr>
      <td style="padding:6px 10px">${escHtml(h.nm || h.nm1 || '—')}</td>
      <td style="padding:6px 10px;color:var(--text2)">${escHtml(h.relate || h.relt || h.stock_knd || '—')}</td>
      <td style="padding:6px 10px;text-align:right;font-family:var(--font-mono,monospace)">${fmtCount(pickStock(h))}</td>
      <td style="padding:6px 10px;text-align:right;color:var(--blue);font-weight:600;font-family:var(--font-mono,monospace)">${fmtRt(pickRt(h))}</td>
    </tr>`).join('');
    sections.push(`
      <div style="margin-bottom:18px">
        <div style="font-size:15.5px;font-weight:700;color:var(--text);margin-bottom:8px;display:flex;align-items:center;gap:6px">
          👥 최대주주 현황 <span style="font-size:13.5px;color:var(--text3);font-weight:400">(${d.major_holders.length}명)</span>
        </div>
        <div style="border:1px solid var(--border);border-radius:8px;overflow:hidden">
          <table style="width:100%;border-collapse:collapse;font-size:14.5px">
            <thead style="background:var(--bg3)">
              <tr><th style="padding:6px 10px;text-align:left">성명/법인</th><th style="padding:6px 10px;text-align:left">관계</th><th style="padding:6px 10px;text-align:right">보유주식</th><th style="padding:6px 10px;text-align:right">지분율</th></tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>`);
  }

  // 2. 5%+ 주요주주 (임원·주요주주 소유주식 변동)
  if (d.shareholders?.length) {
    const fmtNum = (v) => {
      if (v == null || v === '' || v === '-') return '—';
      const n = parseFloat(String(v).replace(/,/g, ''));
      return isNaN(n) ? String(v) : n.toLocaleString();
    };
    const fmtDelta = (v) => {
      if (v == null || v === '' || v === '-') return '';
      const n = parseFloat(String(v).replace(/,/g, ''));
      if (isNaN(n) || n === 0) return '';
      return ` <span style="font-size:13px;color:${n > 0 ? 'var(--green)' : 'var(--red)'};margin-left:4px">${n > 0 ? '+' : ''}${n.toLocaleString()}</span>`;
    };
    const rows = d.shareholders.slice(0, 12).map(s => {
      // 직위/주요주주 표시
      const role = s.isu_exctv_ofcps || s.isu_exctv_rgist_at || (s.isu_main_shrholdr === 'Y' ? '주요주주' : null) || s.relat || '—';
      const holding = s.sp_stock_lmp_cnt ?? s.posesn_stock_co ?? s.stock_cnt ?? '';
      const delta = s.sp_stock_lmp_irds_cnt ?? s.irds_cnt ?? '';
      return `<tr>
        <td style="padding:6px 10px">${escHtml(s.nm || s.repror || '—')}</td>
        <td style="padding:6px 10px;color:var(--text2)">${escHtml(role)}</td>
        <td style="padding:6px 10px;text-align:right;font-family:var(--font-mono,monospace)">${fmtNum(holding)}${fmtDelta(delta)}</td>
      </tr>`;
    }).join('');
    sections.push(`
      <div style="margin-bottom:18px">
        <div style="font-size:15.5px;font-weight:700;color:var(--text);margin-bottom:8px">📊 임원·주요주주 보유 변동</div>
        <div style="border:1px solid var(--border);border-radius:8px;overflow:hidden">
          <table style="width:100%;border-collapse:collapse;font-size:14.5px">
            <thead style="background:var(--bg3)"><tr><th style="padding:6px 10px;text-align:left">성명</th><th style="padding:6px 10px;text-align:left">직위/관계</th><th style="padding:6px 10px;text-align:right">보유 (주)</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>`);
  }

  // 3. 임원 현황
  if (d.officers?.length) {
    const rows = d.officers.slice(0, 15).map(o => `<tr>
      <td style="padding:6px 10px">${escHtml(o.nm || '—')}</td>
      <td style="padding:6px 10px;color:var(--text2)">${escHtml(o.ofcps || '—')}</td>
      <td style="padding:6px 10px;color:var(--text3);font-size:13.5px">${escHtml(o.chrg_job || o.main_career || '—')}</td>
      <td style="padding:6px 10px;color:var(--text3);font-size:13.5px">${escHtml(o.tenure_end_on || o.term_finish_dt || '—')}</td>
    </tr>`).join('');
    sections.push(`
      <div style="margin-bottom:18px">
        <div style="font-size:15.5px;font-weight:700;color:var(--text);margin-bottom:8px">🧑‍💼 임원 현황 <span style="font-size:13.5px;color:var(--text3);font-weight:400">(${d.officers.length}명)</span></div>
        <div style="border:1px solid var(--border);border-radius:8px;overflow:hidden">
          <table style="width:100%;border-collapse:collapse;font-size:14.5px">
            <thead style="background:var(--bg3)"><tr><th style="padding:6px 10px;text-align:left">성명</th><th style="padding:6px 10px;text-align:left">직위</th><th style="padding:6px 10px;text-align:left">담당업무/경력</th><th style="padding:6px 10px;text-align:left">임기만료</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>`);
  }

  // 4. 재무지표 연간 추이
  if (d.financials && Object.keys(d.financials).length) {
    const years = Object.keys(d.financials).sort((a, b) => b.localeCompare(a)); // 최신년도 먼저
    const fmt = (v) => {
      if (v == null) return '—';
      const abs = Math.abs(v);
      if (abs >= 1e12) return (v / 1e12).toFixed(2) + '조';
      if (abs >= 1e8)  return (v / 1e8).toFixed(0) + '억';
      if (abs >= 1e4)  return (v / 1e4).toFixed(0) + '만';
      return v.toLocaleString();
    };
    const rows = ['revenue', 'opIncome', 'netIncome', 'assets', 'liabilities', 'equity'].map(k => {
      const labels = { revenue: '매출액', opIncome: '영업이익', netIncome: '당기순이익', assets: '자산총계', liabilities: '부채총계', equity: '자본총계' };
      const cells = years.map(y => {
        const v = d.financials[y]?.[k];
        const color = k === 'opIncome' || k === 'netIncome'
          ? (v == null ? 'var(--text3)' : v > 0 ? 'var(--green)' : 'var(--red)')
          : 'var(--text)';
        return `<td style="padding:6px 10px;text-align:right;color:${color}">${fmt(v)}</td>`;
      }).join('');
      return `<tr><td style="padding:6px 10px;color:var(--text2);font-weight:500">${labels[k]}</td>${cells}</tr>`;
    }).join('');
    sections.push(`
      <div style="margin-bottom:8px">
        <div style="font-size:15.5px;font-weight:700;color:var(--text);margin-bottom:8px">📈 재무지표 연간 추이</div>
        <div style="border:1px solid var(--border);border-radius:8px;overflow:hidden">
          <table style="width:100%;border-collapse:collapse;font-size:14.5px">
            <thead style="background:var(--bg3)"><tr><th style="padding:6px 10px;text-align:left">항목</th>${years.map(y => `<th style="padding:6px 10px;text-align:right">${y}</th>`).join('')}</tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>`);
  }

  const cached = d.cached ? `<span style="color:var(--text3);font-size:13px;margin-left:8px">(캐시 · ${new Date(d.updated_at).toLocaleDateString('ko-KR')})</span>` : '';
  const empty = !sections.length
    ? '<div style="color:var(--text3);font-size:14.5px;text-align:center;padding:20px">DART 데이터가 비어있습니다 (사업보고서 미공시 또는 비상장)</div>'
    : sections.join('');

  return `<div style="background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:24px;box-shadow:var(--shadow-card)">
    <div style="font-size:17px;font-weight:700;color:var(--text);margin-bottom:14px;display:flex;align-items:center;gap:8px;padding-bottom:10px;border-bottom:1px solid var(--border)">
      🇰🇷 DART 상세 공시 데이터${cached}
      <span style="margin-left:auto;font-size:13.5px;color:var(--text3);font-weight:400">출처: 전자공시시스템 (opendart.fss.or.kr)</span>
    </div>
    ${empty}
  </div>`;
}
</script>
</body>
</html>
