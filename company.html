<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>종목 상세 — StockRipple</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg: #0d1117; --bg2: #161b22; --bg3: #21262d; --border: #30363d;
  --text: #e6edf3; --text2: #8b949e; --text3: #6e7681;
  --blue: #2f81f7; --blue-dim: #1f4d8a;
  --green: #3fb950; --green-dim: #1a4a26;
  --red: #f85149; --red-dim: #4a1a1a;
  --yellow: #d29922; --purple: #a371f7;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

.header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(13,17,23,0.92); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border); padding: 0 24px;
}
.header-inner {
  max-width: 1100px; margin: 0 auto;
  display: flex; align-items: center; gap: 16px; height: 56px;
}
.back-btn {
  display: flex; align-items: center; gap: 6px; color: var(--text2);
  text-decoration: none; font-size: 13px; background: none; border: none; cursor: pointer;
  padding: 5px 10px; border-radius: 6px; transition: all 0.15s;
}
.back-btn:hover { background: var(--bg3); color: var(--text); }
.logo-sm { font-size: 14px; font-weight: 700; color: var(--text2); }
.logo-sm span { color: var(--blue); }

.page-wrap { max-width: 1100px; margin: 0 auto; padding: 32px 24px 60px; }

/* Company Header */
.company-header { margin-bottom: 28px; }
.company-header-top { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
.ticker-badge {
  font-size: 14px; font-weight: 700; font-family: 'SF Mono', 'Fira Code', monospace;
  padding: 6px 14px; border-radius: 8px; white-space: nowrap; flex-shrink: 0;
}
.ticker-badge.kr { background: #1f3540; color: #64c8ea; }
.ticker-badge.us { background: #1f2d4a; color: #79c0ff; }
.company-name-wrap { flex: 1; }
.company-name-main { font-size: 28px; font-weight: 700; line-height: 1.2; margin-bottom: 4px; }
.company-sub { font-size: 13px; color: var(--text3); }
.price-block { text-align: right; flex-shrink: 0; }
.current-price { font-size: 28px; font-weight: 700; }
.price-change { font-size: 14px; font-weight: 600; margin-top: 2px; }
.price-change.pos { color: var(--green); }
.price-change.neg { color: var(--red); }
.price-loading { font-size: 14px; color: var(--text3); }

/* Stats Bar */
.stats-bar {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 32px;
}
.stat-card {
  background: var(--bg2); border: 1px solid var(--border); border-radius: 10px;
  padding: 14px 16px;
}
.stat-label { font-size: 11px; color: var(--text3); font-weight: 500; text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 6px; }
.stat-value { font-size: 22px; font-weight: 700; }
.stat-value.green { color: var(--green); }
.stat-value.blue { color: var(--blue); }
.stat-value.yellow { color: var(--yellow); }

/* Section Headers */
.section-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
.section-title svg { color: var(--text3); }

/* Chart Section */
.chart-section { margin-bottom: 36px; }
.chart-container {
  background: var(--bg2); border: 1px solid var(--border); border-radius: 12px;
  padding: 20px;
}
.chart-range-btns { display: flex; gap: 6px; margin-bottom: 16px; }
.range-btn {
  padding: 4px 12px; border-radius: 6px; font-size: 12px; font-weight: 600;
  border: 1px solid var(--border); background: none; color: var(--text3); cursor: pointer; transition: all 0.15s;
}
.range-btn.active, .range-btn:hover { background: var(--blue); border-color: var(--blue); color: #fff; }
.chart-wrap { position: relative; height: 280px; }
.chart-loading { text-align: center; padding: 60px; color: var(--text3); font-size: 13px; }

/* History Section */
.history-section { margin-bottom: 36px; }
.history-table-wrap { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.history-table { width: 100%; border-collapse: collapse; }
.history-table th {
  font-size: 11px; font-weight: 600; color: var(--text3); text-align: left;
  padding: 12px 16px; background: var(--bg3); border-bottom: 1px solid var(--border);
  text-transform: uppercase; letter-spacing: 0.4px;
}
.history-table td {
  padding: 13px 16px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: middle;
}
.history-table tr:last-child td { border-bottom: none; }
.history-table tr:hover td { background: rgba(255,255,255,0.02); }
.date-cell { color: var(--text3); white-space: nowrap; font-size: 12px; }
.issue-link {
  color: var(--text); text-decoration: none; font-weight: 500;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.issue-link:hover { color: var(--blue); }
.upside-cell { font-weight: 700; white-space: nowrap; }
.upside-cell.pos { color: var(--green); }
.upside-cell.neg { color: var(--red); }
.return-cell { white-space: nowrap; }
.return-badge {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 5px;
}
.return-badge.accurate { background: var(--green-dim); color: var(--green); }
.return-badge.inaccurate { background: var(--red-dim); color: var(--red); }
.return-badge.pending { background: var(--bg3); color: var(--text3); }
.empty-row td { text-align: center; color: var(--text3); padding: 40px; }

/* Loading / Error */
.loading-state { text-align: center; padding: 80px 24px; }
.spinner { width: 36px; height: 36px; border: 2px solid var(--border); border-top-color: var(--blue); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 700px) {
  .company-name-main { font-size: 20px; }
  .current-price { font-size: 20px; }
  .stats-bar { grid-template-columns: repeat(2, 1fr); }
  .history-table th:nth-child(1), .history-table td:nth-child(1) { display: none; }
  .history-table th:nth-child(4), .history-table td:nth-child(4) { display: none; }
}
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <a href="/" class="back-btn">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      피드로 돌아가기
    </a>
    <span class="logo-sm">Stock<span>Ripple</span></span>
  </div>
</header>

<div class="page-wrap" id="pageWrap">
  <div class="loading-state">
    <div class="spinner"></div>
    <p style="color:var(--text2)">종목 정보 불러오는 중...</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://nmvfffzpkqyzztiobwtt.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_22PPW0eCY3Tvy3vZVZYKFw_yCb8cI2f';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function escHtml(s) {
  return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtDate(d) {
  if (!d) return '—';
  return new Date(d).toLocaleDateString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit' });
}

let _lineChart = null;
let _currentTicker = '';
let _currentRange = '3mo';
let _isKr = false;

async function loadPrice(ticker) {
  try {
    const res = await fetch(`/api/stock-price?ticker=${encodeURIComponent(ticker)}`);
    return await res.json();
  } catch(e) { return null; }
}

async function loadChartData(ticker, range) {
  try {
    const res = await fetch(`/api/stock-chart?ticker=${encodeURIComponent(ticker)}&range=${range}`);
    return await res.json();
  } catch(e) { return null; }
}

function renderLineChart(data) {
  const wrap = document.getElementById('mainChartWrap');
  if (!wrap) return;
  wrap.innerHTML = '<canvas id="mainChartCanvas"></canvas>';
  const ctx = document.getElementById('mainChartCanvas');

  const { points, currentPrice, currency } = data;
  const values = points.map(p => p.close);
  const labels = points.map(p => p.date);
  const first = values[0];
  const last = currentPrice || values[values.length - 1];
  const isUp = last >= first;
  const lineColor = isUp ? '#3fb950' : '#f85149';

  if (_lineChart) { _lineChart.destroy(); _lineChart = null; }
  _lineChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        data: values,
        borderColor: lineColor,
        borderWidth: 2,
        pointRadius: 0,
        tension: 0.2,
        fill: true,
        backgroundColor: (ctx2) => {
          const g = ctx2.chart.ctx.createLinearGradient(0, 0, 0, ctx2.chart.height);
          g.addColorStop(0, isUp ? 'rgba(63,185,80,0.25)' : 'rgba(248,81,73,0.25)');
          g.addColorStop(1, 'rgba(0,0,0,0)');
          return g;
        },
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: c => {
              const v = c.raw;
              const fmt = new Intl.NumberFormat('en-US', {
                style: 'currency', currency: currency || 'USD',
                maximumFractionDigits: currency === 'KRW' ? 0 : 2
              });
              return ' ' + fmt.format(v);
            }
          },
          backgroundColor: '#161b22', borderColor: '#30363d', borderWidth: 1,
          titleColor: '#8b949e', bodyColor: '#e6edf3',
        }
      },
      scales: {
        x: {
          ticks: {
            color: '#8b949e', font: { size: 10 }, maxTicksLimit: 6,
            callback(val, i) { return labels[i]?.slice(5); }
          },
          grid: { color: '#21262d' }
        },
        y: {
          ticks: {
            color: '#8b949e', font: { size: 10 },
            callback: v => currency === 'KRW' ? v.toLocaleString('ko-KR') : v.toFixed(0)
          },
          grid: { color: '#21262d' }
        }
      }
    }
  });
}

async function selectRange(range) {
  _currentRange = range;
  document.querySelectorAll('.range-btn').forEach(b => b.classList.toggle('active', b.dataset.range === range));
  const wrap = document.getElementById('mainChartWrap');
  if (wrap) wrap.innerHTML = '<div class="chart-loading">차트 불러오는 중...</div>';
  const data = await loadChartData(_currentTicker, range);
  if (!data || !data.points || !data.points.length) {
    if (wrap) wrap.innerHTML = '<div class="chart-loading" style="color:var(--red)">차트 데이터를 불러올 수 없습니다.</div>';
    return;
  }
  renderLineChart(data);
}

function buildReturnCell(r1d, acc1d, r7d, acc7d) {
  if (r1d != null) {
    const sign = r1d >= 0 ? '+' : '';
    const cls = acc1d === true ? 'accurate' : acc1d === false ? 'inaccurate' : 'pending';
    const mark = acc1d === true ? '✓' : acc1d === false ? '✗' : '';
    return `<span class="return-badge ${cls}">${sign}${Number(r1d).toFixed(1)}% (1일) ${mark}</span>`;
  }
  if (r7d != null) {
    const sign = r7d >= 0 ? '+' : '';
    const cls = acc7d === true ? 'accurate' : acc7d === false ? 'inaccurate' : 'pending';
    const mark = acc7d === true ? '✓' : acc7d === false ? '✗' : '';
    return `<span class="return-badge ${cls}">${sign}${Number(r7d).toFixed(1)}% (7일) ${mark}</span>`;
  }
  return `<span class="return-badge pending">검증 대기</span>`;
}

function renderPage(company, records, priceData) {
  const isKr = company.market === 'KR';
  const ticker = company.ticker;
  const name = company.name_ko || company.name_en || ticker;
  const sector = company.sector || '';

  // Price block
  let priceHtml = '<span class="price-loading">주가 로딩 중...</span>';
  if (priceData && priceData.price) {
    const fmt = new Intl.NumberFormat('en-US', {
      style: 'currency', currency: priceData.currency || 'USD',
      maximumFractionDigits: priceData.currency === 'KRW' ? 0 : 2
    });
    priceHtml = `<div class="current-price">${fmt.format(priceData.price)}</div>`;
    if (priceData.changePercent != null) {
      const sign = priceData.changePercent >= 0 ? '+' : '';
      const cls = priceData.changePercent >= 0 ? 'pos' : 'neg';
      priceHtml += `<div class="price-change ${cls}">${sign}${Number(priceData.changePercent).toFixed(2)}%</div>`;
    }
  }

  // Stats
  const totalCount = records.length;
  const upsides = records.filter(r => r.upside_pct != null).map(r => r.upside_pct);
  const avgUpside = upsides.length ? (upsides.reduce((a,b) => a+b, 0) / upsides.length).toFixed(1) : null;
  const acc1dList = records.filter(r => r.is_accurate_1d != null);
  const acc7dList = records.filter(r => r.is_accurate_7d != null);
  const acc1dPct = acc1dList.length ? Math.round(acc1dList.filter(r => r.is_accurate_1d).length / acc1dList.length * 100) : null;
  const acc7dPct = acc7dList.length ? Math.round(acc7dList.filter(r => r.is_accurate_7d).length / acc7dList.length * 100) : null;

  // History rows
  const historyRows = records.map(r => {
    const issue = r.analyses?.issues;
    const analysisId = r.analyses?.id;
    const issueTitle = issue?.title || '(제목 없음)';
    const publishedAt = issue?.published_at;
    const date = fmtDate(r.entry_date || publishedAt);
    const upside = r.upside_pct != null ? r.upside_pct : null;
    const upsideSign = upside != null ? (upside >= 0 ? '+' : '') : '';
    const upsideClass = upside != null ? (upside >= 0 ? 'pos' : 'neg') : '';
    const upsideText = upside != null ? `${upsideSign}${upside}%` : '—';
    const returnCell = buildReturnCell(r.actual_return_1d, r.is_accurate_1d, r.actual_return_7d, r.is_accurate_7d);
    const issueHref = analysisId ? `analysis.html?id=${encodeURIComponent(r.analyses?.issues?.id || analysisId)}` : '#';
    return `
      <tr>
        <td class="date-cell">${date}</td>
        <td><a href="${escHtml(issueHref)}" class="issue-link">${escHtml(issueTitle)}</a></td>
        <td class="upside-cell ${upsideClass}">${upsideText}</td>
        <td class="return-cell">${returnCell}</td>
      </tr>`;
  }).join('');

  const html = `
    <div class="company-header">
      <div class="company-header-top">
        <span class="ticker-badge ${isKr ? 'kr' : 'us'}">${escHtml(ticker)}</span>
        <div class="company-name-wrap">
          <div class="company-name-main">${escHtml(name)}</div>
          <div class="company-sub">${isKr ? '한국 상장' : '미국 상장'}${sector ? ' · ' + escHtml(sector) : ''}</div>
        </div>
        <div class="price-block" id="priceBlock">${priceHtml}</div>
      </div>
    </div>

    <div class="stats-bar">
      <div class="stat-card">
        <div class="stat-label">등장 횟수</div>
        <div class="stat-value blue">${totalCount}회</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">평균 예상 상승률</div>
        <div class="stat-value ${avgUpside != null && avgUpside >= 0 ? 'green' : ''}">${avgUpside != null ? (avgUpside >= 0 ? '+' : '') + avgUpside + '%' : '—'}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">1일 정확도</div>
        <div class="stat-value ${acc1dPct != null && acc1dPct >= 50 ? 'green' : 'yellow'}">${acc1dPct != null ? acc1dPct + '%' : '—'}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">7일 정확도</div>
        <div class="stat-value ${acc7dPct != null && acc7dPct >= 50 ? 'green' : 'yellow'}">${acc7dPct != null ? acc7dPct + '%' : '—'}</div>
      </div>
    </div>

    <div class="chart-section">
      <div class="section-title">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        주가 차트
      </div>
      <div class="chart-container">
        <div class="chart-range-btns">
          <button class="range-btn" data-range="1mo" onclick="selectRange('1mo')">1개월</button>
          <button class="range-btn active" data-range="3mo" onclick="selectRange('3mo')">3개월</button>
          <button class="range-btn" data-range="6mo" onclick="selectRange('6mo')">6개월</button>
          <button class="range-btn" data-range="1y" onclick="selectRange('1y')">1년</button>
        </div>
        <div class="chart-wrap" id="mainChartWrap">
          <div class="chart-loading">차트 불러오는 중...</div>
        </div>
      </div>
    </div>

    <div class="history-section">
      <div class="section-title">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        분석 이력 <span style="font-size:13px;color:var(--text2);font-weight:400">(${totalCount}건)</span>
      </div>
      <div class="history-table-wrap">
        <table class="history-table">
          <thead>
            <tr>
              <th>날짜</th>
              <th>이슈</th>
              <th>예상 상승률</th>
              <th>실제 수익률</th>
            </tr>
          </thead>
          <tbody>
            ${historyRows || '<tr class="empty-row"><td colspan="4">분석 이력이 없습니다.</td></tr>'}
          </tbody>
        </table>
      </div>
    </div>
  `;

  document.getElementById('pageWrap').innerHTML = html;

  // Load chart
  loadChartData(ticker, _currentRange).then(data => {
    if (data && data.points && data.points.length) {
      renderLineChart(data);
    } else {
      const wrap = document.getElementById('mainChartWrap');
      if (wrap) wrap.innerHTML = '<div class="chart-loading" style="color:var(--red)">차트 데이터를 불러올 수 없습니다.</div>';
    }
  });
}

async function init() {
  const params = new URLSearchParams(location.search);
  const ticker = params.get('ticker');
  if (!ticker) { location.href = '/'; return; }

  _currentTicker = ticker;

  const { data: company, error: compErr } = await sb
    .from('companies')
    .select('id,ticker,name_ko,name_en,market,sector')
    .eq('ticker', ticker)
    .single();

  if (compErr || !company) {
    document.getElementById('pageWrap').innerHTML = `
      <div class="loading-state">
        <p style="color:var(--red)">종목 <strong>${escHtml(ticker)}</strong>을(를) 찾을 수 없습니다.</p>
      </div>`;
    return;
  }

  document.title = `${company.name_ko || company.name_en || ticker} (${ticker}) — StockRipple`;
  _isKr = company.market === 'KR';

  const [priceData, { data: records }] = await Promise.all([
    loadPrice(ticker),
    sb.from('analysis_companies')
      .select('upside_pct,confidence,actual_return_1d,is_accurate_1d,actual_return_7d,is_accurate_7d,entry_date,analyses(id,confidence_score,issues(id,title,published_at,source_name))')
      .eq('company_id', company.id)
      .order('entry_date', { ascending: false }),
  ]);

  renderPage(company, records || [], priceData);
}

init();
</script>
</body>
</html>
