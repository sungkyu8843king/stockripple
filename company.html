<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>종목 상세 — StockRipple</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg: #ffffff; --bg2: #f6f6f8; --bg3: #ececf0; --bg4: #dededf;
  --border: #e5e5ea; --border-strong: #c4c4c9; --border-soft: rgba(0,0,0,0.06);
  --text: #0a0a0a; --text2: #4b4b52; --text3: #86868b;
  --blue: #0066cc; --blue-dim: rgba(0,102,204,0.10);
  --green: #00873a; --green-dim: rgba(0,135,58,0.10);
  --red:   #e31937; --red-dim:   rgba(227,25,55,0.10);
  --yellow:#b8860b; --yellow-dim:rgba(184,134,11,0.12);
  --purple:#7c3aed; --purple-dim:rgba(124,58,237,0.10);
  --shadow-card: 0 1px 3px rgba(0,0,0,0.04), 0 8px 24px rgba(0,0,0,0.06);
  --r-lg: 20px; --r-md: 14px; --r-sm: 10px; --r-pill: 999px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

.header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(255,255,255,0.85); backdrop-filter: blur(12px) saturate(180%);
  border-bottom: 1px solid var(--border); padding: 0 24px;
}
.header-inner {
  max-width: 1100px; margin: 0 auto;
  display: flex; align-items: center; gap: 16px; height: 56px;
}
.back-btn {
  display: flex; align-items: center; gap: 6px; color: var(--text2);
  text-decoration: none; font-size: 13px; background: none; border: none; cursor: pointer;
  padding: 5px 10px; border-radius: 6px; transition: all 0.15s;
}
.back-btn:hover { background: var(--bg3); color: var(--text); }
.logo-sm { font-size: 14px; font-weight: 700; color: var(--text2); }
.logo-sm span { color: var(--blue); }

.page-wrap { max-width: 1100px; margin: 0 auto; padding: 32px 24px 60px; }

/* Company Header */
.company-header { margin-bottom: 28px; }
.company-header-top { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
.ticker-badge {
  font-size: 14px; font-weight: 700; font-family: 'SF Mono', 'Fira Code', monospace;
  padding: 6px 14px; border-radius: 8px; white-space: nowrap; flex-shrink: 0;
}
.ticker-badge.kr { background: rgba(0,102,204,0.10); color: #0066cc; }
.ticker-badge.us { background: rgba(124,58,237,0.10); color: #7c3aed; }
.company-name-wrap { flex: 1; }
.company-name-main { font-size: 28px; font-weight: 700; line-height: 1.2; margin-bottom: 4px; }
.company-sub { font-size: 13px; color: var(--text3); }
.price-block { text-align: right; flex-shrink: 0; }
.current-price { font-size: 28px; font-weight: 700; }
.price-change { font-size: 14px; font-weight: 600; margin-top: 2px; }
.price-change.pos { color: var(--green); }
.price-change.neg { color: var(--red); }
.price-loading { font-size: 14px; color: var(--text3); }

/* Stats Bar */
.stats-bar {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 32px;
}
.stat-card {
  background: var(--bg2); border: 1px solid var(--border); border-radius: 10px;
  padding: 14px 16px;
}
.stat-label { font-size: 11px; color: var(--text3); font-weight: 500; text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 6px; }
.stat-value { font-size: 22px; font-weight: 700; }
.stat-value.green { color: var(--green); }
.stat-value.blue { color: var(--blue); }
.stat-value.yellow { color: var(--yellow); }

/* Section Headers */
.section-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
.section-title svg { color: var(--text3); }

/* Chart Section */
.chart-section { margin-bottom: 36px; }
.chart-container {
  background: var(--bg2); border: 1px solid var(--border); border-radius: 12px;
  padding: 20px;
}
.chart-range-btns { display: flex; gap: 6px; margin-bottom: 16px; }
.range-btn {
  padding: 4px 12px; border-radius: 6px; font-size: 12px; font-weight: 600;
  border: 1px solid var(--border); background: none; color: var(--text3); cursor: pointer; transition: all 0.15s;
}
.range-btn.active, .range-btn:hover { background: var(--blue); border-color: var(--blue); color: #fff; }
.chart-wrap { position: relative; height: 280px; }
.chart-loading { text-align: center; padding: 60px; color: var(--text3); font-size: 13px; }

/* History Section */
.history-section { margin-bottom: 36px; }
.history-table-wrap { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.history-table { width: 100%; border-collapse: collapse; }
.history-table th {
  font-size: 11px; font-weight: 600; color: var(--text3); text-align: left;
  padding: 12px 16px; background: var(--bg3); border-bottom: 1px solid var(--border);
  text-transform: uppercase; letter-spacing: 0.4px;
}
.history-table td {
  padding: 13px 16px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: middle;
}
.history-table tr:last-child td { border-bottom: none; }
.history-table tr:hover td { background: rgba(255,255,255,0.02); }
.date-cell { color: var(--text3); white-space: nowrap; font-size: 12px; }
.issue-link {
  color: var(--text); text-decoration: none; font-weight: 500;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.issue-link:hover { color: var(--blue); }
.upside-cell { font-weight: 700; white-space: nowrap; }
.upside-cell.pos { color: var(--green); }
.upside-cell.neg { color: var(--red); }
.return-cell { white-space: nowrap; }
.return-badge {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 5px;
}
.return-badge.accurate { background: var(--green-dim); color: var(--green); }
.return-badge.inaccurate { background: var(--red-dim); color: var(--red); }
.return-badge.pending { background: var(--bg3); color: var(--text3); }
.empty-row td { text-align: center; color: var(--text3); padding: 40px; }

/* AI Summary */
.ai-summary-card {
  background: linear-gradient(135deg, rgba(0,102,204,0.06) 0%, rgba(0,102,204,0.015) 100%);
  border: 1px solid rgba(0,102,204,0.20);
  border-radius: var(--r-lg, 20px); padding: 22px; margin-bottom: 24px;
  box-shadow: var(--shadow-card, 0 1px 3px rgba(0,0,0,0.04));
}
.ai-badge-row { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
.ai-badge { font-size: 11px; color: #0066cc; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; }
.ai-dot { width: 7px; height: 7px; border-radius: 50%; background: #0066cc; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
.ai-block { margin-bottom: 16px; }
.ai-block:last-child { margin-bottom: 0; }
.ai-block-label { font-size: 12px; color: var(--text2); font-weight: 700; margin-bottom: 6px; letter-spacing: 0.2px; }
.ai-block-text { font-size: 14px; line-height: 1.7; color: var(--text); }
.ai-risks { display: flex; flex-direction: column; gap: 6px; }
.ai-risk-item { font-size: 13.5px; color: #a25b00; line-height: 1.55; padding-left: 18px; position: relative; font-weight: 500; }
.ai-risk-item::before { content: '⚠️'; position: absolute; left: -2px; }
.ai-watch-item { font-size: 13.5px; color: #006b2e; line-height: 1.55; padding-left: 18px; position: relative; font-weight: 500; }
.ai-watch-item::before { content: '👁'; position: absolute; left: -2px; }

/* Trade box */
.trade-box {
  display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; padding: 16px;
  background: linear-gradient(135deg, rgba(63,185,80,.08), rgba(47,129,247,.08));
  border: 1px solid rgba(63,185,80,.25); border-radius: 10px; margin-bottom: 14px;
}
.trade-cell { text-align: center; }
.trade-cell + .trade-cell { border-left: 1px solid var(--border); }
.trade-label { font-size: 10px; color: var(--text3); margin-bottom: 4px; }
.trade-val { font-size: 16px; font-weight: 700; font-family: 'SF Mono', monospace; }
.trade-val.buy { color: var(--blue); }
.trade-val.tg  { color: var(--green); }
.trade-val.sl  { color: var(--red); }

/* Tech chips */
.tech-chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0; }
.tech-chip {
  font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 5px;
  background: var(--bg3); color: var(--text2);
}

/* Fundamentals grid */
.fund-section { margin-bottom: 24px; }
.fund-group {
  background: var(--bg2); border: 1px solid var(--border); border-radius: 12px;
  padding: 18px; margin-bottom: 12px;
}
.fund-group-title { font-size: 12px; color: var(--text3); font-weight: 700; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.6px; display: flex; align-items: center; gap: 6px; }
.fund-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.fund-item { padding: 10px 12px; background: var(--bg3); border-radius: 8px; }
.fund-label { font-size: 11px; color: var(--text3); margin-bottom: 4px; }
.fund-val { font-size: 15px; font-weight: 700; font-family: 'SF Mono', monospace; color: var(--text); }
.fund-val.good { color: var(--green); }
.fund-val.bad  { color: var(--red); }
.fund-val.warn { color: var(--yellow); }
.fund-val.dim  { color: var(--text3); font-size: 13px; }
.fund-sub { font-size: 10px; color: var(--text3); margin-top: 2px; font-family: 'SF Mono', monospace; }
.fund-sub.pos { color: var(--green); }
.fund-sub.neg { color: var(--red); }
@media (max-width: 700px) {
  .fund-grid { grid-template-columns: repeat(2, 1fr); }
}

/* TradingView wrapper */
.tv-wrap {
  background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
  margin-bottom: 24px;
}
.tv-header { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.tv-tabs { display: flex; gap: 4px; }
.tv-tab { padding: 4px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; background: var(--bg3); border: 1px solid var(--border); color: var(--text2); }
.tv-tab.active { background: var(--blue); color: #fff; border-color: var(--blue); }
.tv-frame { width: 100%; height: 500px; border: none; }

/* Loading / Error */
.loading-state { text-align: center; padding: 80px 24px; }
.spinner { width: 36px; height: 36px; border: 2px solid var(--border); border-top-color: var(--blue); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 700px) {
  .company-name-main { font-size: 20px; }
  .current-price { font-size: 20px; }
  .stats-bar { grid-template-columns: repeat(2, 1fr); }
  .history-table th:nth-child(1), .history-table td:nth-child(1) { display: none; }
  .history-table th:nth-child(4), .history-table td:nth-child(4) { display: none; }
}
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <a href="/" class="back-btn">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      피드로 돌아가기
    </a>
    <span class="logo-sm">Stock<span>Ripple</span></span>
  </div>
</header>

<div class="page-wrap" id="pageWrap">
  <div class="loading-state">
    <div class="spinner"></div>
    <p style="color:var(--text2)">종목 정보 불러오는 중...</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://nmvfffzpkqyzztiobwtt.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_22PPW0eCY3Tvy3vZVZYKFw_yCb8cI2f';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function escHtml(s) {
  return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtDate(d) {
  if (!d) return '—';
  return new Date(d).toLocaleDateString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit' });
}

let _lineChart = null;
let _currentTicker = '';
let _currentRange = '3mo';
let _isKr = false;

async function loadPrice(ticker) {
  try {
    // /api/quotes는 정규장 + pre/post + marketState까지 한 번에 제공
    const res = await fetch(`/api/quotes?tickers=${encodeURIComponent(ticker)}`);
    if (!res.ok) return null;
    const j = await res.json();
    return j?.data?.[ticker] || null;
  } catch(e) { return null; }
}

async function loadChartData(ticker, range) {
  try {
    const res = await fetch(`/api/stock-chart?ticker=${encodeURIComponent(ticker)}&range=${range}`);
    return await res.json();
  } catch(e) { return null; }
}

function renderLineChart(data) {
  const wrap = document.getElementById('mainChartWrap');
  if (!wrap) return;
  wrap.innerHTML = '<canvas id="mainChartCanvas"></canvas>';
  const ctx = document.getElementById('mainChartCanvas');

  const { points, currentPrice, currency } = data;
  const values = points.map(p => p.close);
  const labels = points.map(p => p.date);
  const first = values[0];
  const last = currentPrice || values[values.length - 1];
  const isUp = last >= first;
  const lineColor = isUp ? '#00873a' : '#e31937';

  if (_lineChart) { _lineChart.destroy(); _lineChart = null; }
  _lineChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        data: values,
        borderColor: lineColor,
        borderWidth: 2,
        pointRadius: 0,
        tension: 0.2,
        fill: true,
        backgroundColor: (ctx2) => {
          const g = ctx2.chart.ctx.createLinearGradient(0, 0, 0, ctx2.chart.height);
          g.addColorStop(0, isUp ? 'rgba(0,135,58,0.18)' : 'rgba(227,25,55,0.18)');
          g.addColorStop(1, 'rgba(255,255,255,0)');
          return g;
        },
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: c => {
              const v = c.raw;
              const fmt = new Intl.NumberFormat('en-US', {
                style: 'currency', currency: currency || 'USD',
                maximumFractionDigits: currency === 'KRW' ? 0 : 2
              });
              return ' ' + fmt.format(v);
            }
          },
          backgroundColor: '#ffffff', borderColor: '#e5e5ea', borderWidth: 1,
          titleColor: '#4b4b52', bodyColor: '#0a0a0a',
        }
      },
      scales: {
        x: {
          ticks: {
            color: '#4b4b52', font: { size: 10 }, maxTicksLimit: 6,
            callback(val, i) { return labels[i]?.slice(5); }
          },
          grid: { color: '#e5e5ea' }
        },
        y: {
          ticks: {
            color: '#4b4b52', font: { size: 10 },
            callback: v => currency === 'KRW' ? v.toLocaleString('ko-KR') : v.toFixed(0)
          },
          grid: { color: '#e5e5ea' }
        }
      }
    }
  });
}

async function selectRange(range) {
  _currentRange = range;
  document.querySelectorAll('.range-btn').forEach(b => b.classList.toggle('active', b.dataset.range === range));
  const wrap = document.getElementById('mainChartWrap');
  if (wrap) wrap.innerHTML = '<div class="chart-loading">차트 불러오는 중...</div>';
  const data = await loadChartData(_currentTicker, range);
  if (!data || !data.points || !data.points.length) {
    if (wrap) wrap.innerHTML = '<div class="chart-loading" style="color:var(--red)">차트 데이터를 불러올 수 없습니다.</div>';
    return;
  }
  renderLineChart(data);
}

function buildReturnCell(r1d, acc1d, r7d, acc7d) {
  if (r1d != null) {
    const sign = r1d >= 0 ? '+' : '';
    const cls = acc1d === true ? 'accurate' : acc1d === false ? 'inaccurate' : 'pending';
    const mark = acc1d === true ? '✓' : acc1d === false ? '✗' : '';
    return `<span class="return-badge ${cls}">${sign}${Number(r1d).toFixed(1)}% (1일) ${mark}</span>`;
  }
  if (r7d != null) {
    const sign = r7d >= 0 ? '+' : '';
    const cls = acc7d === true ? 'accurate' : acc7d === false ? 'inaccurate' : 'pending';
    const mark = acc7d === true ? '✓' : acc7d === false ? '✗' : '';
    return `<span class="return-badge ${cls}">${sign}${Number(r7d).toFixed(1)}% (7일) ${mark}</span>`;
  }
  return `<span class="return-badge pending">검증 대기</span>`;
}

function renderPage(company, records, priceData) {
  const isKr = company.market === 'KR';
  const ticker = company.ticker;
  const name = company.name_ko || company.name_en || ticker;
  const sector = company.sector || '';

  // Price block — regular + pre/after-market
  let priceHtml = '<span class="price-loading">주가 로딩 중...</span>';
  if (priceData && priceData.price) {
    const fmt = new Intl.NumberFormat('en-US', {
      style: 'currency', currency: priceData.currency || 'USD',
      maximumFractionDigits: priceData.currency === 'KRW' ? 0 : 2
    });
    const stateMap = {
      REGULAR: { label: '🟢 정규장', color: 'var(--green)' },
      PRE:     { label: '🟡 프리장', color: 'var(--yellow)' },
      POST:    { label: '🟣 애프터장', color: 'var(--purple)' },
      CLOSED:  { label: '⚪ 마감',   color: 'var(--text3)' },
    };
    const st = stateMap[priceData.marketState] || stateMap.CLOSED;
    priceHtml = `<div style="font-size:11px;color:${st.color};font-weight:600;margin-bottom:3px">${st.label}</div>`;
    priceHtml += `<div class="current-price">${fmt.format(priceData.price)}</div>`;
    if (priceData.changePercent != null) {
      const sign = priceData.changePercent >= 0 ? '+' : '';
      const cls = priceData.changePercent >= 0 ? 'pos' : 'neg';
      priceHtml += `<div class="price-change ${cls}">${sign}${Number(priceData.changePercent).toFixed(2)}% <span style="font-size:10px;color:var(--text3);font-weight:500">정규</span></div>`;
    }
    // 시간외 호가 (프리/애프터) — 미장만
    let ahLabel = null, ahPrice = null, ahPct = null, ahColor = 'var(--purple)';
    if (priceData.postMarketPrice != null && priceData.postMarketChangePercent != null) {
      ahLabel = '애프터장'; ahPrice = priceData.postMarketPrice; ahPct = priceData.postMarketChangePercent; ahColor = 'var(--purple)';
    } else if (priceData.preMarketPrice != null && priceData.preMarketChangePercent != null) {
      ahLabel = '프리장'; ahPrice = priceData.preMarketPrice; ahPct = priceData.preMarketChangePercent; ahColor = 'var(--yellow)';
    }
    if (ahLabel) {
      const ahSign = ahPct >= 0 ? '+' : '';
      const ahChgColor = ahPct >= 0 ? 'var(--green)' : 'var(--red)';
      priceHtml += `
        <div style="margin-top:8px;padding-top:8px;border-top:1px dashed var(--border);text-align:right">
          <div style="display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;background:${ahColor === 'var(--purple)' ? 'var(--purple-dim)' : 'var(--yellow-dim)'};color:${ahColor};margin-bottom:3px">⏱ ${ahLabel}</div>
          <div style="font-size:18px;font-weight:700;color:var(--text);font-family:var(--font-mono,'SF Mono',monospace)">${fmt.format(ahPrice)}</div>
          <div style="font-size:12px;font-weight:700;color:${ahChgColor}">${ahSign}${ahPct.toFixed(2)}%</div>
        </div>`;
    }
  }

  // Stats
  const totalCount = records.length;
  const upsides = records.filter(r => r.upside_pct != null).map(r => r.upside_pct);
  const avgUpside = upsides.length ? (upsides.reduce((a,b) => a+b, 0) / upsides.length).toFixed(1) : null;
  const acc1dList = records.filter(r => r.is_accurate_1d != null);
  const acc7dList = records.filter(r => r.is_accurate_7d != null);
  const acc1dPct = acc1dList.length ? Math.round(acc1dList.filter(r => r.is_accurate_1d).length / acc1dList.length * 100) : null;
  const acc7dPct = acc7dList.length ? Math.round(acc7dList.filter(r => r.is_accurate_7d).length / acc7dList.length * 100) : null;

  // History rows
  const historyRows = records.map(r => {
    const issue = r.analyses?.issues;
    const analysisId = r.analyses?.id;
    const issueTitle = issue?.title || '(제목 없음)';
    const publishedAt = issue?.published_at;
    const date = fmtDate(r.entry_date || publishedAt);
    const upside = r.upside_pct != null ? r.upside_pct : null;
    const upsideSign = upside != null ? (upside >= 0 ? '+' : '') : '';
    const upsideClass = upside != null ? (upside >= 0 ? 'pos' : 'neg') : '';
    const upsideText = upside != null ? `${upsideSign}${upside}%` : '—';
    const returnCell = buildReturnCell(r.actual_return_1d, r.is_accurate_1d, r.actual_return_7d, r.is_accurate_7d);

// ── TradingView 차트 ──────────────────────────────────────
let _tvSymbol = '';
let _tvInterval = 'D';

function buildTvSymbol(ticker, market) {
  // 한국 주식: 005930.KS → KRX:005930
  if (/\.KS$/i.test(ticker)) return 'KRX:' + ticker.replace(/\.KS$/i, '');
  if (/\.KQ$/i.test(ticker)) return 'KOSDAQ:' + ticker.replace(/\.KQ$/i, '');
  // 미국 주식: 자동 인식 (대부분 NASDAQ:XXX 또는 NYSE:XXX)
  return ticker;
}

function loadTradingView(interval) {
  _tvInterval = interval;
  const frame = document.getElementById('tvFrame');
  if (!frame || !_tvSymbol) return;
  const sym = encodeURIComponent(_tvSymbol);
  // hide_side_toolbar=0 → 거래량/지표 도구 표시
  frame.src = `https://www.tradingview.com/widgetembed/?symbol=${sym}&interval=${interval}&theme=light&style=1&timezone=Asia%2FSeoul&locale=kr&hide_side_toolbar=0&allow_symbol_change=0&studies=Volume%40tv-basicstudies&save_image=0`;
}

function setTvInterval(interval, btn) {
  document.querySelectorAll('.tv-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  loadTradingView(interval);
}

// ── 매매 정보 박스 ────────────────────────────────────────
function renderTradeBox(records) {
  // [TRADE] 마커가 있는 가장 최근 분석을 사용
  const withTrade = (records || []).find(r => (r.rationale || '').includes('[TRADE]'));
  const wrap = document.getElementById('tradeBoxWrap');
  if (!withTrade || !wrap) { if (wrap) wrap.innerHTML = ''; return; }

  let trade = null, reason = '';
  try {
    const idx = withTrade.rationale.indexOf('[TRADE]');
    reason = withTrade.rationale.slice(0, idx).trim();
    trade = JSON.parse(withTrade.rationale.slice(idx + 7).trim());
  } catch { return; }

  const fmtP = v => (v > 0 ? '+' : '') + v + '%';
  const tfLabel = { '1w':'단기 1주', '1m':'중기 1개월', '3m':'중장기 3개월', '6m':'장기 6개월' };

  wrap.innerHTML = `
    <div class="section-title" style="margin-top:8px">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      AI 추천 매매 가이드 ${trade.tf ? `<span style="font-size:12px;color:var(--blue);font-weight:600;margin-left:6px">${tfLabel[trade.tf] || trade.tf}</span>` : ''}
    </div>
    <div class="trade-box">
      <div class="trade-cell">
        <div class="trade-label">매수가 (현재가 대비)</div>
        <div class="trade-val buy">${trade.elp != null ? fmtP(trade.elp) : '—'} ~ ${trade.ehp != null ? fmtP(trade.ehp) : '—'}</div>
      </div>
      <div class="trade-cell">
        <div class="trade-label">목표</div>
        <div class="trade-val tg">${trade.tp != null ? fmtP(trade.tp) : '—'}</div>
      </div>
      <div class="trade-cell">
        <div class="trade-label">손절</div>
        <div class="trade-val sl">${trade.sl != null ? fmtP(trade.sl) : '—'}</div>
      </div>
    </div>
    ${trade.th ? `<div style="font-size:13px;color:#00873a;margin-bottom:6px;line-height:1.55"><b>💡 매수 근거:</b> ${escHtml(trade.th)}</div>` : ''}
    ${trade.rk ? `<div style="font-size:13px;color:#a25b00;margin-bottom:16px;line-height:1.55;font-weight:500"><b>⚠️ 리스크:</b> ${escHtml(trade.rk)}</div>` : ''}
  `;
}

// ── 기술 지표 chip ────────────────────────────────────────
async function loadTechChips(ticker) {
  const wrap = document.getElementById('techChipsWrap');
  if (!wrap) return;
  wrap.innerHTML = '<div style="font-size:11px;color:var(--text3);margin:8px 0">기술 지표 로딩...</div>';
  try {
    const r = await fetch(`/api/technicals?tickers=${encodeURIComponent(ticker)}`);
    if (!r.ok) { wrap.innerHTML = ''; return; }
    const j = await r.json();
    const info = j?.data?.[ticker];
    if (!info) { wrap.innerHTML = ''; return; }

    const sigMap = {
      strong_bullish: { label: '🟢 강세 추세',  color: 'var(--green)' },
      bullish:        { label: '🟢 상승',       color: 'var(--green)' },
      oversold_bull:  { label: '🟢 과매도(매수기회)', color: '#00873a' },
      neutral:        { label: '⚪ 중립',       color: 'var(--text2)' },
      overbought:     { label: '🟡 과매수',     color: 'var(--yellow)' },
      oversold:       { label: '🟠 과매도',     color: 'var(--yellow)' },
      bearish:        { label: '🔴 하락',       color: 'var(--red)' },
      strong_bearish: { label: '🔴 약세 추세',  color: 'var(--red)' },
    };
    const sig = sigMap[info.signal] || sigMap.neutral;

    const chips = [
      `<span class="tech-chip" style="color:${sig.color}">${sig.label}</span>`,
    ];
    if (info.rsi14 != null) {
      const rsiColor = info.rsi14 >= 70 ? 'var(--yellow)' : info.rsi14 <= 30 ? 'var(--yellow)' : 'var(--text2)';
      chips.push(`<span class="tech-chip" style="color:${rsiColor}">RSI 14: ${info.rsi14}</span>`);
    }
    if (info.vsSma20  != null) chips.push(`<span class="tech-chip" style="color:${info.vsSma20  > 0 ? 'var(--green)' : 'var(--red)'}">20일선 ${info.vsSma20  > 0 ? '+' : ''}${info.vsSma20}%</span>`);
    if (info.vsSma50  != null) chips.push(`<span class="tech-chip" style="color:${info.vsSma50  > 0 ? 'var(--green)' : 'var(--red)'}">50일선 ${info.vsSma50  > 0 ? '+' : ''}${info.vsSma50}%</span>`);
    if (info.vsSma200 != null) chips.push(`<span class="tech-chip" style="color:${info.vsSma200 > 0 ? 'var(--green)' : 'var(--red)'}">200일선 ${info.vsSma200 > 0 ? '+' : ''}${info.vsSma200}%</span>`);

    wrap.innerHTML = `<div class="tech-chips">${chips.join('')}</div>`;
  } catch { wrap.innerHTML = ''; }
}

// ── 펀더멘털 표시 ────────────────────────────────────────
async function loadFundamentals(ticker, forceRefresh = false) {
  const wrap = document.getElementById('fundamentalsWrap');
  if (!wrap) return;
  wrap.innerHTML = `
    <div class="fund-section">
      <div class="section-title">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        펀더멘털 <span style="font-size:11px;color:var(--text3);font-weight:400">불러오는 중...</span>
        <span class="spinner" style="width:14px;height:14px;border-width:2px;margin:0 0 0 8px"></span>
      </div>
    </div>`;
  try {
    const url = `/api/stock?type=fundamentals&ticker=${encodeURIComponent(ticker)}${forceRefresh ? '&nocache=' + Date.now() : ''}`;
    const r = await fetch(url);
    if (!r.ok) {
      renderFundamentalsError(wrap, ticker, `서버 에러 (HTTP ${r.status})`);
      return;
    }
    const f = await r.json();
    if (!f.ok) {
      renderFundamentalsError(wrap, ticker, f.error || '데이터 없음', f.hint, f.resetKst);
      return;
    }
    renderFundamentals(wrap, f, ticker);
  } catch (e) {
    renderFundamentalsError(wrap, ticker, '네트워크 에러: ' + e.message);
  }
}

  wrap.innerHTML = `

        펀더멘털
        <button onclick="loadFundamentals('${escHtml(ticker)}', true)" style="margin-left:auto;background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:5px 12px;border-radius:6px;cursor:pointer;font-size:12px">🔄 다시 시도</button>
      </div>
      <div class="fund-group" style="text-align:center;padding:32px">
        <div style="font-size:14px;color:var(--yellow);margin-bottom:8px">⚠️ ${escHtml(message)}</div>

        <div style="font-size:11px;color:var(--text3);margin-top:14px">기존에 한 번 가져온 종목은 캐시로 자동 표시됨 (한도와 무관)</div>
      </div>

}

function renderFundamentals(wrap, f, ticker) {
  // 포맷 헬퍼
  const fmtNum = (v, digits = 2) => v == null ? '—' : Number(v).toFixed(digits);
  const fmtPct = v => v == null ? '—' : (v > 0 ? '+' : '') + Number(v).toFixed(1) + '%';
  const fmtPctRaw = v => v == null ? '—' : Number(v).toFixed(1) + '%';
  const fmtMoney = v => {
    if (v == null) return '—';
    const abs = Math.abs(v);
    if (abs >= 1e12) return `$${(v/1e12).toFixed(2)}T`;
    if (abs >= 1e9)  return `$${(v/1e9).toFixed(2)}B`;
    if (abs >= 1e6)  return `$${(v/1e6).toFixed(0)}M`;
    return `$${Number(v).toFixed(0)}`;
  };

  // 색상 판정 (값이 좋은지/나쁜지)
  const peColor = f.pe == null ? '' : f.pe < 15 ? 'good' : f.pe < 30 ? '' : f.pe < 50 ? 'warn' : 'bad';
  const pbColor = f.pb == null ? '' : f.pb < 1 ? 'good' : f.pb < 3 ? '' : f.pb < 5 ? 'warn' : 'bad';
  const roeColor = f.roe == null ? '' : f.roe > 15 ? 'good' : f.roe > 5 ? '' : f.roe > 0 ? 'warn' : 'bad';
  const opMarginColor = f.operatingMargin == null ? '' : f.operatingMargin > 20 ? 'good' : f.operatingMargin > 5 ? '' : f.operatingMargin > 0 ? 'warn' : 'bad';
  const debtColor = f.debtToEquity == null ? '' : f.debtToEquity < 0.5 ? 'good' : f.debtToEquity < 1.5 ? '' : f.debtToEquity < 3 ? 'warn' : 'bad';
  const currColor = f.currentRatio == null ? '' : f.currentRatio > 2 ? 'good' : f.currentRatio > 1 ? '' : 'bad';
  const revGrColor = f.revenueGrowthYoY == null ? '' : f.revenueGrowthYoY > 10 ? 'good' : f.revenueGrowthYoY > 0 ? '' : 'bad';

  const html = `
    <div class="fund-section">

          ${f.dividendYield ? `<div class="fund-item"><div class="fund-label">배당수익률</div><div class="fund-val">${(f.dividendYield * 100).toFixed(2)}%</div></div>` : ''}

  wrap.innerHTML = html;
}

// Yahoo Finance에서 정보 가져와 companies 테이블에 자동 등록
async function autoRegisterCompany(ticker) {
  try {
    // /api/quotes로 회사 정보 조회 (시세 + 통화 + marketState 가져옴)
    const r = await fetch(`/api/quotes?tickers=${encodeURIComponent(ticker)}`);
    if (!r.ok) return null;
    const j = await r.json();
    const q = j?.data?.[ticker];
    if (!q || q.price == null) return null;

    // 시장 자동 판별 (.KS = 한국, 그 외 = 미국)
    const market = /\.KS$|\.KQ$/i.test(ticker) ? 'KR' : 'US';

    // Yahoo의 v8/chart로 회사명 가져오기
    let companyName = ticker;
    try {
      const r2 = await fetch(`https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(ticker)}?interval=1d&range=1d`);
      if (r2.ok) {
        const cd = await r2.json();
        companyName = cd?.chart?.result?.[0]?.meta?.longName
                   || cd?.chart?.result?.[0]?.meta?.shortName
                   || ticker;
      }
    } catch {}

    // DB에 INSERT (RLS: companies는 보통 public read + service write)
    const { data: inserted, error } = await sb.from('companies').insert({
      ticker,
      name_en: companyName,
      name_ko: companyName,  // 한국어 이름은 영문명으로 폴백, 추후 admin에서 보정
      market,
      current_price: q.price,
      currency: q.currency || (market === 'KR' ? 'KRW' : 'USD'),
      price_updated_at: new Date().toISOString(),
    }).select('id,ticker,name_ko,name_en,market,sector').single();

    if (error) {
      // 동시 요청으로 이미 만들어졌을 가능성 → 다시 조회
      const { data: existing } = await sb.from('companies')
        .select('id,ticker,name_ko,name_en,market,sector').eq('ticker', ticker).maybeSingle();
      return existing || null;
    }
    return inserted;
  } catch (e) {
    console.warn('autoRegisterCompany error:', e);
    return null;
  }
}

async function init() {
  const params = new URLSearchParams(location.search);
  const ticker = (params.get('ticker') || '').toUpperCase().trim();
  if (!ticker) { location.href = '/'; return; }

  _currentTicker = ticker;

  let { data: company } = await sb
    .from('companies')
    .select('id,ticker,name_ko,name_en,market,sector')
    .eq('ticker', ticker)
    .maybeSingle();

  // DB에 없으면 Yahoo에서 가져와서 자동 등록
  if (!company) {
    document.getElementById('pageWrap').innerHTML = `
      <div class="loading-state">
        <div class="spinner"></div>
        <p style="color:var(--text2)"><strong>${escHtml(ticker)}</strong> 정보를 Yahoo Finance에서 가져오는 중...</p>
      </div>`;
    company = await autoRegisterCompany(ticker);
    if (!company) {
      document.getElementById('pageWrap').innerHTML = `
        <div class="loading-state">
          <p style="color:var(--red)">❌ 종목 <strong>${escHtml(ticker)}</strong>을(를) 찾을 수 없습니다.</p>
          <p style="color:var(--text3);font-size:13px;margin-top:8px">
            Yahoo Finance에서도 검색 실패. 올바른 티커인지 확인해 주세요.<br>
            예: AAPL, MSFT, NVDA, 005930.KS, 035420.KS
          </p>
          <a href="/" class="back-btn" style="display:inline-block;margin-top:14px;padding:8px 16px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text)">← 메인으로</a>
        </div>`;
      return;
    }
  }

  document.title = `${company.name_ko || company.name_en || ticker} (${ticker}) — StockRipple`;
  _isKr = company.market === 'KR';

  const [priceData, { data: records }] = await Promise.all([
    loadPrice(ticker),
    sb.from('analysis_companies')
      .select('upside_pct,confidence,rationale,actual_return_1d,is_accurate_1d,actual_return_7d,is_accurate_7d,entry_date,analyses(id,confidence_score,issues(id,title,published_at,source_name))')
      .eq('company_id', company.id)
      .order('entry_date', { ascending: false }),
  ]);

  renderPage(company, records || [], priceData);
}

init();
