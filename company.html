<style>
:root {
  /* 소프트 핀테크 다크 (2026-07 전면 다크 전환) — 전체 사이트 톤 통일 */
  --bg: #15171e; --bg-rgb: 21,23,30; --bg2: #1e2129; --bg3: #262a34; --bg4: #2f333f;
  --border: rgba(255,255,255,0.075); --border-strong: rgba(255,255,255,0.16); --border-soft: rgba(255,255,255,0.05);
  --text: #f2f4f8; --text2: #a6adbb; --text3: #6c7385;
  --blue: #4d8dff; --blue-dim: rgba(77,141,255,0.14);   /* 시그니처 액센트: 소프트 블루 */
  --green: #3ddb7f; --green-dim: rgba(61,219,127,0.14);
  --red:   #ff6b6b; --red-dim:   rgba(255,107,107,0.14);
  --yellow:#f0b45e; --yellow-dim:rgba(240,180,94,0.16);
  --purple:#9d7bff; --purple-dim:rgba(157,123,255,0.16);
  --amber: #f0b45e; --amber-dim: rgba(240,180,94,0.16);
  --mono: 'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace;
  --shadow-card: 0 10px 30px -14px rgba(0,0,0,0.55);
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
  --shadow-pop: 0 20px 50px rgba(0,0,0,0.6), 0 4px 12px rgba(0,0,0,0.4);
  --shadow-focus: 0 0 0 3px rgba(77,141,255,0.22);
  --inset-hairline: rgba(255,255,255,0.03);
  --r-lg: 20px; --r-md: 16px; --r-sm: 12px; --r-xs: 7px; --r-xl: 20px; --r-pill: 999px;
  --ease: cubic-bezier(0.22, 1, 0.36, 1); --t-fast: 120ms; --t-med: 200ms;
}

/* ── 라이트 모드 오버라이드 (2026-07-27) ── */
:root[data-theme="light"] {
  --bg: #f5f6f8; --bg-rgb: 245,246,248; --bg2: #ffffff; --bg3: #eef0f3; --bg4: #e3e6eb;
  --border: rgba(15,17,23,0.09); --border-strong: rgba(15,17,23,0.18); --border-soft: rgba(15,17,23,0.05);
  --text: #14161c; --text2: #4b5163; --text3: #6b7280;
  --red: #dc2626; --green: #15803d; --blue: #1d4ed8; --yellow: #a16207; --purple: #7c3aed; --amber: #a16207;
  --shadow-sm: 0 2px 8px rgba(15,17,23,0.10);
  --shadow-card: 0 10px 30px -14px rgba(15,17,23,0.16);
  --shadow-pop: 0 20px 50px rgba(15,17,23,0.20), 0 4px 12px rgba(15,17,23,0.10);
  --shadow-focus: 0 0 0 3px rgba(29,78,216,0.18);
  --inset-hairline: rgba(15,17,23,0.04);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', sans-serif; color: var(--text); min-height: 100vh; background: var(--bg);
}

.header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(var(--bg-rgb),0.80); backdrop-filter: blur(14px) saturate(150%);
  border-bottom: 1px solid var(--border); padding: 0 24px;
}
.header-inner {
  max-width: 1320px; margin: 0 auto;
  display: flex; align-items: center; gap: 16px; height: 56px;
}
.back-btn {
  display: flex; align-items: center; gap: 6px; color: var(--text2);
  text-decoration: none; font-size: 15.5px; background: none; border: none; cursor: pointer;
  padding: 5px 10px; border-radius: 6px; transition: all 0.15s;
}
.back-btn:hover { background: var(--bg3); color: var(--text); }
.logo-sm { font-size: 16px; font-weight: 700; color: var(--text2); }
.logo-sm span { color: var(--blue); }

/* 메인 상단바(index.html)와 통일 — 로고/검색/네비/로그인 */
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.logo-icon {
  width: 32px; height: 32px; border-radius: 9px;
  background: linear-gradient(135deg, var(--blue) 0%, var(--purple) 100%);
  color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: 700;
  box-shadow: 0 3px 10px rgba(36,87,230,0.30);
}
.logo-text { font-size: 19px; font-weight: 800; color: var(--text); letter-spacing: -0.02em; }
.logo-sub { font-size: 13px; color: var(--text3); font-weight: 500; margin-top: 1px; letter-spacing: 0; }
.header-nav { display: flex; gap: 2px; margin-left: auto; align-items: center; }
.nav-btn {
  padding: 7px 13px; border-radius: var(--r-md); font-size: 15.5px; font-weight: 500;
  background: none; border: none; color: var(--text2); cursor: pointer;
  text-decoration: none; display: flex; align-items: center; gap: 6px;
  transition: all var(--t-fast) var(--ease); white-space: nowrap;
}
.nav-btn:hover { background: var(--bg3); color: var(--text); }
.nav-btn.active { background: var(--blue); color: #fff; font-weight: 600; }
.nav-new { position: relative; }
.nav-new::after { content: ""; position: absolute; top: 2px; right: 1px; width: 7px; height: 7px; border-radius: 50%; background: var(--red); box-shadow: 0 0 0 2px var(--bg), 0 0 6px var(--red); }
.nav-btn-primary {
  background: var(--blue); color: #fff; padding: 7px 16px; margin-left: 6px;
  border-radius: var(--r-md); font-size: 15.5px; font-weight: 600;
  text-decoration: none; cursor: pointer; border: none; transition: all var(--t-fast);
}
.nav-btn-primary:hover { background: #1e4ccc; }
.user-menu { position: relative; flex-shrink: 0; }
.user-avatar-btn {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--blue-dim); color: var(--blue);
  border: 1.5px solid var(--blue); font-size: 15.5px; font-weight: 700;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.user-dropdown {
  position: absolute; top: calc(100% + 8px); right: 0;
  background: var(--bg2); border: 1px solid var(--border); border-radius: var(--r-md);
  min-width: 140px; overflow: hidden; z-index: 500;
  box-shadow: var(--shadow-pop);
}
.dropdown-item {
  display: block; width: 100%; padding: 10px 14px; font-size: 15.5px;
  color: var(--text2); background: none; border: none; text-align: left;
  cursor: pointer; text-decoration: none; transition: all var(--t-fast);
}
.dropdown-item:hover { background: var(--bg3); color: var(--text); }

/* PC 전용 상단 종목 검색창 — 모바일(700px 이하)에서는 숨김 */
.header-search {
  display: flex; align-items: center; gap: 6px;
  background: var(--bg2); border: 1px solid var(--border); border-radius: var(--r-md);
  padding: 7px 10px; flex: 1 1 auto; max-width: 260px; min-width: 0;
}
.header-search svg { color: var(--text3); flex-shrink: 0; }
.header-search input {
  flex: 1; min-width: 0; border: none; outline: none; background: none;
  font-size: 15.5px; color: var(--text); font-family: inherit;
}
.header-search input::placeholder { color: var(--text3); }
@media (max-width: 900px) { .header-search { display: none; } }

.auth-overlay {
  position: fixed; inset: 0; background: rgba(19,23,34,0.45); z-index: 2000;
  display: flex; align-items: center; justify-content: center; padding: 20px;
  backdrop-filter: blur(6px);
  animation: fadeIn 0.15s ease;
}
@keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
.auth-modal {
  background: var(--bg2); border: 1px solid var(--border); border-radius: var(--r-xl);
  width: 100%; max-width: 380px; padding: 36px 32px 28px; position: relative;
  animation: slideUp 0.2s ease;
  box-shadow: var(--shadow-pop);
}
@keyframes slideUp { from { transform: translateY(16px); opacity: 0 } to { transform: translateY(0); opacity: 1 } }
.auth-close {
  position: absolute; top: 14px; right: 14px;
  background: none; border: none; color: var(--text3); cursor: pointer;
  font-size: 18px; width: 28px; height: 28px; border-radius: var(--r-xs);
  display: flex; align-items: center; justify-content: center;
  transition: all var(--t-fast);
}
.auth-close:hover { background: var(--bg3); color: var(--text); }
.auth-logo { font-size: 17px; font-weight: 800; color: var(--text3); margin-bottom: 6px; }
.auth-logo span { color: var(--blue); }
.auth-title { font-size: 24px; font-weight: 800; margin-bottom: 24px; letter-spacing: -0.02em; }
.auth-btn-google {
  width: 100%; padding: 12px 16px; border-radius: var(--r-md); font-size: 16px; font-weight: 500;
  background: #fff; border: 1px solid #dadce0; color: #3c4043;
  cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
  transition: all var(--t-fast); margin-bottom: 20px;
  box-shadow: var(--shadow-sm);
}
.auth-btn-google:hover { background: #f8f9fa; box-shadow: 0 2px 6px rgba(0,0,0,0.12); }
.auth-btn-google:active { background: #f1f3f4; }
.auth-divider {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 18px; color: var(--text3); font-size: 14.5px;
}
.auth-divider::before, .auth-divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.auth-field { position: relative; margin-bottom: 12px; }
.auth-field label { display: block; font-size: 14.5px; font-weight: 600; color: var(--text3); margin-bottom: 5px; }
.auth-input {
  width: 100%; padding: 10px 12px; background: var(--bg3); border: 1.5px solid var(--border);
  border-radius: var(--r-sm); color: var(--text); font-size: 16px;
  outline: none; transition: border-color var(--t-fast), box-shadow var(--t-fast); font-family: inherit;
  box-sizing: border-box;
}
.auth-input:focus { border-color: var(--blue); box-shadow: var(--shadow-focus); background: var(--bg2); }
.auth-input::placeholder { color: var(--text3); }
.auth-error { font-size: 14.5px; min-height: 18px; margin: 4px 0 8px; color: var(--red); }
.auth-error.success { color: var(--green); }
.auth-submit-btn {
  width: 100%; padding: 12px; border-radius: var(--r-md); font-size: 16px; font-weight: 700;
  background: var(--blue); border: none; color: #fff; cursor: pointer;
  transition: all var(--t-fast);
}
.auth-submit-btn:hover { background: #1e4ccc; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(36,87,230,0.35); }
.auth-submit-btn:active { transform: none; box-shadow: none; }
.auth-submit-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
.auth-switch { margin-top: 18px; text-align: center; font-size: 15.5px; color: var(--text3); }
.auth-link { background: none; border: none; color: var(--blue); cursor: pointer; font-size: 15.5px; font-weight: 600; }
.auth-link:hover { text-decoration: underline; }
.auth-consent { margin-bottom: 14px; }
.auth-consent-label { display: flex; align-items: flex-start; gap: 8px; font-size: 15px; color: var(--text2); cursor: pointer; line-height: 1.5; }
.auth-consent-label input[type="checkbox"] { margin-top: 2px; width: 15px; height: 15px; flex-shrink: 0; accent-color: var(--blue); cursor: pointer; }
.auth-link-inline { background: none; border: none; color: var(--blue); cursor: pointer; font-size: 15px; font-weight: 600; padding: 0; text-decoration: underline; }
.auth-privacy-text {
  margin-top: 8px; padding: 10px 12px; background: var(--bg3); border-radius: var(--r-sm);
  font-size: 14px; color: var(--text3); line-height: 1.7;
}

.sp-card {
  display: flex; flex-direction: column; gap: 6px;
  padding: 14px 16px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 14px;
  text-decoration: none; color: var(--text);
  transition: transform .12s var(--ease), border-color .12s, box-shadow .12s;
}
.sp-card:hover {
  transform: translateY(-2px);
  border-color: var(--blue);
  box-shadow: 0 8px 24px rgba(0,102,204,0.10);
}
.sp-card-top { display:flex; align-items:center; justify-content:space-between; gap:8px; }
.sp-ticker {
  font-family: var(--mono);
  font-size: 14.5px; font-weight: 700;
  padding: 3px 9px; border-radius: 6px; letter-spacing: .3px;
}
.sp-market { font-size: 13.5px; color: var(--text3); font-weight: 500; }
.sp-name { font-size: 17px; font-weight: 700; color: var(--text); line-height: 1.3; }
.sp-name-sub { font-size: 13.5px; color: var(--text3); font-weight: 400; }
.sp-arrow { font-size: 13.5px; color: var(--blue); margin-top: 4px; font-weight: 500; }

/* 헤더 네비가 좁은 화면에서 잘리지 않고 줄바꿈되도록 (index.html과 동일 패턴 —
   min-width:auto 콘텐츠가 트랙을 강제로 넓혀 모바일 가로스크롤을 유발하는 문제 방지) */
@media (max-width: 760px) {
  .header-inner { flex-wrap: wrap; height: auto; padding: 8px 0; row-gap: 6px; position: relative; }
  .header-nav { flex-wrap: wrap; row-gap: 4px; }
  /* 로그인/유저메뉴는 로고와 같은 첫 줄 우측 끝에 고정 — 아래로 줄바꿈되는 네비 목록과 분리 */
  #loginBtn, .user-menu { position: absolute; top: 8px; right: 0; margin-left: 0; }
}
/* index.html과 동일 — 버튼 자체를 줄여야 실제로 한 줄에 들어맞음(위 wrap만으로는
   header-nav의 고유 너비(콘텐츠 기준)가 줄지 않아 375px 등 좁은 화면에서 가로스크롤 발생 확인) */
@media (max-width: 600px) {
  .logo-sub { display: none; }
  .nav-btn { padding: 6px 9px; font-size: 14.5px; }
  .header { padding: 0 16px; }
}

.page-wrap { max-width: 1320px; margin: 0 auto; padding: 32px 24px 60px; }

/* Company Header */
.company-header { margin-bottom: 28px; }
.company-header-top { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
.ticker-badge {
  font-size: 16px; font-weight: 700; font-family: var(--mono);
  padding: 6px 14px; border-radius: 8px; white-space: nowrap; flex-shrink: 0;
}
.ticker-badge { font-family: var(--mono); border: 1px solid var(--border); }
.ticker-badge.kr { background: var(--blue-dim); color: var(--blue); border-color: rgba(77,141,255,0.30); }
.ticker-badge.us { background: var(--purple-dim); color: var(--purple); border-color: rgba(139,139,255,0.30); }
.company-name-wrap { flex: 1; }
.company-name-main { font-size: 28px; font-weight: 700; line-height: 1.2; margin-bottom: 4px; }
.company-sub { font-size: 15.5px; color: var(--text3); }
.price-block { text-align: right; flex-shrink: 0; }
.share-icon-btn { flex-shrink: 0; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border); background: var(--bg2); color: var(--text2); font-size: 17px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.share-icon-btn:hover { background: var(--bg3); color: var(--text); }
.watch-icon-btn { flex-shrink: 0; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border); background: var(--bg2); color: var(--text2); font-size: 17px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .15s; }
.watch-icon-btn:hover { background: var(--bg3); color: var(--text); transform: scale(1.08); }
.watch-icon-btn.active { color: #f0b45e; border-color: #f0b45e; }
.current-price { font-size: 28px; font-weight: 700; }
.current-price.flash-up { animation: priceFlashUp .9s ease-out; }
.current-price.flash-down { animation: priceFlashDown .9s ease-out; }
@keyframes priceFlashUp {
  0%   { color: var(--red); text-shadow: 0 0 10px rgba(220,47,62,.45); }
  100% { color: var(--text); text-shadow: none; }
}
@keyframes priceFlashDown {
  0%   { color: var(--blue); text-shadow: 0 0 10px rgba(77,141,255,.45); }
  100% { color: var(--text); text-shadow: none; }
}
.current-price-krw { font-size: 16px; font-weight: 600; color: var(--text2); margin-top: 1px; font-family: var(--mono); }
.price-change { font-size: 16px; font-weight: 600; margin-top: 2px; }
.price-change.pos { color: var(--red); }
.price-change.neg { color: var(--blue); }
.price-src { font-size: 13px; color: var(--text3); font-weight: 500; margin-top: 3px; }
.price-loading { font-size: 16px; color: var(--text3); }

/* Stats Bar */
.stats-bar {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 32px;
}
.stat-card {
  background: var(--bg2); border: 1px solid var(--border); border-radius: 10px;
  padding: 14px 16px;
}
.stat-label { font-size: 13.5px; color: var(--text3); font-weight: 500; text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 6px; }
.stat-value { font-size: 22px; font-weight: 700; }
.stat-value.green { color: var(--green); }
.stat-value.blue { color: var(--blue); }
.stat-value.yellow { color: var(--yellow); }

/* Section Headers */
/* 모바일에서 아이콘+제목+뱃지+버튼이 한 줄에 다 못 들어가면(펀더멘털 섹션처럼 뱃지가
   여러 개 붙는 경우) flex-shrink로 안이 찌그러지면서 "펀더멘털"→"펀더멘/털"처럼 단어
   중간이 줄바꿈되던 문제 수정 — nowrap으로 텍스트 자체는 안 쪼개지게 하고, flex-wrap으로
   안 들어가는 항목은 통째로 다음 줄로 내린다(단어가 아니라 항목 단위로 줄바꿈). */
.section-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; white-space: nowrap; }
.section-title svg { color: var(--text3); }

/* Chart Section */
.chart-section { margin-bottom: 36px; }
.chart-container {
  background: var(--bg2); border: 1px solid var(--border); border-radius: 12px;
  padding: 20px;
}
.chart-range-btns { display: flex; gap: 6px; margin-bottom: 16px; }
.range-btn {
  padding: 4px 12px; border-radius: 6px; font-size: 14.5px; font-weight: 600;
  border: 1px solid var(--border); background: none; color: var(--text3); cursor: pointer; transition: all 0.15s;
}
.range-btn.active, .range-btn:hover { background: var(--blue); border-color: var(--blue); color: #fff; }
.chart-wrap { position: relative; height: 280px; }
.chart-loading { text-align: center; padding: 60px; color: var(--text3); font-size: 15.5px; }

/* 고도화 캔들차트 (매물대 사이드바는 2026-07-22 제거, 차트 전체폭) */
.adv-chart-box { min-width: 0; }
.adv-chart { width: 100%; height: 340px; }

/* History Section */
.history-section { margin-bottom: 36px; }
.history-table-wrap { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.history-table { width: 100%; border-collapse: collapse; }
.history-table th {
  font-size: 13.5px; font-weight: 600; color: var(--text3); text-align: left;
  padding: 12px 16px; background: var(--bg3); border-bottom: 1px solid var(--border);
  text-transform: uppercase; letter-spacing: 0.4px;
}
.history-table td {
  padding: 13px 16px; border-bottom: 1px solid var(--border); font-size: 15.5px; vertical-align: middle;
}
.history-table tr:last-child td { border-bottom: none; }
.history-table tr:hover td { background: var(--bg3); }
.date-cell { color: var(--text3); white-space: nowrap; font-size: 14.5px; }
.issue-link {
  color: var(--text); text-decoration: none; font-weight: 500;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.issue-link:hover { color: var(--blue); }
.upside-cell { font-weight: 700; white-space: nowrap; }
.upside-cell.pos { color: var(--red); }
.upside-cell.neg { color: var(--blue); }
.return-cell { white-space: nowrap; }
.return-badge {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 14.5px; font-weight: 600; padding: 3px 8px; border-radius: 5px;
}
.return-badge.accurate { background: var(--green-dim); color: var(--green); }
.return-badge.inaccurate { background: var(--red-dim); color: var(--red); }
.return-badge.pending { background: var(--bg3); color: var(--text3); }
.empty-row td { text-align: center; color: var(--text3); padding: 40px; }

/* AI Summary */
.ai-summary-card {
  background: linear-gradient(180deg, var(--bg3), var(--bg2));
  border: 1px solid var(--border);
  border-radius: var(--r-md); padding: 22px; margin-bottom: 20px;
  box-shadow: var(--shadow-card); position: relative; overflow: hidden;
}
.ai-summary-card::before { content:""; position:absolute; inset:0 0 auto 0; height:1px;
  background:linear-gradient(90deg, transparent, rgba(77,141,255,0.30), transparent); }
.ai-disclaimer { font-size: 13.5px; color: var(--text3); line-height: 1.5; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border); }
.ai-disclaimer b { color: var(--text2); font-weight: 700; }
.ai-badge-row { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
.ai-badge { font-size: 13.5px; color: var(--blue); font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; }
.ai-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--blue); box-shadow: 0 0 8px var(--blue); animation: pulse 2s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
.ai-block { margin-bottom: 16px; }
.ai-block:last-child { margin-bottom: 0; }
.ai-block-label { font-size: 14.5px; color: var(--text2); font-weight: 700; margin-bottom: 6px; letter-spacing: 0.2px; }
.ai-block-text { font-size: 16px; line-height: 1.7; color: var(--text); }
.ai-risks { display: flex; flex-direction: column; gap: 6px; }
.ai-risk-item { font-size: 16px; color: var(--yellow); line-height: 1.55; padding-left: 18px; position: relative; font-weight: 500; }
.ai-risk-item::before { content: '⚠️'; position: absolute; left: -2px; }
.ai-watch-item { font-size: 16px; color: var(--green); line-height: 1.55; padding-left: 18px; position: relative; font-weight: 500; }
.ai-watch-item::before { content: '👁'; position: absolute; left: -2px; }

/* Trade box */
.trade-box {
  display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; padding: 16px;
  background: linear-gradient(135deg, rgba(63,185,80,.08), rgba(47,129,247,.08));
  border: 1px solid rgba(63,185,80,.25); border-radius: 10px; margin-bottom: 14px;
}
.trade-cell { text-align: center; }
.trade-cell + .trade-cell { border-left: 1px solid var(--border); }
.trade-label { font-size: 13px; color: var(--text3); margin-bottom: 4px; }
.trade-val { font-size: 18px; font-weight: 700; font-family: var(--mono); }
.trade-val.buy { color: var(--blue); }
.trade-val.tg  { color: var(--green); }
.trade-val.sl  { color: var(--red); }

/* Tech chips */
.tech-chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0; }
.tech-chip {
  font-size: 13.5px; font-weight: 600; padding: 4px 10px; border-radius: 5px;
  background: var(--bg3); color: var(--text2);
}

/* Fundamentals grid */
.fund-section { margin-bottom: 24px; }
.fund-group {
  background: var(--bg2); border: 1px solid var(--border); border-radius: 12px;
  padding: 18px; margin-bottom: 12px;
}
.fund-group-title { font-size: 14.5px; color: var(--text3); font-weight: 700; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.6px; display: flex; align-items: center; gap: 6px; }
.fund-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.fund-item { padding: 10px 12px; background: var(--bg3); border-radius: 8px; }
.fund-label { font-size: 13.5px; color: var(--text3); margin-bottom: 4px; }
.fund-val { font-size: 17px; font-weight: 700; font-family: var(--mono); color: var(--text); }
.fund-val.good { color: var(--green); }
.fund-val.bad  { color: var(--red); }
.fund-val.warn { color: var(--yellow); }
.fund-val.dim  { color: var(--text3); font-size: 15.5px; }
.fund-sub { font-size: 13px; color: var(--text3); margin-top: 2px; font-family: var(--mono); }
.fund-sub.pos { color: var(--red); }
.fund-sub.neg { color: var(--blue); }
@media (max-width: 700px) {
  .fund-grid { grid-template-columns: repeat(2, 1fr); }
}

/* 오늘의 시세 (당일 레인지 · 거래량 · 52주 범위) */
.quote-card {
  background: var(--bg2); border: 1px solid var(--border); border-radius: var(--r-md, 14px);
  padding: 18px 20px; margin-bottom: 24px;
}
.quote-card-title { font-size: 15.5px; font-weight: 700; color: var(--text2); margin-bottom: 16px; }
.range-row { margin-bottom: 18px; }
.range-row:last-child { margin-bottom: 0; }
.range-row-label { font-size: 13.5px; color: var(--text3); margin-bottom: 8px; }
.range-track { position: relative; height: 5px; background: var(--bg4); border-radius: 3px; }
.range-fill { position: absolute; top: 0; left: 0; height: 100%; background: var(--blue); border-radius: 3px; opacity: 0.35; }
.range-dot {
  position: absolute; top: 50%; width: 13px; height: 13px; border-radius: 50%;
  background: #fff; border: 3px solid var(--blue); transform: translate(-50%, -50%);
  box-shadow: 0 1px 4px rgba(0,0,0,0.18);
}
.range-endpoints { display: flex; justify-content: space-between; margin-top: 8px; }
.range-endpoint-label { font-size: 13px; color: var(--text3); }
.range-endpoint-val { font-size: 15px; font-weight: 700; font-family: var(--mono); }
.quote-stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 18px; }
.quote-stat-label { font-size: 13px; color: var(--text3); margin-bottom: 4px; }
.quote-stat-val { font-size: 16px; font-weight: 700; font-family: var(--mono); }
@media (max-width: 700px) { .quote-stat-grid { grid-template-columns: repeat(2, 1fr); } }

/* 애널리스트 컨센서스 (KR 종목 — 목표주가/상승여력만, 방향성 점수는 척도 확인 불가로 미표시) */
.consensus-row { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
.consensus-target-val { font-size: 24px; font-weight: 800; color: var(--blue); font-family: var(--mono); line-height: 1.2; }
.consensus-target-sub { font-size: 13.5px; color: var(--text3); margin-top: 3px; }
.consensus-upside { text-align: center; padding: 10px 18px; border-radius: 10px; }
.consensus-upside-val { font-size: 20px; font-weight: 800; font-family: var(--mono); }
.consensus-upside-label { font-size: 13px; color: var(--text3); margin-top: 2px; }

/* 동종업계 비교 (KR 종목) */
.peer-table { width: 100%; border-collapse: collapse; font-size: 15px; }
.peer-table th { text-align: left; padding: 6px 8px; font-size: 13.5px; color: var(--text3); font-weight: 600; border-bottom: 1px solid var(--border); }
.peer-table td { padding: 9px 8px; border-bottom: 1px solid var(--border); }
.peer-table tr:last-child td { border-bottom: none; }
.peer-table a { color: var(--text); text-decoration: none; font-weight: 600; }
.peer-table a:hover { color: var(--blue); }
.peer-chg { font-weight: 700; font-family: var(--mono); }

/* TradingView wrapper */
.tv-wrap {
  background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
  margin-bottom: 24px;
}
.tv-header { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.tv-tabs { display: flex; gap: 4px; }
.tv-tab { padding: 4px 12px; border-radius: 6px; font-size: 14.5px; font-weight: 600; cursor: pointer; background: var(--bg3); border: 1px solid var(--border); color: var(--text2); }
.tv-tab.active { background: var(--blue); color: #fff; border-color: var(--blue); }
.tv-frame { width: 100%; height: 500px; border: none; }

/* Loading / Error */
.loading-state { text-align: center; padding: 80px 24px; }
.spinner { width: 36px; height: 36px; border: 2px solid var(--border); border-top-color: var(--blue); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 700px) {
  .company-name-main { font-size: 20px; }
  .current-price { font-size: 20px; }
  .stats-bar { grid-template-columns: repeat(2, 1fr); }
  .history-table th:nth-child(1), .history-table td:nth-child(1) { display: none; }
  .history-table th:nth-child(4), .history-table td:nth-child(4) { display: none; }
}

/* ═══ 2026-07 다크 콕핏: 판단 데크 + 게이지 + 수급 모듈 ═══ */
.tabnum, .fund-val, .quote-stat-val, .range-endpoint-val, .vmeta .v { font-variant-numeric: tabular-nums; }

.cmp-hero {
  background: linear-gradient(180deg, var(--bg3), var(--bg2));
  border: 1px solid var(--border); border-radius: var(--r-md);
  box-shadow: var(--shadow-card); overflow: hidden; margin-bottom: 14px; position: relative;
}
.cmp-hero::before { content:""; position:absolute; inset:0 0 auto 0; height:1px;
  background:linear-gradient(90deg, transparent, rgba(77,141,255,0.32), transparent); }
/* 세로 스택: (티커뱃지+공유버튼) → 종목명 → 상장 서브텍스트 → 세션·현재가·등락 — 전부 왼쪽 정렬.
   예전엔 플렉스 한 줄에 4개를 다 넣고 wrap에 맡겼는데, 종목명이 길면 가격 블록이 margin-left:auto로
   혼자 다음 줄로 밀려나면서 그 줄 왼쪽에 큰 여백만 남는 문제가 있었음(2026-07 실측) — 항상 같은
   왼쪽 기준선에서 시작하는 세로 스택으로 바꿔 그 문제를 원천 제거.*/
.cmp-hero-top { padding: 20px 24px; }
.cmp-hero-row1 { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.cmp-hero-top .company-name-main { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 5px; }
.cmp-hero-top .company-sub { letter-spacing: 0.01em; margin: 0; }
/* PC: 종목명(왼쪽) ↔ 현재가(오른쪽) 2단 — 예전 세로 스택은 종목명 옆 오른쪽이 비어 보였음.
   flex+space-between로 오른쪽을 가격이 채우되, 종목명 wrap에 min-width:0을 줘서 긴 이름이
   가격을 다음 줄로 밀어내지 않게 한다(예전 wrap 버그 방지). 모바일은 다시 세로 스택. */
.cmp-hero-main { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; }
.cmp-hero-main .company-name-wrap { flex: 1; min-width: 0; }
.cmp-hero-top .price-block { text-align: right; flex-shrink: 0; }
@media (max-width: 640px) {
  .cmp-hero-main { flex-direction: column; align-items: flex-start; gap: 14px; }
  .cmp-hero-top .price-block { text-align: left; }
}
.cmp-hero-top .current-price { font-family: var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.cmp-hero-top .price-change { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.cmp-verdict {
  display: flex; align-items: stretch; gap: 0; flex-wrap: wrap;
  border-top: 1px solid var(--border); background: rgba(0,0,0,0.2);
}
.cmp-verdict > .vbadge { align-self: center; margin: 15px 20px; }
.vbadge {
  display: inline-flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 700;
  color: var(--bg); border-radius: var(--r-pill); padding: 8px 17px; white-space: nowrap;
}
.vbadge.buy { background: linear-gradient(135deg, var(--blue), #7aa9ff); box-shadow: 0 0 22px -4px rgba(77,141,255,0.5); }
.vbadge.neutral { background: var(--bg4); color: var(--text); box-shadow: none; }
.vbadge .spark { width: 7px; height: 7px; border-radius: 50%; background: var(--bg); opacity: 0.7; }
.vmeta { display: flex; flex-direction: column; justify-content: center; gap: 3px; padding: 13px 20px; border-left: 1px solid var(--border); }
.vmeta .k { font-size: 13px; color: var(--text3); letter-spacing: 0.02em; }
.vmeta .v { font-size: 19px; font-weight: 600; font-family: var(--mono); letter-spacing: -0.01em; }
.vmeta .v.pos { color: var(--green); }
.vmeta .v.neg { color: var(--red); }
.vdivider { display: none; }

.cmp-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; min-height: 34px; }
.cmp-chip {
  background: var(--bg2); border: 1px solid var(--border); border-radius: var(--r-pill);
  padding: 7px 13px; font-size: 14.5px; color: var(--text2); display: inline-flex; align-items: center; gap: 7px;
  white-space: nowrap;
}
/* 모바일에서는 RSI/PER/PBR 등 지표 칩이 두 줄로 줄바꿈되며 세로 공간을 많이 잡아먹어서,
   줄바꿈 대신 한 줄 가로 스크롤로 바꾼다. */
@media (max-width: 700px) {
  .cmp-chips { flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 2px; }
  .cmp-chip { flex-shrink: 0; }
}
.cmp-chip .cdot { width: 5px; height: 5px; border-radius: 50%; background: var(--text3); flex-shrink: 0; }
.cmp-chip b { font-family: var(--mono); font-weight: 600; color: var(--text); font-size: 15px; letter-spacing: -0.01em; }
.cmp-chip b.pos { color: var(--green); } .cmp-chip b.neg { color: var(--red); }
/* 지표 칩의 ? 설명 버튼 */
.chip-q { width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--border); background: var(--bg3);
  color: var(--text3); font-size: 13px; font-weight: 700; line-height: 1; cursor: pointer; padding: 0;
  display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all .12s; }
.chip-q:hover { color: var(--blue); border-color: rgba(77,141,255,0.4); background: var(--blue-dim); }
/* 지표 설명 팝오버 */
.metric-pop { position: fixed; inset: 0; z-index: 200; display: none; align-items: center; justify-content: center;
  background: rgba(0,0,0,0.5); padding: 20px; backdrop-filter: blur(2px); }
.metric-pop.show { display: flex; }
.mp-card { background: var(--bg2); border: 1px solid var(--border-strong, var(--border)); border-radius: 16px;
  padding: 22px 22px 16px; max-width: 380px; width: 100%; position: relative;
  box-shadow: 0 24px 60px -12px rgba(0,0,0,0.6); animation: mpIn .16s ease; }
@keyframes mpIn { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }
.mp-close { position: absolute; top: 12px; right: 12px; width: 28px; height: 28px; border-radius: 8px; border: none;
  background: var(--bg3); color: var(--text3); font-size: 15.5px; cursor: pointer; }
.mp-close:hover { color: var(--text); }
.mp-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.mp-emoji { font-size: 26px; }
.mp-name { font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }
.mp-cur { font-size: 15.5px; color: var(--text2); background: var(--bg3); border-radius: 9px; padding: 8px 12px; margin-bottom: 14px; }
.mp-cur b { font-family: var(--mono); color: var(--blue); font-size: 16px; }
.mp-sec { margin-bottom: 13px; }
.mp-lbl { font-size: 13.5px; font-weight: 700; letter-spacing: 0.02em; color: var(--blue); margin-bottom: 5px; }
.mp-sec p { font-size: 16px; line-height: 1.65; color: var(--text); margin: 0; }
.mp-foot { font-size: 13.5px; color: var(--text3); border-top: 1px solid var(--border); padding-top: 11px; margin-top: 4px; }

.cmp-tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: 24px; overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch; touch-action: pan-x; }
.cmp-tab {
  font-size: 16px; font-weight: 550; color: var(--text3); background: none; border: none;
  padding: 12px 15px; cursor: pointer; white-space: nowrap; border-bottom: 2px solid transparent; margin-bottom: -1px; letter-spacing: 0.01em;
}
.cmp-tab.active { color: var(--text); border-bottom-color: var(--blue); }
.cmp-tab:hover:not(.active) { color: var(--text2); }
.cmp-panel { display: none; }
.cmp-panel.active { display: block; animation: cmpFade 0.2s var(--ease); }
@keyframes cmpFade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.cmp-empty { text-align: center; color: var(--text3); font-size: 15.5px; padding: 40px 20px; }

/* 섹션 헤더 (콕핏) */
.ck-sec-head { display: flex; align-items: center; gap: 10px; margin: 0 0 14px; }
.ck-sec-head .tick { width: 3px; height: 14px; border-radius: 2px; background: var(--blue); flex-shrink: 0; }
.ck-sec-head h3 { font-size: 15.5px; font-weight: 600; letter-spacing: 0.01em; }
.ck-sec-head .note { margin-left: auto; font-size: 13px; color: var(--text3); letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600; }
.ck-sec-head + .ck-sec-head, .cmp-panel .ck-sec-head:not(:first-child) { margin-top: 26px; }

/* 분석 이력 카드 (제목 + AI 분석 내용) */
.hist-list { display: flex; flex-direction: column; gap: 10px; }
.hist-card { display: block; background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; padding: 15px 17px; text-decoration: none; color: var(--text); transition: border-color var(--t-fast); box-shadow: 0 1px 0 var(--inset-hairline) inset; }
.hist-card:hover { border-color: var(--border-strong); }
.hist-card-top { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
.hist-date { font-size: 14.5px; font-family: var(--mono); color: var(--text3); font-variant-numeric: tabular-nums; }
/* 매칭 근거 뱃지 — 상승/하락 방향성 신호가 아니므로 의도적으로 --red/--blue를 쓰지 않는다
   (이 색은 이 프로젝트에서 등락률 전용). 직접 언급만 살짝 강조. */
.hist-badge { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 6px; color: var(--text3); background: var(--bg3); }
.hist-badge.direct { color: var(--blue); background: var(--blue-dim); }
.hist-src { font-size: 12.5px; color: var(--text3); margin-left: auto; }
.hist-title { font-size: 16.5px; font-weight: 650; line-height: 1.45; letter-spacing: -0.01em; margin-bottom: 6px; }
.hist-reason { font-size: 15.5px; color: var(--text2); line-height: 1.65; }
/* "왜?" 체크리스트 — analysis.html의 같은 클래스와 동일 톤(2026-08). 등급/평점(별점 등)
   대신 "최근 어떤 뉴스에서 몇 번 언급됐는지"만 사실대로 보여주는 걸로 확정(유사투자자문업
   리스크 검토 결과) — 종목 페이지에 upside_pct 같은 수치 배지도 의도적으로 안 넣음. */
.reasons-why { font-size: 11px; font-weight: 700; color: var(--text3); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 5px; }
.reasons-list { list-style: none; margin: 0 0 8px; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.reasons-list li { font-size: 14.5px; font-weight: 600; color: var(--text); line-height: 1.4; position: relative; padding-left: 20px; }
.reasons-list li::before { content: '✔'; position: absolute; left: 0; top: 0; color: var(--green); font-weight: 800; font-size: 12.5px; }

/* ── 단일 스크롤 섹션 ── */
.cmp-sec { margin-top: 30px; }
.cmp-sec:first-of-type { margin-top: 20px; }

/* 히어로 경고/상태 뱃지 */
.meta-badges { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 24px; margin: -4px 0 4px; }
.meta-badges:empty { display: none; }
/* #metaBadges(로더가 통째로 갈아끼움)와 전일 동시간 배지를 한 줄에 나란히 놓는 래퍼.
   안쪽 .meta-badges가 좌우 24px 패딩을 이미 갖고 있어 래퍼에는 패딩을 주지 않는다.
   전일 동시간 배지는 margin-left:auto로 우측 끝에 붙인다 — 미국 종목은 상한/하한 칩이
   없어(가격제한폭 제도 없음) 좌측에 홀로 떠 있으면 허전하다(2026-08-05 피드백). */
.meta-badges-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.meta-badges-row > .meta-badges { margin: -4px 0 4px; }
.meta-badges-row > .mbadge { margin-left: auto; margin-right: 24px; margin-bottom: 4px; }
.mbadge { font-size: 13.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--border); white-space: nowrap; }
.mbadge.danger { background: var(--red-dim); color: var(--red); border-color: rgba(220,47,62,0.35); }
.mbadge.warn { background: var(--yellow-dim); color: var(--yellow); border-color: rgba(217,164,6,0.35); }
.mbadge.ok { background: var(--blue-dim); color: var(--blue); border-color: rgba(77,141,255,0.30); }
.mbadge.muted { background: var(--bg3); color: var(--text3); }

/* Toss식 가로 스탯바 */
.stat-bar { display: grid; grid-template-columns: repeat(6, minmax(0,1fr)); gap: 1px; background: var(--border); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); margin-top: 12px; }
.stat-cell { background: var(--bg2); padding: 12px 14px; min-width: 0; }
.stat-k { font-size: 13px; color: var(--text3); margin-bottom: 4px; white-space: nowrap; }
.stat-v { font-size: 15.5px; font-weight: 700; font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat-range { padding: 14px 24px 4px; }
.stat-range-track { position: relative; height: 5px; background: var(--bg4); border-radius: 3px; }
.stat-range-fill { position: absolute; top: 0; left: 0; height: 100%; background: var(--blue); opacity: 0.35; border-radius: 3px; }
.stat-range-dot { position: absolute; top: 50%; width: 10px; height: 10px; border-radius: 50%; background: var(--blue); border: 2px solid var(--bg2); transform: translate(-50%,-50%); }
.stat-range-ends { display: flex; justify-content: space-between; margin-top: 8px; font-size: 13px; color: var(--text3); font-family: var(--mono); }
@media (max-width: 640px) { .stat-bar { grid-template-columns: repeat(3, minmax(0,1fr)); } }

/* 🌊 파급효과 */
/* 수급 섹션 "읽는 법" 도움말 */
.flow-help { font-size: 14.5px; color: var(--text2); line-height: 1.65; background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 13px; margin: 0 0 14px; }
.flow-help b { color: var(--text); }

/* 📊 호가창 */
.ob-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; padding: 8px 10px; }
.ob-ladder { display: flex; flex-direction: column; }
.ob-row { display: grid; grid-template-columns: 1fr 90px 1fr; align-items: center; height: 26px; }
.ob-price { text-align: center; font-family: var(--mono); font-size: 15.5px; font-weight: 700; font-variant-numeric: tabular-nums; }
.ob-price.ask { color: var(--blue); }
.ob-price.bid { color: var(--red); }
.ob-vol { display: flex; align-items: center; gap: 6px; min-width: 0; height: 100%; }
.ob-vol.ask { justify-content: flex-end; }
.ob-vol.bid { justify-content: flex-start; }
.ob-vnum { font-size: 13px; font-family: var(--mono); color: var(--text3); flex-shrink: 0; }
.ob-bar { height: 15px; border-radius: 3px; min-width: 2px; }
.ob-bar.ask { background: rgba(77,141,255,0.22); }
.ob-bar.bid { background: rgba(220,47,62,0.22); }
.ob-spread { display: flex; justify-content: space-between; padding: 5px 12px; margin: 3px 0; border-top: 1px dashed var(--border); border-bottom: 1px dashed var(--border); }
.ob-spread-lbl { font-size: 13px; color: var(--text3); font-weight: 600; letter-spacing: 0.05em; }
.ob-balance { padding: 11px 12px 5px; }
.ob-bal-head { display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: var(--text2); font-family: var(--mono); margin-bottom: 7px; }
.ob-bal-head em { font-style: normal; font-size: 13px; color: var(--text3); margin-right: 4px; }
.ob-bal-head em.ask { color: var(--blue); } .ob-bal-head em.bid { color: var(--red); }
.ob-bal-lean { font-family: 'Inter', sans-serif; font-size: 13.5px; font-weight: 700; }
.ob-bal-track { display: flex; height: 22px; border-radius: 7px; overflow: hidden; background: var(--bg3); }
.ob-bal-bid, .ob-bal-ask { display: flex; align-items: center; font-size: 13px; font-weight: 700; font-family: var(--mono); color: #fff; transition: width .3s ease; min-width: 0; }
.ob-bal-bid { background: linear-gradient(90deg, rgba(220,47,62,0.55), rgba(220,47,62,0.85)); justify-content: flex-start; padding-left: 9px; }
.ob-bal-ask { background: linear-gradient(90deg, rgba(77,141,255,0.85), rgba(77,141,255,0.55)); justify-content: flex-end; padding-right: 9px; }

/* 📅 일별 시세 표 */
.dt-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 14px; background: var(--bg2); }
.dt-table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
.dt-table th { font-size: 13px; color: var(--text3); font-weight: 600; padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; position: sticky; top: 0; background: var(--bg2); }
.dt-table td { padding: 9px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.dt-table tr:last-child td { border-bottom: none; }
.dt-num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
/* .dt-table th의 text-align:left가 명시도(0,1,1)로 .dt-num 단독(0,1,0)보다 세서 숫자
   헤더(종가/전일대비/…)가 값과 반대로 왼쪽 정렬돼 열이 어긋나 보였다(스크린샷으로 확인,
   2026-07-28) — 헤더 전용으로 한 번 더 못박아 값과 정렬을 맞춘다. */
.dt-table th.dt-num { text-align: right; }
.dt-date { color: var(--text2); font-family: var(--mono); }
.dt-close { font-weight: 700; }
.dt-dim { color: var(--text3); }
.dt-num.pos { color: var(--red); }
.dt-num.neg { color: var(--blue); }

/* 게이지 타일 (펀더멘털 표 안 디자인) */
.gtile { background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; padding: 15px 16px; }
.gtile .glab { font-size: 13.5px; color: var(--text3); letter-spacing: 0.02em; margin-bottom: 9px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.gtag { font-size: 12.5px; font-weight: 700; letter-spacing: 0.03em; padding: 2px 7px; border-radius: 5px; white-space: nowrap; }
.gtag.g { color: var(--green); background: var(--green-dim); }
.gtag.n { color: var(--blue); background: var(--blue-dim); }
.gtag.w { color: var(--yellow); background: var(--yellow-dim); }
.gtag.b { color: var(--red); background: var(--red-dim); }
.gtile .gnum { font-family: var(--mono); font-size: 24px; font-weight: 600; letter-spacing: -0.02em; line-height: 1; font-variant-numeric: tabular-nums; }
.gtile .gnum small { font-size: 16px; color: var(--text2); font-weight: 500; }
.gmeter { margin-top: 13px; }
.gmeter-track { height: 5px; border-radius: 3px; background: var(--border); position: relative; overflow: hidden; }
.gmeter-fill { position: absolute; top: 0; left: 0; height: 100%; border-radius: 3px; }
.gmeter-knob { position: absolute; top: 50%; width: 11px; height: 11px; border-radius: 50%; transform: translate(-50%,-50%); border: 2.5px solid var(--bg2); }
.gmeter-scale { display: flex; justify-content: space-between; margin-top: 6px; font-size: 12.5px; color: var(--text3); }

/* 콕핏 데이터 테이블 */
.ck-panel { background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; box-shadow: 0 1px 0 var(--inset-hairline) inset; }
.ck-tbl { width: 100%; border-collapse: collapse; font-size: 15px; }
.ck-tbl thead th { font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text3); font-weight: 600; text-align: right; padding: 12px 16px; border-bottom: 1px solid var(--border); }
.ck-tbl thead th:first-child { text-align: left; }
.ck-tbl td { padding: 12px 16px; border-bottom: 1px solid var(--border); text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; white-space: nowrap; }
.ck-tbl td:first-child { text-align: left; font-family: 'Inter', sans-serif; color: var(--text2); }
.ck-tbl tbody tr:last-child td { border-bottom: none; }
.ck-tbl tbody tr:hover td { background: rgba(77,141,255,0.05); }
.ck-cell { display: inline-block; min-width: 62px; padding: 3px 9px; border-radius: 6px; font-weight: 600; font-size: 14.5px; white-space: nowrap; }
.ck-cell.p { color: var(--red); background: var(--red-dim); }
.ck-cell.n { color: var(--blue); background: var(--blue-dim); }

/* 수급 흐름 모듈 */
.hold-bar { height: 26px; border-radius: 8px; overflow: hidden; display: flex; margin: 6px 0 10px; }
.hold-seg { height: 100%; display: flex; align-items: center; justify-content: center; font-size: 13.5px; font-weight: 600; color: var(--bg); overflow: hidden; white-space: nowrap; }
.hold-legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 14px; color: var(--text2); }
.hold-legend span { display: flex; align-items: center; gap: 6px; }
.hold-legend i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }
.hold-legend b { font-family: var(--mono); color: var(--text); }
.flow-tiles { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; margin-bottom: 14px; }
.ft { background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; padding: 15px 16px; }
.ft-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.ft-name { display: flex; align-items: center; gap: 8px; font-size: 15.5px; font-weight: 600; }
.ft-name i { width: 8px; height: 8px; border-radius: 50%; }
.ft-arrow { font-size: 13.5px; font-weight: 700; font-family: var(--mono); padding: 2px 8px; border-radius: 6px; }
.ft-net { font-family: var(--mono); font-size: 21px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.ft-sub { font-size: 13px; color: var(--text3); margin-top: 2px; }
.ft-spark { height: 34px; margin-top: 10px; }
.ft-spark svg { width: 100%; height: 100%; display: block; }
.cum-box { position: relative; height: 150px; }
.cum-box svg { width: 100%; height: 100%; display: block; }
.zone-tag { position: absolute; font-size: 13px; font-weight: 600; padding: 3px 8px; border-radius: 6px; }

/* 상대수익률 비교 차트 */
.rr-top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 6px; }
.rr-legend { display: flex; gap: 16px; flex-wrap: wrap; }
.rr-lg { display: flex; align-items: center; gap: 7px; font-size: 15px; color: var(--text2); }
.rr-lg .ln { width: 16px; height: 2.5px; border-radius: 2px; }
.rr-lg b { font-family: var(--mono); font-weight: 600; }
.rr-ranges { margin-left: auto; display: flex; gap: 3px; }
.rr-rg { font-size: 13.5px; font-weight: 600; color: var(--text3); background: none; border: 1px solid transparent; border-radius: 7px; padding: 4px 9px; cursor: pointer; }
.rr-rg.on { color: var(--blue); background: var(--blue-dim); border-color: rgba(77,141,255,0.3); }
.rr-box { position: relative; height: 230px; margin-top: 8px; }
.rr-box svg { width: 100%; height: 100%; display: block; }

.flow-tiles-2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
@media (max-width: 680px) { .flow-tiles, .flow-tiles-2 { grid-template-columns: 1fr; } }

@media (max-width: 700px) {
  .cmp-hero-top { padding: 16px; }
  .cmp-hero-top .price-block .current-price { font-size: 22px; }
  .cmp-verdict > .vbadge { margin: 12px 16px; }
  .vmeta { padding: 12px 16px; }
}
</style>

<body>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/site-header.js"></script>
<div id="site-header-mount"></div>
<script>renderSiteHeader('/company.html');</script>

<!-- 지표 설명 팝오버 (RSI/PER/PBR 등 ? 클릭 시) -->
<div id="metricPop" class="metric-pop" onclick="if(event.target===this)hideMetricInfo()"><div class="mp-card"></div></div>

<div class="page-wrap" id="pageWrap">
  <div class="loading-state">
    <div class="spinner"></div>
    <p style="color:var(--text2)">종목 정보 불러오는 중...</p>
  </div>
</div>

<div id="site-footer-mount"></div>
<script>renderSiteFooter();</script>

<script>
async function shareContent(e, btn) {
  e.preventDefault(); e.stopPropagation();
  const title = btn.dataset.shareTitle || document.title;
  const url = btn.dataset.shareUrl || location.href;
  if (navigator.share) {
    try { await navigator.share({ title, url }); } catch (err) { /* 사용자 취소 등 — 무시 */ }
    return;
  }
  try {
    await navigator.clipboard.writeText(url);
    showShareToast('🔗 링크가 복사되었습니다');
  } catch {
    showShareToast('공유하기를 지원하지 않는 브라우저입니다');
  }
}

function fmtDate(d) {
  if (!d) return '—';
  return new Date(d).toLocaleDateString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit' });
}

// 07-16(목) 형식 — 분석이력·수급 일자 표기용
const _WEEKDAYS = ['일', '월', '화', '수', '목', '금', '토'];
function fmtMDW(d) {
  if (!d) return '—';
  const dt = new Date(d);
  if (isNaN(dt)) return '—';
  const mm = String(dt.getMonth() + 1).padStart(2, '0');
  const dd = String(dt.getDate()).padStart(2, '0');
  return `${mm}-${dd}(${_WEEKDAYS[dt.getDay()]})`;
}

let _lineChart = null;
let _currentTicker = '';
let _currentRange = '3mo';
let _isKr = false;
let _currentLivePrice = null;   // 애널리스트 컨센서스 상승여력% 계산에 재사용 (화면에 보이는 현재가와 일관성 유지)
let _usdKrwRate = null;         // 미장 종목 원화 병기용
let _tossQuote = null;          // 미장 종목 헤드라인(통합가)+정규/시간외 변동 — Toss 공식 데이터 기반
let _lastPriceData = null;      // buildPriceBlock에 마지막으로 넘겼던 Yahoo priceData — 토스 전용 재렌더용
let _tossMeta = null;           // 종목 마스터(상장주식수→시총, NXT/정리매매/경고) — Toss 공식

async function loadUsdKrwRate() {
  try {
    const r = await fetch('/api/toss?action=fx');
    if (!r.ok) return null;
    const j = await r.json();
    if (j.ok && j.rate) _usdKrwRate = j.rate;
    return _usdKrwRate;
  } catch { return null; }
}

async function loadTossQuote(ticker) {
  try {
    const r = await fetch(`/api/toss?action=quote&symbol=${encodeURIComponent(ticker)}`);
    if (!r.ok) return null;
    const j = await r.json();
    if (j.ok && j.lastPrice != null) _tossQuote = j;
    return _tossQuote;
  } catch { return null; }
}

async function loadPrice(ticker) {
  try {
    // /api/quotes는 정규장 + pre/post + marketState까지 한 번에 제공
    const res = await fetch(`/api/quotes?tickers=${encodeURIComponent(ticker)}`);
    if (!res.ok) return null;
    const j = await res.json();
    return j?.data?.[ticker] || null;
  } catch(e) { return null; }
}

// ── 고도화 캔들차트 (lightweight-charts) + 매물대 ─────────────────
// Yahoo 라인차트/TradingView 임베드를 대체. Toss 공식 일봉으로 캔들+거래량을 우리 테마로 렌더.
let _advChart = null, _advResizeObs = null, _advRange = 66;
// 2026-07-27: 라이트/다크 토글에 반응하도록 렌더 시점에 CSS 변수를 다시 읽는다(하드코딩 시
// 라이트 모드에서 회색 텍스트/흰색 그리드가 그대로 남아 거의 안 보이게 됨).
function getAdvColors(){
  const cs = getComputedStyle(document.documentElement);
  const isLight = document.documentElement.getAttribute('data-theme') === 'light';
  return {
    up:'#e5484d', down:(cs.getPropertyValue('--blue').trim() || '#4d8dff'),
    text:(cs.getPropertyValue('--text3').trim() || '#8b93a1'),
    grid: isLight ? 'rgba(15,17,23,0.08)' : 'rgba(255,255,255,0.06)',
  };
}
function cssVar(name, fallback){
  const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  return v || fallback;
}
// 라이트/다크 토글 시 이 페이지의 JS 렌더 차트(캔들·Chart.js·상대수익률 SVG)는 CSS만으론
// 재도색되지 않으므로(그리드/축 색이 렌더 시점에 고정돼 캔버스에 그려짐) 마지막 데이터로
// 다시 그린다 — 새 네트워크 요청 없이 캐시된 상태(_currentTicker/_currentRange/_relState)만 재사용.
window.addEventListener('sr-theme-change', () => {
  if (_currentTicker) {
    loadAdvChart(_currentTicker, _advRange);
    loadChartData(_currentTicker, _currentRange).then(data => { if (data) renderLineChart(data); });
  }
  if (_relState) buildRelativeChart(_relState.baseTicker, _relState.baseName, _relState.peerTicker, _relState.peerName, _relState.range);
});

async function initAdvChart(ticker){ _advRange = 66; await loadAdvChart(ticker, 66); }
async function setAdvRange(n, btn){
  document.querySelectorAll('#advRangeBtns .range-btn').forEach(b=>b.classList.toggle('active', b===btn));
  _advRange = n;
  await loadAdvChart(_currentTicker, n);
}
async function loadAdvChart(ticker, count){
  const el = document.getElementById('advChart');
  if (!el) return;
  if (typeof LightweightCharts === 'undefined') { el.innerHTML = '<div class="chart-loading" style="color:var(--red)">차트 라이브러리 로드 실패</div>'; return; }
  try {
    const r = await fetch(`/api/toss?action=candles&symbol=${encodeURIComponent(ticker)}&count=${count}`);
    if (!r.ok) throw new Error('http '+r.status);
    const j = await r.json();
    if (!j.ok || !j.candles?.length) throw new Error('no data');
    renderAdvChart(el, j.candles, j.currency);
  } catch(e) { el.innerHTML = '<div class="chart-loading" style="color:var(--red)">차트 데이터를 불러올 수 없어요.</div>'; }
}
function renderAdvChart(el, candles, currency){
  const isKrw = currency === 'KRW';
  el.innerHTML = '';
  if (_advChart) { try { _advChart.remove(); } catch{} _advChart = null; }
  if (_advResizeObs) { try { _advResizeObs.disconnect(); } catch{} _advResizeObs = null; }
  const ADV_COLORS = getAdvColors();
  const chart = LightweightCharts.createChart(el, {
    width: el.clientWidth || 600, height: 330,
    layout: { background:{ type:'solid', color:'transparent' }, textColor:ADV_COLORS.text, fontFamily:'Inter, sans-serif', fontSize:11 },
    grid: { vertLines:{ color:ADV_COLORS.grid }, horzLines:{ color:ADV_COLORS.grid } },
    rightPriceScale: { borderColor:ADV_COLORS.grid },
    timeScale: { borderColor:ADV_COLORS.grid, timeVisible:false, rightOffset:4 },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    localization: { priceFormatter: p => isKrw ? '₩'+Math.round(p).toLocaleString('ko-KR') : '$'+Number(p).toFixed(2) },
  });
  const cs = chart.addCandlestickSeries({ upColor:ADV_COLORS.up, downColor:ADV_COLORS.down, borderUpColor:ADV_COLORS.up, borderDownColor:ADV_COLORS.down, wickUpColor:ADV_COLORS.up, wickDownColor:ADV_COLORS.down });
  cs.setData(candles.map(c=>({ time:c.date, open:c.open, high:c.high, low:c.low, close:c.close })));
  // lastValueVisible/priceLineVisible off — 안 그러면 거래량 마지막 값이 우측 축에 뜨는데,
  // chart 레벨 priceFormatter(₩)가 거기까지 적용돼 "₩8,308,202"처럼 거래량이 '원'으로 잘못
  // 표기되던 버그가 있었음(2026-07-22 사용자 제보). 라벨 자체를 숨겨 해결.
  const vs = chart.addHistogramSeries({ priceFormat:{ type:'volume' }, priceScaleId:'', lastValueVisible:false, priceLineVisible:false });
  vs.priceScale().applyOptions({ scaleMargins:{ top:0.82, bottom:0 } });
  vs.setData(candles.map(c=>({ time:c.date, value:c.volume||0, color:(c.close>=c.open?ADV_COLORS.up:ADV_COLORS.down)+'55' })));
  chart.timeScale().fitContent();
  _advChart = chart;
  _advResizeObs = new ResizeObserver(()=>{ if(_advChart) _advChart.applyOptions({ width: el.clientWidth }); });
  _advResizeObs.observe(el);
}
// (매물대(Volume Profile) 사이드바는 2026-07-22 제거 — 일봉 종가 기준 근사라 정확도가 낮고
//  차트 옆 공간만 차지해, 차트를 전체폭으로 넓히는 게 더 낫다는 판단.)

async function loadChartData(ticker, range) {
  try {
    const res = await fetch(`/api/stock-chart?ticker=${encodeURIComponent(ticker)}&range=${range}`);
    return await res.json();
  } catch(e) { return null; }
}

function renderLineChart(data) {
  const wrap = document.getElementById('mainChartWrap');
  if (!wrap) return;
  wrap.innerHTML = '<canvas id="mainChartCanvas"></canvas>';
  const ctx = document.getElementById('mainChartCanvas');

  const { points, currentPrice, currency } = data;
  const values = points.map(p => p.close);
  const labels = points.map(p => p.date);
  const first = values[0];
  const last = currentPrice || values[values.length - 1];
  const isUp = last >= first;
  const lineColor = isUp ? '#3ddc84' : '#ff5c72';

  if (_lineChart) { _lineChart.destroy(); _lineChart = null; }
  _lineChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        data: values,
        borderColor: lineColor,
        borderWidth: 2,
        pointRadius: 0,
        tension: 0.2,
        fill: true,
        backgroundColor: (ctx2) => {
          const g = ctx2.chart.ctx.createLinearGradient(0, 0, 0, ctx2.chart.height);
          g.addColorStop(0, isUp ? 'rgba(61,220,132,0.22)' : 'rgba(255,92,114,0.22)');
          g.addColorStop(1, 'rgba(10,12,18,0)');
          return g;
        },
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: c => {
              const v = c.raw;
              const fmt = new Intl.NumberFormat('en-US', {
                style: 'currency', currency: currency || 'USD',
                maximumFractionDigits: currency === 'KRW' ? 0 : 2
              });
              return ' ' + fmt.format(v);
            }
          },
          backgroundColor: cssVar('--bg4', '#12151f'), borderColor: cssVar('--border-strong', 'rgba(255,255,255,0.14)'), borderWidth: 1,
          titleColor: cssVar('--text2', '#9aa4bf'), bodyColor: cssVar('--text', '#eef1f8'),
        }
      },
      scales: {
        x: {
          ticks: {
            color: cssVar('--text3', '#626b86'), font: { size: 10 }, maxTicksLimit: 6,
            callback(val, i) { return labels[i]?.slice(5); }
          },
          grid: { color: cssVar('--border-soft', 'rgba(255,255,255,0.05)') }
        },
        y: {
          ticks: {
            color: cssVar('--text3', '#626b86'), font: { size: 10 },
            callback: v => currency === 'KRW' ? v.toLocaleString('ko-KR') : v.toFixed(0)
          },
          grid: { color: cssVar('--border-soft', 'rgba(255,255,255,0.05)') }
        }
      }
    }
  });
}

async function selectRange(range) {
  _currentRange = range;
  document.querySelectorAll('.range-btn').forEach(b => b.classList.toggle('active', b.dataset.range === range));
  const wrap = document.getElementById('mainChartWrap');
  if (wrap) wrap.innerHTML = '<div class="chart-loading">차트 불러오는 중...</div>';
  const data = await loadChartData(_currentTicker, range);
  if (!data || !data.points || !data.points.length) {
    if (wrap) wrap.innerHTML = '<div class="chart-loading" style="color:var(--red)">차트 데이터를 불러올 수 없습니다.</div>';
    return;
  }
  renderLineChart(data);
}

function buildReturnCell(r1d, acc1d, r7d, acc7d) {
  if (r1d != null) {
    const sign = r1d >= 0 ? '+' : '';
    const cls = acc1d === true ? 'accurate' : acc1d === false ? 'inaccurate' : 'pending';
    const mark = acc1d === true ? '✓' : acc1d === false ? '✗' : '';
    return `<span class="return-badge ${cls}">${sign}${Number(r1d).toFixed(1)}% (1일) ${mark}</span>`;
  }
  if (r7d != null) {
    const sign = r7d >= 0 ? '+' : '';
    const cls = acc7d === true ? 'accurate' : acc7d === false ? 'inaccurate' : 'pending';
    const mark = acc7d === true ? '✓' : acc7d === false ? '✗' : '';
    return `<span class="return-badge ${cls}">${sign}${Number(r7d).toFixed(1)}% (7일) ${mark}</span>`;
  }
  return `<span class="return-badge pending">검증 대기</span>`;
}

// 오늘의 시세 카드 — 당일 레인지 바 · 거래량/거래대금 · 52주 범위 · 상장일
// priceData는 /api/quotes 응답 그대로(dayHigh/dayLow/volume/fiftyTwoWeekHigh/Low/firstTradeDate 포함)
function buildQuoteCard(priceData) {
  if (!priceData || priceData.price == null) return '';
  const isKrw = priceData.currency === 'KRW';
  const fmtP = v => v == null ? '—' : (isKrw ? Math.round(v).toLocaleString('ko-KR') : Number(v).toFixed(2));
  const fmtVol = v => {
    if (v == null) return '—';
    if (v >= 1e8) return (v / 1e8).toFixed(1) + '억';
    if (v >= 1e4) return (v / 1e4).toFixed(0) + '만';
    return v.toLocaleString();
  };
  const fmtMoneyShort = v => {
    if (v == null) return '—';
    if (isKrw) {
      if (v >= 1e12) return (v / 1e12).toFixed(1) + '조원';
      if (v >= 1e8)  return Math.round(v / 1e8).toLocaleString() + '억원';
      return Math.round(v).toLocaleString() + '원';
    }
    if (v >= 1e9) return '$' + (v / 1e9).toFixed(2) + 'B';
    if (v >= 1e6) return '$' + (v / 1e6).toFixed(1) + 'M';
    return '$' + Math.round(v).toLocaleString();
  };

  const rangeBar = (low, high, cur, label) => {
    if (low == null || high == null || cur == null || high <= low) return '';
    const pos = Math.min(100, Math.max(0, ((cur - low) / (high - low)) * 100));
    return `
      <div class="range-row">
        <div class="range-row-label">${label}</div>
        <div class="range-track">
          <div class="range-fill" style="width:${pos}%"></div>
          <div class="range-dot" style="left:${pos}%"></div>
        </div>
        <div class="range-endpoints">
          <div><span class="range-endpoint-label">최저 </span><span class="range-endpoint-val">${fmtP(low)}</span></div>
          <div><span class="range-endpoint-label">최고 </span><span class="range-endpoint-val">${fmtP(high)}</span></div>
        </div>
      </div>`;
  };

  const dayRange = rangeBar(priceData.dayLow, priceData.dayHigh, priceData.price, '📍 일간 최저 ~ 최고');
  const yearRange = rangeBar(priceData.fiftyTwoWeekLow, priceData.fiftyTwoWeekHigh, priceData.price, '📅 52주 최저 ~ 최고');
  if (!dayRange && !yearRange && priceData.volume == null) return '';

  const tradingValue = priceData.volume != null ? priceData.volume * priceData.price : null;

  return `
    <div class="quote-card">
      <div class="quote-card-title">📊 오늘의 시세</div>
      ${dayRange}
      ${yearRange}
      <div class="quote-stat-grid">
        <div class="quote-stat"><div class="quote-stat-label">당일 거래량</div><div class="quote-stat-val">${fmtVol(priceData.volume)}${isKrw ? '주' : ''}</div></div>
        <div class="quote-stat"><div class="quote-stat-label">당일 거래대금 (추정)</div><div class="quote-stat-val">${fmtMoneyShort(tradingValue, isKrw)}</div></div>
        <div class="quote-stat"><div class="quote-stat-label">상장일</div><div class="quote-stat-val" style="font-size:15px">${priceData.firstTradeDate ? fmtDate(priceData.firstTradeDate) : '—'}</div></div>
        <div class="quote-stat"><div class="quote-stat-label">거래소</div><div class="quote-stat-val" style="font-size:15px">${escHtml(priceData.exchangeName || '—')}</div></div>
      </div>
    </div>`;
}

// 통화 축약 (원/달러). 모듈 레벨 — statBar·시총·거래대금 공용.
function fmtMoneyShort(v, isKrw) {
  if (v == null) return '—';
  if (isKrw) {
    if (v >= 1e13) return Math.round(v / 1e12).toLocaleString() + '조';   // 10조+ 는 정수(예: 1,491조)
    if (v >= 1e12) return (v / 1e12).toFixed(1) + '조';
    if (v >= 1e8)  return Math.round(v / 1e8).toLocaleString() + '억';
    return Math.round(v).toLocaleString() + '원';
  }
  if (v >= 1e12) return '$' + (v / 1e12).toFixed(2) + 'T';
  if (v >= 1e9)  return '$' + (v / 1e9).toFixed(2) + 'B';
  if (v >= 1e6)  return '$' + (v / 1e6).toFixed(1) + 'M';
  return '$' + Math.round(v).toLocaleString();
}

// Toss식 가로 스탯바 + 52주 범위. 시가(#statOpen)/시총(#statMktCap)은 Toss 로더가 채움.
function buildStatBar(priceData) {
  if (!priceData || priceData.price == null) return '';
  const isKrw = priceData.currency === 'KRW';
  const cur = isKrw ? '₩' : '$';
  const fmtP = v => v == null ? '—' : (isKrw ? Math.round(v).toLocaleString('ko-KR') : Number(v).toFixed(2));
  const fmtVol = v => { if (v == null) return '—'; if (v >= 1e8) return (v/1e8).toFixed(1)+'억'; if (v >= 1e4) return Math.round(v/1e4).toLocaleString()+'만'; return v.toLocaleString(); };
  const tradingValue = priceData.volume != null ? priceData.volume * priceData.price : null;
  const volFallback = fmtVol(priceData.volume) + (isKrw ? '주' : '');
  const amtFallback = fmtMoneyShort(tradingValue, isKrw);
  const lowFallback = priceData.dayLow != null ? cur + fmtP(priceData.dayLow) : '—';
  const highFallback = priceData.dayHigh != null ? cur + fmtP(priceData.dayHigh) : '—';
  const cells = [
    // Yahoo 값을 초깃값으로 먼저 보여주고, loadDailyTable()이 Toss 일별시세(오늘/최근 거래일 실측
    // 거래량·시가·고저)로 곧바로 덮어씀 — 국내 종목은 NXT 프리/애프터장에 Yahoo가 0을 주는 경우가
    // 많아(2026-07 실측) Toss가 사실상 항상 최종값이 된다. Toss 실패 시엔 Yahoo 값이 그대로 남음.
    ['거래량', `<span id="statVolume">${volFallback}</span>`],
    ['거래대금', `<span id="statAmount">${amtFallback}</span>`],
    ['시가', '<span id="statOpen">—</span>'],
    ['1일 최저', `<span id="statLow">${lowFallback}</span>`],
    ['1일 최고', `<span id="statHigh">${highFallback}</span>`],
    ['시가총액', '<span id="statMktCap">—</span>'],
  ];
  const statCells = cells.map(([k, v]) => `<div class="stat-cell"><div class="stat-k">${k}</div><div class="stat-v">${v}</div></div>`).join('');
  let yr = '';
  const lo = priceData.fiftyTwoWeekLow, hi = priceData.fiftyTwoWeekHigh;
  if (lo != null && hi != null && hi > lo) {
    const pos = Math.min(100, Math.max(0, ((priceData.price - lo) / (hi - lo)) * 100));
    yr = `<div class="stat-range">
      <div class="stat-range-track"><div class="stat-range-fill" style="width:${pos}%"></div><div class="stat-range-dot" style="left:${pos}%"></div></div>
      <div class="stat-range-ends"><span>52주 최저 ${cur}${fmtP(lo)}</span><span>최고 ${cur}${fmtP(hi)}</span></div>
    </div>`;
  }
  return `<div class="stat-bar">${statCells}</div>${yr}`;
}

// 숫자가 이전값→새값으로 부드럽게 굴러가며 마지막에 상승/하락 색으로 반짝이는 효과.
// company.html은 app.js를 로드하지 않는 독립 페이지라 그 파일의 동명 함수를 그대로 복제(홈
// 지수 카드 등에서 쓰는 것과 완전히 동일한 구현 — 로직을 바꿀 땐 app.js 쪽도 같이 볼 것).
function animateNumberText(el, toVal, formatFn, flashCls) {
  if (!el || toVal == null || !isFinite(toVal)) return;
  const fromVal = el.dataset.animVal != null ? parseFloat(el.dataset.animVal) : NaN;
  el.dataset.animVal = toVal;
  if (!isFinite(fromVal)) { el.textContent = formatFn(toVal); return; }
  if (fromVal === toVal) return;

  if (el._animRAF) cancelAnimationFrame(el._animRAF);
  const startTs = performance.now();
  const duration = 500;
  const ease = t => 1 - Math.pow(1 - t, 3);
  const step = now => {
    const t = Math.min(1, (now - startTs) / duration);
    el.textContent = formatFn(fromVal + (toVal - fromVal) * ease(t));
    if (t < 1) { el._animRAF = requestAnimationFrame(step); return; }
    el._animRAF = null;
    if (flashCls) {
      const [upCls, dnCls] = flashCls;
      el.classList.remove(upCls, dnCls);
      void el.offsetWidth;
      el.classList.add(toVal > fromVal ? upCls : dnCls);
      setTimeout(() => el.classList.remove(upCls, dnCls), 900);
    }
  };
  el._animRAF = requestAnimationFrame(step);
}

// Price block — regular + pre/after-market. renderPage(최초)와 refreshLivePrice(폴링) 공용.
// 국내·미장 모두 Toss 공식 API(_tossQuote, loadTossQuote()가 채움) 기준으로 헤드라인(통합가) +
// 정규장/시간외 변동 분해를 계산 — Toss는 세션 구분 필드가 없어서(확인됨) 일별 캔들 종가를
// "정규장 마감가" 기준점 삼아 서버(api/market-data.js handleTossQuote)에서 직접 계산한 값.
// 국내 종목은 넥스트레이드(NXT) 프리마켓(08:00-08:50)·애프터마켓(15:30-20:00)에서 Yahoo가
// 세션을 못 읽어 전일 스탯을 그대로 보여주는 문제가 있어(2026-07 실측) Toss를 우선한다.
// Toss 프록시가 아직 안 떴거나 실패했을 땐 Yahoo(priceData) 기준으로 폴백.
// 시세 데이터의 실제 시각을 "N초/분 전"으로 — 신선도를 주장이 아니라 사실로 노출한다.
function relTime(iso) {
  if (!iso) return null;
  const diffMs = Date.now() - new Date(iso).getTime();
  if (!isFinite(diffMs) || diffMs < 0) return '방금';
  const s = Math.floor(diffMs / 1000);
  if (s < 10) return '방금';
  if (s < 60) return `${s}초 전`;
  const m = Math.floor(s / 60);
  if (m < 60) return `${m}분 전`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h}시간 전`;
  return new Date(iso).toLocaleDateString('ko-KR', { timeZone: 'Asia/Seoul', month: '2-digit', day: '2-digit' });
}

function buildPriceBlock(priceData) {
  let priceHtml = '<span class="price-loading">주가 로딩 중...</span>';
  if (priceData && priceData.price) {
    _lastPriceData = priceData;
    const isKrw = priceData.currency === 'KRW';
    const fmt = new Intl.NumberFormat('en-US', {
      style: 'currency', currency: priceData.currency || 'USD',
      maximumFractionDigits: isKrw ? 0 : 2
    });
    const sessionMap = {
      REGULAR: { label: '🟢 정규장', color: 'var(--green)' },
      DAY:     { label: '🔵 데이마켓', color: 'var(--blue)' },
      PRE:     { label: '🟡 프리장', color: 'var(--yellow)' },
      POST:    { label: '🟣 애프터장', color: 'var(--purple)' },
      CLOSED:  { label: '⚪ 마감',   color: 'var(--text3)' },
    };
    const tq = (_tossQuote && _tossQuote.lastPrice != null) ? _tossQuote : null;

    const st = sessionMap[tq ? tq.session : priceData.marketState] || sessionMap.CLOSED;
    priceHtml = `<div style="font-size:13.5px;color:${st.color};font-weight:600;margin-bottom:3px">${st.label}</div>`;

    if (tq) {
      priceHtml += `<div class="current-price" id="cmpCurPrice" data-val="${tq.lastPrice}">${fmt.format(tq.lastPrice)}</div>`;
      if (_usdKrwRate) {
        priceHtml += `<div class="current-price-krw">₩${Math.round(tq.lastPrice * _usdKrwRate).toLocaleString('ko-KR')}</div>`;
      }
      if (tq.regularChangePercent != null) {
        const sign = tq.regularChange >= 0 ? '+' : '-';
        const cls = tq.regularChangePercent >= 0 ? 'pos' : 'neg';
        const amtStr = fmt.format(Math.abs(tq.regularChange));
        // "정규장 X로 마감" 문구는 애프터마켓(오늘 정규장이 실제로 이미 끝난 상태)일 때만
        // 사실이다 — 데이마켓/프리마켓은 오늘 정규장이 아직 열리지도 않았으므로 이 문구를
        // 쓰면 안 된다(2026-07-21 지적). 그 경우들은 아래 plain 분기로 통일.
        if (tq.session === 'POST' && tq.regularClose != null) {
          priceHtml += `<div class="price-change ${cls}">정규장 ${fmt.format(tq.regularClose)}으로 마감 ${sign}${amtStr}(${sign}${Math.abs(tq.regularChangePercent).toFixed(2)}%)</div>`;
        } else {
          // 세션이 CLOSED일 땐 위에 이미 "⚪ 마감"이 떠 있는데 여기 "정규" 태그까지 붙으면
          // "마감"과 "정규"가 동시에 보여 모순처럼 읽힌다(실측 피드백, 2026-07-21) — 정규장이
          // 실제로 진행 중일 때만 "정규" 태그를 붙이고, 마감 중엔 태그 없이 숫자만 보여준다.
          const tagHtml = tq.session === 'REGULAR' ? ` <span style="font-size:13px;color:var(--text3);font-weight:500">정규</span>` : '';
          priceHtml += `<div class="price-change ${cls}">${sign}${amtStr} (${sign}${Math.abs(tq.regularChangePercent).toFixed(2)}%)${tagHtml}</div>`;
        }
      }
      if (tq.exChangePercent != null && tq.exChangePercent !== 0) {
        const exLabel = tq.session === 'PRE' ? '프리마켓' : tq.session === 'DAY' ? '데이마켓' : '애프터마켓';
        const exSign = tq.exChange >= 0 ? '+' : '-';
        const exCls = tq.exChangePercent >= 0 ? 'pos' : 'neg';
        const exAmtStr = fmt.format(Math.abs(tq.exChange));
        priceHtml += `<div class="price-change ${exCls}" style="margin-top:2px">${exLabel}에서 ${exSign}${exAmtStr}(${exSign}${Math.abs(tq.exChangePercent).toFixed(2)}%)</div>`;
      }
      const fresh = relTime(tq.timestamp);
      priceHtml += `<div class="price-src">토스증권 시세${fresh ? ` · ${fresh}` : ''}</div>`;
    } else {
      // Toss 폴백 — Yahoo 기준 (Toss 프록시 미설정/일시 장애 시에만 탐)
      let exLabel = null, exPrice = null, exChange = null, exPct = null;
      if (priceData.postMarketPrice != null && priceData.postMarketChangePercent) {
        exLabel = '애프터마켓'; exPrice = priceData.postMarketPrice; exChange = priceData.postMarketChange; exPct = priceData.postMarketChangePercent;
      } else if (priceData.preMarketPrice != null && priceData.preMarketChangePercent) {
        exLabel = '프리마켓'; exPrice = priceData.preMarketPrice; exChange = priceData.preMarketChange; exPct = priceData.preMarketChangePercent;
      }
      const headlinePrice = exPrice != null ? exPrice : priceData.price;
      priceHtml += `<div class="current-price" id="cmpCurPrice" data-val="${headlinePrice}">${fmt.format(headlinePrice)}</div>`;
      if (!isKrw && _usdKrwRate) {
        priceHtml += `<div class="current-price-krw">₩${Math.round(headlinePrice * _usdKrwRate).toLocaleString('ko-KR')}</div>`;
      }
      if (priceData.changePercent != null) {
        const sign = priceData.change >= 0 ? '+' : '-';
        const cls = priceData.changePercent >= 0 ? 'pos' : 'neg';
        const amtStr = priceData.change != null ? fmt.format(Math.abs(priceData.change)) : '';
        if (exLabel === '애프터마켓') {
          priceHtml += `<div class="price-change ${cls}">정규장 ${fmt.format(priceData.price)}으로 마감 ${sign}${amtStr}(${sign}${Math.abs(priceData.changePercent).toFixed(2)}%)</div>`;
        } else {
          // 위 세션 상태가 "마감"인데 여기 "정규" 태그까지 붙으면 모순처럼 보임 — 정규장이
          // 실제로 진행 중일 때만 태그를 붙인다(Toss 우선 경로와 동일 원칙).
          const tagHtml = priceData.marketState === 'REGULAR' ? ` <span style="font-size:13px;color:var(--text3);font-weight:500">정규</span>` : '';
          priceHtml += `<div class="price-change ${cls}">${sign}${amtStr} (${sign}${Math.abs(priceData.changePercent).toFixed(2)}%)${tagHtml}</div>`;
        }
      }
      if (exLabel) {
        const exSign = exChange >= 0 ? '+' : '-';
        const exCls = exPct >= 0 ? 'pos' : 'neg';
        const exAmtStr = exChange != null ? fmt.format(Math.abs(exChange)) : '';
        priceHtml += `<div class="price-change ${exCls}" style="margin-top:2px">${exLabel}에서 ${exSign}${exAmtStr}(${exSign}${Math.abs(exPct).toFixed(2)}%)</div>`;
      }
      // Yahoo 폴백 경로 — 미국 종목은 최대 15분 지연될 수 있음을 정직하게 고지.
      priceHtml += `<div class="price-src">Yahoo Finance · 최대 15분 지연 가능</div>`;
    }

    _currentLivePrice = priceData.price;
    // 탭 제목 = 현재가·등락률을 먼저, 종목명은 뒤로(요청, 2026-08) — 여러 종목 탭을
    // 띄워놓고 봐도 가격이 먼저 눈에 들어오게. buildPriceBlock이 초기 렌더/15초 폴링/
    // 10초 토스 고속 동기화 세 경로 전부의 유일한 공통 지점이라 여기 한 곳만 갱신하면 됨.
    updatePageTitle(tq ? tq.lastPrice : priceData.price, tq ? tq.regularChangePercent : priceData.changePercent, priceData.currency);
  }
  return priceHtml;
}

function updatePageTitle(price, changePercent, currency) {
  if (price == null) return;
  const isKrw = (currency || 'USD') === 'KRW';
  const priceStr = isKrw ? `${Math.round(price).toLocaleString('ko-KR')}원` : `$${Number(price).toLocaleString('en-US', { maximumFractionDigits: 2 })}`;
  const chgStr = changePercent != null ? `${changePercent >= 0 ? '+' : ''}${changePercent.toFixed(2)}%` : '';
  document.title = `${priceStr}${chgStr ? ' ' + chgStr : ''} | ${_coName || ''} — StockRipple`;
}

// 종목 실시간가 고속 동기화(토스증권 공식 API, 10초 간격) — 기존 15초 Yahoo 폴링과 별개로
// 헤드라인 숫자만 더 자주 갱신. day range/52주/거래량 등 나머지는 기존 주기 유지.
// 국내·미장 공통: /action=quote로 헤드라인+정규/시간외 변동 분해까지 전부 다시 계산되므로
// priceBlock 전체를 재렌더(buildPriceBlock이 이제 국내 종목도 _tossQuote를 우선 사용).
let _tossFastTimer = null;
function startTossFastPriceSync(ticker) {
  if (_tossFastTimer || !ticker) return;

  const tick = async () => {
    if (document.hidden) return;
    const q = await loadTossQuote(ticker);
    if (!q || q.lastPrice == null) return;
    const priceBlock = document.getElementById('priceBlock');
    if (!priceBlock) return;
    // 홈 지수 카드와 동일한 "숫자가 이전값→새값으로 굴러가며 강조되는" 효과를 주기 위해,
    // 통째로 재렌더하기 전에 현재가 엘리먼트의 이전 값을 스냅샷해두고, 새로 그려진 뒤 그
    // 값을 dataset.animVal로 심어 animateNumberText가 이전→신규로 보간·플래시하게 한다.
    const prevEl = document.getElementById('cmpCurPrice');
    const prevVal = prevEl ? (prevEl.dataset.animVal ?? prevEl.dataset.val) : null;
    priceBlock.innerHTML = buildPriceBlock(_lastPriceData);
    const curEl = document.getElementById('cmpCurPrice');
    if (curEl && prevVal != null) {
      const isKrw = (_lastPriceData?.currency || 'USD') === 'KRW';
      const fmt = new Intl.NumberFormat('en-US', { style: 'currency', currency: _lastPriceData?.currency || 'USD', maximumFractionDigits: isKrw ? 0 : 2 });
      curEl.dataset.animVal = prevVal;
      animateNumberText(curEl, Number(curEl.dataset.val), v => fmt.format(v), ['flash-up', 'flash-down']);
    }
  };

  tick();
  _tossFastTimer = setInterval(tick, 10000);
}

let _liveRefreshTimer = null;
function startLivePriceRefresh() {
  if (_liveRefreshTimer) return;

// ── 상대수익률 비교 차트 (vs 피어, 기준일 0% 정규화) ──
let _coName = '';
let _relState = null;
function relRange(rr) { if (_relState) buildRelativeChart(_relState.baseTicker, _relState.baseName, _relState.peerTicker, _relState.peerName, rr); }
async function buildRelativeChart(baseTicker, baseName, peerTicker, peerName, range) {
  const wrap = document.getElementById('relChartWrap');
  if (!wrap) return;
  range = range || _currentRange;
  _relState = { baseTicker, baseName, peerTicker, peerName, range };
  const [a, b] = await Promise.all([loadChartData(baseTicker, range), loadChartData(peerTicker, range)]);
  if (!a?.points?.length || !b?.points?.length) { wrap.innerHTML = ''; return; }
  const norm = pts => { const f = pts[0].close || 1; return pts.map(p => (p.close / f - 1) * 100); };
  const na = norm(a.points), nb = norm(b.points);
  const endA = na[na.length - 1], endB = nb[nb.length - 1];
  const W = 1000, H = 210;
  const all = [...na, ...nb, 0];
  const mn = Math.min(...all), mx = Math.max(...all), r = (mx - mn) || 1, pad = r * 0.08;
  const lo = mn - pad, hi = mx + pad, rr2 = (hi - lo) || 1;
  const y = v => H - ((v - lo) / rr2) * H;
  const CA = '#4d8dff', CM = '#f0b45e';
  const line = (arr, color) => {
    const pts = arr.map((v, i) => `${(i / (arr.length - 1 || 1)) * W},${y(v)}`).join(' ');
    return `<polyline fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" points="${pts}"/><circle cx="${W}" cy="${y(arr[arr.length - 1])}" r="4" fill="${color}"/>`;
  };
  const fmtPct = v => (v >= 0 ? '+' : '') + v.toFixed(1) + '%';
  const rangeLabels = { '1mo': '1M', '3mo': '3M', '6mo': '6M', '1y': '1Y' };
  const rangeBtns = ['1mo', '3mo', '6mo', '1y'].map(x => `<button class="rr-rg ${x === range ? 'on' : ''}" onclick="relRange('${x}')">${rangeLabels[x]}</button>`).join('');
  wrap.innerHTML = `
    <div class="ck-sec-head"><span class="tick"></span><h3>상대수익률 비교</h3><span class="note">기준일 = 0%</span></div>
    <div class="ck-panel" style="padding:16px 18px;margin-bottom:20px">
      <div class="rr-top">
        <div class="rr-legend">
          <div class="rr-lg"><span class="ln" style="background:${CA}"></span>${escHtml(baseName)} <b style="color:${endA >= 0 ? 'var(--red)' : 'var(--blue)'}">${fmtPct(endA)}</b></div>
          <div class="rr-lg"><span class="ln" style="background:${CM}"></span>${escHtml(peerName)} <b style="color:${endB >= 0 ? 'var(--red)' : 'var(--blue)'}">${fmtPct(endB)}</b></div>
        </div>
        <div class="rr-ranges">${rangeBtns}</div>
      </div>
      <div class="rr-box" style="height:210px">
        <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
          <line x1="0" y1="${y(0)}" x2="${W}" y2="${y(0)}" stroke="${cssVar('--border-strong','rgba(255,255,255,.14)')}" stroke-dasharray="4 5" stroke-width="1"/>
          ${line(na, CA)}${line(nb, CM)}
        </svg>
      </div>
    </div>`;
}

// ── 핵심 지표 칩 (기술지표·펀더멘털 로드 시 채워짐) ──────────

// 초심자도 의미와 영향을 알 수 있게(사용자 요청 2026-07-22). 투자 권유가 아니라 지표 해설.
