<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>종목 상세 — StockRipple</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg: #ffffff; --bg2: #f6f6f8; --bg3: #ececf0; --bg4: #dededf;
  --border: #e5e5ea; --border-strong: #c4c4c9; --border-soft: rgba(0,0,0,0.06);
  --text: #0a0a0a; --text2: #4b4b52; --text3: #86868b;
  --blue: #0066cc; --blue-dim: rgba(0,102,204,0.10);
  --green: #00873a; --green-dim: rgba(0,135,58,0.10);
  --red:   #e31937; --red-dim:   rgba(227,25,55,0.10);
  --yellow:#b8860b; --yellow-dim:rgba(184,134,11,0.12);
  --purple:#7c3aed; --purple-dim:rgba(124,58,237,0.10);
  --shadow-card: 0 1px 3px rgba(0,0,0,0.04), 0 8px 24px rgba(0,0,0,0.06);
  --r-lg: 20px; --r-md: 14px; --r-sm: 10px; --r-pill: 999px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

.header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(255,255,255,0.85); backdrop-filter: blur(12px) saturate(180%);
  border-bottom: 1px solid var(--border); padding: 0 24px;
}
.header-inner {
  max-width: 1100px; margin: 0 auto;
  display: flex; align-items: center; gap: 16px; height: 56px;
}
.back-btn {
  display: flex; align-items: center; gap: 6px; color: var(--text2);
  text-decoration: none; font-size: 13px; background: none; border: none; cursor: pointer;
  padding: 5px 10px; border-radius: 6px; transition: all 0.15s;
}
.back-btn:hover { background: var(--bg3); color: var(--text); }
.logo-sm { font-size: 14px; font-weight: 700; color: var(--text2); }
.logo-sm span { color: var(--blue); }

.page-wrap { max-width: 1100px; margin: 0 auto; padding: 32px 24px 60px; }

/* Company Header */
.company-header { margin-bottom: 28px; }
.company-header-top { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
.ticker-badge {
  font-size: 14px; font-weight: 700; font-family: 'SF Mono', 'Fira Code', monospace;
  padding: 6px 14px; border-radius: 8px; white-space: nowrap; flex-shrink: 0;
}
.ticker-badge.kr { background: rgba(0,102,204,0.10); color: #0066cc; }
.ticker-badge.us { background: rgba(124,58,237,0.10); color: #7c3aed; }
.company-name-wrap { flex: 1; }
.company-name-main { font-size: 28px; font-weight: 700; line-height: 1.2; margin-bottom: 4px; }
.company-sub { font-size: 13px; color: var(--text3); }
.price-block { text-align: right; flex-shrink: 0; }
.current-price { font-size: 28px; font-weight: 700; }
.price-change { font-size: 14px; font-weight: 600; margin-top: 2px; }
.price-change.pos { color: var(--green); }
.price-change.neg { color: var(--red); }
.price-loading { font-size: 14px; color: var(--text3); }

/* Stats Bar */
.stats-bar {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 32px;
}
.stat-card {
  background: var(--bg2); border: 1px solid var(--border); border-radius: 10px;
  padding: 14px 16px;
}
.stat-label { font-size: 11px; color: var(--text3); font-weight: 500; text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 6px; }
.stat-value { font-size: 22px; font-weight: 700; }
.stat-value.green { color: var(--green); }
.stat-value.blue { color: var(--blue); }
.stat-value.yellow { color: var(--yellow); }

/* Section Headers */
.section-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
.section-title svg { color: var(--text3); }

/* Chart Section */
.chart-section { margin-bottom: 36px; }
.chart-container {
  background: var(--bg2); border: 1px solid var(--border); border-radius: 12px;
  padding: 20px;
}
.chart-range-btns { display: flex; gap: 6px; margin-bottom: 16px; }
.range-btn {
  padding: 4px 12px; border-radius: 6px; font-size: 12px; font-weight: 600;
  border: 1px solid var(--border); background: none; color: var(--text3); cursor: pointer; transition: all 0.15s;
}
.range-btn.active, .range-btn:hover { background: var(--blue); border-color: var(--blue); color: #fff; }
.chart-wrap { position: relative; height: 280px; }
.chart-loading { text-align: center; padding: 60px; color: var(--text3); font-size: 13px; }

/* History Section */
.history-section { margin-bottom: 36px; }
.history-table-wrap { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.history-table { width: 100%; border-collapse: collapse; }
.history-table th {
  font-size: 11px; font-weight: 600; color: var(--text3); text-align: left;
  padding: 12px 16px; background: var(--bg3); border-bottom: 1px solid var(--border);
  text-transform: uppercase; letter-spacing: 0.4px;
}
.history-table td {
  padding: 13px 16px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: middle;
}
.history-table tr:last-child td { border-bottom: none; }
.history-table tr:hover td { background: rgba(255,255,255,0.02); }
.date-cell { color: var(--text3); white-space: nowrap; font-size: 12px; }
.issue-link {
  color: var(--text); text-decoration: none; font-weight: 500;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.issue-link:hover { color: var(--blue); }
.upside-cell { font-weight: 700; white-space: nowrap; }
.upside-cell.pos { color: var(--green); }
.upside-cell.neg { color: var(--red); }
.return-cell { white-space: nowrap; }
.return-badge {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 5px;
}
.return-badge.accurate { background: var(--green-dim); color: var(--green); }
.return-badge.inaccurate { background: var(--red-dim); color: var(--red); }
.return-badge.pending { background: var(--bg3); color: var(--text3); }
.empty-row td { text-align: center; color: var(--text3); padding: 40px; }

/* AI Summary */
.ai-summary-card {
  background: linear-gradient(135deg, rgba(0,102,204,0.06) 0%, rgba(0,102,204,0.015) 100%);
  border: 1px solid rgba(0,102,204,0.20);
  border-radius: var(--r-lg, 20px); padding: 22px; margin-bottom: 24px;
  box-shadow: var(--shadow-card, 0 1px 3px rgba(0,0,0,0.04));
}
.ai-badge-row { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
.ai-badge { font-size: 11px; color: #0066cc; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; }
.ai-dot { width: 7px; height: 7px; border-radius: 50%; background: #0066cc; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
.ai-block { margin-bottom: 16px; }
.ai-block:last-child { margin-bottom: 0; }
.ai-block-label { font-size: 12px; color: var(--text2); font-weight: 700; margin-bottom: 6px; letter-spacing: 0.2px; }
.ai-block-text { font-size: 14px; line-height: 1.7; color: var(--text); }
.ai-risks { display: flex; flex-direction: column; gap: 6px; }
.ai-risk-item { font-size: 13.5px; color: #a25b00; line-height: 1.55; padding-left: 18px; position: relative; font-weight: 500; }
.ai-risk-item::before { content: '⚠️'; position: absolute; left: -2px; }
.ai-watch-item { font-size: 13.5px; color: #006b2e; line-height: 1.55; padding-left: 18px; position: relative; font-weight: 500; }
.ai-watch-item::before { content: '👁'; position: absolute; left: -2px; }

/* Trade box */
.trade-box {
  display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; padding: 16px;
  background: linear-gradient(135deg, rgba(63,185,80,.08), rgba(47,129,247,.08));
  border: 1px solid rgba(63,185,80,.25); border-radius: 10px; margin-bottom: 14px;
}
.trade-cell { text-align: center; }
.trade-cell + .trade-cell { border-left: 1px solid var(--border); }
.trade-label { font-size: 10px; color: var(--text3); margin-bottom: 4px; }
.trade-val { font-size: 16px; font-weight: 700; font-family: 'SF Mono', monospace; }
.trade-val.buy { color: var(--blue); }
.trade-val.tg  { color: var(--green); }
.trade-val.sl  { color: var(--red); }

/* Tech chips */
.tech-chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0; }
.tech-chip {
  font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 5px;
  background: var(--bg3); color: var(--text2);
}

/* Fundamentals grid */
.fund-section { margin-bottom: 24px; }
.fund-group {
  background: var(--bg2); border: 1px solid var(--border); border-radius: 12px;
  padding: 18px; margin-bottom: 12px;
}
.fund-group-title { font-size: 12px; color: var(--text3); font-weight: 700; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.6px; display: flex; align-items: center; gap: 6px; }
.fund-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.fund-item { padding: 10px 12px; background: var(--bg3); border-radius: 8px; }
.fund-label { font-size: 11px; color: var(--text3); margin-bottom: 4px; }
.fund-val { font-size: 15px; font-weight: 700; font-family: 'SF Mono', monospace; color: var(--text); }
.fund-val.good { color: var(--green); }
.fund-val.bad  { color: var(--red); }
.fund-val.warn { color: var(--yellow); }
.fund-val.dim  { color: var(--text3); font-size: 13px; }
.fund-sub { font-size: 10px; color: var(--text3); margin-top: 2px; font-family: 'SF Mono', monospace; }
.fund-sub.pos { color: var(--green); }
.fund-sub.neg { color: var(--red); }
@media (max-width: 700px) {
  .fund-grid { grid-template-columns: repeat(2, 1fr); }
}

/* 오늘의 시세 (당일 레인지 · 거래량 · 52주 범위) */
.quote-card {
  background: var(--bg2); border: 1px solid var(--border); border-radius: var(--r-md, 14px);
  padding: 18px 20px; margin-bottom: 24px;
}
.quote-card-title { font-size: 13px; font-weight: 700; color: var(--text2); margin-bottom: 16px; }
.range-row { margin-bottom: 18px; }
.range-row:last-child { margin-bottom: 0; }
.range-row-label { font-size: 11px; color: var(--text3); margin-bottom: 8px; }
.range-track { position: relative; height: 5px; background: var(--bg4); border-radius: 3px; }
.range-fill { position: absolute; top: 0; left: 0; height: 100%; background: var(--blue); border-radius: 3px; opacity: 0.35; }
.range-dot {
  position: absolute; top: 50%; width: 13px; height: 13px; border-radius: 50%;
  background: #fff; border: 3px solid var(--blue); transform: translate(-50%, -50%);
  box-shadow: 0 1px 4px rgba(0,0,0,0.18);
}
.range-endpoints { display: flex; justify-content: space-between; margin-top: 8px; }
.range-endpoint-label { font-size: 10px; color: var(--text3); }
.range-endpoint-val { font-size: 12.5px; font-weight: 700; font-family: 'SF Mono', monospace; }
.quote-stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 18px; }
.quote-stat-label { font-size: 10px; color: var(--text3); margin-bottom: 4px; }
.quote-stat-val { font-size: 13.5px; font-weight: 700; font-family: 'SF Mono', monospace; }
@media (max-width: 700px) { .quote-stat-grid { grid-template-columns: repeat(2, 1fr); } }

/* 애널리스트 컨센서스 (KR 종목 — 목표주가/상승여력만, 방향성 점수는 척도 확인 불가로 미표시) */
.consensus-row { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
.consensus-target-val { font-size: 24px; font-weight: 800; color: var(--blue); font-family: 'SF Mono', monospace; line-height: 1.2; }
.consensus-target-sub { font-size: 11px; color: var(--text3); margin-top: 3px; }
.consensus-upside { text-align: center; padding: 10px 18px; border-radius: 10px; }
.consensus-upside-val { font-size: 20px; font-weight: 800; font-family: 'SF Mono', monospace; }
.consensus-upside-label { font-size: 10.5px; color: var(--text3); margin-top: 2px; }

/* 동종업계 비교 (KR 종목) */
.peer-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.peer-table th { text-align: left; padding: 6px 8px; font-size: 11px; color: var(--text3); font-weight: 600; border-bottom: 1px solid var(--border); }
.peer-table td { padding: 9px 8px; border-bottom: 1px solid var(--border); }
.peer-table tr:last-child td { border-bottom: none; }
.peer-table a { color: var(--text); text-decoration: none; font-weight: 600; }
.peer-table a:hover { color: var(--blue); }
.peer-chg { font-weight: 700; font-family: 'SF Mono', monospace; }

/* TradingView wrapper */
.tv-wrap {
  background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
  margin-bottom: 24px;
}
.tv-header { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.tv-tabs { display: flex; gap: 4px; }
.tv-tab { padding: 4px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; background: var(--bg3); border: 1px solid var(--border); color: var(--text2); }
.tv-tab.active { background: var(--blue); color: #fff; border-color: var(--blue); }
.tv-frame { width: 100%; height: 500px; border: none; }

/* Loading / Error */
.loading-state { text-align: center; padding: 80px 24px; }
.spinner { width: 36px; height: 36px; border: 2px solid var(--border); border-top-color: var(--blue); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 700px) {
  .company-name-main { font-size: 20px; }
  .current-price { font-size: 20px; }
  .stats-bar { grid-template-columns: repeat(2, 1fr); }
  .history-table th:nth-child(1), .history-table td:nth-child(1) { display: none; }
  .history-table th:nth-child(4), .history-table td:nth-child(4) { display: none; }
}
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <a href="/" class="back-btn">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      피드로 돌아가기
    </a>
    <span class="logo-sm">Stock<span>Ripple</span></span>
  </div>
</header>

<div class="page-wrap" id="pageWrap">
  <div class="loading-state">
    <div class="spinner"></div>
    <p style="color:var(--text2)">종목 정보 불러오는 중...</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://nmvfffzpkqyzztiobwtt.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_22PPW0eCY3Tvy3vZVZYKFw_yCb8cI2f';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// 실시간 접속자 표시용 (관리자 대시보드) — 페이지뷰 집계가 아니라 현재 열려있는 탭 수 근사치
(function trackPresence() {
  try {
    let sid = sessionStorage.getItem('sr_sid');
    if (!sid) { sid = crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`; sessionStorage.setItem('sr_sid', sid); }
    const ch = sb.channel('site-presence', { config: { presence: { key: sid } } });
    ch.subscribe(status => { if (status === 'SUBSCRIBED') ch.track({ page: location.pathname }); });
  } catch {}
})();

function escHtml(s) {
  return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtDate(d) {
  if (!d) return '—';
  return new Date(d).toLocaleDateString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit' });
}

let _lineChart = null;
let _currentTicker = '';
let _currentRange = '3mo';
let _isKr = false;
let _currentLivePrice = null;   // 애널리스트 컨센서스 상승여력% 계산에 재사용 (화면에 보이는 현재가와 일관성 유지)

async function loadPrice(ticker) {
  try {
    // /api/quotes는 정규장 + pre/post + marketState까지 한 번에 제공
    const res = await fetch(`/api/quotes?tickers=${encodeURIComponent(ticker)}`);
    if (!res.ok) return null;
    const j = await res.json();
    return j?.data?.[ticker] || null;
  } catch(e) { return null; }
}

async function loadChartData(ticker, range) {
  try {
    const res = await fetch(`/api/stock-chart?ticker=${encodeURIComponent(ticker)}&range=${range}`);
    return await res.json();
  } catch(e) { return null; }
}

function renderLineChart(data) {
  const wrap = document.getElementById('mainChartWrap');
  if (!wrap) return;
  wrap.innerHTML = '<canvas id="mainChartCanvas"></canvas>';
  const ctx = document.getElementById('mainChartCanvas');

  const { points, currentPrice, currency } = data;
  const values = points.map(p => p.close);
  const labels = points.map(p => p.date);
  const first = values[0];
  const last = currentPrice || values[values.length - 1];
  const isUp = last >= first;
  const lineColor = isUp ? '#00873a' : '#e31937';

  if (_lineChart) { _lineChart.destroy(); _lineChart = null; }
  _lineChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        data: values,
        borderColor: lineColor,
        borderWidth: 2,
        pointRadius: 0,
        tension: 0.2,
        fill: true,
        backgroundColor: (ctx2) => {
          const g = ctx2.chart.ctx.createLinearGradient(0, 0, 0, ctx2.chart.height);
          g.addColorStop(0, isUp ? 'rgba(0,135,58,0.18)' : 'rgba(227,25,55,0.18)');
          g.addColorStop(1, 'rgba(255,255,255,0)');
          return g;
        },
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: c => {
              const v = c.raw;
              const fmt = new Intl.NumberFormat('en-US', {
                style: 'currency', currency: currency || 'USD',
                maximumFractionDigits: currency === 'KRW' ? 0 : 2
              });
              return ' ' + fmt.format(v);
            }
          },
          backgroundColor: '#ffffff', borderColor: '#e5e5ea', borderWidth: 1,
          titleColor: '#4b4b52', bodyColor: '#0a0a0a',
        }
      },
      scales: {
        x: {
          ticks: {
            color: '#4b4b52', font: { size: 10 }, maxTicksLimit: 6,
            callback(val, i) { return labels[i]?.slice(5); }
          },
          grid: { color: '#e5e5ea' }
        },
        y: {
          ticks: {
            color: '#4b4b52', font: { size: 10 },
            callback: v => currency === 'KRW' ? v.toLocaleString('ko-KR') : v.toFixed(0)
          },
          grid: { color: '#e5e5ea' }
        }
      }
    }
  });
}

async function selectRange(range) {
  _currentRange = range;
  document.querySelectorAll('.range-btn').forEach(b => b.classList.toggle('active', b.dataset.range === range));
  const wrap = document.getElementById('mainChartWrap');
  if (wrap) wrap.innerHTML = '<div class="chart-loading">차트 불러오는 중...</div>';
  const data = await loadChartData(_currentTicker, range);
  if (!data || !data.points || !data.points.length) {
    if (wrap) wrap.innerHTML = '<div class="chart-loading" style="color:var(--red)">차트 데이터를 불러올 수 없습니다.</div>';
    return;
  }
  renderLineChart(data);
}

function buildReturnCell(r1d, acc1d, r7d, acc7d) {
  if (r1d != null) {
    const sign = r1d >= 0 ? '+' : '';
    const cls = acc1d === true ? 'accurate' : acc1d === false ? 'inaccurate' : 'pending';
    const mark = acc1d === true ? '✓' : acc1d === false ? '✗' : '';
    return `<span class="return-badge ${cls}">${sign}${Number(r1d).toFixed(1)}% (1일) ${mark}</span>`;
  }
  if (r7d != null) {
    const sign = r7d >= 0 ? '+' : '';
    const cls = acc7d === true ? 'accurate' : acc7d === false ? 'inaccurate' : 'pending';
    const mark = acc7d === true ? '✓' : acc7d === false ? '✗' : '';
    return `<span class="return-badge ${cls}">${sign}${Number(r7d).toFixed(1)}% (7일) ${mark}</span>`;
  }
  return `<span class="return-badge pending">검증 대기</span>`;
}

// 오늘의 시세 카드 — 당일 레인지 바 · 거래량/거래대금 · 52주 범위 · 상장일
// priceData는 /api/quotes 응답 그대로(dayHigh/dayLow/volume/fiftyTwoWeekHigh/Low/firstTradeDate 포함)
function buildQuoteCard(priceData) {
  if (!priceData || priceData.price == null) return '';
  const isKrw = priceData.currency === 'KRW';
  const fmtP = v => v == null ? '—' : (isKrw ? Math.round(v).toLocaleString('ko-KR') : Number(v).toFixed(2));
  const fmtVol = v => {
    if (v == null) return '—';
    if (v >= 1e8) return (v / 1e8).toFixed(1) + '억';
    if (v >= 1e4) return (v / 1e4).toFixed(0) + '만';
    return v.toLocaleString();
  };
  const fmtMoneyShort = v => {
    if (v == null) return '—';
    if (isKrw) {
      if (v >= 1e12) return (v / 1e12).toFixed(1) + '조원';
      if (v >= 1e8)  return Math.round(v / 1e8).toLocaleString() + '억원';
      return Math.round(v).toLocaleString() + '원';
    }
    if (v >= 1e9) return '$' + (v / 1e9).toFixed(2) + 'B';
    if (v >= 1e6) return '$' + (v / 1e6).toFixed(1) + 'M';
    return '$' + Math.round(v).toLocaleString();
  };

  const rangeBar = (low, high, cur, label) => {
    if (low == null || high == null || cur == null || high <= low) return '';
    const pos = Math.min(100, Math.max(0, ((cur - low) / (high - low)) * 100));
    return `
      <div class="range-row">
        <div class="range-row-label">${label}</div>
        <div class="range-track">
          <div class="range-fill" style="width:${pos}%"></div>
          <div class="range-dot" style="left:${pos}%"></div>
        </div>
        <div class="range-endpoints">
          <div><span class="range-endpoint-label">최저 </span><span class="range-endpoint-val">${fmtP(low)}</span></div>
          <div><span class="range-endpoint-label">최고 </span><span class="range-endpoint-val">${fmtP(high)}</span></div>
        </div>
      </div>`;
  };

  const dayRange = rangeBar(priceData.dayLow, priceData.dayHigh, priceData.price, '📍 일간 최저 ~ 최고');
  const yearRange = rangeBar(priceData.fiftyTwoWeekLow, priceData.fiftyTwoWeekHigh, priceData.price, '📅 52주 최저 ~ 최고');
  if (!dayRange && !yearRange && priceData.volume == null) return '';

  const tradingValue = priceData.volume != null ? priceData.volume * priceData.price : null;

  return `
    <div class="quote-card">
      <div class="quote-card-title">📊 오늘의 시세</div>
      ${dayRange}
      ${yearRange}
      <div class="quote-stat-grid">
        <div class="quote-stat"><div class="quote-stat-label">당일 거래량</div><div class="quote-stat-val">${fmtVol(priceData.volume)}${isKrw ? '주' : ''}</div></div>
        <div class="quote-stat"><div class="quote-stat-label">당일 거래대금 (추정)</div><div class="quote-stat-val">${fmtMoneyShort(tradingValue)}</div></div>
        <div class="quote-stat"><div class="quote-stat-label">상장일</div><div class="quote-stat-val" style="font-size:12.5px">${priceData.firstTradeDate ? fmtDate(priceData.firstTradeDate) : '—'}</div></div>
        <div class="quote-stat"><div class="quote-stat-label">거래소</div><div class="quote-stat-val" style="font-size:12.5px">${escHtml(priceData.exchangeName || '—')}</div></div>
      </div>
    </div>`;
}

// Price block — regular + pre/after-market. renderPage(최초)와 refreshLivePrice(폴링) 공용.
function buildPriceBlock(priceData) {
  let priceHtml = '<span class="price-loading">주가 로딩 중...</span>';
  if (priceData && priceData.price) {
    const fmt = new Intl.NumberFormat('en-US', {
      style: 'currency', currency: priceData.currency || 'USD',
      maximumFractionDigits: priceData.currency === 'KRW' ? 0 : 2
    });
    const stateMap = {
      REGULAR: { label: '🟢 정규장', color: 'var(--green)' },
      PRE:     { label: '🟡 프리장', color: 'var(--yellow)' },
      POST:    { label: '🟣 애프터장', color: 'var(--purple)' },
      CLOSED:  { label: '⚪ 마감',   color: 'var(--text3)' },
    };
    const st = stateMap[priceData.marketState] || stateMap.CLOSED;
    priceHtml = `<div style="font-size:11px;color:${st.color};font-weight:600;margin-bottom:3px">${st.label}</div>`;
    priceHtml += `<div class="current-price">${fmt.format(priceData.price)}</div>`;
    if (priceData.changePercent != null) {
      const sign = priceData.changePercent >= 0 ? '+' : '';
      const cls = priceData.changePercent >= 0 ? 'pos' : 'neg';
      priceHtml += `<div class="price-change ${cls}">${sign}${Number(priceData.changePercent).toFixed(2)}% <span style="font-size:10px;color:var(--text3);font-weight:500">정규</span></div>`;
    }
    // 시간외 호가 (프리/애프터) — 미장만
    let ahLabel = null, ahPrice = null, ahPct = null, ahColor = 'var(--purple)';
    if (priceData.postMarketPrice != null && priceData.postMarketChangePercent != null) {
      ahLabel = '애프터장'; ahPrice = priceData.postMarketPrice; ahPct = priceData.postMarketChangePercent; ahColor = 'var(--purple)';
    } else if (priceData.preMarketPrice != null && priceData.preMarketChangePercent != null) {
      ahLabel = '프리장'; ahPrice = priceData.preMarketPrice; ahPct = priceData.preMarketChangePercent; ahColor = 'var(--yellow)';
    }
    if (ahLabel) {
      const ahSign = ahPct >= 0 ? '+' : '';
      const ahChgColor = ahPct >= 0 ? 'var(--green)' : 'var(--red)';
      priceHtml += `
        <div style="margin-top:8px;padding-top:8px;border-top:1px dashed var(--border);text-align:right">
          <div style="display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;background:${ahColor === 'var(--purple)' ? 'var(--purple-dim)' : 'var(--yellow-dim)'};color:${ahColor};margin-bottom:3px">⏱ ${ahLabel}</div>
          <div style="font-size:18px;font-weight:700;color:var(--text);font-family:var(--font-mono,'SF Mono',monospace)">${fmt.format(ahPrice)}</div>
          <div style="font-size:12px;font-weight:700;color:${ahChgColor}">${ahSign}${ahPct.toFixed(2)}%</div>
        </div>`;
    }
    _currentLivePrice = priceData.price;
  }
  return priceHtml;
}

// 페이지 머문 동안 주가를 계속 폴링해서 가격·등락률·레인지 바(오늘의 시세) 위치를 실시간 갱신
let _liveRefreshTimer = null;
function startLivePriceRefresh() {
  if (_liveRefreshTimer) return;
  _liveRefreshTimer = setInterval(async () => {
    if (document.hidden || !_currentTicker) return;  // 백그라운드 탭이면 쿼터 낭비 방지
    const priceData = await loadPrice(_currentTicker);
    if (!priceData || priceData.price == null) return;
    const priceBlock = document.getElementById('priceBlock');
    if (priceBlock) priceBlock.innerHTML = buildPriceBlock(priceData);
    const quoteWrap = document.getElementById('quoteCardWrap');
    if (quoteWrap) {
      const html = buildQuoteCard(priceData);
      if (html) quoteWrap.innerHTML = html;
    }
  }, 15000);
}

// 쿠팡 파트너스 광고 — 세 가지 문제를 피해야 한다:
// 1) 스크립트 태그를 HTML 템플릿 리터럴 안에 문자열로 직접 넣으면 브라우저의 HTML
//    파서가(JS 문법을 모른 채) 그 안의 스크립트 종료 태그 문자열을 페이지 전체를
//    감싸는 진짜 메인 스크립트의 종료로 오인해 그 뒤 코드 전부가 텍스트로 노출되던 사고.
// 2) 쿠팡 위젯(g.js)은 레거시 document.write() 방식이라, 페이지 로드가 끝난 뒤
//    document.createElement로 동적 주입하면 브라우저가 document.write를 조용히
//    무시해버려(에러 없이) 광고가 아예 안 뜬다.
// 3) iframe에 srcdoc을 쓰면 진짜 URL이 없어(about:srcdoc) 광고 서버가 리퍼러를
//    검증하다 막힐 수 있다.
// → /coupang-ad.html(우리 도메인의 진짜 정적 페이지, 실제 script 태그로 작성됨)을
//   iframe src로 로드해 세 문제를 전부 피한다.
function loadCoupangAd() {
  const slot = document.getElementById('coupangAdSlot');
  if (!slot || slot.dataset.loaded) return;
  slot.dataset.loaded = '1';
  const iframe = document.createElement('iframe');
  iframe.title = '광고';
  iframe.scrolling = 'no';
  iframe.src = '/coupang-ad.html';
  iframe.style.cssText = 'border:0;width:100%;max-width:1052px;height:84px;display:block;margin:0 auto';
  slot.appendChild(iframe);
}

// ── TradingView 차트 ──────────────────────────────────────
let _tvSymbol = '';
let _tvInterval = 'D';

function buildTvSymbol(ticker, market) {
  // 한국 주식: 005930.KS → KRX:005930
  if (/\.KS$/i.test(ticker)) return 'KRX:' + ticker.replace(/\.KS$/i, '');
  if (/\.KQ$/i.test(ticker)) return 'KOSDAQ:' + ticker.replace(/\.KQ$/i, '');
  // 미국 주식: 자동 인식 (대부분 NASDAQ:XXX 또는 NYSE:XXX)
  return ticker;
}

function loadTradingView(interval) {
  _tvInterval = interval;
  const frame = document.getElementById('tvFrame');
  if (!frame || !_tvSymbol) return;
  const sym = encodeURIComponent(_tvSymbol);
  // hide_side_toolbar=0 → 거래량/지표 도구 표시
  frame.src = `https://www.tradingview.com/widgetembed/?symbol=${sym}&interval=${interval}&theme=light&style=1&timezone=Asia%2FSeoul&locale=kr&hide_side_toolbar=0&allow_symbol_change=0&studies=Volume%40tv-basicstudies&save_image=0`;
}

function setTvInterval(interval, btn) {
  document.querySelectorAll('.tv-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  loadTradingView(interval);
}

  const fmtP = v => (v > 0 ? '+' : '') + v + '%';

        <div class="trade-val buy">${trade.elp != null ? fmtP(trade.elp) : '—'} ~ ${trade.ehp != null ? fmtP(trade.ehp) : '—'}</div>
      </div>
      <div class="trade-cell">
        <div class="trade-label">목표</div>
        <div class="trade-val tg">${trade.tp != null ? fmtP(trade.tp) : '—'}</div>
      </div>
      <div class="trade-cell">
        <div class="trade-label">손절</div>
        <div class="trade-val sl">${trade.sl != null ? fmtP(trade.sl) : '—'}</div>
      </div>

// ── 기술 지표 chip ────────────────────────────────────────
async function loadTechChips(ticker) {
  const wrap = document.getElementById('techChipsWrap');
  if (!wrap) return;
  wrap.innerHTML = '<div style="font-size:11px;color:var(--text3);margin:8px 0">기술 지표 로딩...</div>';
  try {
    const r = await fetch(`/api/technicals?tickers=${encodeURIComponent(ticker)}`);
    if (!r.ok) { wrap.innerHTML = ''; return; }
    const j = await r.json();
    const info = j?.data?.[ticker];
    if (!info) { wrap.innerHTML = ''; return; }

    const sigMap = {
      strong_bullish: { label: '🟢 강세 추세',  color: 'var(--green)' },
      bullish:        { label: '🟢 상승',       color: 'var(--green)' },
      oversold_bull:  { label: '🟢 과매도(매수기회)', color: '#00873a' },
      neutral:        { label: '⚪ 중립',       color: 'var(--text2)' },
      overbought:     { label: '🟡 과매수',     color: 'var(--yellow)' },
      oversold:       { label: '🟠 과매도',     color: 'var(--yellow)' },
      bearish:        { label: '🔴 하락',       color: 'var(--red)' },
      strong_bearish: { label: '🔴 약세 추세',  color: 'var(--red)' },
    };
    const sig = sigMap[info.signal] || sigMap.neutral;

    const chips = [
      `<span class="tech-chip" style="color:${sig.color}">${sig.label}</span>`,
    ];
    if (info.rsi14 != null) {
      const rsiColor = info.rsi14 >= 70 ? 'var(--yellow)' : info.rsi14 <= 30 ? 'var(--yellow)' : 'var(--text2)';
      chips.push(`<span class="tech-chip" style="color:${rsiColor}">RSI 14: ${info.rsi14}</span>`);
    }
    if (info.vsSma20  != null) chips.push(`<span class="tech-chip" style="color:${info.vsSma20  > 0 ? 'var(--green)' : 'var(--red)'}">20일선 ${info.vsSma20  > 0 ? '+' : ''}${info.vsSma20}%</span>`);
    if (info.vsSma50  != null) chips.push(`<span class="tech-chip" style="color:${info.vsSma50  > 0 ? 'var(--green)' : 'var(--red)'}">50일선 ${info.vsSma50  > 0 ? '+' : ''}${info.vsSma50}%</span>`);
    if (info.vsSma200 != null) chips.push(`<span class="tech-chip" style="color:${info.vsSma200 > 0 ? 'var(--green)' : 'var(--red)'}">200일선 ${info.vsSma200 > 0 ? '+' : ''}${info.vsSma200}%</span>`);

    wrap.innerHTML = `<div class="tech-chips">${chips.join('')}</div>`;
  } catch { wrap.innerHTML = ''; }
}

// ── 펀더멘털 표시 ────────────────────────────────────────
async function loadFundamentals(ticker, forceRefresh = false) {
  const wrap = document.getElementById('fundamentalsWrap');
  if (!wrap) return;
  wrap.innerHTML = `
    <div class="fund-section">
      <div class="section-title">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        펀더멘털 <span style="font-size:11px;color:var(--text3);font-weight:400">불러오는 중...</span>
        <span class="spinner" style="width:14px;height:14px;border-width:2px;margin:0 0 0 8px"></span>
      </div>
    </div>`;
  try {
    const url = `/api/stock?type=fundamentals&ticker=${encodeURIComponent(ticker)}${forceRefresh ? '&nocache=' + Date.now() : ''}`;
    const r = await fetch(url);
    if (!r.ok) {
      renderFundamentalsError(wrap, ticker, `서버 에러 (HTTP ${r.status})`);
      return;
    }
    const f = await r.json();
    if (!f.ok) {
      renderFundamentalsError(wrap, ticker, f.error || '데이터 없음', f.hint, f.resetKst);
      return;
    }
    renderFundamentals(wrap, f, ticker);
  } catch (e) {
    renderFundamentalsError(wrap, ticker, '네트워크 에러: ' + e.message);
  }
}

function renderFundamentalsError(wrap, ticker, message, hint = '', resetKst = '') {
  wrap.innerHTML = `
    <div class="fund-section">
      <div class="section-title">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        펀더멘털
        <button onclick="loadFundamentals('${escHtml(ticker)}', true)" style="margin-left:auto;background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:5px 12px;border-radius:6px;cursor:pointer;font-size:12px">🔄 다시 시도</button>
      </div>
      <div class="fund-group" style="text-align:center;padding:32px">
        <div style="font-size:14px;color:var(--yellow);margin-bottom:8px">⚠️ ${escHtml(message)}</div>
        ${hint ? `<div style="font-size:12px;color:var(--text2);margin-top:6px">${escHtml(hint)}</div>` : ''}

}

function renderFundamentals(wrap, f, ticker) {
  const isKrw = f.currency === 'KRW';
  // 포맷 헬퍼
  const fmtNum = (v, digits = 2) => v == null ? '—' : Number(v).toFixed(digits);
  const fmtPct = v => v == null ? '—' : (v > 0 ? '+' : '') + Number(v).toFixed(1) + '%';
  const fmtPctRaw = v => v == null ? '—' : Number(v).toFixed(1) + '%';
  const fmtMoney = v => {
    if (v == null) return '—';
    const abs = Math.abs(v);
    if (isKrw) {
      if (abs >= 1e12) return `${(v/1e12).toLocaleString(undefined, { maximumFractionDigits: 1 })}조원`;
      if (abs >= 1e8)  return `${Math.round(v/1e8).toLocaleString()}억원`;
      return `${Number(v).toLocaleString()}원`;
    }
    if (abs >= 1e12) return `$${(v/1e12).toFixed(2)}T`;
    if (abs >= 1e9)  return `$${(v/1e9).toFixed(2)}B`;
    if (abs >= 1e6)  return `$${(v/1e6).toFixed(0)}M`;
    return `$${Number(v).toFixed(0)}`;
  };

  // 색상 판정 (값이 좋은지/나쁜지)
  const peColor = f.pe == null ? '' : f.pe < 15 ? 'good' : f.pe < 30 ? '' : f.pe < 50 ? 'warn' : 'bad';
  const pbColor = f.pb == null ? '' : f.pb < 1 ? 'good' : f.pb < 3 ? '' : f.pb < 5 ? 'warn' : 'bad';

  const opMarginColor = f.operatingMargin == null ? '' : f.operatingMargin > 20 ? 'good' : f.operatingMargin > 5 ? '' : f.operatingMargin > 0 ? 'warn' : 'bad';

        펀더멘털 ${f.fiscalPeriod ? `<span style="font-size:11px;color:var(--text3);font-weight:400">${f.fiscalPeriod}${f.reportDate ? ` (${f.reportDate})` : ''}</span>` : ''}
        ${f.source === 'db-cache' ? `<span style="font-size:10px;color:var(--green);background:var(--bg3);padding:2px 7px;border-radius:4px;margin-left:6px">💾 캐시 ${f.cacheAgeHours}h 전</span>` : ''}

        ${f.source === 'naver' ? `<span style="font-size:10px;color:var(--green);background:var(--bg3);padding:2px 7px;border-radius:4px;margin-left:6px">🇰🇷 네이버증권</span>` : ''}
        <button onclick="loadFundamentals('${escHtml(ticker)}', true)" style="margin-left:auto;background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:4px 10px;border-radius:6px;cursor:pointer;font-size:11px" title="캐시 무시하고 FMP에서 최신 데이터 가져오기">🔄 새로고침</button>

// Yahoo Finance에서 정보 가져와 companies 테이블에 자동 등록
async function autoRegisterCompany(ticker) {
  try {
    // /api/quotes로 회사 정보 조회 (시세 + 통화 + marketState 가져옴)
    const r = await fetch(`/api/quotes?tickers=${encodeURIComponent(ticker)}`);
    if (!r.ok) return null;
    const j = await r.json();
    const q = j?.data?.[ticker];
    if (!q || q.price == null) return null;

    // 시장 자동 판별 (.KS = 한국, 그 외 = 미국)
    const market = /\.KS$|\.KQ$/i.test(ticker) ? 'KR' : 'US';

    // 회사명: 서버 프록시(펀더멘털 API)로 조회 — KR은 네이버(정확한 한글명), US는 FMP.
    // 브라우저에서 Yahoo Finance를 직접 호출하면 CORS로 거의 항상 실패해(응답을 읽을 수
    // 없음) 티커 코드가 그대로 회사명으로 저장되는 문제가 있었음 — /api/quotes가 이미
    // 받아온 shortName을 우선 폴백으로 쓰고, 서버 경유 조회로 더 정확한 이름을 덮어쓴다.
    let companyName = q.shortName || ticker;
    try {
      const r2 = await fetch(`/api/stock?type=fundamentals&ticker=${encodeURIComponent(ticker)}`);
      if (r2.ok) {
        const fd = await r2.json();
        if (fd?.company) companyName = fd.company;
      }
    } catch {}

    // DB에 INSERT (RLS: companies는 보통 public read + service write)
    const { data: inserted, error } = await sb.from('companies').insert({
      ticker,
      name_en: companyName,
      name_ko: companyName,  // 한국어 이름은 영문명으로 폴백, 추후 admin에서 보정
      market,
      current_price: q.price,
      currency: q.currency || (market === 'KR' ? 'KRW' : 'USD'),
      price_updated_at: new Date().toISOString(),
    }).select('id,ticker,name_ko,name_en,market,sector').single();

    if (error) {
      // 동시 요청으로 이미 만들어졌을 가능성 → 다시 조회
      const { data: existing } = await sb.from('companies')
        .select('id,ticker,name_ko,name_en,market,sector').eq('ticker', ticker).maybeSingle();
      return existing || null;
    }
    return inserted;
  } catch (e) {
    console.warn('autoRegisterCompany error:', e);
    return null;
  }
}

async function init() {
  const params = new URLSearchParams(location.search);
  const ticker = (params.get('ticker') || '').toUpperCase().trim();
  if (!ticker) { location.href = '/'; return; }

  _currentTicker = ticker;

  let { data: company } = await sb
    .from('companies')
    .select('id,ticker,name_ko,name_en,market,sector')
    .eq('ticker', ticker)
    .maybeSingle();

  // DB에 없으면 Yahoo에서 가져와서 자동 등록
  if (!company) {
    // 1차: name_ko / name_en으로 매칭 시도 (예: HLB → 028300.KQ)
    try {
      const safe = ticker.replace(/[%_'"\\]/g, '');
      const { data: nameMatch } = await sb
        .from('companies').select('ticker, name_ko, name_en, market')
        .or(`name_ko.ilike.${safe},name_en.ilike.${safe}`)
        .limit(1).maybeSingle();
      if (nameMatch?.ticker && nameMatch.ticker !== ticker) {
        location.replace(`/company.html?ticker=${encodeURIComponent(nameMatch.ticker)}`);
        return;
      }
    } catch {}

    document.getElementById('pageWrap').innerHTML = `
      <div class="loading-state">
        <div class="spinner"></div>
        <p style="color:var(--text2)"><strong>${escHtml(ticker)}</strong> 정보를 Yahoo Finance에서 가져오는 중...</p>
      </div>`;
    company = await autoRegisterCompany(ticker);
    if (!company) {
      document.getElementById('pageWrap').innerHTML = `
        <div class="loading-state">
          <p style="color:var(--red)">❌ 종목 <strong>${escHtml(ticker)}</strong>을(를) 찾을 수 없습니다.</p>
          <p style="color:var(--text3);font-size:13px;margin-top:8px">
            Yahoo Finance에서도 검색 실패.<br>
            한국 종목은 6자리 코드 + .KS 또는 .KQ (예: 028300.KQ, 005930.KS)<br>
            미국 종목은 영문 티커 (예: AAPL, MSFT, NVDA)
          </p>
          <a href="/" class="back-btn" style="display:inline-block;margin-top:14px;padding:8px 16px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text)">← 메인으로</a>
        </div>`;
      return;
    }
  }

  document.title = `${company.name_ko || company.name_en || ticker} (${ticker}) — StockRipple`;
  _isKr = company.market === 'KR';

  const [priceData, { data: records }] = await Promise.all([
    loadPrice(ticker),
    sb.from('analysis_companies')
      .select('upside_pct,confidence,rationale,actual_return_1d,is_accurate_1d,actual_return_7d,is_accurate_7d,entry_date,analyses(id,confidence_score,issues(id,title,published_at,source_name))')
      .eq('company_id', company.id)
      .order('entry_date', { ascending: false }),
  ]);

  renderPage(company, records || [], priceData);
  startLivePriceRefresh();
}

init();

function renderInvestorTrend(d) {
  const days = d.days;
  const fmtNet = v => {
    if (v == null) return '<span style="color:var(--text3)">—</span>';
    const cls = v > 0 ? 'var(--green)' : v < 0 ? 'var(--red)' : 'var(--text3)';
    const sign = v > 0 ? '+' : '';
    return `<span style="color:${cls};font-variant-numeric:tabular-nums">${sign}${v.toLocaleString()}</span>`;
  };
  const fmtClose = day => {
    const ch = day.change;
    const cls = ch > 0 ? 'var(--green)' : ch < 0 ? 'var(--red)' : 'var(--text3)';
    const arrow = ch > 0 ? '▲' : ch < 0 ? '▼' : '—';
    return `${day.close != null ? day.close.toLocaleString() : '—'}
      <span style="color:${cls};font-size:11px">${arrow}${ch != null ? Math.abs(ch).toLocaleString() : ''}</span>`;
  };

  // 최근 5일 누적 순매수
  const sum5 = key => days.slice(0, 5).reduce((a, day) => a + (day[key] || 0), 0);
  const chip = (label, v) => {
    const cls = v > 0 ? 'var(--green)' : v < 0 ? 'var(--red)' : 'var(--text3)';
    const bg  = v > 0 ? 'var(--green-dim)' : v < 0 ? 'var(--red-dim)' : 'var(--bg3)';
    return `<span style="background:${bg};color:${cls};padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600">
      ${label} ${v > 0 ? '+' : ''}${v.toLocaleString()}주</span>`;
  };

  const td = 'padding:7px 8px;border-bottom:1px solid var(--border);';
  const rows = days.map(day => `
    <tr>
      <td style="${td}white-space:nowrap;color:var(--text2)">${day.date.slice(5)}</td>
      <td style="${td}white-space:nowrap">${fmtClose(day)}</td>
      <td style="${td}text-align:right">${fmtNet(day.individual)}</td>
      <td style="${td}text-align:right">${fmtNet(day.institution)}</td>
      <td style="${td}text-align:right">${fmtNet(day.foreign)}</td>
      <td style="${td}text-align:right;color:var(--text2)">${day.foreignHoldRatio != null ? day.foreignHoldRatio.toFixed(2) + '%' : '—'}</td>
    </tr>`).join('');

  return `<div style="background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:24px">
    <div style="font-size:14px;font-weight:700;color:var(--text2);display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      🧭 투자자별 매매동향
      <span style="font-size:11px;color:var(--text3);font-weight:400">일별 순매수 · 주 단위 · 네이버증권</span>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">
      <span style="font-size:12px;color:var(--text3);align-self:center">최근 5일 누적:</span>
      ${chip('개인', sum5('individual'))}
      ${chip('기관', sum5('institution'))}
      ${chip('외국인', sum5('foreign'))}
    </div>
    <div style="overflow-x:auto;max-height:420px;overflow-y:auto;margin-top:12px">
      <table style="width:100%;border-collapse:collapse;font-size:12.5px">
        <thead>
          <tr style="color:var(--text3);font-size:11px;text-align:right">
            <th style="text-align:left;padding:6px 8px;position:sticky;top:0;background:var(--bg2)">날짜</th>
            <th style="text-align:left;padding:6px 8px;position:sticky;top:0;background:var(--bg2)">종가</th>
            <th style="padding:6px 8px;position:sticky;top:0;background:var(--bg2)">개인</th>
            <th style="padding:6px 8px;position:sticky;top:0;background:var(--bg2)">기관</th>
            <th style="padding:6px 8px;position:sticky;top:0;background:var(--bg2)">외국인</th>
            <th style="padding:6px 8px;position:sticky;top:0;background:var(--bg2)">외인보유율</th>
          </tr>
        </thead>
        <tbody style="border-top:1px solid var(--border)">
          ${rows}
        </tbody>
      </table>
    </div>
  </div>`;
}

async function loadDartDetail(ticker) {
  const wrap = document.getElementById('dartDetailWrap');
  if (!wrap) return;
  wrap.innerHTML = `<div style="background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:24px">
    <div style="font-size:14px;font-weight:700;color:var(--text2);display:flex;align-items:center;gap:8px">
      🇰🇷 DART 상세 공시 데이터 <span class="spinner" style="width:12px;height:12px;border-width:2px"></span>
    </div>
  </div>`;

  try {
    const r = await fetch('/api/admin?action=dart-company-detail&ticker=' + encodeURIComponent(ticker));
    if (!r.ok) {
      const j = await r.json().catch(() => ({}));
      wrap.innerHTML = `<div style="background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:24px;font-size:12px;color:var(--text3)">
        🇰🇷 DART 상세 데이터 사용 불가 — ${escHtml(j.error || 'unknown')}
        ${j.error?.includes('not synced') ? '<div style="margin-top:6px;color:var(--blue)">관리자가 <code>?action=dart-sync-corp-codes</code>를 실행해야 합니다.</div>' : ''}
      </div>`;
      return;
    }
    const d = await r.json();
    wrap.innerHTML = renderDartDetail(d);
  } catch (e) {
    wrap.innerHTML = `<div style="background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:24px;font-size:12px;color:var(--red)">DART 로드 실패: ${escHtml(e.message)}</div>`;
  }
}

function renderDartDetail(d) {
  const sections = [];

  // 1. 최대주주 현황
  if (d.major_holders?.length) {
    // DART 실제 필드명: trmend_posesn_stock_co / trmend_posesn_stock_qota_rt (기말 기준)
    // 기초 기준은 bsis_posesn_stock_co / bsis_posesn_stock_qota_rt
    const pickStock = (h) => h.trmend_posesn_stock_co ?? h.trmend_qy ?? h.bsis_posesn_stock_co ?? '';
    const pickRt    = (h) => h.trmend_posesn_stock_qota_rt ?? h.bsis_posesn_stock_qota_rt ?? h.trmend_qota_rt ?? '';
    const fmtCount = (v) => {
      if (v == null || v === '' || v === '-') return '—';
      const n = parseFloat(String(v).replace(/,/g, ''));
      return isNaN(n) ? String(v) : n.toLocaleString();
    };
    const fmtRt = (v) => {
      if (v == null || v === '' || v === '-') return '—';
      const s = String(v).trim();
      return s.includes('%') ? s : s + '%';
    };
    const rows = d.major_holders.slice(0, 15).map(h => `<tr>
      <td style="padding:6px 10px">${escHtml(h.nm || h.nm1 || '—')}</td>
      <td style="padding:6px 10px;color:var(--text2)">${escHtml(h.relate || h.relt || h.stock_knd || '—')}</td>
      <td style="padding:6px 10px;text-align:right;font-family:var(--font-mono,monospace)">${fmtCount(pickStock(h))}</td>
      <td style="padding:6px 10px;text-align:right;color:var(--blue);font-weight:600;font-family:var(--font-mono,monospace)">${fmtRt(pickRt(h))}</td>
    </tr>`).join('');
    sections.push(`
      <div style="margin-bottom:18px">
        <div style="font-size:13px;font-weight:700;color:var(--text);margin-bottom:8px;display:flex;align-items:center;gap:6px">
          👥 최대주주 현황 <span style="font-size:11px;color:var(--text3);font-weight:400">(${d.major_holders.length}명)</span>
        </div>
        <div style="border:1px solid var(--border);border-radius:8px;overflow:hidden">
          <table style="width:100%;border-collapse:collapse;font-size:12px">
            <thead style="background:var(--bg3)">
              <tr><th style="padding:6px 10px;text-align:left">성명/법인</th><th style="padding:6px 10px;text-align:left">관계</th><th style="padding:6px 10px;text-align:right">보유주식</th><th style="padding:6px 10px;text-align:right">지분율</th></tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>`);
  }

  // 2. 5%+ 주요주주 (임원·주요주주 소유주식 변동)
  if (d.shareholders?.length) {
    const fmtNum = (v) => {
      if (v == null || v === '' || v === '-') return '—';
      const n = parseFloat(String(v).replace(/,/g, ''));
      return isNaN(n) ? String(v) : n.toLocaleString();
    };
    const fmtDelta = (v) => {
      if (v == null || v === '' || v === '-') return '';
      const n = parseFloat(String(v).replace(/,/g, ''));
      if (isNaN(n) || n === 0) return '';
      return ` <span style="font-size:10px;color:${n > 0 ? 'var(--green)' : 'var(--red)'};margin-left:4px">${n > 0 ? '+' : ''}${n.toLocaleString()}</span>`;
    };
    const rows = d.shareholders.slice(0, 12).map(s => {
      // 직위/주요주주 표시
      const role = s.isu_exctv_ofcps || s.isu_exctv_rgist_at || (s.isu_main_shrholdr === 'Y' ? '주요주주' : null) || s.relat || '—';
      const holding = s.sp_stock_lmp_cnt ?? s.posesn_stock_co ?? s.stock_cnt ?? '';
      const delta = s.sp_stock_lmp_irds_cnt ?? s.irds_cnt ?? '';
      return `<tr>
        <td style="padding:6px 10px">${escHtml(s.nm || s.repror || '—')}</td>
        <td style="padding:6px 10px;color:var(--text2)">${escHtml(role)}</td>
        <td style="padding:6px 10px;text-align:right;font-family:var(--font-mono,monospace)">${fmtNum(holding)}${fmtDelta(delta)}</td>
      </tr>`;
    }).join('');
    sections.push(`
      <div style="margin-bottom:18px">
        <div style="font-size:13px;font-weight:700;color:var(--text);margin-bottom:8px">📊 임원·주요주주 보유 변동</div>
        <div style="border:1px solid var(--border);border-radius:8px;overflow:hidden">
          <table style="width:100%;border-collapse:collapse;font-size:12px">
            <thead style="background:var(--bg3)"><tr><th style="padding:6px 10px;text-align:left">성명</th><th style="padding:6px 10px;text-align:left">직위/관계</th><th style="padding:6px 10px;text-align:right">보유 (주)</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>`);
  }

  // 3. 임원 현황
  if (d.officers?.length) {
    const rows = d.officers.slice(0, 15).map(o => `<tr>
      <td style="padding:6px 10px">${escHtml(o.nm || '—')}</td>
      <td style="padding:6px 10px;color:var(--text2)">${escHtml(o.ofcps || '—')}</td>
      <td style="padding:6px 10px;color:var(--text3);font-size:11px">${escHtml(o.chrg_job || o.main_career || '—')}</td>
      <td style="padding:6px 10px;color:var(--text3);font-size:11px">${escHtml(o.tenure_end_on || o.term_finish_dt || '—')}</td>
    </tr>`).join('');
    sections.push(`
      <div style="margin-bottom:18px">
        <div style="font-size:13px;font-weight:700;color:var(--text);margin-bottom:8px">🧑‍💼 임원 현황 <span style="font-size:11px;color:var(--text3);font-weight:400">(${d.officers.length}명)</span></div>
        <div style="border:1px solid var(--border);border-radius:8px;overflow:hidden;max-height:340px;overflow-y:auto">
          <table style="width:100%;border-collapse:collapse;font-size:12px">
            <thead style="background:var(--bg3);position:sticky;top:0"><tr><th style="padding:6px 10px;text-align:left">성명</th><th style="padding:6px 10px;text-align:left">직위</th><th style="padding:6px 10px;text-align:left">담당업무/경력</th><th style="padding:6px 10px;text-align:left">임기만료</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>`);
  }

  // 4. 재무지표 연간 추이
  if (d.financials && Object.keys(d.financials).length) {
    const years = Object.keys(d.financials).sort((a, b) => b.localeCompare(a)); // 최신년도 먼저
    const fmt = (v) => {
      if (v == null) return '—';
      const abs = Math.abs(v);
      if (abs >= 1e12) return (v / 1e12).toFixed(2) + '조';
      if (abs >= 1e8)  return (v / 1e8).toFixed(0) + '억';
      if (abs >= 1e4)  return (v / 1e4).toFixed(0) + '만';
      return v.toLocaleString();
    };
    const rows = ['revenue', 'opIncome', 'netIncome', 'assets', 'liabilities', 'equity'].map(k => {
      const labels = { revenue: '매출액', opIncome: '영업이익', netIncome: '당기순이익', assets: '자산총계', liabilities: '부채총계', equity: '자본총계' };
      const cells = years.map(y => {
        const v = d.financials[y]?.[k];
        const color = k === 'opIncome' || k === 'netIncome'
          ? (v == null ? 'var(--text3)' : v > 0 ? 'var(--green)' : 'var(--red)')
          : 'var(--text)';
        return `<td style="padding:6px 10px;text-align:right;color:${color}">${fmt(v)}</td>`;
      }).join('');
      return `<tr><td style="padding:6px 10px;color:var(--text2);font-weight:500">${labels[k]}</td>${cells}</tr>`;
    }).join('');
    sections.push(`
      <div style="margin-bottom:8px">
        <div style="font-size:13px;font-weight:700;color:var(--text);margin-bottom:8px">📈 재무지표 연간 추이</div>
        <div style="border:1px solid var(--border);border-radius:8px;overflow:hidden">
          <table style="width:100%;border-collapse:collapse;font-size:12px">
            <thead style="background:var(--bg3)"><tr><th style="padding:6px 10px;text-align:left">항목</th>${years.map(y => `<th style="padding:6px 10px;text-align:right">${y}</th>`).join('')}</tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>`);
  }

  const cached = d.cached ? `<span style="color:var(--text3);font-size:10px;margin-left:8px">(캐시 · ${new Date(d.updated_at).toLocaleDateString('ko-KR')})</span>` : '';
  const empty = !sections.length
    ? '<div style="color:var(--text3);font-size:12px;text-align:center;padding:20px">DART 데이터가 비어있습니다 (사업보고서 미공시 또는 비상장)</div>'
    : sections.join('');

  return `<div style="background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:24px;box-shadow:var(--shadow-card)">
    <div style="font-size:15px;font-weight:700;color:var(--text);margin-bottom:14px;display:flex;align-items:center;gap:8px;padding-bottom:10px;border-bottom:1px solid var(--border)">
      🇰🇷 DART 상세 공시 데이터${cached}
      <span style="margin-left:auto;font-size:11px;color:var(--text3);font-weight:400">출처: 전자공시시스템 (opendart.fss.or.kr)</span>
    </div>
    ${empty}
  </div>`;
}
</script>
</body>
</html>
