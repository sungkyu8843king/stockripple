<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>ad</title>
</head>
<body style="margin:0;overflow:hidden">
<script>
// 광고가 window.open(새 탭)으로 이동을 시도하면 iOS Safari에서 "다른 앱을 열려고
// 합니다" 확인창이 뜬다. 같은 창에서 바로 이동(top.location.href)시키면 확인창 없이
// 넘어가므로, 새 탭 시도를 가로채 강제로 같은 창 이동으로 바꾼다.
(function(){
	var _open = window.open;
	window.open = function(url){
		if (url) { top.location.href = url; return null; }
		return _open.apply(window, arguments);
	};
})();
</script>
<script>
// 배너 클릭 집계 — g.js 위젯이 채워넣는 내용(어떤 태그든) 클릭을 document 레벨에서
// 위임 감지해 어드민 "배너 클릭" 패널용으로 sendBeacon 기록. 이동을 막거나 늦추지 않음.
document.addEventListener('click', function () {
	try {
		var payload = new Blob([JSON.stringify({slot:'coupang-feed-pc'})], {type:'application/json'});
		navigator.sendBeacon('/api/admin?action=banner-click', payload);
	} catch (e) {}
});
</script>
<script src="https://ads-partners.coupang.com/g.js"></script>
<script>
	new PartnersCoupang.G({"id":1006666,"template":"carousel","trackingCode":"AF2174378","width":"728","height":"90","tsource":""});
</script>
</body>
</html>
