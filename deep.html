<style>
:root {
  --bg: #15171e; --bg-rgb: 21,23,30; --bg2: #1e2129; --bg3: #262a34; --bg4: #2f333f;
  --border: rgba(255,255,255,0.075); --border-strong: rgba(255,255,255,0.16); --border-soft: rgba(255,255,255,0.05);
  --text: #f2f4f8; --text2: #a6adbb; --text3: #6c7385;
  --blue: #4d8dff; --blue-dim: rgba(77,141,255,0.14);
  --green: #3ddb7f; --green-dim: rgba(61,219,127,0.14);
  --red:   #ff6b6b; --red-dim:   rgba(255,107,107,0.14);
  --yellow:#f0b45e; --yellow-dim: rgba(240,180,94,0.16); --purple:#9d7bff; --purple-dim: rgba(157,123,255,0.16);
  --shadow-card: 0 10px 30px -14px rgba(0,0,0,0.55);
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
  --r-lg: 20px; --r-md: 14px; --r-sm: 10px; --r-xs: 7px;
  --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
}
:root[data-theme="light"] {
  --bg: #f5f6f8; --bg-rgb: 245,246,248; --bg2: #ffffff; --bg3: #eef0f3; --bg4: #e3e6eb;
  --border: rgba(15,17,23,0.09); --border-strong: rgba(15,17,23,0.18); --border-soft: rgba(15,17,23,0.05);
  --text: #14161c; --text2: #4b5163; --text3: #6b7280;
  --red: #dc2626; --green: #15803d; --blue: #1d4ed8; --yellow: #a16207; --purple: #7c3aed;
  --shadow-sm: 0 2px 8px rgba(15,17,23,0.10);
  --shadow-card: 0 10px 30px -14px rgba(15,17,23,0.16);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

.wrap { max-width: 860px; margin: 0 auto; padding: 22px 18px 80px; }

/* ── 히어로 비주얼 ──────────────────────────────────────────
   실사진을 안 쓰는 이유: issues 테이블에 이미지 컬럼이 아예 없고(RSS 수집 단계에서
   저장하지 않는다), 원문 이미지 핫링크는 저작권·CORS 양쪽으로 위험하다. 대신 테마
   문자열에서 결정론적으로 색을 뽑아 게시물마다 고유한 그라데이션 배너를 만든다. */
.dd-hero { position: relative; border-radius: var(--r-lg); padding: 30px 26px 26px; overflow: hidden; margin-bottom: 26px; border: 1px solid var(--border); }
.dd-hero-wave { position: absolute; inset: 0; opacity: .28; pointer-events: none; }
.dd-hero-inner { position: relative; }
.dd-theme-chip { display: inline-block; font-size: 13px; font-weight: 800; letter-spacing: .02em; padding: 5px 12px; border-radius: 999px; background: rgba(255,255,255,.16); color: #fff; margin-bottom: 14px; backdrop-filter: blur(4px); }
.dd-hero h1 { font-size: 31px; font-weight: 800; line-height: 1.28; letter-spacing: -.02em; color: #fff; word-break: keep-all; }
.dd-hero .dd-deck { margin-top: 12px; font-size: 16.5px; line-height: 1.6; color: rgba(255,255,255,.86); word-break: keep-all; }
.dd-hero .dd-meta { margin-top: 16px; font-size: 13.5px; color: rgba(255,255,255,.72); display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
/* 카드뉴스 공유 버튼 — 히어로 배너 우측 상단에 얹는다(2026-08-20 피드백: "그냥 저 초록색
   우측 위에 나오게 해"). 배너 색이 글마다 달라지므로(heroStyle이 테마 문자열에서 색을 뽑음)
   반투명 검정 오버레이로 명도와 무관하게 항상 읽히게 한다. */
.dd-hero-share { position: absolute; top: 20px; right: 20px; z-index: 2; display: inline-flex; align-items: center; gap: 6px;
  cursor: pointer; font-family: inherit; font-size: 13.5px; font-weight: 700; color: #fff;
  background: rgba(0,0,0,.28); backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,.3);
  border-radius: 999px; padding: 8px 14px; }
.dd-hero-share:hover { background: rgba(0,0,0,.4); }
.dd-hero-share:disabled { opacity: .6; cursor: default; }

/* ── 섹터 칩 ── */
.dd-sectors { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 26px; }
.dd-sec { font-size: 14px; font-weight: 700; padding: 6px 13px; border-radius: 999px; border: 1px solid var(--border-strong); background: var(--bg2); }
.dd-sec.pos { color: var(--red); border-color: color-mix(in srgb, var(--red) 42%, transparent); background: var(--red-dim); }
.dd-sec.neg { color: var(--blue); border-color: color-mix(in srgb, var(--blue) 42%, transparent); background: var(--blue-dim); }
.dd-sec.neu { color: var(--text2); }

/* ── 본문 ── */
.dd-section { margin-bottom: 32px; }
.dd-section h2 { font-size: 21px; font-weight: 800; letter-spacing: -.015em; margin-bottom: 13px; display: flex; align-items: center; gap: 10px; word-break: keep-all; }
.dd-section h2::before { content: ''; width: 4px; height: 19px; border-radius: 2px; background: var(--purple); flex-shrink: 0; }
.dd-section p { font-size: 16.5px; line-height: 1.82; color: var(--text2); margin-bottom: 15px; word-break: keep-all; }
.dd-section p:last-child { margin-bottom: 0; }

/* ── 카드(차트/체인 공통) ── */
.dd-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--r-md); padding: 20px; margin-bottom: 22px; }
.dd-card-title { font-size: 16px; font-weight: 800; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
.dd-card-sub { font-size: 13.5px; color: var(--text3); margin-bottom: 16px; line-height: 1.5; }
/* 넓은 차트는 페이지 전체가 아니라 이 래퍼 안에서만 가로 스크롤된다.
   (이 레포에서 Grid/Flex 아이템 min-width:auto 때문에 모바일 가로넘침이 반복 재발했다) */
.dd-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }

/* ── 파급 체인 ── */
.dd-chain { display: flex; flex-direction: column; gap: 0; }
.dd-chain-row { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 14px; }
.dd-chain-rail { display: flex; flex-direction: column; align-items: center; }
.dd-chain-dot { width: 13px; height: 13px; border-radius: 50%; flex-shrink: 0; margin-top: 5px; }
.dd-chain-line { width: 2px; flex: 1; background: var(--border-strong); min-height: 18px; }
.dd-chain-body { padding-bottom: 20px; min-width: 0; }
.dd-chain-step { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.dd-chain-conf { font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; letter-spacing: .02em; }
.dd-chain-reason { font-size: 14.5px; color: var(--text2); line-height: 1.6; margin-top: 5px; word-break: keep-all; }

/* ── 종목 시세 바 (상승=빨강 / 하락=파랑, 한국 관례) ── */
.dd-tk { display: grid; grid-template-columns: minmax(84px, 128px) minmax(0, 1fr) 74px; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--border); }
.dd-tk:last-child { border-bottom: 0; }
.dd-tk-name { font-size: 14.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dd-tk-tk { font-size: 11.5px; color: var(--text3); font-family: var(--font-mono); }
.dd-tk-track { height: 22px; background: var(--bg3); border-radius: 5px; position: relative; overflow: hidden; min-width: 0; }
.dd-tk-zero { position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--border-strong); }
.dd-tk-fill { position: absolute; top: 4px; bottom: 4px; border-radius: 3px; }
.dd-tk-val { font-size: 14px; font-weight: 700; text-align: right; font-family: var(--font-mono); }

/* ── 뉴스 시점 주가 차트 ── */
.dd-tktabs { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 12px; }
.dd-tktab { font-family: var(--font-mono); font-size: 12.5px; font-weight: 600; padding: 5px 11px; border-radius: 999px;
            border: 1px solid var(--border-strong); background: var(--bg3); color: var(--text2); cursor: pointer; }
.dd-tktab.active { background: var(--purple); border-color: var(--purple); color: #fff; }
.dd-chart-msg { padding: 60px 0; text-align: center; color: var(--text3); font-size: 14px; }
.dd-marks { margin-top: 14px; display: flex; flex-direction: column; gap: 10px; }
.dd-mark { background: var(--bg3); border-left: 3px solid var(--yellow); border-radius: 0 8px 8px 0; padding: 10px 13px; }
.dd-mark-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 14.5px; }
.dd-mark-pin { font-size: 13px; }
.dd-mark-cnt { font-size: 12.5px; color: var(--text3); }
.dd-mark-after { font-size: 13.5px; font-weight: 700; font-family: var(--font-mono); margin-left: auto; }
.dd-mark-t { font-size: 13px; color: var(--text2); line-height: 1.55; margin-top: 5px; word-break: break-word; }

/* ── 본문 사이에 끼우는 근거 기사 카드 ──
   실사진 대신 시각적 리듬을 만드는 장치. 원문 기사 이미지는 저작권·CORS 문제로 못 쓴다. */
.dd-quote { background: linear-gradient(135deg, var(--bg3), var(--bg2)); border: 1px solid var(--border-strong);
            border-radius: var(--r-md); padding: 16px 18px; margin: 0 0 30px; position: relative; overflow: hidden; }
.dd-quote::before { content: '“'; position: absolute; right: 12px; top: -14px; font-size: 76px; line-height: 1;
                    color: var(--purple); opacity: .16; font-family: Georgia, serif; pointer-events: none; }
.dd-quote-label { font-size: 11.5px; font-weight: 800; letter-spacing: .04em; color: var(--purple); margin-bottom: 7px; }
.dd-quote-t { font-size: 15.5px; font-weight: 700; line-height: 1.5; word-break: keep-all; text-decoration: none; color: var(--text); display: block; position: relative; }
.dd-quote-t:hover { color: var(--blue); }
.dd-quote-m { font-size: 12.5px; color: var(--text3); margin-top: 8px; }

/* ── 참고문헌 ── */
.dd-refs { counter-reset: ref; }
.dd-ref { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--border); }
.dd-ref:last-child { border-bottom: 0; }
.dd-ref-num { font-size: 13px; font-weight: 700; color: var(--text3); font-family: var(--font-mono); padding-top: 2px; }
.dd-ref-t { font-size: 15px; font-weight: 600; line-height: 1.5; color: var(--text); text-decoration: none; display: block; word-break: break-word; }
.dd-ref-t:hover { color: var(--blue); }
.dd-ref-m { font-size: 12.5px; color: var(--text3); margin-top: 4px; display: flex; gap: 10px; flex-wrap: wrap; }
.dd-ref-m a { color: var(--text3); text-decoration: none; }
.dd-ref-m a:hover { color: var(--blue); text-decoration: underline; }

/* ── 목록 화면 ── */
.dd-list { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
.dd-item { display: block; text-decoration: none; color: inherit; border: 1px solid var(--border); border-radius: var(--r-md); overflow: hidden; background: var(--bg2); transition: transform .15s, box-shadow .15s; }
.dd-item:hover { transform: translateY(-2px); box-shadow: var(--shadow-card); }
.dd-item-band { height: 76px; position: relative; display: flex; align-items: center; padding: 0 18px; }
.dd-item-band .dd-theme-chip { margin: 0; }
.dd-item-body { padding: 16px 18px 18px; }
.dd-item-title { font-size: 18.5px; font-weight: 800; line-height: 1.4; letter-spacing: -.015em; word-break: keep-all; }
.dd-item-deck { font-size: 14.5px; color: var(--text2); line-height: 1.6; margin-top: 8px; word-break: keep-all; }
.dd-item-meta { font-size: 12.5px; color: var(--text3); margin-top: 12px; display: flex; gap: 12px; flex-wrap: wrap; }

.dd-note { font-size: 13px; color: var(--text3); line-height: 1.65; background: var(--bg2); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 14px 16px; margin-top: 30px; }

/* ── 이미지로 공유(카드뉴스) — analysis.html의 같은 기능을 이 페이지용으로 복제.
   app.js를 안 쓰는 독립 페이지라(위 주석 참고) 로직 수정 시 analysis.html 쪽도 같이 볼 것.
   버튼 자체 스타일(.dd-hero-share)은 위 히어로 섹션 쪽에 정의돼 있다(배너에 얹는 버튼이라). */
.sharemodal { position: fixed; inset: 0; z-index: 2500; display: flex; align-items: center; justify-content: center;
  background: rgba(0,0,0,.72); padding: 20px; }
.sharemodal-inner { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--r-lg);
  padding: 18px; max-width: 460px; width: 100%; max-height: 92vh; overflow-y: auto; box-shadow: 0 20px 50px rgba(0,0,0,.6); }
.sharemodal-inner img { width: 100%; border-radius: var(--r-md); display: block; background: #15171e; }
.sharemodal-actions { display: flex; gap: 8px; margin-top: 14px; }
.sharemodal-actions button {
  flex: 1; min-width: 0; cursor: pointer; font-family: inherit; font-size: 14.5px; font-weight: 650;
  padding: 11px 12px; border-radius: var(--r-sm); border: 1px solid var(--border); background: var(--bg3); color: var(--text);
}
.sharemodal-actions button.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
.sharemodal-hint { font-size: 12.5px; color: var(--text3); margin-top: 10px; text-align: center; }
/* 캡처 원본 — 화면 밖에 두되 display:none은 쓸 수 없다(html2canvas가 크기를 못 잰다). */
#shareCardStage { position: fixed; left: -20000px; top: 0; width: 1080px; z-index: -1; pointer-events: none; }
.dd-back { display: inline-flex; align-items: center; gap: 6px; color: var(--text2); text-decoration: none; font-size: 14.5px; margin-bottom: 18px; padding: 6px 11px; border-radius: var(--r-xs); background: var(--bg2); border: 1px solid var(--border); }
.dd-back:hover { color: var(--text); background: var(--bg3); }
.dd-more { display: block; width: 100%; margin-top: 12px; padding: 9px 0; border-radius: var(--r-xs);
           border: 1px solid var(--border-strong); background: var(--bg3); color: var(--text2);
           font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; }
.dd-more:hover { color: var(--text); background: var(--bg4); }
.dd-empty { text-align: center; padding: 70px 20px; color: var(--text3); }
.dd-empty-icon { font-size: 46px; margin-bottom: 14px; }
.dd-empty-title { font-size: 18px; font-weight: 700; color: var(--text2); margin-bottom: 8px; }
.spinner { width: 30px; height: 30px; border: 3px solid var(--border-strong); border-top-color: var(--blue); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 14px; }
@keyframes spin { to { transform: rotate(360deg); } }

.dd-head-row { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
.dd-h1 { font-size: 27px; font-weight: 800; letter-spacing: -.02em; }
.dd-h1-sub { font-size: 14.5px; color: var(--text3); }

@media (max-width: 640px) {
  .wrap { padding: 16px 14px 70px; }
  .dd-hero { padding: 24px 19px 22px; }
  .dd-hero h1 { font-size: 25px; }
  .dd-hero .dd-deck { font-size: 15.5px; }
  .dd-section h2 { font-size: 19px; }
  .dd-section p { font-size: 16px; line-height: 1.78; }
  .dd-tk { grid-template-columns: minmax(72px, 100px) minmax(0, 1fr) 62px; gap: 8px; }
  .dd-h1 { font-size: 23px; }
}
</style>
</head>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   심층분석 페이지 (2026-08-19)

   이 페이지 전용 로직은 전부 여기 인라인에 있다 — app.js는 5개 페이지 공유라
   여기에 이 페이지 전용 코드를 넣지 말 것.

   ⚠️ 데이터는 /api/admin?action=deep-dives 하나만 쓴다. 서버가 issues의 공개 필드만
      재료로 쓴 글과 실데이터 차트를 이미 조립해 내려주므로, 이 페이지가 Supabase를
      직접 조회하거나 시세 API를 따로 부를 일이 없다.
   ═══════════════════════════════════════════════════════════════════════ */

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// 테마 문자열 → 결정론적 색상. 같은 글은 언제 봐도 같은 색이고, 다른 글은 서로 구분된다.
function themeHue(s) {
  let h = 0;
  for (let i = 0; i < String(s).length; i++) h = (h * 31 + String(s).charCodeAt(i)) % 360;
  return h;
}
function heroStyle(theme) {
  const h = themeHue(theme || 'x');
  return `background:linear-gradient(135deg, hsl(${h} 62% 34%), hsl(${(h + 42) % 360} 58% 22%))`;
}
// 히어로 배경의 물결 무늬 — 사이트 로고의 〜 모티프. 순수 SVG라 외부 이미지가 없다.
function heroWave() {
  return `<svg class="dd-hero-wave" viewBox="0 0 400 120" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 74 Q 50 44 100 74 T 200 74 T 300 74 T 400 74" fill="none" stroke="#fff" stroke-width="2.5" opacity=".55"/>
    <path d="M0 92 Q 50 62 100 92 T 200 92 T 300 92 T 400 92" fill="none" stroke="#fff" stroke-width="2" opacity=".33"/>
    <path d="M0 56 Q 50 26 100 56 T 200 56 T 300 56 T 400 56" fill="none" stroke="#fff" stroke-width="1.5" opacity=".22"/>
  </svg>`;
}

function fmtDate(s) {
  if (!s) return '';
  const d = new Date(s);
  if (isNaN(d)) return '';
  return `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')}`;
}
// 심층분석 발행 시각(published_at)은 날짜만이 아니라 시:분까지 보여준다(2026-08-20 피드백).
// 근거 기사 날짜(fmtDate)는 그대로 일자만 — 참고문헌 목록에서까지 분 단위가 필요친 않다.
function fmtDateTime(s) {
  if (!s) return '';
  const d = new Date(s);
  if (isNaN(d)) return '';
  return `${fmtDate(s)} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}

const TONE_LABEL = { pos: '우호적', neg: '비우호적', neu: '중립' };

/* ── 차트 렌더러 (전부 인라인 SVG / CSS) ───────────────────────────── */

// ① 📉 뉴스 시점 주가 차트 — 이 페이지의 핵심 시각화.
//    "언제 어떤 얘기가 나왔고, 그래서 그 뒤에 어떻게 됐는지"를 한 화면에서 보여준다.
//    ⚠️ 주가 데이터는 DB에 굳히지 않고 열람 시점에 실시간으로 받아온다 — 글은 계속 남는데
//       시세를 스냅샷으로 저장하면 며칠 뒤엔 사실과 다른 숫자를 보여주게 된다.
//    ⚠️ 과거 기록의 서술일 뿐이며, 앞으로의 방향에 대한 판단이 아니다(문구로도 명시).
let _ddSeries = {};   // { ticker: {points, longName, currency} }
let _ddMarks = [];
let _ddTickers = [];

function renderPriceChartShell(d) {
  const tks = Array.isArray(d.tickers) ? d.tickers : [];
  const marks = (d.charts && d.charts.news_marks) || [];
  if (!tks.length || !marks.length) return '';
  // 탭 라벨은 티커가 아니라 종목명으로 보여준다(2026-08-20 피드백) — renderTickers가 이미
  // 같은 재료(charts.ticker_moves, /api/quotes에서 받아온 name)를 쓰고 있으니 그대로 재사용.
  // 이름이 없으면(드묾) 티커로 폴백.
  const tkNames = {};
  ((d.charts && d.charts.ticker_moves) || []).forEach(m => { tkNames[m.ticker] = m.name || m.ticker; });
  return `<div class="dd-card">
    <div class="dd-card-title">📉 뉴스가 나온 시점과 그 이후</div>
    <div class="dd-card-sub">이 글의 근거 기사가 나온 날을 주가 흐름 위에 표시했습니다. 이미 지나간 일의 기록이며, 앞으로의 방향을 뜻하지 않습니다.</div>
    <div class="dd-tktabs" id="ddTkTabs">${tks.map((t, i) =>
      `<button type="button" class="dd-tktab${i === 0 ? ' active' : ''}" data-tk="${esc(t)}">${esc(tkNames[t] || t)}</button>`).join('')}</div>
    <div class="dd-scroll" id="ddChartBox"><div class="dd-chart-msg">시세 불러오는 중…</div></div>
    <div class="dd-marks" id="ddMarkList"></div>
  </div>`;
}

async function loadPriceChart(ticker) {
  const box = document.getElementById('ddChartBox');
  const list = document.getElementById('ddMarkList');
  if (!box) return;
  if (!_ddSeries[ticker]) {
    box.innerHTML = '<div class="dd-chart-msg">시세 불러오는 중…</div>';
    try {
      const r = await fetch(`/api/stock?type=chart&ticker=${encodeURIComponent(ticker)}&range=3mo`);
      const j = await r.json();
      if (!j.points || !j.points.length) throw new Error('no points');
      _ddSeries[ticker] = j;
    } catch {
      box.innerHTML = '<div class="dd-chart-msg">시세를 불러오지 못했습니다.</div>';
      if (list) list.innerHTML = '';
      return;
    }
  }
  const s = _ddSeries[ticker];
  box.innerHTML = drawPriceSvg(s);
  // 뉴스는 항상 최근이라 볼거리가 오른쪽 끝에 있다 — 왼쪽에서 시작하면 정작 마커가 안 보인다.
  box.scrollLeft = box.scrollWidth;
  if (list) list.innerHTML = markListHtml(s, ticker);
}

// 마커 날짜에 정확히 거래일이 없을 수 있다(주말·휴장). 그 날짜 이상인 첫 거래일로 붙인다.
// ⚠️ 뉴스가 마지막 거래일보다 최근이면 오른쪽 끝으로 클램프한다 — 야후 일봉은 국내 종목의
//    당일 종가가 하루 늦게 들어오는 경우가 잦아서(실측: 뉴스는 8/19인데 일봉은 8/18까지),
//    -1을 반환하면 그 마커가 차트에서 조용히 사라진다.
function markIndex(points, date) {
  if (!points.length) return -1;
  for (let i = 0; i < points.length; i++) if (points[i].date >= date) return i;
  return points.length - 1;
}

function drawPriceSvg(s) {
  const pts = s.points;
  const W = Math.max(560, pts.length * 9), H = 210;
  const PL = 8, PR = 8, PT = 18, PB = 26;
  const lo = Math.min(...pts.map(p => p.close)), hi = Math.max(...pts.map(p => p.close));
  const span = (hi - lo) || 1;
  const x = i => PL + (i / Math.max(1, pts.length - 1)) * (W - PL - PR);
  const y = v => PT + (1 - (v - lo) / span) * (H - PT - PB);

  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.close).toFixed(1)}`).join('');
  const area = `${line}L${x(pts.length - 1).toFixed(1)},${H - PB}L${x(0).toFixed(1)},${H - PB}Z`;

  // 뉴스 발생일 세로선 + 상단 핀
  const marks = _ddMarks.map(m => {
    const i = markIndex(pts, m.date);
    if (i < 0) return '';
    const mx = x(i).toFixed(1);
    return `<line x1="${mx}" y1="${PT - 6}" x2="${mx}" y2="${H - PB}" stroke="var(--yellow)" stroke-width="1.5" stroke-dasharray="3 3" opacity=".85"/>`
      + `<circle cx="${mx}" cy="${PT - 6}" r="4.5" fill="var(--yellow)"><title>${esc(m.date)} · 기사 ${m.count}건</title></circle>`;
  }).join('');

  const first = pts[0].close, last = pts[pts.length - 1].close;
  const up = last >= first;
  const col = up ? 'var(--red)' : 'var(--blue)';
  const gid = 'ddg' + Math.abs(hi | 0);

  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:${W}px;height:${H}px" role="img" aria-label="주가 흐름과 뉴스 발생 시점">
    <defs><linearGradient id="${gid}" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="${col}" stop-opacity=".26"/><stop offset="100%" stop-color="${col}" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${area}" fill="url(#${gid})"/>
    <path d="${line}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>
    ${marks}
    <text x="${PL}" y="${H - 8}" font-size="10.5" fill="var(--text3)">${esc(pts[0].date)}</text>
    <text x="${W - PR}" y="${H - 8}" font-size="10.5" fill="var(--text3)" text-anchor="end">${esc(pts[pts.length - 1].date)}</text>
  </svg>`;
}

function fmtNum(n, cur) {
  if (n == null) return '';
  return cur === 'KRW' ? Math.round(n).toLocaleString() + '원' : '$' + n.toFixed(2);
}

// 마커 아래 설명 — "그 날 무슨 기사가 있었고, 그 뒤 주가가 어떻게 됐는지"
function markListHtml(s, ticker) {
  const pts = s.points;
  const last = pts[pts.length - 1];
  return _ddMarks.map(m => {
    const i = markIndex(pts, m.date);
    let after = '';
    if (i >= 0 && i < pts.length - 1) {
      const pct = (last.close - pts[i].close) / pts[i].close * 100;
      const col = pct > 0 ? 'var(--red)' : pct < 0 ? 'var(--blue)' : 'var(--text3)';
      after = `<span class="dd-mark-after" style="color:${col}">이후 ${pct > 0 ? '+' : ''}${pct.toFixed(1)}%</span>`;
    } else if (i >= 0) {
      after = `<span class="dd-mark-after" style="color:var(--text3)">종가 ${fmtNum(pts[i].close, s.currency)}</span>`;
    }
    const d = m.date.slice(5).replace('-', '월 ') + '일';
    return `<div class="dd-mark">
      <div class="dd-mark-head"><span class="dd-mark-pin">📌</span><b>${esc(d)}</b>
        <span class="dd-mark-cnt">이 테마 기사 ${m.count}건</span>${after}</div>
      ${(m.titles || []).slice(0, 2).map(t => `<div class="dd-mark-t">· ${esc(t)}</div>`).join('')}
    </div>`;
  }).join('');
}

// 차트가 DOM에 들어간 뒤 탭을 연결하고 첫 티커를 그린다.
function wirePriceChart() {
  const tabs = document.getElementById('ddTkTabs');
  if (!tabs) return;
  tabs.addEventListener('click', e => {
    const b = e.target.closest('.dd-tktab');
    if (!b) return;
    tabs.querySelectorAll('.dd-tktab').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    loadPriceChart(b.dataset.tk);
  });
  const first = tabs.querySelector('.dd-tktab');
  if (first) loadPriceChart(first.dataset.tk);
}

// ③ 관련 종목 등락 — 서버가 /api/quotes에서 받아온 실시간 값.
// ⚠️ 한국 관례: 상승=빨강, 하락=파랑.
function renderTickers(moves) {
  if (!Array.isArray(moves) || !moves.length) return '';
  const maxAbs = Math.max(...moves.map(m => Math.abs(m.changePercent)), 1);
  const rows = moves.map(m => {
    const p = m.changePercent;
    const col = p > 0 ? 'var(--red)' : p < 0 ? 'var(--blue)' : 'var(--text3)';
    const w = Math.min(50, Math.abs(p) / maxAbs * 50);
    const fill = p >= 0
      ? `left:50%;width:${w.toFixed(1)}%;background:${col}`
      : `right:50%;width:${w.toFixed(1)}%;background:${col}`;
    const href = `/stock/${encodeURIComponent(m.ticker)}`;
    return `<a class="dd-tk" href="${esc(href)}" style="text-decoration:none;color:inherit">
      <div style="min-width:0">
        <div class="dd-tk-name">${esc(m.name || m.ticker)}</div>
        <div class="dd-tk-tk">${esc(m.ticker)}</div>
      </div>
      <div class="dd-tk-track"><div class="dd-tk-zero"></div><div class="dd-tk-fill" style="${fill}"></div></div>
      <div class="dd-tk-val" style="color:${col}">${p > 0 ? '+' : ''}${p.toFixed(2)}%</div>
    </a>`;
  }).join('');
  return `<div class="dd-card">
    <div class="dd-card-title">📊 이 테마와 함께 보는 종목</div>
    <div class="dd-card-sub">이 흐름과 관련된 종목의 <b>오늘 등락률</b>입니다. 매수·매도 의견이 아니며, 추천 종목 목록도 아닙니다.</div>
    ${rows}
  </div>`;
}

// ④ 파급 체인 — 뉴스가 산업 사이를 타고 번지는 경로. 뒤로 갈수록 확신도가 낮아지는 게 정상이라
//    confidence를 색으로 그대로 드러낸다(전부 high로 보이면 오히려 신뢰가 떨어진다).
function renderChain(chain) {
  if (!Array.isArray(chain) || !chain.length) return '';
  const CONF = {
    high:   { c: 'var(--red)',    l: '연결 뚜렷' },
    medium: { c: 'var(--yellow)', l: '연결 보통' },
    low:    { c: 'var(--text3)',  l: '연결 약함' },
  };
  const rows = chain.map((s, i) => {
    const cf = CONF[s.confidence] || CONF.medium;
    const last = i === chain.length - 1;
    return `<div class="dd-chain-row">
      <div class="dd-chain-rail">
        <div class="dd-chain-dot" style="background:${cf.c}"></div>
        ${last ? '' : '<div class="dd-chain-line"></div>'}
      </div>
      <div class="dd-chain-body">
        <div class="dd-chain-step">${esc(s.step)}
          <span class="dd-chain-conf" style="color:${cf.c};background:color-mix(in srgb, ${cf.c} 16%, transparent)">${cf.l}</span>
        </div>
        ${s.reason ? `<div class="dd-chain-reason">${esc(s.reason)}</div>` : ''}
      </div>
    </div>`;
  }).join('');
  return `<div class="dd-card">
    <div class="dd-card-title">🌊 파급 경로</div>
    <div class="dd-card-sub">이 이슈가 산업 사이로 번져 나가는 순서입니다. 뒤로 갈수록 근거가 느슨해지므로 연결 강도를 함께 표시했습니다.</div>
    <div class="dd-chain">${rows}</div>
  </div>`;
}

// 본문 중간에 끼우는 근거 기사 카드.
function quoteCard(s) {
  if (!s) return '';
  return `<div class="dd-quote">
    <div class="dd-quote-label">근거 기사</div>
    <a class="dd-quote-t" href="/analysis/${encodeURIComponent(s.id)}">${esc(s.title)}</a>
    <div class="dd-quote-m">${esc(s.source_name || '출처미상')} · ${fmtDate(s.published_at)}</div>
  </div>`;
}

function expandRefs(btn) {
  btn.closest('.dd-card').querySelectorAll('.dd-ref[data-extra]').forEach(el => el.hidden = false);
  btn.remove();
}

/* ── 상세 화면 ───────────────────────────────────────────────────── */
function renderDetail(d, sources) {
  const secs = Array.isArray(d.sectors) ? d.sectors : [];
  const charts = d.charts || {};
  const nSrc = Array.isArray(d.source_issue_ids) ? d.source_issue_ids.length : 0;

  // 본문 섹션 사이사이에 근거 기사 카드를 끼워 넣어 시각적 리듬을 만든다.
  // (원문 기사 사진은 저작권·CORS 문제로 쓸 수 없어서, 인용 카드가 그 역할을 대신한다.)
  const quotes = (sources || []).slice(0, 3);
  const secList = Array.isArray(d.sections) ? d.sections : [];
  const body = secList.map((s, i) => {
    const sec = `
    <div class="dd-section">
      <h2>${esc(s.heading)}</h2>
      ${(s.paragraphs || []).map(p => `<p>${esc(p)}</p>`).join('')}
    </div>`;
    // 첫 섹션 뒤부터 한 칸 걸러 하나씩 — 마지막 섹션 뒤에는 넣지 않는다.
    const qi = Math.floor(i / 2);
    const useQuote = i > 0 && i % 2 === 1 && i < secList.length - 1 && quotes[qi];
    return sec + (useQuote ? quoteCard(quotes[qi]) : '');
  }).join('');

  const REF_PREVIEW = 5;
  const refRow = (s, i) => `
    <div class="dd-ref"${i >= REF_PREVIEW ? ' data-extra="1" hidden' : ''}>
      <div class="dd-ref-num">${i + 1}</div>
      <div style="min-width:0">
        <a class="dd-ref-t" href="/analysis/${encodeURIComponent(s.id)}">${esc(s.title)}</a>
        <div class="dd-ref-m">
          <span>${esc(s.source_name || '출처미상')}</span>
          <span>${fmtDate(s.published_at)}</span>
          ${s.source_url ? `<a href="${esc(s.source_url)}" target="_blank" rel="noopener noreferrer">원문 ↗</a>` : ''}
        </div>
      </div>
    </div>`;
  const refs = (sources || []).map(refRow).join('');
  const hidden = Math.max(0, (sources || []).length - REF_PREVIEW);

  return `
    <a class="dd-back" href="/deep.html">← 심층분석 목록</a>

    <div class="dd-hero" style="${heroStyle(d.theme)}">
      ${heroWave()}
      <button class="dd-hero-share" onclick="openShareImage()">🖼 카드뉴스로 공유</button>
      <div class="dd-hero-inner">
        ${d.theme ? `<span class="dd-theme-chip">${esc(d.theme)}</span>` : ''}
        <h1>${esc(d.title)}</h1>
        ${d.deck ? `<p class="dd-deck">${esc(d.deck)}</p>` : ''}
        <div class="dd-meta">
          <span>${fmtDateTime(d.published_at)}</span>
          ${nSrc ? `<span>· 기사 ${nSrc}건을 종합</span>` : ''}
        </div>
      </div>
    </div>

    ${secs.length ? `<div class="dd-sectors">${secs.map(s =>
      `<span class="dd-sec ${esc(s.tone || 'neu')}">${esc(s.name)} · ${TONE_LABEL[s.tone] || '중립'}</span>`).join('')}</div>` : ''}

    ${body}
    ${renderChain(d.ripple_chain)}
    ${renderPriceChartShell(d)}
    ${renderTickers(charts.ticker_moves)}

    ${refs ? `<div class="dd-card">
      <div class="dd-card-title">📚 참고한 기사 (${(sources || []).length}건)</div>
      <div class="dd-card-sub">이 글은 아래 기사들을 종합해 작성했습니다.</div>
      <div class="dd-refs">${refs}</div>
      ${hidden ? `<button type="button" class="dd-more" onclick="expandRefs(this)">나머지 ${hidden}건 더 보기 ▾</button>` : ''}
    </div>` : ''}

    <div class="dd-note">
      이 글은 공개된 뉴스 기사를 종합해 산업의 흐름을 설명하는 정보 제공 콘텐츠입니다.
      특정 종목의 매수·매도를 권유하지 않으며, 투자 판단과 그 결과에 대한 책임은 이용자 본인에게 있습니다.
      표시된 시세는 조회 시점의 값으로 실제와 다를 수 있습니다.
    </div>`;
}

/* ── 목록 화면 ───────────────────────────────────────────────────── */
function renderList(rows) {
  if (!rows.length) {
    return `<div class="dd-head-row"><span class="dd-h1">🔎 심층분석</span></div>
      <div class="dd-empty">
        <div class="dd-empty-icon">📝</div>
        <p class="dd-empty-title">아직 발행된 심층분석이 없습니다</p>
        <p>여러 기사가 같은 흐름을 가리킬 때 하나의 글로 묶어 발행합니다. 하루 2편까지 올라옵니다.</p>
      </div>`;
  }
  const items = rows.map(r => {
    const nSrc = Array.isArray(r.source_issue_ids) ? r.source_issue_ids.length : 0;
    const secs = (Array.isArray(r.sectors) ? r.sectors : []).slice(0, 3);
    return `<a class="dd-item" href="/deep/${encodeURIComponent(r.slug)}">
      <div class="dd-item-band" style="${heroStyle(r.theme)}">
        ${heroWave()}
        ${r.theme ? `<span class="dd-theme-chip" style="position:relative">${esc(r.theme)}</span>` : ''}
      </div>
      <div class="dd-item-body">
        <div class="dd-item-title">${esc(r.title)}</div>
        ${r.deck ? `<div class="dd-item-deck">${esc(r.deck)}</div>` : ''}
        <div class="dd-item-meta">
          <span>${fmtDateTime(r.published_at)}</span>
          ${nSrc ? `<span>기사 ${nSrc}건 종합</span>` : ''}
          ${secs.length ? `<span>${secs.map(s => esc(s.name)).join(' · ')}</span>` : ''}
        </div>
      </div>
    </a>`;
  }).join('');
  return `<div class="dd-head-row">
      <span class="dd-h1">🔎 심층분석</span>
      <span class="dd-h1-sub">여러 기사를 하나의 흐름으로 묶어 정리합니다</span>
    </div>
    <div class="dd-list" style="margin-top:20px">${items}</div>
    <div class="dd-note">
      개별 기사 원문이 필요하면 <a href="/news.html" style="color:var(--blue)">뉴스 페이지</a>에서 볼 수 있습니다.
    </div>`;
}

/* ── 부트스트랩 ──────────────────────────────────────────────────── */
// slug는 두 경로로 들어온다: /deep/:slug (rewrite → render-deep가 이 파일을 서빙) 또는
// /deep.html?slug=... (프리렌더 실패 시 폴백 리다이렉트 경로).
function currentSlug() {
  const m = location.pathname.match(/^\/deep\/([^/?#]+)/);
  if (m) return decodeURIComponent(m[1]);
  return new URLSearchParams(location.search).get('slug') || '';
}

async function boot() {
  const wrap = document.getElementById('wrap');
  const slug = currentSlug();
  try {
    const url = slug
      ? `/api/admin?action=deep-dives&slug=${encodeURIComponent(slug)}`
      : '/api/admin?action=deep-dives&limit=20';
    const r = await fetch(url);
    const j = await r.json();

    if (slug) {
      if (!j.ok || !j.data) {
        wrap.innerHTML = `<a class="dd-back" href="/deep.html">← 심층분석 목록</a>
          <div class="dd-empty"><div class="dd-empty-icon">🔍</div>
          <p class="dd-empty-title">글을 찾을 수 없습니다</p>
          <p>주소가 바뀌었거나 아직 발행 전일 수 있습니다.</p></div>`;
        return;
      }
      // 차트 렌더러가 참조하는 모듈 상태를 먼저 채운 뒤 그린다.
      _ddMarks = (j.data.charts && j.data.charts.news_marks) || [];
      _ddTickers = j.data.tickers || [];
      _ddSeries = {};
      window._shareDive = j.data;
      wrap.innerHTML = renderDetail(j.data, j.sources || []);
      document.title = `${j.data.title} — StockRipple`;
      wirePriceChart();   // 시세는 innerHTML이 들어간 뒤 비동기로 채운다
    } else {
      wrap.innerHTML = renderList(j.data || []);
    }
  } catch (e) {
    wrap.innerHTML = `<div class="dd-empty"><div class="dd-empty-icon">⚠️</div>
      <p class="dd-empty-title">불러오지 못했습니다</p>
      <p>잠시 후 다시 시도해 주세요.</p></div>`;
  }
}

boot();
initAuth();

/* ═══════════════════════════════════════════════════════════════════════
   🖼 카드뉴스로 공유 (2026-08-20)
   analysis.html의 "이미지로 공유"와 같은 기술적 뼈대(html2canvas, 화면 밖 스테이지,
   항상 다크로 굽기)를 재사용하되, 이 페이지 데이터(sections/ripple_chain/sectors)에
   맞춰 인스타그램 카드뉴스 스타일(번호 매긴 섹션 박스 + 하단 요약 스트립)로 새로 짰다.
   🚫 재료는 deep_dives의 공개 필드뿐(title/deck/theme/sections/sectors/published_at/
   source_issue_ids) — analyses/analysis_companies류는애초에 이 테이블에 안 들어간다
   (db/deep-dives.sql 참고, 유사투자자문업 리스크 방지가 이미 저장 시점에 걸려 있음).
   ═══════════════════════════════════════════════════════════════════════ */
let _shareBlob = null;

function _norm(s) {
  return String(s || '').replace(/\s+/g, ' ').trim();
}
// 첫 문장만 뽑는다 — 말줄임표(…)로 문장 중간을 자르는 대신, 문장 종결부호(다./요./.!?)가
// 나오는 지점까지만 쓴다. 그 안에서 못 찾으면(드묾) 원문을 그대로 다 보여준다 — 박스가
// 조금 더 길어질 뿐, 잘린 문장보다는 낫다(2026-08-20 피드백: "말줄임표 빼고 핵심만").
function _firstSentence(s) {
  const t = _norm(s);
  const m = t.match(/^(.{6,200}?[.!?])(?=\s|$)/);
  return m ? m[1] : t;
}

// 섹션마다 다른 아이콘·색을 입혀서(2026-08-20 피드백 이전엔 색만 다른 똑같은 네모 번호칸이라
// "그냥 2x2로 위치만 바꾼 것"처럼 보였다) 인스타 카드뉴스 특유의 알록달록한 느낌을 낸다.
// 실사진이 아니라 이모지 아이콘이라 저작권 문제 없음.
const DD_CARD_STYLE = [
  { icon: '📊', c: '#4d8dff', bg: 'rgba(77,141,255,.14)' },
  { icon: '🌊', c: '#3ddb7f', bg: 'rgba(61,219,127,.14)' },
  { icon: '⚡', c: '#f0b45e', bg: 'rgba(240,180,94,.14)' },
  { icon: '💡', c: '#9d7bff', bg: 'rgba(157,123,255,.14)' },
];
const DD_TONE = { pos: { c: '#ff6b6b', icon: '📈' }, neg: { c: '#4d8dff', icon: '📉' }, neu: { c: '#a6adbb', icon: '➖' } };

// 카드는 라이트/다크와 무관하게 항상 다크로 굽는다(analysis.html과 동일 원칙) — var() 대신
// 값을 박아 커뮤니티에 퍼진 이미지가 보는 사람 설정에 따라 달라지지 않게 한다.
function _buildDeepShareCardHtml(d) {
  const allSecs = Array.isArray(d.sections) ? d.sections : [];
  const secs = allSecs.slice(0, 4);
  const extra = Math.max(0, allSecs.length - secs.length);

  const cards = secs.map((s, i) => {
    const st = DD_CARD_STYLE[i % DD_CARD_STYLE.length];
    const sentence = _firstSentence((s.paragraphs && s.paragraphs[0]) || '');
    return `<div style="background:${st.bg};border:1px solid ${st.c}55;border-radius:22px;padding:24px 22px;min-width:0">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px">
        <div style="font-size:34px;line-height:1">${st.icon}</div>
        <div style="width:27px;height:27px;border-radius:8px;background:${st.c};color:#12141a;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0">${i + 1}</div>
      </div>
      <div style="font-size:22px;font-weight:800;line-height:1.32;color:#f2f4f8;margin-bottom:9px">${esc(_norm(s.heading))}</div>
      ${sentence ? `<div style="font-size:17.5px;line-height:1.52;color:#c3c9d6">${esc(sentence)}</div>` : ''}
    </div>`;
  }).join('');

  const sectors = (Array.isArray(d.sectors) ? d.sectors : []).slice(0, 5);
  const chips = sectors.map(s => {
    const t = DD_TONE[s.tone] || DD_TONE.neu;
    return `<div style="display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:999px;padding:9px 16px">
      <span style="font-size:16px">${t.icon}</span><span style="font-size:16px;font-weight:700;color:${t.c}">${esc(_norm(s.name))}</span>
    </div>`;
  }).join('');

  const nSrc = Array.isArray(d.source_issue_ids) ? d.source_issue_ids.length : 0;
  const dateStr = d.published_at
    ? new Date(d.published_at).toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric' })
    : '';

  return `<div style="width:1080px;box-sizing:border-box;background:#15171e;padding:56px 52px;font-family:'Inter','Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#f2f4f8">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:26px">
      <div style="display:inline-flex;align-items:center;gap:9px;background:linear-gradient(135deg,#4d8dff,#9d7bff);border-radius:999px;padding:8px 18px 8px 10px">
        <div style="width:23px;height:23px;border-radius:7px;background:rgba(255,255,255,.28);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff">~</div>
        <div style="font-size:19px;font-weight:800;color:#fff;letter-spacing:-.01em">StockRipple 심층분석</div>
      </div>
      <div style="font-size:21px;color:#6c7385">${esc(dateStr)}</div>
    </div>

    ${d.theme ? `<div style="display:inline-block;font-size:21px;font-weight:800;padding:7px 17px;border-radius:999px;background:rgba(77,141,255,.16);color:#4d8dff;margin-bottom:16px">${esc(_norm(d.theme))}</div>` : ''}

    <div style="font-size:44px;font-weight:800;line-height:1.32;letter-spacing:-.02em;margin-bottom:${d.deck ? '16px' : '30px'}">${esc(_norm(d.title))}</div>
    ${d.deck ? `<div style="font-size:24px;line-height:1.58;color:#a6adbb;margin-bottom:30px">${esc(_norm(d.deck))}</div>` : ''}

    ${cards ? `<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:${extra ? '10px' : '32px'}">${cards}</div>` : ''}
    ${extra ? `<div style="font-size:18px;color:#6c7385;text-align:right;margin-bottom:32px">+ ${extra}개 섹션 더 보기</div>` : ''}

    ${chips ? `<div style="display:flex;flex-wrap:wrap;gap:9px;margin-bottom:6px">${chips}</div>` : ''}

    <div style="margin-top:32px;padding-top:24px;border-top:1px solid rgba(255,255,255,.09);display:flex;align-items:center;justify-content:space-between">
      <div style="font-size:22px;color:#6c7385">${nSrc ? `기사 ${nSrc}건을 종합했어요` : '여러 뉴스를 하나의 흐름으로 정리합니다'}</div>
      <div style="font-size:22px;font-weight:700;color:#4d8dff">stockripple.vercel.app</div>
    </div>
  </div>`;
}

// html2canvas(≈200KB)를 공유 버튼을 누른 순간에만 받아온다 — analysis.html의 loadHtml2Canvas와
// 동일(이 페이지도 app.js를 안 쓰는 독립 페이지라 복제), 로직 수정 시 그쪽도 같이 볼 것.
let _h2cPromise = null;
function loadHtml2Canvas() {
  if (typeof html2canvas === 'function') return Promise.resolve(true);
  if (_h2cPromise) return _h2cPromise;
  _h2cPromise = new Promise(resolve => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
    s.onload = () => resolve(typeof html2canvas === 'function');
    s.onerror = () => { _h2cPromise = null; resolve(false); };
    document.head.appendChild(s);
  });
  return _h2cPromise;
}

async function openShareImage() {
  const dive = window._shareDive;
  if (!dive) return;
  const btn = document.querySelector('.dd-hero-share');
  const prevLabel = btn?.textContent;
  if (btn) { btn.disabled = true; btn.textContent = '이미지 만드는 중…'; }
  if (!(await loadHtml2Canvas())) {
    if (btn) { btn.disabled = false; btn.textContent = prevLabel || '🖼 카드뉴스로 공유'; }
    return;
  }

  const stage = document.createElement('div');
  stage.id = 'shareCardStage';
  stage.innerHTML = _buildDeepShareCardHtml(dive);
  document.body.appendChild(stage);
  try {
    const canvas = await html2canvas(stage.firstElementChild, { backgroundColor: '#15171e', scale: 1, logging: false });
    _shareBlob = await new Promise(r => canvas.toBlob(r, 'image/png'));
    _showShareModal(canvas.toDataURL('image/png'));
  } catch {
    if (btn) btn.textContent = '이미지 생성에 실패했어요';
  } finally {
    stage.remove();
    if (btn && btn.textContent === '이미지 만드는 중…') { btn.disabled = false; btn.textContent = '🖼 카드뉴스로 공유'; }
  }
}

function _showShareModal(dataUrl) {
  closeShareImage();
  const canCopy = !!(navigator.clipboard && window.ClipboardItem);
  const el = document.createElement('div');
  el.className = 'sharemodal';
  el.id = 'shareModal';
  el.onclick = e => { if (e.target === el) closeShareImage(); };
  el.innerHTML = `<div class="sharemodal-inner">
    <img src="${dataUrl}" alt="공유 이미지 미리보기">
    <div class="sharemodal-actions">
      <button class="primary" onclick="saveShareImage()">이미지 저장</button>
      ${canCopy ? '<button onclick="copyShareImage()">이미지 복사</button>' : ''}
      <button onclick="closeShareImage()">닫기</button>
    </div>
    <div class="sharemodal-hint" id="shareHint">오픈채팅·커뮤니티에 그대로 올릴 수 있어요</div>
  </div>`;
  document.body.appendChild(el);
}

function closeShareImage() {
  document.getElementById('shareModal')?.remove();
  const btn = document.querySelector('.dd-hero-share');
  if (btn) { btn.disabled = false; btn.textContent = '🖼 카드뉴스로 공유'; }
}

function saveShareImage() {
  if (!_shareBlob) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(_shareBlob);
  a.download = `stockripple-deep-${(window._shareDive?.slug || 'post').toString().slice(0, 40)}.png`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

async function copyShareImage() {
  const hint = document.getElementById('shareHint');
  try {
    await navigator.clipboard.write([new ClipboardItem({ 'image/png': _shareBlob })]);
    if (hint) hint.textContent = '복사했어요! 붙여넣기로 공유하세요';
  } catch {
    if (hint) hint.textContent = '이 브라우저는 이미지 복사를 지원하지 않아요 — 저장을 이용해 주세요';
  }
}
</script>
