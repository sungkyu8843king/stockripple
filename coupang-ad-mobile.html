<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>ad</title>
</head>
<body style="margin:0;overflow:hidden">
<script>
// 광고가 window.open(새 탭)으로 이동을 시도하면 iOS Safari에서 "다른 앱을 열려고
// 합니다" 확인창이 뜬다. 같은 창에서 바로 이동(top.location.href)시키면 확인창 없이
// 넘어가므로, 새 탭 시도를 가로채 강제로 같은 창 이동으로 바꾼다.
// ⚠️ 2026-08 실측: g.js가 실제 이동 전에 트래킹용으로 window.open('about:blank', ...)
// 같은 목적지 없는 호출을 먼저 날리는 경우가 있는데, 예전 코드는 이것도 "url이 있다"고
// 판단해 최상위 탭 전체를 about:blank로 이동시켜버렸다(원래 페이지 전체가 사라지고
// 빈 탭만 남는 사고 + 그 페이지의 JS 상태도 같이 날아감). about: 스킴은 진짜 목적지가
// 아니므로 무시하고, 실제 목적지 URL이 있는 호출만 같은 창에서 이동시킨다.
(function(){
	window.open = function(url){
		if (url && !/^about:/i.test(url)) { top.location.href = url; }
		return null;
	};
})();
</script>
<script>
// 배너 클릭 집계 — g.js 위젯이 채워넣는 내용(어떤 태그든) 클릭을 document 레벨에서
// 위임 감지해 어드민 "배너 클릭" 패널용으로 sendBeacon 기록. 이동을 막거나 늦추지 않음.
// 이 슬롯(AI 종합분석 영역)은 부모 창(company.html)이 "배너를 직접 눌러야 열리는"
// 게이트를 걸어두므로, 같은 출처 동기 함수 호출로 클릭 사실을 즉시 알려준다(postMessage는
// 부모가 처리하는 시점이 비동기라 그 사이 광고 이동이 시작되면 신호가 유실될 수 있음).
document.addEventListener('click', function () {
	try {
		var payload = new Blob([JSON.stringify({slot:'coupang-panel-mobile'})], {type:'application/json'});
		navigator.sendBeacon('/api/admin?action=banner-click', payload);
	} catch (e) {}
	try {
		if (window.parent && window.parent !== window && typeof window.parent.aiGateOnAdClicked === 'function') {
			window.parent.aiGateOnAdClicked();
		}
	} catch (e) {}
});
</script>
<script src="https://ads-partners.coupang.com/g.js"></script>
<script>
	new PartnersCoupang.G({"id":1005657,"template":"banner","trackingCode":"AF2174378","width":"320","height":"100"});
</script>
</body>
</html>
