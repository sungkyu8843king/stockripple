<!DOCTYPE html>
<html lang="ko">
<head>
<script>(function(){try{if(localStorage.getItem('sr_theme')==='light')document.documentElement.setAttribute('data-theme','light');}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="/announcement-bar.js" defer></script>
<script src="/sr-pulse.js" defer></script>

<title>내 계정 — StockRipple</title>
<!-- Open Graph / 링크 공유 미리보기 (정적 — 동적 티커 페이지는 일반 설명) -->
<meta property="og:type" content="website">

<meta property="og:description" content="뉴스 이슈의 파급효과를 분석해 관련 산업과 기업에 미치는 영향을 정리합니다.">
<meta property="og:url" content="https://stockripple.vercel.app/account.html">
<meta property="og:locale" content="ko_KR">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="내 계정 — StockRipple">
<meta name="twitter:description" content="뉴스 이슈의 파급효과를 분석해 관련 산업과 기업에 미치는 영향을 정리합니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #15171e; --bg-rgb: 21,23,30; --bg2: #1e2129; --bg3: #262a34; --bg4: #2f333f;
  --border: rgba(255,255,255,0.075); --border-strong: rgba(255,255,255,0.16); --border-soft: rgba(255,255,255,0.05);
  --text: #f2f4f8; --text2: #a6adbb; --text3: #6c7385;
  --blue: #4d8dff; --blue-dim: rgba(77,141,255,0.14);
  --green: #3ddb7f; --green-dim: rgba(61,219,127,0.14);
  --red:   #ff6b6b; --red-dim:   rgba(255,107,107,0.14);
  --yellow:#f0b45e; --purple:#9d7bff;
  --shadow-card: 0 10px 30px -14px rgba(0,0,0,0.55);
}

/* ── 라이트 모드 오버라이드 (2026-07-27) ── */
:root[data-theme="light"] {
  --bg: #f5f6f8; --bg-rgb: 245,246,248; --bg2: #ffffff; --bg3: #eef0f3; --bg4: #e3e6eb;
  --border: rgba(15,17,23,0.09); --border-strong: rgba(15,17,23,0.18); --border-soft: rgba(15,17,23,0.05);
  --text: #14161c; --text2: #4b5163; --text3: #6b7280;
  --blue: #1d4ed8; --green: #15803d; --red: #dc2626; --yellow: #a16207; --purple: #7c3aed;
  --shadow-card: 0 10px 30px -14px rgba(15,17,23,0.16);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

/* Header */
.header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(var(--bg-rgb),0.80); backdrop-filter: blur(12px) saturate(180%);
  border-bottom: 1px solid var(--border); padding: 0 24px;
}
.header-inner {
  max-width: 1100px; margin: 0 auto;
  display: flex; align-items: center; gap: 16px; height: 56px;
}
.back-btn {
  display: flex; align-items: center; gap: 6px; color: var(--text2);
  text-decoration: none; font-size: 15.5px; background: none; border: none; cursor: pointer;
  padding: 5px 10px; border-radius: 6px; transition: all 0.15s;
}
.back-btn:hover { background: var(--bg3); color: var(--text); }
.logo-sm { font-size: 16px; font-weight: 700; color: var(--text2); }
.logo-sm span { color: var(--blue); }

.page-wrap { max-width: 1100px; margin: 0 auto; padding: 32px 24px 60px; }

/* Profile Section */
.profile-section {
  display: flex; align-items: center; gap: 20px;
  margin-bottom: 32px; padding-bottom: 32px;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}
.avatar {
  width: 72px; height: 72px; border-radius: 50%;
  background: linear-gradient(135deg, var(--blue) 0%, var(--purple) 100%);
  display: flex; align-items: center; justify-content: center;
  font-size: 28px; font-weight: 700; color: #f2f4f8; flex-shrink: 0;
  text-transform: uppercase;
}
.profile-info { flex: 1; }
.profile-email { font-size: 20px; font-weight: 600; margin-bottom: 6px; }
.profile-meta { font-size: 15.5px; color: var(--text3); }
.profile-meta span { color: var(--text2); }

/* Tabs */
.tabs {
  display: flex; gap: 2px; border-bottom: 1px solid var(--border);
  margin-bottom: 28px;
}
.tab-btn {
  padding: 10px 18px; font-size: 16px; font-weight: 500;
  background: none; border: none; color: var(--text2); cursor: pointer;
  border-bottom: 2px solid transparent; margin-bottom: -1px;
  transition: all 0.15s;
}
.tab-btn:hover { color: var(--text); }
.tab-btn.active { color: var(--text); border-bottom-color: var(--blue); }

/* Tab Content */
.tab-content { display: none; }
.tab-content.active { display: block; }

/* Section Title */
.section-title {
  font-size: 17px; font-weight: 700; margin-bottom: 16px;
  display: flex; align-items: center; gap: 8px; color: var(--text);
}
.section-title svg { color: var(--text3); }
.section-count {
  font-size: 15.5px; color: var(--text2); font-weight: 400; margin-left: 4px;
}

/* Watchlist */
.watchlist-list {
  display: flex; flex-direction: column; gap: 8px;
}
.watchlist-item {
  display: flex; align-items: center; gap: 12px;
  background: var(--bg2); border: 1px solid var(--border); border-radius: 10px;
  padding: 14px 16px; transition: border-color 0.15s;
}
.watchlist-item:hover { border-color: #3d444d; }
.ticker-badge {
  font-size: 14.5px; font-weight: 700; font-family: 'SF Mono', 'Fira Code', monospace;
  padding: 4px 10px; border-radius: 6px; white-space: nowrap; flex-shrink: 0;
}
.ticker-badge.kr { background: rgba(0,102,204,0.10); color: #4d8dff; }
.ticker-badge.us { background: rgba(124,58,237,0.10); color: #9d7bff; }
.watchlist-name { flex: 1; font-size: 16px; font-weight: 500; }
.watchlist-name a { color: var(--text); text-decoration: none; }
.watchlist-name a:hover { color: var(--blue); }
.watchlist-added { font-size: 13.5px; color: var(--text3); white-space: nowrap; }
.delete-btn {
  background: none; border: none; cursor: pointer; color: var(--text3);
  padding: 5px 7px; border-radius: 5px; font-size: 17px; line-height: 1;
  transition: all 0.15s;
}
.delete-btn:hover { background: var(--red-dim); color: var(--red); }

/* Bookmarks */
.bookmarks-list {
  display: flex; flex-direction: column; gap: 8px;
}
.bookmark-item {
  display: flex; align-items: flex-start; gap: 12px;
  background: var(--bg2); border: 1px solid var(--border); border-radius: 10px;
  padding: 14px 16px; transition: border-color 0.15s;
}
.bookmark-item:hover { border-color: #3d444d; }
.bookmark-info { flex: 1; min-width: 0; }
.bookmark-title {
  font-size: 16px; font-weight: 500; margin-bottom: 6px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.bookmark-title a { color: var(--text); text-decoration: none; }
.bookmark-title a:hover { color: var(--blue); }
.bookmark-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.bookmark-date { font-size: 13.5px; color: var(--text3); }
.sector-tag { font-size: 13.5px; padding: 3px 8px; border-radius: 4px; font-weight: 500; }
.tag-semi  { background: rgba(0,102,204,0.10); color: #4d8dff; }
.tag-ev    { background: rgba(0,135,58,0.10);  color: #00873a; }
.tag-ai    { background: rgba(124,58,237,0.10);color: #9d7bff; }
.tag-bio   { background: rgba(227,25,55,0.10); color: #e31937; }
.tag-fin   { background: rgba(184,134,11,0.12);color: #b8860b; }
.tag-cloud { background: rgba(0,102,204,0.10); color: #4d8dff; }
.tag-robot { background: #2a2040; color: #b06bff; }
.tag-energy { background: #2a3a1a; color: #8bc34a; }
.tag-default { background: var(--bg3); color: var(--text2); }

/* Settings */
.settings-card {
  background: var(--bg2); border: 1px solid var(--border); border-radius: 12px;
  padding: 24px; margin-bottom: 16px;
}
.settings-card-title {
  font-size: 16px; font-weight: 600; margin-bottom: 16px;
  display: flex; align-items: center; gap: 8px;
}
.settings-card-title svg { color: var(--text3); }
.form-group { margin-bottom: 16px; }
.form-label {
  display: block; font-size: 14.5px; font-weight: 600; color: var(--text2);
  text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 8px;
}
.form-input {
  width: 100%; background: var(--bg3); border: 1px solid var(--border);
  border-radius: 8px; padding: 10px 14px; font-size: 16px;
  color: var(--text); font-family: 'Inter', sans-serif; outline: none;
  transition: border-color 0.15s;
}
.form-input:focus { border-color: var(--blue); }
.form-input::placeholder { color: var(--text3); }
.form-hint { font-size: 14.5px; color: var(--text3); margin-top: 6px; line-height: 1.5; }
.form-hint a { color: var(--blue); text-decoration: none; }
.form-hint a:hover { text-decoration: underline; }

.toggle-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 0; border-top: 1px solid var(--border);
}
.toggle-label { font-size: 16px; color: var(--text); }
.toggle-desc { font-size: 14.5px; color: var(--text3); margin-top: 2px; }
.toggle-switch { position: relative; width: 40px; height: 22px; flex-shrink: 0; }
.toggle-switch input { opacity: 0; width: 0; height: 0; }
.toggle-slider {
  position: absolute; inset: 0; cursor: pointer;
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 22px; transition: all 0.2s;
}
.toggle-slider:before {
  content: ''; position: absolute;
  width: 16px; height: 16px; border-radius: 50%;
  left: 2px; top: 2px; background: var(--text3);
  transition: all 0.2s;
}
.toggle-switch input:checked + .toggle-slider { background: var(--blue-dim); border-color: var(--blue); }
.toggle-switch input:checked + .toggle-slider:before { transform: translateX(18px); background: var(--blue); }

.save-btn {
  display: inline-flex; align-items: center; gap: 7px;
  background: var(--blue); color: #f2f4f8; border: none; border-radius: 8px;
  padding: 10px 20px; font-size: 16px; font-weight: 600;
  cursor: pointer; transition: background 0.15s;
}
.save-btn:hover { background: #388be8; }
.save-btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* Signout */
.signout-area { margin-top: 40px; padding-top: 24px; border-top: 1px solid var(--border); display: flex; gap: 8px; }
.signout-btn {
  background: none; border: 1px solid var(--border); border-radius: 8px;
  color: var(--text2); padding: 9px 18px; font-size: 15.5px; font-weight: 500;
  cursor: pointer; transition: all 0.15s; font-family: 'Inter', sans-serif;
}
.signout-btn:hover { border-color: var(--red); color: var(--red); background: var(--red-dim); }
.delete-account-btn {
  background: none; border: 1px solid var(--border); border-radius: 8px;
  color: var(--text3); padding: 9px 18px; font-size: 15.5px; font-weight: 500;
  cursor: pointer; transition: all 0.15s; font-family: 'Inter', sans-serif;
}
.delete-account-btn:hover { border-color: var(--red); color: #f2f4f8; background: var(--red); }

/* Empty state */
.empty-state {
  text-align: center; padding: 48px 24px;
  color: var(--text3); font-size: 16px; line-height: 1.7;
}
.empty-state-icon { font-size: 36px; margin-bottom: 12px; opacity: 0.5; }

/* Loading */
.loading-state { text-align: center; padding: 80px 24px; }
.spinner {
  width: 36px; height: 36px; border: 2px solid var(--border);
  border-top-color: var(--blue); border-radius: 50%;
  animation: spin 0.8s linear infinite; margin: 0 auto 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Toast */
.toast-container {
  position: fixed; bottom: 24px; right: 24px; z-index: 9999;
  display: flex; flex-direction: column; gap: 8px; pointer-events: none;
}
.toast {
  padding: 12px 18px; border-radius: 8px; font-size: 15.5px; font-weight: 500;
  animation: toastIn 0.25s ease; pointer-events: all; max-width: 320px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.4);
}
.toast.success { background: var(--green-dim); border: 1px solid var(--green); color: var(--green); }
.toast.error { background: var(--red-dim); border: 1px solid var(--red); color: var(--red); }
@keyframes toastIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

@media (max-width: 600px) {
  .profile-email { font-size: 17px; }
  .avatar { width: 56px; height: 56px; font-size: 22px; }
  .tab-btn { padding: 10px 12px; font-size: 15.5px; }
  .settings-card { padding: 16px; }
}
</style>
</head>
<body>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/site-header.js"></script>
<div id="site-header-mount"></div>
<script>renderSiteHeader('/account.html');</script>

<div class="page-wrap" id="pageWrap">
  <div class="loading-state">
    <div class="spinner"></div>
    <p style="color:var(--text2)">계정 정보 불러오는 중...</p>
  </div>
</div>

<div id="toastContainer" class="toast-container"></div>

<script>
// SUPABASE_URL/ANON_KEY/sb는 site-header.js가 공용 제공(2026-07-22) — 여기서 재선언 안 함.

const sectorColors = {
  '반도체': 'tag-semi', 'AI': 'tag-ai', '전기차': 'tag-ev', '배터리': 'tag-ev',
  '바이오': 'tag-bio', '제약': 'tag-bio', '핀테크': 'tag-fin', '금융': 'tag-fin',
  '클라우드': 'tag-cloud', 'IT': 'tag-cloud', '로봇': 'tag-robot',
  '에너지': 'tag-energy', '친환경': 'tag-energy',
};

// currentUser는 site-header.js가 선언 — 여기선 재선언하지 않고 그대로 씀(할당은 아래에서).
let activeTab = 'watchlist';

function escHtml(s) {
  return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtDate(d) {
  if (!d) return '—';
  return new Date(d).toLocaleDateString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit' });
}

function showToast(msg, type = 'success') {
  const container = document.getElementById('toastContainer');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  container.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

/* ── Init ── */
async function init() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) {
    location.href = '/';
    return;
  }
  currentUser = session.user;
  renderShell();
  switchTab('watchlist');
}

function renderShell() {
  const email = currentUser.email || '';
  const initial = email.charAt(0).toUpperCase();
  const joinedAt = fmtDate(currentUser.created_at);

  document.getElementById('pageWrap').innerHTML = `
    <div class="profile-section">
      <div class="avatar">${escHtml(initial)}</div>
      <div class="profile-info">
        <div class="profile-email">${escHtml(email)}</div>
        <div class="profile-meta">가입일: <span>${joinedAt}</span></div>
      </div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('watchlist')" id="tab-watchlist">
        <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="display:inline;vertical-align:-2px;margin-right:5px"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        관심종목
      </button>
      <button class="tab-btn" onclick="switchTab('bookmarks')" id="tab-bookmarks">
        <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="display:inline;vertical-align:-2px;margin-right:5px"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
        북마크
      </button>
      <button class="tab-btn" onclick="switchTab('settings')" id="tab-settings">
        <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="display:inline;vertical-align:-2px;margin-right:5px"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93A10 10 0 0 0 4.93 19.07M19.07 4.93L4.93 19.07"/></svg>
        알림 설정
      </button>
    </div>

    <div id="tab-content-watchlist" class="tab-content active"></div>
    <div id="tab-content-bookmarks" class="tab-content"></div>
    <div id="tab-content-settings" class="tab-content"></div>

    <div class="signout-area">
      <button class="signout-btn" onclick="doSignOut()">로그아웃</button>
      <button class="delete-account-btn" onclick="doDeleteAccount()">회원탈퇴</button>
    </div>
  `;
}

/* ── Tab switching ── */
function switchTab(tab) {
  activeTab = tab;

  // Update tab buttons
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  const activeBtn = document.getElementById('tab-' + tab);
  if (activeBtn) activeBtn.classList.add('active');

  // Show/hide content panels
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  const panel = document.getElementById('tab-content-' + tab);
  if (panel) panel.classList.add('active');

  // Load data for active tab
  if (tab === 'watchlist') loadWatchlist();
  else if (tab === 'bookmarks') loadBookmarks();
  else if (tab === 'settings') loadSettings();
}

/* ── Watchlist ── */
async function loadWatchlist() {
  const panel = document.getElementById('tab-content-watchlist');
  panel.innerHTML = '<div class="loading-state" style="padding:40px"><div class="spinner"></div></div>';

  const { data, error } = await sb
    .from('user_watchlist')
    .select('ticker,name,market,added_at')
    .eq('user_id', currentUser.id)
    .order('added_at', { ascending: false });

  if (error) {
    panel.innerHTML = `<div class="empty-state"><p style="color:var(--red)">데이터를 불러올 수 없습니다.</p></div>`;
    return;
  }

  const items = data || [];

  if (!items.length) {
    panel.innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">☆</div>
        <div>관심종목이 없습니다.</div>
        <div style="margin-top:6px;font-size:14.5px">분석 페이지에서 ☆ 버튼으로 종목을 추가하세요.</div>
      </div>`;
    return;
  }

  const rows = items.map(item => {
    const isKr = item.market === 'KR';
    return `
      <div class="watchlist-item" id="wl-${escHtml(item.ticker)}">
        <span class="ticker-badge ${isKr ? 'kr' : 'us'}">${escHtml(item.ticker)}</span>
        <div class="watchlist-name">
          <a href="/company.html?ticker=${encodeURIComponent(item.ticker)}">${escHtml(item.name || item.ticker)}</a>
        </div>
        <span class="watchlist-added">${fmtDate(item.added_at)}</span>
        <button class="delete-btn" onclick="deleteWatchlistItem('${escHtml(item.ticker)}')" title="삭제">✕</button>
      </div>`;
  }).join('');

  panel.innerHTML = `
    <div class="section-title">
      <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      관심종목 <span class="section-count">(${items.length}개)</span>
    </div>
    <div class="watchlist-list">${rows}</div>`;
}

async function deleteWatchlistItem(ticker) {
  const { error } = await sb
    .from('user_watchlist')
    .delete()
    .eq('user_id', currentUser.id)
    .eq('ticker', ticker);

  if (error) {
    showToast('삭제 중 오류가 발생했습니다.', 'error');
    return;
  }

  const el = document.getElementById('wl-' + ticker);
  if (el) el.remove();

  // Update count
  const list = document.querySelector('.watchlist-list');
  const remaining = list ? list.querySelectorAll('.watchlist-item').length : 0;
  const countEl = document.querySelector('#tab-content-watchlist .section-count');
  if (countEl) countEl.textContent = `(${remaining}개)`;

  if (remaining === 0) loadWatchlist();

  showToast('관심종목에서 삭제했습니다.');
}

/* ── Bookmarks ── */
async function loadBookmarks() {
  const panel = document.getElementById('tab-content-bookmarks');
  panel.innerHTML = '<div class="loading-state" style="padding:40px"><div class="spinner"></div></div>';

  const { data, error } = await sb
    .from('user_bookmarks')
    .select('issue_id,added_at, issues(id, title, published_at, source_name, sectors)')
    .eq('user_id', currentUser.id)
    .order('added_at', { ascending: false });

  if (error) {
    panel.innerHTML = `<div class="empty-state"><p style="color:var(--red)">데이터를 불러올 수 없습니다.</p></div>`;
    return;
  }

  const items = data || [];

  if (!items.length) {
    panel.innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">🔖</div>
        <div>북마크된 이슈가 없습니다.</div>
        <div style="margin-top:6px;font-size:14.5px">분석 페이지에서 북마크 버튼을 눌러 저장하세요.</div>
      </div>`;
    return;
  }

  const rows = items.map(item => {
    const issue = item.issues;
    if (!issue) return '';
    const sectors = (issue.sectors || []).slice(0, 3);
    const sectorTags = sectors.map(s =>
      `<span class="sector-tag ${sectorColors[s] || 'tag-default'}">${escHtml(s)}</span>`
    ).join('');
    return `
      <div class="bookmark-item" id="bm-${escHtml(item.issue_id)}">
        <div class="bookmark-info">
          <div class="bookmark-title">
            <a href="/analysis.html?id=${encodeURIComponent(issue.id)}">${escHtml(issue.title)}</a>
          </div>
          <div class="bookmark-meta">
            <span class="bookmark-date">${fmtDate(issue.published_at)}</span>
            ${sectorTags}
          </div>
        </div>
        <button class="delete-btn" onclick="deleteBookmark('${escHtml(item.issue_id)}')" title="삭제">✕</button>
      </div>`;
  }).join('');

  panel.innerHTML = `
    <div class="section-title">
      <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
      북마크 <span class="section-count">(${items.length}개)</span>
    </div>
    <div class="bookmarks-list">${rows}</div>`;
}

async function deleteBookmark(issueId) {
  const { error } = await sb
    .from('user_bookmarks')
    .delete()
    .eq('user_id', currentUser.id)
    .eq('issue_id', issueId);

  if (error) {
    showToast('삭제 중 오류가 발생했습니다.', 'error');
    return;
  }

  const el = document.getElementById('bm-' + issueId);
  if (el) el.remove();

  const list = document.querySelector('.bookmarks-list');
  const remaining = list ? list.querySelectorAll('.bookmark-item').length : 0;
  const countEl = document.querySelector('#tab-content-bookmarks .section-count');
  if (countEl) countEl.textContent = `(${remaining}개)`;

  if (remaining === 0) loadBookmarks();

  showToast('북마크에서 삭제했습니다.');
}

/* ── Notification Settings ── */
async function loadSettings() {
  const panel = document.getElementById('tab-content-settings');
  panel.innerHTML = '<div class="loading-state" style="padding:40px"><div class="spinner"></div></div>';

  const [{ data: settings }, { data: profile }] = await Promise.all([
    sb.from('user_settings').select('*').eq('user_id', currentUser.id).single(),
    sb.from('user_profiles').select('nickname').eq('user_id', currentUser.id).maybeSingle(),
  ]);

  const chatId = settings?.telegram_chat_id || '';
  const notifyNew = settings?.notify_new_analysis ?? true;
  const nickname = profile?.nickname || (typeof currentNickname !== 'undefined' ? currentNickname : '') || '';

  panel.innerHTML = `
    <div class="settings-card">
      <div class="settings-card-title">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0 1 16 0v1"/></svg>
        닉네임
      </div>
      <form id="nicknameForm" onsubmit="saveNickname(event)">
        <div class="form-group">
          <label class="form-label" for="nicknameInput">닉네임</label>
          <input
            id="nicknameInput"
            class="form-input"
            type="text"
            maxlength="20"
            placeholder="닉네임"
            value="${escHtml(nickname)}"
            autocomplete="off"
          >
          <div class="form-hint">채팅 등 사이트 곳곳에서 회원님을 표시하는 이름입니다 (1~20자).</div>
        </div>
        <div style="margin-top:20px">
          <button type="submit" class="save-btn" id="saveNickBtn">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
            저장
          </button>
        </div>
      </form>
    </div>

    <div class="settings-card">
      <div class="settings-card-title">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Telegram 알림 설정
      </div>

      <form id="settingsForm" onsubmit="saveSettings(event)">
        <div class="form-group">
          <label class="form-label" for="telegramChatId">Telegram Chat ID</label>
          <input
            id="telegramChatId"
            class="form-input"
            type="text"
            placeholder="예: 123456789"
            value="${escHtml(chatId)}"
            autocomplete="off"
          >
          <div class="form-hint">
            Telegram에서 <strong>@userinfobot</strong>에게 <code>/start</code>를 보내면 Chat ID를 확인할 수 있습니다.
          </div>
        </div>

        <div class="toggle-row">
          <div>
            <div class="toggle-label">새 분석 알림 받기</div>
            <div class="toggle-desc">새로운 이슈 분석이 등록될 때 알림을 보냅니다.</div>
          </div>
          <label class="toggle-switch">
            <input type="checkbox" id="notifyNewAnalysis" ${notifyNew ? 'checked' : ''}>
            <span class="toggle-slider"></span>
          </label>
        </div>

        <div style="margin-top:20px">
          <button type="submit" class="save-btn" id="saveBtn">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
            저장
          </button>
        </div>
      </form>
    </div>`;
}

async function saveNickname(e) {
  e.preventDefault();
  const btn = document.getElementById('saveNickBtn');
  const val = document.getElementById('nicknameInput').value.trim();
  if (!val) { showToast('닉네임을 입력해주세요.', 'error'); return; }
  if (val.length > 20) { showToast('닉네임은 20자 이하로 입력해주세요.', 'error'); return; }

  btn.disabled = true;
  btn.textContent = '저장 중...';

  const { error } = await sb.from('user_profiles').upsert({
    user_id: currentUser.id,
    nickname: val,
    updated_at: new Date().toISOString(),
  }, { onConflict: 'user_id' });

  btn.disabled = false;
  btn.innerHTML = `
    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
    저장`;

  if (error) {
    showToast('저장 중 오류가 발생했습니다.', 'error');
    return;
  }
  // site-header.js의 전역 currentNickname도 같이 갱신 — 헤더 드롭다운/채팅 닉네임이
  // 페이지 새로고침 없이 바로 반영되도록 이벤트로 알린다(ensureNickname()과 같은 이벤트).
  if (typeof currentNickname !== 'undefined') currentNickname = val;
  window.dispatchEvent(new CustomEvent('sr-nickname-change', { detail: { nickname: val } }));
  showToast('닉네임을 저장했습니다.');
}

async function saveSettings(e) {
  e.preventDefault();
  const btn = document.getElementById('saveBtn');
  const chatId = document.getElementById('telegramChatId').value.trim();
  const notifyChecked = document.getElementById('notifyNewAnalysis').checked;

  btn.disabled = true;
  btn.textContent = '저장 중...';

  const { error } = await sb.from('user_settings').upsert({
    user_id: currentUser.id,
    telegram_chat_id: chatId || null,
    notify_new_analysis: notifyChecked,
    updated_at: new Date().toISOString(),
  }, { onConflict: 'user_id' });

  btn.disabled = false;
  btn.innerHTML = `
    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
    저장`;

  if (error) {
    showToast('저장 중 오류가 발생했습니다.', 'error');
  } else {
    showToast('알림 설정이 저장되었습니다.');
  }
}

/* ── Sign out ── */
async function doSignOut() {
  await sb.auth.signOut();
  location.href = '/';
}

/* ── Delete account ── */
async function doDeleteAccount() {
  const ok = confirm('정말 회원 탈퇴하시겠습니까?\n관심종목·북마크·알림 설정·모의투자 데이터가 모두 삭제되며 복구할 수 없습니다.');
  if (!ok) return;

  const { data: { session } } = await sb.auth.getSession();
  if (!session) { location.href = '/'; return; }

  try {
    const r = await fetch('/api/admin?action=delete-own-account', {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${session.access_token}` },
    });
    const d = await r.json();
    if (!r.ok || !d.ok) throw new Error(d.error || '탈퇴 처리 중 오류가 발생했습니다.');
    await sb.auth.signOut();
    alert('회원 탈퇴가 완료되었습니다.');
    location.href = '/';
  } catch (e) {
    showToast(e.message, 'error');
  }
}

init();
initAuth();
</script>

<script>renderSiteFooter();</script>
